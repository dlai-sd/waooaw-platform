# CI Pipeline — runs on every PR to main
# Constitutional basis: GENESIS Engineering Quality Mandate; ADR-013
# Purpose: Build images, run unit tests, SAST, OpenAPI/proto lint.
#          PR is blocked from merge if any step fails.
#
# This pipeline does NOT deploy. Deployment is triggered by merge (promote.yaml).

name: CI — Build & Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:

  runner-supply:
    uses: ./.github/workflows/validation-runner-supply.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  validation-plan:
    name: WC-102 validation plan (Shadow)
    runs-on: ubuntu-latest
    needs: runner-supply
    outputs:
      release_required: ${{ steps.plan.outputs.release_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact validation range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha=$PR_BASE_SHA
            head_sha=$PR_HEAD_SHA
          else
            base_sha=$PUSH_BASE_SHA
            head_sha=$PUSH_HEAD_SHA
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          mkdir -p test-results/wc102
          git diff --name-only --find-renames "$base_sha" "$head_sha" > test-results/wc102/changed-files.txt
          git diff --name-status --find-renames "$base_sha" "$head_sha" > test-results/wc102/changed-files.status
      - name: Resolve immutable validation runner (C-080)
        uses: ./.github/actions/use-validation-runner
        id: runner-build
        with:
          runner-id: full
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable validation runner evidence
        run: |
          scripts/record_build_evidence.sh \
            "$RUNNER_TEMP/build-evidence/validation-plan.json" 'test-runner-validation-plan' \
            '${{ steps.range.outputs.base_sha }}' '${{ steps.range.outputs.head_sha }}' \
            '${{ steps.runner-build.outputs.image_id }}' '' \
            '["change-impact","requirement-ledger"]' 'workflow_build'
      - name: Compute Shadow selection and validate changed ledgers
        id: plan
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          chmod 0777 test-results/wc102
          scripts/verify_runner_image.sh test test-runner '${{ steps.runner-build.outputs.image_id }}'
          docker compose --profile test run --rm \
            -e BASE_SHA -e HEAD_SHA -e EVENT_NAME -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT test-runner sh -lc '
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0=safe.directory
              export GIT_CONFIG_VALUE_0=/workspace
              python scripts/validation_policy.py \
                --policy validation/engineering-validation.yaml \
                --base "$BASE_SHA" --head "$HEAD_SHA" \
                --event "$EVENT_NAME" \
                --changed-file-list test-results/wc102/changed-files.status \
                --output test-results/wc102/change-impact.json
              python scripts/validation_control/orchestrator.py \
                --selection test-results/wc102/change-impact.json \
                --mode focused --head "$HEAD_SHA" \
                --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-focused" \
                --output test-results/wc102/focused-plan.json
              python scripts/validation_control/orchestrator.py \
                --selection test-results/wc102/change-impact.json \
                --mode qualification --head "$HEAD_SHA" \
                --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-qualification" \
                --all-gates \
                --output test-results/wc102/qualification-plan.json
              python scripts/validate_requirement_ledger.py \
                --repository-root /workspace \
                --changed-file-list test-results/wc102/changed-files.txt
            '
          release_required=$(jq -r '.selected_prechecks | index("release_qualification") != null' \
            test-results/wc102/change-impact.json)
          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
      - name: Retain Shadow selection and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wc102-validation-plan-${{ github.run_id }}
          path: |
            test-results/wc102/change-impact.json
            test-results/wc102/changed-files.txt
            test-results/wc102/changed-files.status
            test-results/wc102/focused-plan.json
            test-results/wc102/qualification-plan.json
            ${{ runner.temp }}/build-evidence/validation-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain complete catalog execution plan
        uses: actions/upload-artifact@v4
        with:
          name: wc104-qualification-plan-${{ github.run_id }}
          path: test-results/wc102/qualification-plan.json
          if-no-files-found: error
          retention-days: 90

  # ─── Build and scan all pull-request release images ──────────────────────
  build:
    name: Build Docker image (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          - name: constitutional-engine
            context: .
            dockerfile: src/constitutional-engine/Dockerfile
          - name: business-platform
            context: .
            dockerfile: src/business-platform/Dockerfile
          - name: professional-runtime
            context: .
            dockerfile: src/professional-runtime/Dockerfile
          - name: ai-runtime
            context: .
            dockerfile: src/ai-runtime/Dockerfile
          - name: web
            context: .
            dockerfile: web/Dockerfile
          - name: billing-engine
            context: .
            dockerfile: src/billing-engine/Dockerfile
          - name: agent-runtime-adapter-digital-marketing
            context: src/agent-adapters
            dockerfile: src/agent-adapters/digital_marketing/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build pull-request image
        id: candidate-build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}:sha-${{ github.sha }}
          sbom: false
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service.name }}
      - name: Record immutable candidate build evidence
        run: |
          scripts/record_build_evidence.sh \
            "$RUNNER_TEMP/build-evidence/${{ matrix.service.name }}.json" \
            '${{ matrix.service.name }}' \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}' \
            '${{ steps.candidate-build.outputs.imageid }}' \
            '${{ steps.candidate-build.outputs.digest }}' \
            '["smoke","trivy"]' \
            'workflow_build'
      - name: Retain immutable candidate build evidence
        uses: actions/upload-artifact@v4
        with:
          name: wc100-candidate-build-${{ matrix.service.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/build-evidence/${{ matrix.service.name }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Smoke Business Platform deployment configuration
        if: matrix.service.name == 'business-platform'
        run: scripts/smoke_business_platform_image.sh '${{ steps.candidate-build.outputs.imageid }}'
      - name: Scan pull-request image
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          image-ref: ${{ steps.candidate-build.outputs.imageid }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 1
      - name: Upload pull-request scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif

  publish:
    name: Publish Docker image (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          - name: constitutional-engine
            context: .
            dockerfile: src/constitutional-engine/Dockerfile
          - name: business-platform
            context: .
            dockerfile: src/business-platform/Dockerfile
          - name: professional-runtime
            context: .
            dockerfile: src/professional-runtime/Dockerfile
          - name: ai-runtime
            context: .
            dockerfile: src/ai-runtime/Dockerfile
          - name: web
            context: .
            dockerfile: web/Dockerfile
          - name: billing-engine
            context: .
            dockerfile: src/billing-engine/Dockerfile
          - name: agent-runtime-adapter-digital-marketing
            context: src/agent-adapters
            dockerfile: src/agent-adapters/digital_marketing/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish attested image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          # G-08 FIX: spec_version label links deployed binary to the architecture
          # spec revision it was built against. Enables bidirectional traceability
          # from production incident → spec revision → constitutional claim (C-073).
          labels: |
            org.waooaw.spec_version=${{ github.sha }}
            org.waooaw.ib_item=IB-009
            org.waooaw.build_date=${{ github.run_id }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service.name }}

      - name: Record immutable registry digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-digest
          printf '%s\n' '${{ steps.image.outputs.digest }}' > "release-digest/${{ matrix.service.name }}.digest"

      - name: Attest published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image-attestation-primary
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Back off after transient attestation failure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-attestation-primary.outcome == 'failure'
        run: sleep 10

      - name: Retry published image attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-attestation-primary.outcome == 'failure'
        id: image-attestation-retry
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Select successful image attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image-attestation
        env:
          PRIMARY_BUNDLE: ${{ steps.image-attestation-primary.outputs.bundle-path }}
          RETRY_BUNDLE: ${{ steps.image-attestation-retry.outputs.bundle-path }}
        run: |
          if test -n "$PRIMARY_BUNDLE" && test -f "$PRIMARY_BUNDLE"; then
            bundle_path=$PRIMARY_BUNDLE
          elif test -n "$RETRY_BUNDLE" && test -f "$RETRY_BUNDLE"; then
            bundle_path=$RETRY_BUNDLE
          else
            echo "No successful image attestation bundle was produced" >&2
            exit 1
          fi
          echo "bundle-path=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Collect registry attestation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image='${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}@${{ steps.image.outputs.digest }}'
          mkdir -p release-attestation
          docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}' > "release-attestation/${{ matrix.service.name }}.sbom.json"
          docker buildx imagetools inspect "$image" --format '{{ json .Provenance }}' > "release-attestation/${{ matrix.service.name }}.provenance.json"
          jq -e '. != null and (type == "object" or type == "array") and length > 0' "release-attestation/${{ matrix.service.name }}.sbom.json" >/dev/null
          jq -e '. != null and (type == "object" or type == "array") and length > 0' "release-attestation/${{ matrix.service.name }}.provenance.json" >/dev/null
          cp '${{ steps.image-attestation.outputs.bundle-path }}' "release-attestation/${{ matrix.service.name }}.signature.jsonl"

      - name: Upload immutable registry digest
        uses: actions/upload-artifact@v4
        with:
          name: goal006-digest-${{ matrix.service.name }}
          path: release-digest/${{ matrix.service.name }}.digest
          if-no-files-found: error
          retention-days: 90
      - name: Upload registry attestation evidence
        uses: actions/upload-artifact@v4
        with:
          name: goal006-attestation-${{ matrix.service.name }}
          path: release-attestation
          if-no-files-found: error
          retention-days: 90

  # ─── Secret detection ─────────────────────────────────────────────────────
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── .NET unit tests ──────────────────────────────────────────────────────
  test-dotnet:
    name: .NET unit tests
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: constitutional-engine
            gate: test-dotnet:constitutional-engine
          - service: business-platform
            gate: test-dotnet:business-platform
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Docker socket group for Testcontainers
        run: echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Execute catalog .NET gate (C-076, C-080)
        uses: ./.github/actions/run-validation-gate
        id: runner-build
        continue-on-error: true
        with:
          gate-id: ${{ matrix.gate }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable .NET runner evidence
        if: always() && steps.runner-build.outputs.image_id != ''
        run: |
          scripts/record_build_evidence.sh \
            "$RUNNER_TEMP/build-evidence/${{ matrix.service }}.json" \
            'test-runner-dotnet-${{ matrix.service }}' \
            '${{ github.event.pull_request.base.sha || github.event.before }}' \
            '${{ github.event.pull_request.head.sha || github.sha }}' \
            '${{ steps.runner-build.outputs.image_id }}' '' \
            '["dotnet-test","coverage"]' 'workflow_build'
      - name: Retain immutable .NET runner evidence
        if: always() && steps.runner-build.outputs.image_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: wc100-dotnet-runner-${{ matrix.service }}-${{ github.run_id }}
          path: ${{ runner.temp }}/build-evidence/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true  # geo-restricted runners must not break the gate
        with:
          directory: ./test-results/coverage/${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Enforce catalog .NET gate result
        if: steps.runner-build.outcome != 'success'
        run: exit 1

  # ─── Python unit tests ────────────────────────────────────────────────────
  test-python:
    name: Python unit tests + lint
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    strategy:
      matrix:
        include:
          - service: professional-runtime
            gate: test-python:professional-runtime
          - service: ai-runtime
            gate: test-python:ai-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Docker socket group for Testcontainers
        run: echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Execute catalog Python gate (C-076, C-080)
        uses: ./.github/actions/run-validation-gate
        id: runner-build
        continue-on-error: true
        with:
          gate-id: ${{ matrix.gate }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable Python runner evidence
        if: always() && steps.runner-build.outputs.image_id != ''
        run: |
          scripts/record_build_evidence.sh \
            "$RUNNER_TEMP/build-evidence/${{ matrix.service }}.json" \
            'test-runner-python-${{ matrix.service }}' \
            '${{ github.event.pull_request.base.sha || github.event.before }}' \
            '${{ github.event.pull_request.head.sha || github.sha }}' \
            '${{ steps.runner-build.outputs.image_id }}' '' \
            '["ruff","mypy","pytest","coverage"]' 'workflow_build'
      - name: Retain immutable Python runner evidence
        if: always() && steps.runner-build.outputs.image_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: wc100-python-runner-${{ matrix.service }}-${{ github.run_id }}
          path: ${{ runner.temp }}/build-evidence/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true  # geo-restricted runners must not break the gate
        with:
          files: test-results/coverage/${{ matrix.service }}/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Retain raw coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.service }}-${{ github.run_id }}
          path: test-results/coverage/${{ matrix.service }}/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce catalog Python gate result
        if: steps.runner-build.outcome != 'success'
        run: exit 1

  release-qualification:
    name: Release qualification
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute catalog release qualification
        if: needs.validation-plan.outputs.release_required == 'true'
        uses: ./.github/actions/run-validation-gate
        id: runner-build
        continue-on-error: true
        with:
          gate-id: release-qualification
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable release runner evidence
        if: always() && needs.validation-plan.outputs.release_required == 'true' && steps.runner-build.outputs.image_id != ''
        run: |
          scripts/record_build_evidence.sh \
            "$RUNNER_TEMP/build-evidence/release-qualification.json" \
            'test-runner-release-qualification' \
            '${{ github.event.pull_request.base.sha || github.event.before }}' \
            '${{ github.event.pull_request.head.sha || github.sha }}' \
            '${{ steps.runner-build.outputs.image_id }}' '' \
            '["release-qualification"]' 'workflow_build'
      - name: Retain immutable release runner evidence
        if: always() && needs.validation-plan.outputs.release_required == 'true' && steps.runner-build.outputs.image_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: wc100-release-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/build-evidence/release-qualification.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain WC-091 Demo data evidence
        if: always() && needs.validation-plan.outputs.release_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wc091-i1-demo-data-${{ github.run_id }}
          path: test-results/wc091/i1-demo-data.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain Docker Azure CLI runtime evidence
        if: always() && needs.validation-plan.outputs.release_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goal006-local-azure-runtime-${{ github.run_id }}
          path: goal006-local-azure-runtime/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce catalog release qualification result
        if: needs.validation-plan.outputs.release_required == 'true' && steps.runner-build.outcome != 'success'
        run: exit 1

  # ─── TypeScript tests ─────────────────────────────────────────────────────
  test-web:
    name: Web unit tests + type check
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    steps:
      - uses: actions/checkout@v4
      - name: Execute catalog web gate (C-076, C-080)
        uses: ./.github/actions/run-validation-gate
        id: runner-build
        continue-on-error: true
        with:
          gate-id: test-web
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable TypeScript runner evidence
        if: always() && steps.runner-build.outputs.image_id != ''
        run: |
          scripts/record_build_evidence.sh \
            "$RUNNER_TEMP/build-evidence/web.json" \
            'test-runner-ts-web' \
            '${{ github.event.pull_request.base.sha || github.event.before }}' \
            '${{ github.event.pull_request.head.sha || github.sha }}' \
            '${{ steps.runner-build.outputs.image_id }}' '' \
            '["typecheck","eslint","jest","coverage"]' 'workflow_build'
      - name: Retain immutable TypeScript runner evidence
        if: always() && steps.runner-build.outputs.image_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: wc100-typescript-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/build-evidence/web.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce catalog web gate result
        if: steps.runner-build.outcome != 'success'
        run: exit 1

  # ─── OpenAPI spec lint ────────────────────────────────────────────────────
  spec-lint:
    name: OpenAPI + Proto lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spectral lint — OpenAPI contracts
        run: |
          docker run --rm --user 1000:1000 -v "$PWD:/workspace:ro" -w /workspace \
            stoplight/spectral:6.15.0 lint \
            --fail-severity error \
            architecture/reference/api-specs/business-platform.openapi.yaml \
            architecture/reference/api-specs/professional-runtime.openapi.yaml

      - name: buf lint — Constitutional Service proto
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace/architecture/reference/proto \
            bufbuild/buf:1.72.0 format --diff --exit-code
          docker run --rm -v "$PWD:/workspace" -w /workspace/architecture/reference/proto \
            bufbuild/buf:1.72.0 lint
          docker run --rm -v "$PWD:/workspace" -w /workspace/architecture/reference/proto \
            bufbuild/buf:1.72.0 breaking \
            --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=architecture/reference/proto'

  # ─── Security — SAST ──────────────────────────────────────────────────────
  sast:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [csharp, python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # ─── Container image security scan ───────────────────────────────────────
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [constitutional-engine, business-platform, professional-runtime, ai-runtime, web, billing-engine, agent-runtime-adapter-digital-marketing]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          image-ref: ${{ env.REGISTRY_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif

      - name: Retain release scan evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: goal006-scan-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          if-no-files-found: error
          retention-days: 90

  # ─── Dependency vulnerability scanning ───────────────────────────────────
  # Catches vulnerable dependencies BEFORE image build — faster feedback than Trivy alone.
  # Constitutional basis: GENESIS AI Security Mandate (log sanitization + dependency hygiene);
  #                       C-062 (AI Security); security/SECURITY-HEADERS.md
  dep-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    steps:
      - uses: actions/checkout@v4
      - name: Execute catalog Python dependency scan
        uses: ./.github/actions/run-validation-gate
        id: python-scan
        continue-on-error: true
        with:
          gate-id: dep-scan:python
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute catalog .NET dependency scan
        uses: ./.github/actions/run-validation-gate
        id: dotnet-scan
        continue-on-error: true
        with:
          gate-id: dep-scan:dotnet
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute catalog TypeScript dependency scan
        uses: ./.github/actions/run-validation-gate
        id: typescript-scan
        continue-on-error: true
        with:
          gate-id: dep-scan:typescript
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record immutable dependency runner evidence
        if: always()
        run: |
          if [[ -n '${{ steps.python-scan.outputs.image_id }}' ]]; then
            scripts/record_build_evidence.sh \
              "$RUNNER_TEMP/build-evidence/dependency-python.json" 'test-runner-python-dependencies' \
              '${{ github.event.pull_request.base.sha || github.event.before }}' \
              '${{ github.event.pull_request.head.sha || github.sha }}' \
              '${{ steps.python-scan.outputs.image_id }}' '' '["pip-audit"]' 'workflow_build'
          fi
          if [[ -n '${{ steps.dotnet-scan.outputs.image_id }}' ]]; then
            scripts/record_build_evidence.sh \
              "$RUNNER_TEMP/build-evidence/dependency-dotnet.json" 'test-runner-dotnet-dependencies' \
              '${{ github.event.pull_request.base.sha || github.event.before }}' \
              '${{ github.event.pull_request.head.sha || github.sha }}' \
              '${{ steps.dotnet-scan.outputs.image_id }}' '' '["dotnet-vulnerable"]' 'workflow_build'
          fi
          if [[ -n '${{ steps.typescript-scan.outputs.image_id }}' ]]; then
            scripts/record_build_evidence.sh \
              "$RUNNER_TEMP/build-evidence/dependency-ts.json" 'test-runner-ts-dependencies' \
              '${{ github.event.pull_request.base.sha || github.event.before }}' \
              '${{ github.event.pull_request.head.sha || github.sha }}' \
              '${{ steps.typescript-scan.outputs.image_id }}' '' '["pnpm-audit"]' 'workflow_build'
          fi

      - name: Retain immutable dependency runner evidence
        if: >-
          always() && (
            steps.python-scan.outputs.image_id != '' ||
            steps.dotnet-scan.outputs.image_id != '' ||
            steps.typescript-scan.outputs.image_id != ''
          )
        uses: actions/upload-artifact@v4
        with:
          name: wc100-dependency-runners-${{ github.run_id }}
          path: ${{ runner.temp }}/build-evidence/dependency-*.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce catalog dependency scan results
        if: >-
          steps.python-scan.outcome != 'success' ||
          steps.dotnet-scan.outcome != 'success' ||
          steps.typescript-scan.outcome != 'success'
        run: exit 1

  # ─── License compliance ───────────────────────────────────────────────────
  # Prevents inadvertent use of GPL/AGPL licensed dependencies in commercial code.
  license-check:
    name: License compliance
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    steps:
      - uses: actions/checkout@v4
      - name: Execute catalog license check
        uses: ./.github/actions/run-validation-gate
        continue-on-error: true  # Advisory only — LGPL can be acceptable
        with:
          gate-id: license-check
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Constitutional commit gate (C-059 — Implementation Traceability) ─────
  # Every commit must reference an IB item or Fix issue AND a constitutional claim.
  # This makes implementation traceability machine-enforced, not merely documented.
  # Constitutional basis: C-059 (Implementation Traceability — LAW)
  # Platform IT Expert: WAOOAW AI Agent — Developer must satisfy this before PR creation.
  constitutional-commit-gate:
    name: C-059 Constitutional Commit Gate
    runs-on: ubuntu-latest
    needs: runner-supply
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable constitutional validation runner
        uses: ./.github/actions/use-validation-runner
        with:
          runner-id: python
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate commit messages (C-059)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p test-results
          gh pr view ${{ github.event.pull_request.number }} \
            --json body --jq .body --repo ${{ github.repository }} > test-results/pr-body.md
          docker compose --profile test-python run --rm \
            -v "$PWD/test-results/pr-body.md:/tmp/pr-body.md:ro" \
            -e BASE="$BASE" -e HEAD="$HEAD" test-runner-python sh -lc '
              python scripts/validate_c059.py \
                --pr-body-file /tmp/pr-body.md \
                --base "$BASE" \
                --head "$HEAD"
            '
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Author review gate (C-065) ──────────────────────────────────────────
  # Review evidence is bound to the exact PR head. A later commit invalidates
  # the declaration and requires a fresh author review before Founder review.
  author-review-gate:
    name: C-065 Author Review Gate
    runs-on: ubuntu-latest
    needs: runner-supply
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable constitutional validation runner
        uses: ./.github/actions/use-validation-runner
        with:
          runner-id: python
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate author review evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p test-results
          for attempt in 1 2 3; do
            gh pr view "$PR_NUMBER" --json body --jq .body --repo "$REPOSITORY" > test-results/pr-body.md
            if docker compose --profile test-python run --rm \
              -v "$PWD/test-results/pr-body.md:/tmp/pr-body.md:ro" \
              -e HEAD_SHA -e BASE_SHA test-runner-python sh -lc '
                python scripts/validate_author_review.py \
                  --pr-body-file /tmp/pr-body.md \
                  --head "$HEAD_SHA" &&
                python scripts/validate_runtime_lifecycle_evidence.py \
                  --pr-body-file /tmp/pr-body.md \
                  --base "$BASE_SHA" \
                  --head "$HEAD_SHA"
              '; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "C-065 failed after three metadata reads for PR head $HEAD_SHA" >&2
              exit 1
            fi
            echo "PR metadata has not converged to $HEAD_SHA; retrying in 5 seconds"
            sleep 5
          done

  # ─── Authorization boundary check (C-066) ─────────────────────────────────
  # Every PR may run CI. Authorization to enter main is enforced by the
  # Founder-controlled review and merge gate, not fragile PR labels.
  # Constitutional basis: C-066 (Autonomous Development Authorization Tiers)
  authorization-tier-check:
    name: C-066 Authorization Tier Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify Founder-controlled merge boundary
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$BASE_BRANCH" = "main"
          test -n "$PR_NUMBER"
          test -n "$REPOSITORY"
          echo "C-066 PASS: CI is authorized; Founder review and merge remain mandatory."

  # ─── Test Champion campaign verdict (INST-015; C-023/C-065/C-099) ─────────
  # Deterministically synthesizes every CI prerequisite. This job recommends
  # PASS/BLOCK and preserves evidence; it does not approve or merge the PR.
  qa-campaign:
    name: Test Champion QA Campaign
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validation-plan
      - build
      - secrets
      - test-dotnet
      - test-python
      - test-web
      - spec-lint
      - sast
      - trivy
      - dep-scan
      - license-check
      - release-qualification
      - constitutional-commit-gate
      - author-review-gate
      - authorization-tier-check
    steps:
      - name: Synthesize immutable gate evidence
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p qa-evidence
          BLOCKING=$(jq '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length' <<< "$GATE_RESULTS")
          BLOCKING_GATES=$(jq -c '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key]' <<< "$GATE_RESULTS")
          VERDICT=PASS
          if [ "$BLOCKING" -gt 0 ]; then
            VERDICT=BLOCK
          fi

          jq -n \
            --arg schema_version "1.0" \
            --arg institution "INST-015" \
            --arg verdict "$VERDICT" \
            --arg repository "$REPOSITORY" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg run_id "$RUN_ID" \
            --arg event_name "$EVENT_NAME" \
            --argjson gates "$GATE_RESULTS" \
            --argjson blocking_gates "$BLOCKING_GATES" \
            '{schema_version: $schema_version, institution: $institution,
              recommendation: $verdict, repository: $repository,
              commit_sha: $commit_sha, run_id: $run_id, event_name: $event_name,
              gates: ($gates | with_entries(.value = {result: .value.result})),
              blocking_gates: $blocking_gates,
              authority_boundary: "Recommendation only; no PR approval or merge authority"}' \
            > qa-evidence/test-champion-verdict.json

          cat qa-evidence/test-champion-verdict.json
          if [ "$VERDICT" = BLOCK ]; then
            echo "Test Champion recommendation: BLOCK; upstream gates: $(jq -r 'join(", ")' <<< "$BLOCKING_GATES")"
            exit 1
          fi
          echo "Test Champion recommendation: PASS"

      - name: Retain Test Champion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-champion-evidence-${{ github.run_id }}
          path: qa-evidence/test-champion-verdict.json
          if-no-files-found: error
          retention-days: 90

  release-manifest:
    name: Attest exact-seven release manifest
    runs-on: ubuntu-latest
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success' &&
      needs.secrets.result == 'success' &&
      needs.test-dotnet.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-web.result == 'success' &&
      needs.spec-lint.result == 'success' &&
      needs.sast.result == 'success' &&
      needs.trivy.result == 'success' &&
      needs.dep-scan.result == 'success' &&
      needs.license-check.result == 'success'
    needs:
      - build
      - publish
      - secrets
      - test-dotnet
      - test-python
      - test-web
      - spec-lint
      - sast
      - trivy
      - dep-scan
      - license-check
      - constitutional-commit-gate
      - authorization-tier-check
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download exact-seven registry digests
        uses: actions/download-artifact@v4
        with:
          pattern: goal006-digest-*
          path: release-digests
          merge-multiple: true

      - name: Download exact-seven scan evidence
        uses: actions/download-artifact@v4
        with:
          pattern: goal006-scan-*
          path: release-evidence
          merge-multiple: true

      - name: Download exact-seven registry attestations
        uses: actions/download-artifact@v4
        with:
          pattern: goal006-attestation-*
          path: release-evidence
          merge-multiple: true

      - name: Create immutable registry manifest
        run: |
          mkdir -p release/goal006/evidence
          cp release-evidence/* release/goal006/evidence/
          python scripts/goal006_registry_manifest.py \
            release-digests \
            release/goal006/evidence \
            release/goal006/registry-release-manifest.json \
            --source-commit '${{ github.sha }}' \
            --run-id '${{ github.run_id }}'

      - name: Attest immutable registry manifest
        id: attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/goal006/registry-release-manifest.json
          show-summary: true

      - name: Upload signed exact-seven release tuple
        uses: actions/upload-artifact@v4
        with:
          name: goal006-exact-seven-release-${{ github.sha }}
          path: |
            release/goal006/registry-release-manifest.json
            release/goal006/evidence
            ${{ steps.attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

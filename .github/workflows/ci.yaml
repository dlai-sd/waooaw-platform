# CI Pipeline — runs on every PR to main
# Constitutional basis: GENESIS Engineering Quality Mandate; ADR-013
# Purpose: Build images, run unit tests, SAST, OpenAPI/proto lint.
#          PR is blocked from merge if any step fails.
#
# This pipeline does NOT deploy. Deployment is triggered by merge (promote.yaml).

name: CI — Build & Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:

  # ─── Build and scan affected pull-request images ─────────────────────────
  build:
    name: Build Docker image (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          - name: constitutional-engine
            dockerfile: src/constitutional-engine/Dockerfile
            path_pattern: ^src/constitutional-engine/
          - name: business-platform
            dockerfile: src/business-platform/Dockerfile
            path_pattern: ^src/business-platform/
          - name: professional-runtime
            dockerfile: src/professional-runtime/Dockerfile
            path_pattern: ^src/professional-runtime/
          - name: ai-runtime
            dockerfile: src/ai-runtime/Dockerfile
            path_pattern: ^src/ai-runtime/
          - name: web
            dockerfile: web/Dockerfile
            path_pattern: ^web/
          - name: billing-engine
            dockerfile: src/billing-engine/Dockerfile
            path_pattern: ^src/billing-engine/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected image
        id: affected
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PATH_PATTERN: ${{ matrix.service.path_pattern }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq "$PATH_PATTERN"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: steps.affected.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build pull-request image
        if: steps.affected.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}:sha-${{ github.sha }}
          sbom: false
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service.name }}
      - name: Scan pull-request image
        if: steps.affected.outputs.build == 'true'
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          image-ref: ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Upload pull-request scan results
        if: always() && steps.affected.outputs.build == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif

  publish:
    name: Publish Docker image (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service:
          - name: constitutional-engine
            dockerfile: src/constitutional-engine/Dockerfile
          - name: business-platform
            dockerfile: src/business-platform/Dockerfile
          - name: professional-runtime
            dockerfile: src/professional-runtime/Dockerfile
          - name: ai-runtime
            dockerfile: src/ai-runtime/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
          - name: billing-engine
            dockerfile: src/billing-engine/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publish attested image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          # G-08 FIX: spec_version label links deployed binary to the architecture
          # spec revision it was built against. Enables bidirectional traceability
          # from production incident → spec revision → constitutional claim (C-073).
          labels: |
            org.waooaw.spec_version=${{ github.sha }}
            org.waooaw.ib_item=IB-009
            org.waooaw.build_date=${{ github.run_id }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service.name }}

      - name: Record immutable registry digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-digest
          printf '%s\n' '${{ steps.image.outputs.digest }}' > "release-digest/${{ matrix.service.name }}.digest"

      - name: Attest published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image-attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Collect registry attestation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image='${{ env.REGISTRY_PREFIX }}/${{ matrix.service.name }}@${{ steps.image.outputs.digest }}'
          mkdir -p release-attestation
          docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}' > "release-attestation/${{ matrix.service.name }}.sbom.json"
          docker buildx imagetools inspect "$image" --format '{{ json .Provenance }}' > "release-attestation/${{ matrix.service.name }}.provenance.json"
          jq -e '. != null and (type == "object" or type == "array") and length > 0' "release-attestation/${{ matrix.service.name }}.sbom.json" >/dev/null
          jq -e '. != null and (type == "object" or type == "array") and length > 0' "release-attestation/${{ matrix.service.name }}.provenance.json" >/dev/null
          cp '${{ steps.image-attestation.outputs.bundle-path }}' "release-attestation/${{ matrix.service.name }}.signature.jsonl"

      - name: Upload immutable registry digest
        uses: actions/upload-artifact@v4
        with:
          name: goal006-digest-${{ matrix.service.name }}
          path: release-digest/${{ matrix.service.name }}.digest
          if-no-files-found: error
          retention-days: 90
      - name: Upload registry attestation evidence
        uses: actions/upload-artifact@v4
        with:
          name: goal006-attestation-${{ matrix.service.name }}
          path: release-attestation
          if-no-files-found: error
          retention-days: 90

  # ─── Secret detection ─────────────────────────────────────────────────────
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── .NET unit tests ──────────────────────────────────────────────────────
  test-dotnet:
    name: .NET unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: constitutional-engine
            source: src/constitutional-engine/constitutional-engine.csproj
            tests: tests/constitutional-engine.Tests/constitutional-engine.Tests.csproj
            profile: test-dotnet
            runner: test-runner-dotnet
          - service: business-platform
            source: src/business-platform/business-platform.csproj
            tests: tests/business-platform.Tests/business-platform.Tests.csproj
            profile: test
            runner: test-runner
    steps:
      - uses: actions/checkout@v4
      - name: Build .NET Docker test runner (C-080)
        run: docker compose --profile ${{ matrix.profile }} build ${{ matrix.runner }}

      - name: Restore, build, and test in Docker (C-076, C-080)
        run: |
          docker compose --profile ${{ matrix.profile }} run --rm --user root ${{ matrix.runner }} sh -lc '
            dotnet restore "${{ matrix.tests }}" &&
            dotnet build "${{ matrix.tests }}" --no-restore -warnaserror &&
            dotnet test "${{ matrix.tests }}" \
              --no-build \
              --settings tests/coverage.runsettings \
              --collect:"XPlat Code Coverage" \
              --results-directory ./coverage/${{ matrix.service }}
          '

      - name: Check coverage ≥90% (C-076)
        run: |
          coverage_file="$(find ./coverage/${{ matrix.service }} -name coverage.cobertura.xml -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "Cobertura coverage report not found" >&2
            exit 1
          fi
          read -r line_rate branch_rate < <(
            sed -n 's/.*<coverage line-rate="\([0-9.]*\)" branch-rate="\([0-9.]*\)".*/\1 \2/p' \
              "$coverage_file" | head -n 1
          )
          awk -v lines="$line_rate" -v branches="$branch_rate" 'BEGIN {
            printf "line_coverage=%.2f%% branch_coverage=%.2f%%\n", lines * 100, branches * 100
            exit !(lines >= 0.90 && branches >= 0.80)
          }'
        # Failure = C-076 constitutional violation — blocks merge absolutely

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage/${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # ─── Python unit tests ────────────────────────────────────────────────────
  test-python:
    name: Python unit tests + lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: professional-runtime
            source: src/professional-runtime
            tests: tests/professional-runtime
            mypy_targets: >-
              -p routers -p workflows -p professionals -m main -m private_server
              -m relationship_workspace -m constitutional_gateway -m evaluation_workflow
              -m intent_crystallizer -m mtls_protocol -m session_executor
              -m skill_resolver -m workload_identity
          - service: ai-runtime
            source: src/ai-runtime
            tests: tests/ai-runtime
            mypy_path: /workspace/src/trust-layer
            mypy_targets: >-
              -p providers -p pii -p pse -p rag -m main -m transcription
    steps:
      - uses: actions/checkout@v4
      - name: Build constitutional Docker test runner (C-080)
        run: docker compose --profile test-python build test-runner-python

      - name: Ruff in Docker (C-080)
        run: |
          docker compose --profile test-python run --rm --user root test-runner-python sh -lc '
            ruff check "${{ matrix.source }}" "${{ matrix.tests }}" &&
            ruff format --check "${{ matrix.source }}" "${{ matrix.tests }}"
          '

      - name: mypy in Docker (C-080)
        if: always()
        run: |
          docker compose --profile test-python run --rm --user root test-runner-python sh -lc '
            cd "${{ matrix.source }}" &&
            MYPYPATH="${{ matrix.mypy_path }}" \
              mypy --strict --namespace-packages --explicit-package-bases ${{ matrix.mypy_targets }}
          '

      - name: pytest and constitutional coverage in Docker (C-076, C-080)
        if: always()
        run: |
          docker compose --profile test-python run --rm --user root test-runner-python sh -lc '
            mkdir -p coverage/${{ matrix.service }} &&
            pytest "${{ matrix.tests }}" \
              --cov="${{ matrix.source }}" \
              --cov-branch \
              --cov-report=xml:coverage/${{ matrix.service }}/coverage.xml \
              --cov-report=json:coverage/${{ matrix.service }}/coverage.json \
              --cov-fail-under=0 &&
            python -c "import json, sys; data=json.load(open(\"coverage/${{ matrix.service }}/coverage.json\")); totals=data[\"totals\"]; lines=totals[\"covered_lines\"]*100/totals[\"num_statements\"]; branches=100 if totals[\"num_branches\"] == 0 else totals[\"covered_branches\"]*100/totals[\"num_branches\"]; print(json.dumps({\"service\": \"${{ matrix.service }}\", \"line_coverage\": lines, \"branch_coverage\": branches, \"minimum_lines\": 90, \"minimum_branches\": 80})); sys.exit(0 if lines >= 90 and branches >= 80 else 1)"
          '

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/${{ matrix.service }}/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Retain raw coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.service }}-${{ github.run_id }}
          path: coverage/${{ matrix.service }}/
          if-no-files-found: error
          retention-days: 90

  # ─── TypeScript tests ─────────────────────────────────────────────────────
  test-web:
    name: Web unit tests + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TypeScript Docker test runner (C-080)
        run: docker compose --profile test-ts build test-runner-ts

      - name: Type check, lint, and test in Docker (C-076, C-080)
        run: |
          docker compose --profile test-ts run --rm test-runner-ts sh -lc '
            cd web &&
            pnpm tsc --noEmit &&
            pnpm eslint . --max-warnings 0 &&
            pnpm jest --coverage --coverageThreshold='"'"'{"global":{"lines":90,"branches":80,"functions":90,"statements":90}}'"'"'
          '
        # C-076: 90% line/function/statement floor is constitutional minimum

  # ─── OpenAPI spec lint ────────────────────────────────────────────────────
  spec-lint:
    name: OpenAPI + Proto lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Spectral lint — OpenAPI contracts
        run: |
          npx --yes @stoplight/spectral-cli@6.15.0 lint \
            --fail-severity error \
            architecture/reference/api-specs/business-platform.openapi.yaml \
            architecture/reference/api-specs/professional-runtime.openapi.yaml

      - name: buf lint — Constitutional Service proto
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace/architecture/reference/proto \
            bufbuild/buf:1.72.0 format --diff --exit-code
          docker run --rm -v "$PWD:/workspace" -w /workspace/architecture/reference/proto \
            bufbuild/buf:1.72.0 lint
          docker run --rm -v "$PWD:/workspace" -w /workspace/architecture/reference/proto \
            bufbuild/buf:1.72.0 breaking \
            --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=architecture/reference/proto'

  # ─── Security — SAST ──────────────────────────────────────────────────────
  sast:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [csharp, python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ─── Container image security scan ───────────────────────────────────────
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [constitutional-engine, business-platform, professional-runtime, ai-runtime, web, billing-engine]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          image-ref: ${{ env.REGISTRY_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif

      - name: Retain release scan evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: goal006-scan-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          if-no-files-found: error
          retention-days: 90

  # ─── Dependency vulnerability scanning ───────────────────────────────────
  # Catches vulnerable dependencies BEFORE image build — faster feedback than Trivy alone.
  # Constitutional basis: GENESIS AI Security Mandate (log sanitization + dependency hygiene);
  #                       C-062 (AI Security); security/SECURITY-HEADERS.md
  dep-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependency audit runners (C-080)
        run: |
          docker compose --profile test-python build test-runner-python
          docker compose --profile test-dotnet build test-runner-dotnet
          docker compose --profile test-ts build test-runner-ts

      - name: pip-audit — Python dependencies
        run: |
          docker compose --profile test-python run --rm --user root test-runner-python sh -lc '
            pip-audit -r src/professional-runtime/requirements.txt --strict &&
            sed -e "/^--extra-index-url/d" \
                -e "s/torch==2.13.0+cpu/torch==2.13.0/" \
                src/ai-runtime/requirements.txt > /tmp/ai-runtime-audit.txt &&
            pip-audit -r /tmp/ai-runtime-audit.txt --strict &&
            pip-audit -r src/billing-engine/requirements.txt --strict
          '
        continue-on-error: false  # Fail on any vulnerability

      - name: dotnet vulnerable — .NET dependencies
        run: |
          docker compose --profile test-dotnet run --rm --user root test-runner-dotnet sh -lc '
            audit_dotnet_project() {
              dotnet restore "$1" --nologo >/dev/null
              if ! output="$(dotnet list "$1" package --vulnerable --include-transitive 2>&1)"; then
                printf "%s\n" "$output"
                return 1
              fi
              printf "%s\n" "$output"
              if printf "%s\n" "$output" | grep -qi "has the following vulnerable packages"; then
                return 1
              fi
            }
            audit_dotnet_project src/constitutional-engine &&
            audit_dotnet_project src/business-platform
          '

      - name: pnpm audit — Node.js dependencies
        run: |
          docker compose --profile test-ts run --rm test-runner-ts sh -lc '
            cd web && pnpm audit --audit-level high
          '

  # ─── License compliance ───────────────────────────────────────────────────
  # Prevents inadvertent use of GPL/AGPL licensed dependencies in commercial code.
  license-check:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-licenses — check Python dependency licenses
        run: |
          pip install pip-licenses
          pip install -r src/professional-runtime/requirements.txt -q
          pip install -r src/ai-runtime/requirements.txt -q
          pip-licenses --fail-on="GPL;AGPL;LGPL"
        continue-on-error: true  # Advisory only — does not block PR (LGPL can be acceptable)

  # ─── Constitutional commit gate (C-059 — Implementation Traceability) ─────
  # Every commit must reference an IB item or Fix issue AND a constitutional claim.
  # This makes implementation traceability machine-enforced, not merely documented.
  # Constitutional basis: C-059 (Implementation Traceability — LAW)
  # Platform IT Expert: WAOOAW AI Agent — Developer must satisfy this before PR creation.
  constitutional-commit-gate:
    name: C-059 Constitutional Commit Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages (C-059)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PR_BODY="$(gh pr view ${{ github.event.pull_request.number }} --json body --jq .body --repo ${{ github.repository }})"
          FAIL=0

          if ! grep -qE 'Work Contract: WC-[0-9]+' <<< "$PR_BODY" ||
             ! grep -qi 'Constitutional basis:' <<< "$PR_BODY"; then
            echo "❌ PR body must declare its Work Contract and Constitutional basis."
            FAIL=1
          fi

          while IFS= read -r msg; do
            # Skip merge commits
            if echo "$msg" | grep -q "^Merge "; then
              continue
            fi

            # Check conventional commit format
            if ! echo "$msg" | grep -qP "^(feat|fix|constitutional|cct|chore|refactor|security|docs|agent)\("; then
              echo "❌ Commit does not follow conventional format: $msg"
              FAIL=1
              continue
            fi

            # Check IB or Fix reference (C-059 traceability)
            if ! echo "$msg" | grep -qP "(IB:|FIX:|Constitutional:|chore\(|docs\()"; then
              echo "⚠️  Commit missing IB/FIX reference (C-059): $msg"
              # Warning only for chore/docs commits; blocking for feat/fix/constitutional
              if echo "$msg" | grep -qP "^(feat|fix|constitutional|cct)\("; then
                FAIL=1
              fi
            fi

          done < <(git log "$BASE..$HEAD" --format="%s" 2>/dev/null || true)

          if [ "$FAIL" -eq "1" ]; then
            echo ""
            echo "Constitutional Commit Gate FAILED (C-059 — Implementation Traceability)"
            echo "All feat/fix/constitutional/cct commits must:"
            echo "  1. Follow conventional commit format: {type}({component}): {description}"
            echo "  2. Reference an IB item or Fix issue in the commit body"
            exit 1
          fi

          echo "✓ All commits satisfy C-059 Implementation Traceability"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Authorization tier check (C-066) ─────────────────────────────────────
  # Verifies the PR branch has the required authorization label on its source issue.
  # Prevents unauthorized implementation work from entering the main branch.
  # Constitutional basis: C-066 (Autonomous Development Authorization Tiers)
  authorization-tier-check:
    name: C-066 Authorization Tier Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify authorization labels on PR
        run: |
          PR_LABELS=$(gh pr view ${{ github.event.pull_request.number }} \
            --json labels --jq '[.labels[].name] | join(",")' \
            --repo ${{ github.repository }})

          echo "PR labels: $PR_LABELS"

          # Emergency tier: always allowed (C-066 Tier 0)
          if echo "$PR_LABELS" | grep -q "tier:0-emergency"; then
            echo "✓ Tier 0 Emergency — authorized (C-066)"
            exit 0
          fi

          # Tier 1/2: requires approval from a named steward
          if echo "$PR_LABELS" | grep -qP "tier:1-bugfix|tier:2-feature"; then
            if echo "$PR_LABELS" | grep -qP "approved:sujay|approved:yogesh"; then
              echo "✓ Tier 1/2 — steward approved (C-066)"
              exit 0
            else
              echo "❌ Tier 1/2 PR requires an approving steward label."
              exit 1
            fi
          fi

          # Tier 3: requires approved:yogesh label
          if echo "$PR_LABELS" | grep -q "tier:3-constitutional"; then
            if echo "$PR_LABELS" | grep -q "approved:yogesh"; then
              echo "✓ Tier 3 — approved by Yogesh (C-066)"
              exit 0
            else
              echo "❌ Tier 3 constitutional PR requires 'approved:yogesh' label."
              exit 1
            fi
          fi

          echo "❌ No constitutional authorization tier label found on PR."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Test Champion campaign verdict (INST-015; C-023/C-065/C-099) ─────────
  # Deterministically synthesizes every CI prerequisite. This job recommends
  # PASS/BLOCK and preserves evidence; it does not approve or merge the PR.
  qa-campaign:
    name: Test Champion QA Campaign
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - secrets
      - test-dotnet
      - test-python
      - test-web
      - spec-lint
      - sast
      - trivy
      - dep-scan
      - license-check
      - constitutional-commit-gate
      - authorization-tier-check
    steps:
      - name: Synthesize immutable gate evidence
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p qa-evidence
          BLOCKING=$(jq '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length' <<< "$GATE_RESULTS")
          VERDICT=PASS
          if [ "$BLOCKING" -gt 0 ]; then
            VERDICT=BLOCK
          fi

          jq -n \
            --arg schema_version "1.0" \
            --arg institution "INST-015" \
            --arg verdict "$VERDICT" \
            --arg repository "$REPOSITORY" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg run_id "$RUN_ID" \
            --arg event_name "$EVENT_NAME" \
            --argjson gates "$GATE_RESULTS" \
            '{schema_version: $schema_version, institution: $institution,
              recommendation: $verdict, repository: $repository,
              commit_sha: $commit_sha, run_id: $run_id, event_name: $event_name,
              gates: ($gates | with_entries(.value = {result: .value.result})),
              authority_boundary: "Recommendation only; no PR approval or merge authority"}' \
            > qa-evidence/test-champion-verdict.json

          cat qa-evidence/test-champion-verdict.json
          if [ "$VERDICT" = BLOCK ]; then
            echo "Test Champion recommendation: BLOCK"
            exit 1
          fi
          echo "Test Champion recommendation: PASS"

      - name: Retain Test Champion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-champion-evidence-${{ github.run_id }}
          path: qa-evidence/test-champion-verdict.json
          if-no-files-found: error
          retention-days: 90

  release-manifest:
    name: Attest exact-six release manifest
    runs-on: ubuntu-latest
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success' &&
      needs.secrets.result == 'success' &&
      needs.test-dotnet.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-web.result == 'success' &&
      needs.spec-lint.result == 'success' &&
      needs.sast.result == 'success' &&
      needs.trivy.result == 'success' &&
      needs.dep-scan.result == 'success' &&
      needs.license-check.result == 'success'
    needs:
      - build
      - publish
      - secrets
      - test-dotnet
      - test-python
      - test-web
      - spec-lint
      - sast
      - trivy
      - dep-scan
      - license-check
      - constitutional-commit-gate
      - authorization-tier-check
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download exact-six registry digests
        uses: actions/download-artifact@v4
        with:
          pattern: goal006-digest-*
          path: release-digests
          merge-multiple: true

      - name: Download exact-six scan evidence
        uses: actions/download-artifact@v4
        with:
          pattern: goal006-scan-*
          path: release-evidence
          merge-multiple: true

      - name: Download exact-six registry attestations
        uses: actions/download-artifact@v4
        with:
          pattern: goal006-attestation-*
          path: release-evidence
          merge-multiple: true

      - name: Create immutable registry manifest
        run: |
          mkdir -p release/goal006/evidence
          cp release-evidence/* release/goal006/evidence/
          python scripts/goal006_registry_manifest.py \
            release-digests \
            release/goal006/evidence \
            release/goal006/registry-release-manifest.json \
            --source-commit '${{ github.sha }}' \
            --run-id '${{ github.run_id }}'

      - name: Attest immutable registry manifest
        id: attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/goal006/registry-release-manifest.json
          show-summary: true

      - name: Upload signed exact-six release tuple
        uses: actions/upload-artifact@v4
        with:
          name: goal006-exact-six-release-${{ github.sha }}
          path: |
            release/goal006/registry-release-manifest.json
            release/goal006/evidence
            ${{ steps.attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

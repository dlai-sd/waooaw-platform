name: Founder Demo Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: goal006-founder-demo
  cancel-in-progress: false

jobs:
  authorize-demo:
    runs-on: ubuntu-latest
    outputs:
      release_run_id: ${{ steps.release.outputs.release_run_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Select trusted current-main release
        id: release
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$DISPATCH_ACTOR" in
            dlai-sd|yk-dlaisd) ;;
            *) echo "Unauthorized Demo dispatcher" >&2; exit 1 ;;
          esac
          test "$DISPATCH_REF" = "refs/heads/main"
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          release_run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&event=push&status=success&per_page=100" \
            | jq -r --arg sha "$latest_main_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty')
          test -n "$release_run_id"
          artifact_name="goal006-exact-six-release-$latest_main_sha"
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_run_id/artifacts" \
            | jq -r --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and (.expired | not))] | first | .id // empty')
          test -n "$artifact_id"
          echo "release_run_id=$release_run_id" >> "$GITHUB_OUTPUT"
          echo "release_sha=$latest_main_sha" >> "$GITHUB_OUTPUT"

  deploy-demo:
    needs: authorize-demo
    uses: ./.github/workflows/deploy-environment.yaml
    with:
      environment: demo
      release_run_id: ${{ fromJSON(needs.authorize-demo.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize-demo.outputs.release_sha }}
      apply: true
    secrets: inherit

  verify-demo:
    needs: [authorize-demo, deploy-demo]
    uses: ./.github/workflows/post-deploy-verify.yaml
    with:
      environment: demo
      release_run_id: ${{ fromJSON(needs.authorize-demo.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize-demo.outputs.release_sha }}
      verification_client_id: ${{ needs.deploy-demo.outputs.verification_client_id }}
      web_url: ${{ needs.deploy-demo.outputs.web_url }}
    secrets: inherit

  publish-founder-url:
    needs: [authorize-demo, deploy-demo, verify-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified Founder Demo URL
        env:
          RELEASE_RUN_ID: ${{ needs.authorize-demo.outputs.release_run_id }}
          RELEASE_SHA: ${{ needs.authorize-demo.outputs.release_sha }}
          WEB_URL: ${{ needs.deploy-demo.outputs.web_url }}
        run: |
          test -n "$WEB_URL"
          {
            echo "## Founder Demo ready"
            echo
            echo "- URL: $WEB_URL"
            echo "- Release run: $RELEASE_RUN_ID"
            echo "- Release SHA: $RELEASE_SHA"
            echo "- Access boundary: configured Founder IPv4 /32 only"
            echo "- UAT status: prohibited pending explicit Founder Demo acceptance"
          } >> "$GITHUB_STEP_SUMMARY"
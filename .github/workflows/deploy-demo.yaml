name: GOAL-006 Exact-Branch Qualification

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment
        required: true
        default: uat
        type: choice
        options:
          - uat
      execution:
        description: Plan or apply
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: goal006-exact-branch-qualification
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      release_run_id: ${{ steps.release.outputs.release_run_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      lease_expires_at: ${{ steps.dispatch.outputs.lease_expires_at }}
      access_cidr: ${{ steps.dispatch.outputs.access_cidr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require exact qualification branch and normalize inputs
        id: dispatch
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          EXECUTION_MODE: ${{ inputs.execution }}
        run: |
          test "$GITHUB_REF" = "refs/heads/fix/goal006-cloud-platform-finalization"
          test "$TARGET_ENVIRONMENT" = "uat"
          normalized=$(python3 scripts/goal006_dispatch_inputs.py \
            --environment "$TARGET_ENVIRONMENT" \
            --execution "$EXECUTION_MODE")
          echo "lease_expires_at=$(jq -r '.lease_expires_at' <<< "$normalized")" >> "$GITHUB_OUTPUT"
          echo "access_cidr=$(jq -r '.access_cidr' <<< "$normalized")" >> "$GITHUB_OUTPUT"

      - name: Select trusted current-main release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_ACTOR" in dlai-sd|yk-dlaisd) ;; *) exit 1 ;; esac
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          release_run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&event=push&status=success&per_page=100" \
            | jq -r --arg sha "$latest_main_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty')
          test -n "$release_run_id"
          artifact_name="goal006-exact-six-release-$latest_main_sha"
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_run_id/artifacts" \
            | jq -r --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and (.expired | not))] | first | .id // empty')
          test -n "$artifact_id"
          echo "release_run_id=$release_run_id" >> "$GITHUB_OUTPUT"
          echo "release_sha=$latest_main_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: authorize
    uses: ./.github/workflows/deploy-environment.yaml
    with:
      environment: uat
      release_run_id: ${{ fromJSON(needs.authorize.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize.outputs.release_sha }}
      apply: ${{ inputs.execution == 'apply' }}
      initialize_configuration: true
      allow_uat_public_environment_replacement: ${{ inputs.execution == 'apply' }}
      lease_expires_at: ${{ needs.authorize.outputs.lease_expires_at }}
      access_cidr: ${{ needs.authorize.outputs.access_cidr }}
    secrets: inherit

  verify:
    if: inputs.execution == 'apply'
    needs: [authorize, deploy]
    uses: ./.github/workflows/post-deploy-verify.yaml
    with:
      environment: uat
      release_run_id: ${{ fromJSON(needs.authorize.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize.outputs.release_sha }}
      verification_client_id: ${{ needs.deploy.outputs.verification_client_id }}
      web_url: ${{ needs.deploy.outputs.web_url }}
      expected_access_cidr: ${{ needs.authorize.outputs.access_cidr }}
    secrets: inherit

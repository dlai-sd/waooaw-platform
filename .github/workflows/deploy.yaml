name: Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: demo
        type: choice
        options:
          - demo
          - uat
          - prod
      execution:
        description: "Plan, activate, or sleep the selected environment"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - activate
          - sleep
      lifecycle_evidence:
        description: "For sleep: retained-data gates; for UAT activate: Founder-accepted promotion JSON"
        required: false
        type: string
      founder_action_authority:
        description: "Current-session Founder authority reference required for activate/sleep"
        required: false
        type: string
      plan_digest:
        description: "Reviewed environment plan sha256 digest"
        required: false
        type: string
      secret_catalog_digest:
        description: "Rendered closed-world secret catalog sha256 digest"
        required: false
        type: string
      lease_id:
        description: "Single-use provider action lease identifier"
        required: false
        type: string
      release_tuple:
        description: "JSON containing configuration, dependency, migration, and schema sha256 digests"
        required: false
        type: string
permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: goal006-${{ inputs.environment }}-deployment
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      release_run_id: ${{ steps.release.outputs.release_run_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      lease_expires_at: ${{ steps.dispatch.outputs.lease_expires_at }}
      lifecycle_record_digest: ${{ steps.lifecycle.outputs.record_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment inputs
        id: dispatch
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          EXECUTION_MODE: ${{ inputs.execution }}
        run: |
          normalized=$(python3 scripts/goal006_dispatch_inputs.py \
            --environment "$TARGET_ENVIRONMENT" \
            --execution "$EXECUTION_MODE")
          jq -e . >/dev/null <<< "$normalized"
          echo "lease_expires_at=$(jq -r '.lease_expires_at' <<< "$normalized")" >> "$GITHUB_OUTPUT"

      - name: Select trusted current-main release
        id: release
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_REF: ${{ github.ref }}
          EXECUTION_MODE: ${{ inputs.execution }}
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$DISPATCH_ACTOR" in
            dlai-sd|yk-dlaisd) ;;
            *) echo "Unauthorized deployment dispatcher" >&2; exit 1 ;;
          esac
          test "$DISPATCH_REF" = "refs/heads/main"
          case "$EXECUTION_MODE" in plan|activate|sleep) ;; *) exit 1 ;; esac
          test "$TARGET_ENVIRONMENT" != prod || test "$EXECUTION_MODE" = plan
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          release_run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&event=push&status=success&per_page=100" \
            | jq -r --arg sha "$latest_main_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty')
          test -n "$release_run_id" || {
            echo "No successful main CI run found for release SHA $latest_main_sha" >&2
            exit 1
          }
          artifact_name="goal006-exact-seven-release-$latest_main_sha"
          artifact_id=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$release_run_id/artifacts?per_page=100" \
            | jq -r --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.name == $name and (.expired | not))] | first | .id // empty')
          test -n "$artifact_id" || {
            echo "No unexpired release artifact named $artifact_name found in CI run $release_run_id" >&2
            exit 1
          }
          echo "release_run_id=$release_run_id" >> "$GITHUB_OUTPUT"
          echo "release_sha=$latest_main_sha" >> "$GITHUB_OUTPUT"

      - name: Bind activate or sleep authorization tuple
        if: inputs.execution != 'plan'
        id: lifecycle
        env:
          ACTION: ${{ inputs.execution }}
          FOUNDER_ACTION_AUTHORITY: ${{ inputs.founder_action_authority }}
          LEASE_EXPIRY: ${{ steps.dispatch.outputs.lease_expires_at }}
          LEASE_ID: ${{ inputs.lease_id }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TUPLE: ${{ inputs.release_tuple }}
          SECRET_CATALOG_DIGEST: ${{ inputs.secret_catalog_digest }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          CONFIGURATION_DIGEST=$(jq -er '.configuration | strings' <<< "$RELEASE_TUPLE")
          DEPENDENCY_DIGEST=$(jq -er '.dependency | strings' <<< "$RELEASE_TUPLE")
          MIGRATION_DIGEST=$(jq -er '.migration | strings' <<< "$RELEASE_TUPLE")
          SCHEMA_DIGEST=$(jq -er '.schema | strings' <<< "$RELEASE_TUPLE")
          jq -n \
            --arg founder_action_authority "$FOUNDER_ACTION_AUTHORITY" \
            --arg runner_execution_identity "id-waooaw-${TARGET_ENVIRONMENT}-deployment-writer" \
            --arg release_sha "$RELEASE_SHA" \
            --arg plan_digest "$PLAN_DIGEST" \
            --arg secret_catalog_digest "$SECRET_CATALOG_DIGEST" \
            --arg lease_id "$LEASE_ID" \
            --arg lease_expiry "$LEASE_EXPIRY" \
            '{
              founder_action_authority: $founder_action_authority,
              runner_execution_identity: $runner_execution_identity,
              release_sha: $release_sha,
              plan_digest: $plan_digest,
              secret_catalog_digest: $secret_catalog_digest,
              lease_id: $lease_id,
              lease_expiry: $lease_expiry
            }' > wc124-authorization.json
          jq -n \
            --arg configuration "$CONFIGURATION_DIGEST" \
            --arg dependency "$DEPENDENCY_DIGEST" \
            --arg migration "$MIGRATION_DIGEST" \
            --arg release "sha256:$(printf '%s' "$RELEASE_SHA" | sha256sum | cut -d' ' -f1)" \
            --arg schema "$SCHEMA_DIGEST" \
            '{configuration:$configuration,dependency:$dependency,migration:$migration,release:$release,schema:$schema}' \
            > wc124-tuple-digests.json
          current_state=ACTIVE
          test "$ACTION" = sleep || current_state=SLEEPING
          python3 scripts/wc124_persistent_state_lifecycle.py \
            --operation-id "wc124-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --action "$ACTION" \
            --environment "$TARGET_ENVIRONMENT" \
            --current-state "$current_state" \
            --authorization wc124-authorization.json \
            --tuple-digests wc124-tuple-digests.json \
            --output wc124-lifecycle-record.json
          echo "record_digest=$(jq -r '.record_digest' wc124-lifecycle-record.json)" >> "$GITHUB_OUTPUT"

      - name: Verify Founder-accepted Demo identity before UAT activation
        if: inputs.execution == 'activate' && inputs.environment == 'uat'
        env:
          PROMOTION_EVIDENCE: ${{ inputs.lifecycle_evidence }}
        run: |
          set -euo pipefail
          test -n "$PROMOTION_EVIDENCE"
          printf '%s' "$PROMOTION_EVIDENCE" | jq -e . > wc124-uat-promotion.json
          python3 scripts/wc124_uat_promotion.py wc124-uat-promotion.json

      - name: Retain authorization-bound lifecycle record
        if: inputs.execution != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: wc124-lifecycle-authorization-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            wc124-lifecycle-record.json
            wc124-uat-promotion.json
          if-no-files-found: error
          retention-days: 400

  deploy:
    needs: authorize
    uses: ./.github/workflows/environment-deployment.yaml
    with:
      environment: ${{ inputs.environment }}
      release_run_id: ${{ fromJSON(needs.authorize.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize.outputs.release_sha }}
      apply: ${{ inputs.execution == 'activate' }}
      lease_expires_at: ${{ needs.authorize.outputs.lease_expires_at }}
      lifecycle_action: ${{ inputs.execution }}
      sleep_evidence_json: ${{ inputs.lifecycle_evidence }}
    secrets: inherit

  verify:
    if: inputs.execution == 'activate'
    needs: [authorize, deploy]
    uses: ./.github/workflows/environment-deployment-verification.yaml
    with:
      environment: ${{ inputs.environment }}
      release_run_id: ${{ fromJSON(needs.authorize.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize.outputs.release_sha }}
      verification_client_id: ${{ needs.deploy.outputs.verification_client_id }}
      web_url: ${{ needs.deploy.outputs.web_url }}
    secrets: inherit

  publish-url:
    if: inputs.execution == 'activate'
    needs: [authorize, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified environment URL
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_RUN_ID: ${{ needs.authorize.outputs.release_run_id }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          WEB_URL: ${{ needs.deploy.outputs.web_url }}
        run: |
          test -n "$WEB_URL"
          {
            echo "## $TARGET_ENVIRONMENT deployment ready"
            echo
            echo "- URL: $WEB_URL"
            echo "- Release run: $RELEASE_RUN_ID"
            echo "- Release SHA: $RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
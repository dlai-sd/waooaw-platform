name: Environment Deployment

on:
  # Demo deployments are Founder-dispatched only; no branch push may start one.
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: demo
        type: choice
        options:
          - demo
          - uat
          - prod
      execution:
        description: "Plan or apply the selected environment"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      image_home:
        description: "Image home: github pulls from GHCR; azure mirrors to ACR and pulls from ACR; both mirrors to ACR and falls back to GHCR"
        required: true
        default: github
        type: choice
        options:
          - github
          - azure
          - both

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: goal006-${{ inputs.environment || 'demo' }}-deployment
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      release_run_id: ${{ steps.release.outputs.release_run_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      control_sha: ${{ steps.release.outputs.control_sha }}
      lease_expires_at: ${{ steps.dispatch.outputs.lease_expires_at }}
      environment: ${{ steps.dispatch.outputs.environment }}
      execution: ${{ steps.dispatch.outputs.execution }}
      image_home: ${{ steps.dispatch.outputs.image_home }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment inputs
        id: dispatch
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'demo' }}
          EXECUTION_MODE: ${{ inputs.execution || 'apply' }}
          IMAGE_HOME: ${{ inputs.image_home || 'github' }}
        run: |
          normalized=$(python3 scripts/goal006_dispatch_inputs.py \
            --environment "$TARGET_ENVIRONMENT" \
            --execution "$EXECUTION_MODE" \
            --image-home "$IMAGE_HOME")
          jq -e . >/dev/null <<< "$normalized"
          {
            echo "lease_expires_at=$(jq -r '.lease_expires_at' <<< "$normalized")"
            echo "environment=$TARGET_ENVIRONMENT"
            echo "execution=$EXECUTION_MODE"
            echo "image_home=$(jq -r '.image_home' <<< "$normalized")"
          } >> "$GITHUB_OUTPUT"

      - name: Select trusted current-main release
        id: release
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_REF: ${{ github.ref }}
          EXECUTION_MODE: ${{ steps.dispatch.outputs.execution }}
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ steps.dispatch.outputs.environment }}
        run: |
          case "$DISPATCH_ACTOR" in
            dlai-sd|yk-dlaisd) ;;
            *) echo "Unauthorized deployment dispatcher" >&2; exit 1 ;;
          esac
          case "$EXECUTION_MODE" in plan|apply) ;; *) exit 1 ;; esac
          test "$TARGET_ENVIRONMENT" != prod || test "$EXECUTION_MODE" = plan
          test "$DISPATCH_REF" = "refs/heads/main"
          # Deployments never build images: the control SHA is always the current main head,
          # whose CI merge run published and attested every deployable image.
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          control_sha="$latest_main_sha"
          release_run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&event=push&status=success&per_page=100" \
            | jq -r --arg sha "$latest_main_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty')
          test -n "$release_run_id" || {
            echo "No successful main CI run found for release SHA $latest_main_sha" >&2
            exit 1
          }
          artifact_name="goal006-exact-seven-release-$latest_main_sha"
          artifact_id=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$release_run_id/artifacts?per_page=100" \
            | jq -r --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.name == $name and (.expired | not))] | first | .id // empty')
          test -n "$artifact_id" || {
            echo "No unexpired release artifact named $artifact_name found in CI run $release_run_id" >&2
            exit 1
          }
          {
            echo "release_run_id=$release_run_id"
            echo "release_sha=$latest_main_sha"
            echo "control_sha=$control_sha"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: authorize
    uses: ./.github/workflows/environment-deployment.yaml
    with:
      environment: ${{ needs.authorize.outputs.environment }}
      release_run_id: ${{ fromJSON(needs.authorize.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize.outputs.release_sha }}
      control_sha: ${{ needs.authorize.outputs.control_sha }}
      apply: ${{ needs.authorize.outputs.execution == 'apply' }}
      lease_expires_at: ${{ needs.authorize.outputs.lease_expires_at }}
      lifecycle_action: ${{ needs.authorize.outputs.execution == 'apply' && 'activate' || 'plan' }}
      image_home: ${{ needs.authorize.outputs.image_home }}
    secrets: inherit

  verify:
    # Verification evidence is produced whenever the private apply succeeded, even if runner
    # cleanup failed afterwards; publication still requires the whole deploy to succeed.
    if: >-
      always()
      && needs.authorize.result == 'success'
      && needs.authorize.outputs.execution == 'apply'
      && needs.deploy.outputs.apply_result == 'success'
    needs: [authorize, deploy]
    uses: ./.github/workflows/environment-deployment-verification.yaml
    with:
      environment: ${{ needs.authorize.outputs.environment }}
      release_run_id: ${{ fromJSON(needs.authorize.outputs.release_run_id) }}
      release_sha: ${{ needs.authorize.outputs.release_sha }}
      control_sha: ${{ needs.authorize.outputs.control_sha }}
      verification_client_id: ${{ needs.deploy.outputs.verification_client_id }}
      web_url: ${{ needs.deploy.outputs.web_url }}
    secrets: inherit

  publish-url:
    if: >-
      needs.authorize.outputs.execution == 'apply'
      && needs.deploy.result == 'success'
      && needs.verify.result == 'success'
    needs: [authorize, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified environment URL
        env:
          TARGET_ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          RELEASE_RUN_ID: ${{ needs.authorize.outputs.release_run_id }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          WEB_URL: ${{ needs.deploy.outputs.web_url }}
        run: |
          test -n "$WEB_URL"
          {
            echo "## $TARGET_ENVIRONMENT deployment ready"
            echo
            echo "- URL: $WEB_URL"
            echo "- Release run: $RELEASE_RUN_ID"
            echo "- Release SHA: $RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

name: GOAL-006 Private Runner Image

on:
  pull_request:
    branches: [main]
    paths:
      - infrastructure/runner/**
      - scripts/goal006_runner_lifecycle.py
      - scripts/goal006_runner_qualification.py
      - infrastructure/terraform/phase2/environments/demo/foundation/**
      - infrastructure/terraform/phase2/modules/foundation/**
      - .github/workflows/goal006-private-runner-qualification.yaml
      - .github/workflows/goal006-runner-image.yaml
  push:
    branches: [main]
    paths:
      - infrastructure/runner/**
      - scripts/goal006_runner_lifecycle.py
      - scripts/goal006_runner_qualification.py
      - infrastructure/terraform/phase2/environments/demo/foundation/**
      - infrastructure/terraform/phase2/modules/foundation/**
      - .github/workflows/goal006-private-runner-qualification.yaml
      - .github/workflows/goal006-runner-image.yaml

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/goal006-private-runner

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build private runner
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/runner/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          sbom: ${{ github.event_name == 'push' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.waooaw.goal=GOAL-006
            org.waooaw.purpose=private-ephemeral-runner

      - name: Verify runner toolchain
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --entrypoint /bin/bash '${{ env.IMAGE }}:sha-${{ github.sha }}' -lc '
            /home/runner/bin/Runner.Listener --version | grep -Fxq "2.336.0"
            test "$(terraform version -json | jq -r .terraform_version)" = "1.9.8"
            test "$(az version --query "\"azure-cli\"" -o tsv)" = "2.79.0"
            python3 /opt/waooaw/goal006_runner_lifecycle.py --help >/dev/null
            python3 /workspace/scripts/goal006_runner_qualification.py --help >/dev/null
            az storage blob lease acquire --help >/dev/null
            az storage blob lease release --help >/dev/null
            terraform -chdir=/workspace/infrastructure/terraform/phase2/environments/demo/foundation init -backend=false -input=false
            terraform -chdir=/workspace/infrastructure/terraform/phase2/environments/demo/foundation validate
          '

      - name: Verify real Storage lease contract
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          network="goal006-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          emulator="goal006-azurite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          account_name="goal006"
          account_key="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA=="
          connection_string="DefaultEndpointsProtocol=http;AccountName=${account_name};AccountKey=${account_key};BlobEndpoint=http://${emulator}:10000/${account_name};"
          cleanup() {
            docker rm -f "$emulator" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run --detach --name "$emulator" --network "$network" \
            --env "AZURITE_ACCOUNTS=${account_name}:${account_key}" \
            mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37 \
            azurite-blob --blobHost 0.0.0.0 >/dev/null
          ready=false
          for attempt in $(seq 1 30); do
            if docker run --rm --network "$network" \
              --entrypoint az '${{ env.IMAGE }}:sha-${{ github.sha }}' \
              storage container create --name qualification-contract \
              --connection-string "$connection_string" --only-show-errors --output none; then
              ready=true
              break
            fi
          done
          test "$ready" = true
          docker run --rm --network "$network" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env "AZURE_STORAGE_CONNECTION_STRING=$connection_string" \
            --entrypoint /bin/bash '${{ env.IMAGE }}:sha-${{ github.sha }}' -lc '
              set -euo pipefail
              printf "%s\n" probe > /tmp/storage-probe
              az storage blob upload --container-name qualification-contract --name probe \
                --file /tmp/storage-probe --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
                --only-show-errors --output none
              lease_id=$(PYTHONPATH=/workspace python3 -c "import os; from scripts.goal006_runner_qualification import acquire_blob_lease; print(acquire_blob_lease([\"az\", \"storage\", \"blob\"], [\"--connection-string\", os.environ[\"AZURE_STORAGE_CONNECTION_STRING\"], \"--only-show-errors\"], container_name=\"qualification-contract\", blob_name=\"probe\"))")
              test "$(az storage blob show --container-name qualification-contract --name probe \
                --connection-string "$AZURE_STORAGE_CONNECTION_STRING" --query properties.lease.status \
                --only-show-errors --output tsv)" = locked
              LEASE_ID="$lease_id" PYTHONPATH=/workspace python3 -c "import os; from scripts.goal006_runner_qualification import release_blob_lease; release_blob_lease([\"az\", \"storage\", \"blob\"], [\"--connection-string\", os.environ[\"AZURE_STORAGE_CONNECTION_STRING\"], \"--only-show-errors\"], container_name=\"qualification-contract\", blob_name=\"probe\", lease_id=os.environ[\"LEASE_ID\"] )"
              az storage blob delete --container-name qualification-contract --name probe \
                --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
                --only-show-errors --output none
            '

      - name: Scan private runner
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-goal006-private-runner.sarif
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always() && github.event_name == 'pull_request' && steps.image.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-goal006-private-runner.sarif

      - name: Attest published runner
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record immutable runner digest
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p runner-image
          jq -n \
            --arg image "$IMAGE@$IMAGE_DIGEST" \
            --arg source_commit "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '{schema:"waooaw.goal006-runner-image/v1", image:$image, source_commit:$source_commit, workflow_run_id:$workflow_run_id}' \
            > runner-image/manifest.json

      - name: Upload immutable runner digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal006-private-runner-${{ github.sha }}
          path: runner-image/manifest.json
          if-no-files-found: error
          retention-days: 90
name: Environment Deployment Verification

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release_run_id:
        required: true
        type: number
      release_sha:
        required: true
        type: string
      verification_client_id:
        required: true
        type: string
      web_url:
        required: true
        type: string
      expected_access_cidr:
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-verification
    env:
      ARM_CLIENT_ID: ${{ inputs.verification_client_id }}
      ARM_TENANT_ID: 0471534c-1bbe-40ab-ae65-3f721b62582c
      ARM_SUBSCRIPTION_ID: 2ed11839-6a0f-4eaa-bd94-44ca96ff5d84
    steps:
      - name: Enforce trusted caller workflow and ref
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_CALLER_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/deploy.yaml@refs/heads/main
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          test "$CALLER_WORKFLOW_REF" = "$EXPECTED_CALLER_WORKFLOW_REF"
          case "$TARGET_ENVIRONMENT" in demo|uat|prod) ;; *) exit 1 ;; esac

      - name: Reject stale release before independent verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$RELEASE_SHA" = "$latest_main_sha"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Download verified exact-six tuple
        uses: actions/download-artifact@v4
        with:
          name: goal006-private-runner-prestart-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-input
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify reusable release evidence
        run: |
          cp release-input/registry-release-manifest.json registry-release-manifest.json
          python scripts/goal006_release_verification.py validate \
            --release-sha '${{ inputs.release_sha }}' \
            --release-run-id '${{ inputs.release_run_id }}' \
            --manifest registry-release-manifest.json \
            --record release-input/release-verification.json

      - name: Azure login with independent OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Verify independent deployment subscription
        run: test "$(az account show --query id -o tsv)" = "$ARM_SUBSCRIPTION_ID"

      - name: Run independent deployment verification
        run: |
          bash scripts/goal006_verify_deployment.sh \
            '${{ inputs.environment }}' \
            registry-release-manifest.json \
            '${{ inputs.release_sha }}' \
            '${{ inputs.web_url }}' \
            '${{ inputs.expected_access_cidr }}'

      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal006-${{ inputs.environment }}-independent-verification-${{ inputs.release_run_id }}
          path: |
            registry-release-manifest.json
            live-inventory.json
            functional-job.json
            functional-verification.json
            functional-http-probes.log
            functional-constitutional-health.log
            revision-evidence/
            deployment-verification.json
          if-no-files-found: warn
          retention-days: 90

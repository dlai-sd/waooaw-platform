name: GOAL-006 UAT Promotion Not Authorized

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-demo-acceptance-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Reject UAT and Production promotion
        run: |
          echo "UAT remains prohibited until explicit Founder acceptance of the Demo deployment." >&2
          exit 1
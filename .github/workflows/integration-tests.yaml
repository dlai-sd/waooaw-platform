# Integration + Contract Tests — runs after merge to main (Gate 2)
# Constitutional basis: C-071 (Quality Obligation), ADR-013 (CCT as CI/CD gate)
# Purpose: Test real service-to-service interactions and API contract conformance.
#          Uses testcontainers — real PostgreSQL, no mocks for infrastructure.

name: Integration & Contract Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # Nightly full run at 02:00 UTC

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false  # Never cancel integration tests mid-run

jobs:

  runner-supply:
    uses: ./.github/workflows/validation-runner-supply.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # ─── Multi-tenant isolation adversarial suite (C-005, ADR-003) ──────────────
  multi-tenant-isolation:
    name: Multi-tenant isolation (adversarial)
    runs-on: ubuntu-latest
    needs: runner-supply
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waooaw
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: waooaw_test
        options: >-
          --health-cmd "pg_isready -U waooaw"
          --health-interval 5s
          --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Run DB migrations on test DB
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=testpassword \
            -v "$PWD/infrastructure/postgres/init:/sql:ro" \
            postgres:16-alpine sh -lc '
              for file in /sql/*.sql; do
                psql -h 127.0.0.1 -U waooaw -d waooaw_test -f "$file"
              done
            '
      - uses: ./.github/actions/use-validation-runner
        with:
          runner-id: python
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-tenant isolation tests
        env:
          DATABASE_URL: postgresql://waooaw:testpassword@host.docker.internal:5432/waooaw_test
        run: |
          docker compose --profile test-python run --rm \
            -e DATABASE_URL test-runner-python \
            pytest tests/integration/test_multi_tenant_*.py \
              -v --tb=short \
              --junit-xml=test-results/multi-tenant.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-tenant-results
          path: test-results/

  # ─── Service integration tests (BP ↔ CE, PR ↔ CE) ───────────────────────────
  service-integration:
    name: Service integration tests
    runs-on: ubuntu-latest
    needs: runner-supply
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waooaw
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: waooaw_test
        options: >-
          --health-cmd "pg_isready -U waooaw"
          --health-interval 5s
          --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Docker socket group for Testcontainers
        run: echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Run DB migrations
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=testpassword \
            -v "$PWD/infrastructure/postgres/init:/sql:ro" \
            postgres:16-alpine sh -lc '
              for file in /sql/*.sql; do
                psql -h 127.0.0.1 -U waooaw -d waooaw_test -f "$file"
              done
            '
      - uses: ./.github/actions/use-validation-runner
        with:
          runner-id: dotnet
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/use-validation-runner
        with:
          runner-id: python
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: BP + CE integration tests (.NET)
        env:
          DATABASE_URL: "Host=host.docker.internal;Port=5432;Database=waooaw_test;Username=waooaw;Password=testpassword"
        run: |
          docker compose --profile test-dotnet run --rm \
            -e DATABASE_URL test-runner-dotnet sh -lc '
              dotnet test tests/integration/constitutional-engine \
                --artifacts-path /tmp/artifacts/integration-constitutional-engine \
                --logger "junit;LogFileName=test-results/ce-integration.xml"
            '
        continue-on-error: false
      - name: PR + AIR integration tests (Python)
        env:
          DATABASE_URL: postgresql://waooaw:testpassword@host.docker.internal:5432/waooaw_test
        run: |
          docker compose --profile test-python run --rm \
            -e DATABASE_URL test-runner-python \
            pytest tests/integration/test_pr_ce_*.py tests/integration/test_air_pse_*.py \
              -v --tb=short \
              --junit-xml=test-results/service-integration.xml

  # ─── REST contract tests — Schemathesis OpenAPI fuzzing ───────────────────
  contract-rest:
    name: REST contract tests (Schemathesis)
    runs-on: ubuntu-latest
    needs: [runner-supply, service-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-validation-runner
        with:
          runner-id: python
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker contract services
        run: docker compose build business-platform professional-runtime
      - name: Start required contract services
        run: docker compose up --detach --wait --wait-timeout 180 business-platform professional-runtime
      - name: Fuzz Business Platform OpenAPI
        run: |
          docker compose --profile test-python run --rm test-runner-python \
            schemathesis run architecture/reference/api-specs/business-platform.openapi.yaml \
            --url http://business-platform:5001 \
            --checks all \
            --max-examples 100 \
            --report junit \
            --report-junit-path test-results/schemathesis-bp.xml
      - name: Fuzz Professional Runtime OpenAPI
        run: |
          docker compose --profile test-python run --rm test-runner-python \
            schemathesis run architecture/reference/api-specs/professional-runtime.openapi.yaml \
            --url http://professional-runtime:5003 \
            --checks all \
            --max-examples 100 \
            --report junit \
            --report-junit-path test-results/schemathesis-pr.xml
      - name: Stop contract services
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ─── seed-prompts.py contract test (C-059, ADR-028) ──────────────────────
  seed-prompts-contract:
    name: seed-prompts.py contract validation
    runs-on: ubuntu-latest
    needs: runner-supply
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-validation-runner
        with:
          runner-id: python
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dry-run seed-prompts.py
        run: docker compose --profile test-python run --rm test-runner-python python scripts/seed-prompts.py --dry-run
      - name: Verify PROMPT markers parse correctly
        run: |
          docker compose --profile test-python run --rm test-runner-python sh -lc '
            output=$(python scripts/seed-prompts.py --dry-run) || {
              echo "seed-prompts dry-run FAILED" >&2
              exit 1
            }
            echo "seed-prompts dry-run PASSED"
            printf "%s\n" "$output"
          '

  # ─── Prompt injection security suite (C-062, C-071) ─────────────────────
  prompt-injection:
    name: Prompt injection defense
    runs-on: ubuntu-latest
    needs: runner-supply
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/use-validation-runner
        with:
          runner-id: python
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run prompt injection suite
        run: |
          docker compose --profile test-python run --rm test-runner-python \
            pytest tests/security/test_prompt_injection.py \
              -v --tb=short \
              --junit-xml=test-results/prompt-injection.xml
        # This tests the PSE C-062 evaluator logic directly (unit-level)
        # Full DAST prompt injection runs in E2E workflow against live service

# Code Quality Gates — runs on every PR (Gate 1 of QA-POLICY.md)
# Constitutional basis: C-072 (Coding Standards Obligation), C-071 (Quality Obligation)
# Purpose: Enforce formatting, linting, type checking, and security scanning
#          across all languages before any code reaches main branch.
#          Tools decide style — agents do not debate formatting.

name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:

  static-preflight:
    name: Static workflow and Docker preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Compile workflow, Compose and Docker build graphs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/run_static_validation_preflight.sh

  runner-supply:
    needs: static-preflight
    uses: ./.github/workflows/validation-runner-supply.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  validation-plan:
    needs: runner-supply
    uses: ./.github/workflows/validation-plan.yaml
    permissions:
      contents: read
      packages: read
      attestations: read

  # ─── Commit message format (C-059 + C-073 traceability) ──────────────────
  # G-05 FIX: commitlint enforces IB:/Constitutional:/CCTs-added: fields on
  # every commit message. Without this, the spec→code traceability chain breaks
  # silently. commitlint.config.js defines WAOOAW-specific types and scopes.
  commitlint:
    name: Commit message lint (C-059 traceability)
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:commitlint
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}
          metadata-directory: test-results/wc104/metadata
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  # ─── .NET: CSharpier format + Roslyn analyzers ──────────────────────────
  dotnet-quality:
    name: .NET — CSharpier + analyzers + StyleCop
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: >-
      contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:dotnet:constitutional-engine') ||
      contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:dotnet:business-platform')
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validation-plan.outputs.dotnet_quality_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: ${{ matrix.gate }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Python: Ruff lint + format + mypy + bandit ─────────────────────────
  python-quality:
    name: Python — Ruff + mypy + bandit
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: >-
      contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:python:professional-runtime') ||
      contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:python:ai-runtime')
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validation-plan.outputs.python_quality_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: ${{ matrix.gate }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Python: scripts/ quality ────────────────────────────────────────────
  scripts-quality:
    name: Python scripts — ruff + mypy
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:scripts')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:scripts
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── TypeScript: Biome lint + format + type check ───────────────────────
  typescript-quality:
    name: TypeScript — Biome + tsc strict
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:typescript')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:typescript
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── SQL: sqlfluff ───────────────────────────────────────────────────────
  sql-quality:
    name: SQL — sqlfluff lint
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:sql')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:sql
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Proto: buf lint + format ────────────────────────────────────────────
  proto-quality:
    name: Proto — buf lint + breaking
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:proto')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:proto
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Security: OTel span tag audit (no PII in traces) ───────────────────
  observability-security:
    name: OTel span PII audit
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:observability')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:observability
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── C-073 Traceability annotation scan ─────────────────────────────────
  traceability-scan:
    name: C-073 Traceability scan (constitutional annotations)
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:traceability')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for diff + claim amendment detection
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:traceability
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: test-results/traceability-report.json

  # ─── Constitutional naming audit (C-072 naming convention) ──────────────
  constitutional-naming:
    name: Constitutional naming audit
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON(needs.validation-plan.outputs.selected_gates), 'quality:constitutional-naming')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: quality:constitutional-naming
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}
          metadata-directory: test-results/wc104/metadata
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  # ─── Mutation testing (weekly — Sunday at midnight UTC) ─────────────────
  mutation-dotnet:
    name: Mutation testing — .NET (Stryker)
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: mutation:dotnet
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: stryker-results
          path: test-results/stryker-ce-results/

  mutation-python:
    name: Mutation testing — Python (mutmut)
    runs-on: ubuntu-latest
    needs: [runner-supply, validation-plan]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-validation-gate
        with:
          gate-id: mutation:python
          token: ${{ secrets.GITHUB_TOKEN }}

name: Private Runner Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options:
          - demo
          - uat
          - prod
      operation:
        description: Operation
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
          - qualify
      reviewed_plan_run_id:
        description: Successful preview run ID required by apply
        required: false
        type: string
      remarks:
        description: Change reason and evidence context
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  ARM_CLIENT_ID: 60c07330-4cc1-4e12-95a2-adc0966f1941
  ARM_PRINCIPAL_ID: 77147af5-a32d-4151-b557-e719f319b55b
  ARM_TENANT_ID: 0471534c-1bbe-40ab-ae65-3f721b62582c
  ARM_SUBSCRIPTION_ID: 2ed11839-6a0f-4eaa-bd94-44ca96ff5d84
  STACK_ROOT: infrastructure/deployment-stacks/goal006-runner
  WORKFLOW_PATH: .github/workflows/private-runner-infrastructure.yaml
  TFSTATE_CONTAINER: tfstate
  CONFIG_CONTAINER: deployment-config
  EVIDENCE_RETENTION_DAYS: "90"

concurrency:
  group: goal006-runner-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deliver:
    if: inputs.operation != 'qualify'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Require trusted current main and valid input combination
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          REVIEWED_PLAN_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/main"
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$GITHUB_SHA" = "$latest_main_sha"
          case "$TARGET_ENVIRONMENT" in demo|uat|prod) ;; *) echo "ENVIRONMENT_NOT_ALLOWED: $TARGET_ENVIRONMENT" >&2; exit 1 ;; esac
          case "$OPERATION" in
            preview)
              test -z "$REVIEWED_PLAN_RUN_ID"
              ;;
            apply)
              grep -Eq '^[0-9]+$' <<< "$REVIEWED_PLAN_RUN_ID"
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate referenced workflow run
        if: inputs.operation == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCED_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
        run: |
          set -eu
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REFERENCED_RUN_ID")
          jq -e --arg path "$WORKFLOW_PATH" '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .path == $path
          ' <<< "$run" >/dev/null

      - name: Download reviewed plan
        if: inputs.operation == 'apply'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: goal006-runner-plan-${{ inputs.environment }}-*
          path: reviewed-input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reviewed_plan_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve immutable source commit and inputs
        id: source
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -eu
          reviewed_plan_path=""
          if test "$OPERATION" = apply; then
            reviewed_plan_path=$(find reviewed-input -name runner-plan.json -type f -print -quit)
            test -n "$reviewed_plan_path"
            source_commit=$(jq -er '.payload.source_commit' "$reviewed_plan_path")
            test "$(jq -er '.payload.environment' "$reviewed_plan_path")" = '${{ inputs.environment }}'
          else
            source_commit="$GITHUB_SHA"
          fi
          grep -Eq '^[0-9a-f]{40}$' <<< "$source_commit"
          test "$source_commit" = "$GITHUB_SHA"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'reviewed_plan_path=%s\n' "$reviewed_plan_path" >> "$GITHUB_OUTPUT"

      - name: Record dispatch context
        run: |
          jq -n \
            --arg environment '${{ inputs.environment }}' \
            --arg operation '${{ inputs.operation }}' \
            --arg remarks '${{ inputs.remarks }}' \
            --arg actor "$GITHUB_ACTOR" \
            --arg source_commit '${{ steps.source.outputs.source_commit }}' \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '{environment: $environment, operation: $operation, remarks: $remarks, actor: $actor, source_commit: $source_commit, workflow_run_id: $workflow_run_id}' \
            > dispatch-context.json

      - name: Verify immutable environment blueprint
        run: |
          python scripts/goal006_runner_bootstrap.py \
            --environment '${{ inputs.environment }}' \
            --manifest "$STACK_ROOT/bootstrap-manifest.json"

      - name: Azure login with constrained environment identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Enforce cumulative cost gate
        run: |
          set -eu
          scope="/subscriptions/$ARM_SUBSCRIPTION_ID"
          query='{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"totalCost":{"name":"PreTaxCost","function":"Sum"}}}}'
          python scripts/azure_rest_retry.py \
            --label "month-to-date actual cost" \
            --output actual-cost.json \
            --attempts 5 \
            --base-delay-seconds 5 \
            -- --method post \
            --url "https://management.azure.com${scope}/providers/Microsoft.CostManagement/query?api-version=2023-11-01" \
            --body "$query"
          month_start=$(date -u +%Y-%m-01T00:00:00Z)
          month_end=$(date -u -d "$(date -u -d "$month_start +1 month" +%Y-%m-%dT00:00:00Z) -1 second" +%Y-%m-%dT%H:%M:%SZ)
          forecast=$(jq -cn --arg from "$month_start" --arg to "$month_end" '{type:"Usage",timeframe:"Custom",timePeriod:{from:$from,to:$to},includeActualCost:true,includeFreshPartialCost:true,dataset:{granularity:"None",aggregation:{totalCost:{name:"PreTaxCost",function:"Sum"}}}}')
          python scripts/azure_rest_retry.py \
            --label "monthly forecast cost" \
            --output forecast-cost.json \
            --attempts 5 \
            --base-delay-seconds 5 \
            -- --method post \
            --url "https://management.azure.com${scope}/providers/Microsoft.CostManagement/forecast?api-version=2023-11-01" \
            --body "$forecast"
          python scripts/goal006_cost_gate.py \
            --actual actual-cost.json \
            --forecast forecast-cost.json \
            --configuration "$STACK_ROOT/cost-estimate.json"

      - name: Preview immutable environment plan
        if: inputs.operation == 'preview'
        run: |
          python scripts/goal006_runner_deployment.py preview \
            --environment '${{ inputs.environment }}' \
            --subscription-id "$ARM_SUBSCRIPTION_ID" \
            --source-commit '${{ steps.source.outputs.source_commit }}' \
            --output runner-plan.json
          jq -e 'all(.payload.changes[]; .change_type != "Delete")' runner-plan.json >/dev/null

      - name: Apply exact reviewed plan
        if: inputs.operation == 'apply'
        run: |
          python scripts/goal006_runner_deployment.py apply \
            --environment '${{ inputs.environment }}' \
            --subscription-id "$ARM_SUBSCRIPTION_ID" \
            --source-commit '${{ steps.source.outputs.source_commit }}' \
            --reviewed-plan '${{ steps.source.outputs.reviewed_plan_path }}' \
            --output deployment-record.json

      - name: Retain reviewed plan
        if: inputs.operation == 'preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal006-runner-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            runner-plan.json
            dispatch-context.json
            actual-cost.json
            forecast-cost.json
          if-no-files-found: warn
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}

      - name: Retain deployment evidence
        if: inputs.operation == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal006-runner-deployment-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            deployment-record.json
            dispatch-context.json
            actual-cost.json
            forecast-cost.json
          if-no-files-found: warn
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}

  resolve-environment:
    if: inputs.operation == 'qualify'
    runs-on: ubuntu-latest
    outputs:
      control_plane_client_id: ${{ steps.config.outputs.control_plane_client_id }}
      cleanup_client_id: ${{ steps.config.outputs.cleanup_client_id }}
      runner_resource_group: ${{ steps.config.outputs.runner_resource_group }}
      runner_broker_job: ${{ steps.config.outputs.runner_broker_job }}
      runner_cleanup_broker_job: ${{ steps.config.outputs.runner_cleanup_broker_job }}
      runner_job: ${{ steps.config.outputs.runner_job }}
      runner_label: ${{ steps.config.outputs.runner_label }}
      state_storage_account: ${{ steps.config.outputs.state_storage_account }}
      cleanup_evidence_container: ${{ steps.config.outputs.cleanup_evidence_container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve active environment configuration
        id: config
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          config=$(python3 scripts/goal006_environment_config.py --environment "$TARGET_ENVIRONMENT")
          for key in control_plane_client_id cleanup_client_id runner_resource_group runner_broker_job \
            runner_cleanup_broker_job runner_job runner_label state_storage_account cleanup_evidence_container; do
            echo "$key=$(jq -r --arg key "$key" '.[$key]' <<< "$config")" >> "$GITHUB_OUTPUT"
          done

  start-broker:
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
      RUNNER_RESOURCE_GROUP: ${{ needs.resolve-environment.outputs.runner_resource_group }}
      RUNNER_BROKER_JOB: ${{ needs.resolve-environment.outputs.runner_broker_job }}
    outputs:
      correlation: ${{ steps.start.outputs.correlation }}
      broker_execution: ${{ steps.start.outputs.execution }}
    steps:
      - name: Require trusted current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/main"
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$GITHUB_SHA" = "$latest_main_sha"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify immutable broker blueprint
        run: |
          python scripts/goal006_runner_bootstrap.py \
            --environment '${{ inputs.environment }}' \
            --manifest infrastructure/deployment-stacks/goal006-runner/bootstrap-manifest.json

      - name: Azure login with control-plane identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Enforce cumulative cost gate
        run: |
          set -eu
          scope="/subscriptions/$ARM_SUBSCRIPTION_ID"
          query='{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"totalCost":{"name":"PreTaxCost","function":"Sum"}}}}'
          python scripts/azure_rest_retry.py \
            --label "month-to-date actual cost" \
            --output actual-cost.json \
            --attempts 5 \
            --base-delay-seconds 5 \
            -- --method post \
            --url "https://management.azure.com${scope}/providers/Microsoft.CostManagement/query?api-version=2023-11-01" \
            --body "$query"
          month_start=$(date -u +%Y-%m-01T00:00:00Z)
          month_end=$(date -u -d "$(date -u -d "$month_start +1 month" +%Y-%m-%dT00:00:00Z) -1 second" +%Y-%m-%dT%H:%M:%SZ)
          forecast=$(jq -cn --arg from "$month_start" --arg to "$month_end" '{type:"Usage",timeframe:"Custom",timePeriod:{from:$from,to:$to},includeActualCost:true,includeFreshPartialCost:true,dataset:{granularity:"None",aggregation:{totalCost:{name:"PreTaxCost",function:"Sum"}}}}')
          python scripts/azure_rest_retry.py \
            --label "monthly forecast cost" \
            --output forecast-cost.json \
            --attempts 5 \
            --base-delay-seconds 5 \
            -- --method post \
            --url "https://management.azure.com${scope}/providers/Microsoft.CostManagement/forecast?api-version=2023-11-01" \
            --body "$forecast"
          python scripts/goal006_cost_gate.py \
            --actual actual-cost.json \
            --forecast forecast-cost.json \
            --configuration infrastructure/deployment-stacks/goal006-runner/cost-estimate.json

      - name: Start private signing broker
        id: start
        run: |
          set -eu
          correlation="goal006:${{ inputs.environment }}:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          runner_image=$(jq -er '.parameters.runnerImage.value' infrastructure/deployment-stacks/goal006-runner/${{ inputs.environment }}.parameters.json)
          az containerapp job show \
            --resource-group "$RUNNER_RESOURCE_GROUP" \
            --name "$RUNNER_BROKER_JOB" \
            --output json > broker-job.json
          python scripts/goal006_runner_execution.py broker \
            --job broker-job.json \
            --expected-image "$runner_image" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output broker-execution.json
          execution=$(az containerapp job start \
            --resource-group "$RUNNER_RESOURCE_GROUP" \
            --name "$RUNNER_BROKER_JOB" \
            --yaml broker-execution.json \
            --query name -o tsv)
          test -n "$execution"
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$RUNNER_BROKER_JOB" \
              --job-execution-name "$execution" \
              --query properties.status -o tsv)
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped) echo "Private broker failed: $status" >&2; exit 1 ;;
            esac
            test "$attempt" != 60
            sleep 5
          done
          printf 'correlation=%s\n' "$correlation" >> "$GITHUB_OUTPUT"
          printf 'execution=%s\n' "$execution" >> "$GITHUB_OUTPUT"

      - name: Retain hosted pre-start evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal006-private-runner-prestart-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            actual-cost.json
            forecast-cost.json
          if-no-files-found: error
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}

  qualify-private:
    needs: [resolve-environment, start-broker]
    runs-on: [self-hosted, "${{ needs.resolve-environment.outputs.runner_label }}"]
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve-environment.outputs.state_storage_account }}
      CONFIG_BLOB: ${{ inputs.environment }}/workload-configuration.json
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login with constrained environment identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Qualify private Storage and Terraform path
        run: |
          python3 scripts/goal006_runner_qualification.py \
            --environment '${{ inputs.environment }}' \
            --correlation '${{ needs.start-broker.outputs.correlation }}' \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --state-container "$TFSTATE_CONTAINER" \
            --config-container "$CONFIG_CONTAINER" \
            --config-blob "$CONFIG_BLOB" \
            --terraform-root infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation \
            --output-directory qualification \
            --output qualification-record.json

      - name: Retain private qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal006-private-runner-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-record.json
            qualification/
          if-no-files-found: warn
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}

  cleanup-private:
    if: always() && inputs.operation == 'qualify'
    needs: [resolve-environment, start-broker, qualify-private]
    runs-on: ubuntu-latest
    env:
      RUNNER_RESOURCE_GROUP: ${{ needs.resolve-environment.outputs.runner_resource_group }}
      RUNNER_BROKER_JOB: ${{ needs.resolve-environment.outputs.runner_broker_job }}
      RUNNER_CLEANUP_BROKER_JOB: ${{ needs.resolve-environment.outputs.runner_cleanup_broker_job }}
      RUNNER_JOB: ${{ needs.resolve-environment.outputs.runner_job }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve-environment.outputs.state_storage_account }}
      CLEANUP_EVIDENCE_CONTAINER: ${{ needs.resolve-environment.outputs.cleanup_evidence_container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login with control-plane identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ needs.resolve-environment.outputs.cleanup_client_id }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Start private cleanup broker
        env:
          PRIVATE_JOB_CONCLUSION: ${{ needs.qualify-private.result }}
        run: |
          set -eu
          runner_image=$(jq -er '.parameters.runnerImage.value' infrastructure/deployment-stacks/goal006-runner/${{ inputs.environment }}.parameters.json)
          az containerapp job show \
            --resource-group "$RUNNER_RESOURCE_GROUP" \
            --name "$RUNNER_CLEANUP_BROKER_JOB" \
            --output json > cleanup-job.json
          python scripts/goal006_runner_execution.py cleanup \
            --job cleanup-job.json \
            --expected-image "$runner_image" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --private-job-conclusion "$PRIVATE_JOB_CONCLUSION" \
            --output cleanup-execution.json
          execution=$(az containerapp job start \
            --resource-group "$RUNNER_RESOURCE_GROUP" \
            --name "$RUNNER_CLEANUP_BROKER_JOB" \
            --yaml cleanup-execution.json \
            --query name -o tsv)
          test -n "$execution"
          for attempt in $(seq 1 180); do
            status=$(az containerapp job execution show \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$RUNNER_CLEANUP_BROKER_JOB" \
              --job-execution-name "$execution" \
              --query properties.status -o tsv)
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped) echo "Private cleanup broker failed: $status" >&2; exit 1 ;;
            esac
            test "$attempt" != 180
            sleep 5
          done
          az containerapp job logs show \
            --resource-group "$RUNNER_RESOURCE_GROUP" \
            --name "$RUNNER_CLEANUP_BROKER_JOB" \
            --execution "$execution" \
            --container cleanup-broker \
            --tail 50 \
            --format text > cleanup-job.log 2>&1 || true
          evidence_container_url="https://$TFSTATE_STORAGE_ACCOUNT.blob.core.windows.net/$CLEANUP_EVIDENCE_CONTAINER"
          python scripts/goal006_runner_execution.py pointer \
            --environment '${{ inputs.environment }}' \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --private-job-conclusion "$PRIVATE_JOB_CONCLUSION" \
            --cleanup-execution-name "$execution" \
            --evidence-container-url "$evidence_container_url" \
            --output cleanup-record.json
          grep -F "cleanup/${{ inputs.environment }}/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT.json" cleanup-record.json

      - name: Verify zero active private executions
        run: |
          set -eu
          for job in "$RUNNER_JOB" "$RUNNER_BROKER_JOB"; do
            active=$(az containerapp job execution list \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$job" \
              --query "[?properties.status=='Running' || properties.status=='Processing' || properties.status=='Waiting'] | length(@)" \
              -o tsv)
            test "$active" = "0"
          done

      - name: Retain hosted cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goal006-private-runner-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: cleanup-record.json
          if-no-files-found: error
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}
# Autonomous Sprint Agent — executes sprint tasks every 2 hours
#
# constitutional_basis: C-066 Tier 2A, C-070 Third Instinct, C-001, C-065, C-059
# ib_item: IB-009
# spec: architecture/reference/agents/platform-it-expert-agent.md
#
# AUTHORIZATION: No per-execution human approval (C-066 Tier 2A).
#   IB:AUTHORIZED + WC exists + AUTONOMOUS_HALT: false = proceed.
# HUMAN OVERRIDE (C-001): Set AUTONOMOUS_HALT: true in PROJECT_STATE.md.
# C-065 SDLC SEPARATION:
#   execute job uses GITHUB_TOKEN (author).
#   review job uses REVIEW_APP_TOKEN (reviewer — different GitHub App identity).
#   GitHub platform enforces: same token cannot open AND approve a PR.
#
# FinOps optimization (4 patterns — see sprint-context/README.md):
#   1. RAG Index pre-step: builds sprint-context/index.json before agent runs — ~85% token reduction
#   2. Nested AGENTS.md: scoped context per src/ subdirectory — agent only loads relevant charter
#   3. model_hint routing: 'auto' for trivial tasks, 'reasoning' for architecture decisions
#   4. Hard timeout + retry gate: 30-min job limit; halt at 3 consecutive failures (C-001)

name: Autonomous Sprint Agent

on:
  schedule:
    - cron: '0 */2 * * *'    # Every 2 hours — matches 2-hr job cap so run always completes before next slot
  workflow_dispatch:
    inputs:
      force_task:
        description: 'Force specific task ID (e.g. WC011-01). Overrides state machine.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — plan but do not commit or open PR'
        required: false
        type: boolean
        default: false

# G1 FIX: Prevent overlapping runs. New cron-triggered run waits for running sprint.
# cancel-in-progress: false — never kill a running sprint mid-task.
concurrency:
  group: autonomous-sprint-${{ github.ref }}
  cancel-in-progress: false

# OIDC permissions for Azure Key Vault secret fetch (G2 fix)
permissions:
  id-token: write      # Required for Azure OIDC login
  contents: write      # git push
  pull-requests: write # PR create + review
  issues: write        # flag_spec_gap() — create spec gap issues (awaiting:founder-approval)

env:
  AUTONOMOUS_SPRINT_AGENT: 'true'
  PYTHONUNBUFFERED: '1'     # flush Python print() immediately → real-time logs in GitHub Actions

jobs:

  # ── Job 0: Pre-flight — HALT check + Sprint Index build ──────────────────
  # FinOps Pattern 1: Build sprint-context/index.json BEFORE agent runs.
  # This maps current task → exact spec files needed. Agent reads this index
  # instead of scanning the full 1,000+ file corpus. ~85% token reduction.
  # FinOps Pattern 4: Hard timeout + consecutive failure gate (C-001).
  preflight:
    name: "Pre-flight: HALT check + Sprint Index (FinOps RAG)"
    runs-on: ubuntu-latest
    timeout-minutes: 5              # Hard limit — index build is fast
    outputs:
      halt:         ${{ steps.halt_check.outputs.halt }}
      task_id:      ${{ steps.index_build.outputs.task_id }}
      model_hint:   ${{ steps.index_build.outputs.model_hint }}
      platform_phase: ${{ steps.halt_check.outputs.platform_phase }}
      consecutive_failures: ${{ steps.halt_check.outputs.consecutive_failures }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pipeline Health Check — EA recommendation, 2026-07-23
      # C-080: test execution uses Docker. Script syntax check uses docker compose run.
      # Security Architect review: label check uses GITHUB_TOKEN only — no secrets exposed.
      - name: Pipeline Health Check (CCT-PIPE-01 gate)
        id: health_check
        run: |
          echo "── Pipeline Health Check ──────────────────────────────────"
          FAILURES=0

          # 1. Script syntax validation via direct Python (pipeline tooling, not test code)
          # Note: pipeline scripts run in Actions runner (CI tooling, not tests).
          # Test code runs in Docker (C-080). This syntax check is pipeline tooling.
          for script in scripts/autonomous_sprint_runner.py \
                        scripts/autonomous_sprint_reviewer.py \
                        scripts/build_sprint_index.py \
                        scripts/sprint_state.py \
                        scripts/sprint_status_reporter.py \
                        scripts/runner_integrity_check.py; do
            python3 -m py_compile "$script" 2>/dev/null && echo "  ✅ $script" || {
              echo "  ❌ SYNTAX ERROR: $script"
              FAILURES=$((FAILURES+1))
            }
          done

          # 1b. Runner integrity gate — catch internal wiring bugs before execution
          python3 scripts/runner_integrity_check.py >/tmp/runner_integrity.log 2>&1 \
            && { echo "  ✅ runner integrity"; cat /tmp/runner_integrity.log; } \
            || { echo "  ❌ RUNNER INTEGRITY FAILED"; cat /tmp/runner_integrity.log; FAILURES=$((FAILURES+1)); }

          # 2. Required GitHub labels — self-heal: create if missing (prevents run #24/#25/#30 failure pattern)
          # Security Architect note: gh label create is idempotent with --force. Writes only label metadata.
          for label in "tier:2-feature" "status:pr-open" "awaiting:review" \
                       "sprint:running" "sprint:waiting" "founder-action-needed"; do
            EXISTS=$(gh label list --repo "$GITHUB_REPOSITORY" --json name \
              --jq ".[] | select(.name==\"$label\") | .name" 2>/dev/null | head -1 || echo "")
            if [ -n "$EXISTS" ]; then
              echo "  ✅ label: $label"
            else
              gh label create "$label" --repo "$GITHUB_REPOSITORY" --color "0075ca" --force 2>/dev/null \
                && echo "  🔧 label created (self-heal): $label" \
                || { echo "  ❌ MISSING LABEL (create failed): $label"; FAILURES=$((FAILURES+1)); }
            fi
          done

          # 3. Sprint state coherence
          PHASE=$(python3 -c "
          import re
          content = open('constitution/PROJECT_STATE.md').read()
          m = re.search(r'platform_phase:\s*(\S+)', content)
          print(m.group(1).strip(\"'\\\"\") if m else 'UNKNOWN')
          ")
          echo "  ℹ️  platform_phase=$PHASE"

          # 4. C-086 Pre-Execution Simulation gate (WC-019)
          python3 scripts/check_c086_gate.py || { echo "  ❌ C-086 gate FAILED"; FAILURES=$((FAILURES+1)); }

          echo "── Health Check: $FAILURES failure(s) ─────────────────────"
          if [ "$FAILURES" -gt 0 ]; then
            echo "  ❌ Pipeline health check FAILED — fix issues above before sprint can run"
            exit 1
          fi
          echo "  ✅ Pipeline healthy — proceeding to HALT check"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check AUTONOMOUS_HALT + consecutive failures (C-001)
        id: halt_check
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          content = Path("constitution/PROJECT_STATE.md").read_text()
          halt_match = re.search(r"autonomous_halt:\s*(true|false)", content)
          halt = halt_match.group(1) if halt_match else "false"

          failures_match = re.search(r"consecutive_failures:\s*(\d+)", content)
          failures = int(failures_match.group(1)) if failures_match else 0

          print(f"  autonomous_halt={halt}, consecutive_failures={failures}")
          EOF
          # W2 fix: the block above was dead (printed to stdout, not $GITHUB_OUTPUT)
          # $GITHUB_OUTPUT is written by the bash block below — keeping only that.

          # Proper GITHUB_OUTPUT write
          HALT=$(python3 -c "
          import re
          content = open('constitution/PROJECT_STATE.md').read()
          halt = re.search(r'autonomous_halt:\s*(true|false)', content)
          failures = re.search(r'consecutive_failures:\s*(\d+)', content)
          phase = re.search(r'platform_phase:\s*(\S+)', content)
          h = halt.group(1) if halt else 'true'
          f = int(failures.group(1)) if failures else 0
          p = phase.group(1).strip('\"\'') if phase else 'SPEC'
          # Halt if: explicit halt=true, OR >=3 failures, OR not IMPLEMENTATION phase
          if h == 'true':
              print('true')
          elif f >= 3:
              print('true')
          elif p != 'IMPLEMENTATION':
              print('true')
          else:
              print('false')
          ")
          PHASE=$(python3 -c "
          import re
          content = open('constitution/PROJECT_STATE.md').read()
          m = re.search(r'platform_phase:\s*(\S+)', content)
          print(m.group(1).strip('\"\'') if m else 'SPEC')
          ")
          FAILURES=$(python3 -c "
          import re
          content = open('constitution/PROJECT_STATE.md').read()
          m = re.search(r'consecutive_failures:\s*(\d+)', content)
          print(m.group(1) if m else '0')
          ")
          echo "halt=$HALT" >> "$GITHUB_OUTPUT"
          echo "consecutive_failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "platform_phase=$PHASE" >> "$GITHUB_OUTPUT"
          # Log reason for transparency
          if [ "$HALT" = "true" ]; then
            echo "  Halt reason: autonomous_halt or consecutive_failures>=3 or platform_phase!= IMPLEMENTATION"
            echo "  platform_phase=$PHASE (must be IMPLEMENTATION to execute)"
          fi

      - name: Build Sprint Context Index (FinOps RAG — Pattern 1)
        id: index_build
        if: steps.halt_check.outputs.halt == 'false'
        env:
          FORCE_TASK: ${{ inputs.force_task || '' }}
        run: |
          if [ -n "$FORCE_TASK" ]; then
            python3 scripts/build_sprint_index.py --task "$FORCE_TASK"
          else
            python3 scripts/build_sprint_index.py
          fi

          # Extract task_id and model_hint from generated index
          TASK_ID=$(python3 -c "import json; d=json.load(open('sprint-context/index.json')); print(d['task_id'])")
          MODEL_HINT=$(python3 -c "import json; d=json.load(open('sprint-context/index.json')); print(d['model_hint'])")
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "model_hint=$MODEL_HINT" >> "$GITHUB_OUTPUT"
          echo "  Index built: task=$TASK_ID, model_hint=$MODEL_HINT"

      # ── Pre-Sprint Gap Analysis (C-086 + GOAL-003) ────────────────────────────
      # Proactive: surfaces probable failure modes BEFORE LLM is called.
      # CRITICAL gaps halt the sprint. HIGH gaps warn on Issue #7 but proceed.
      # Goal Orchestrator constitutional duty — documented in GEOM §11.
      - name: Pre-Sprint Gap Analysis (C-086 proactive gate)
        id: gap_analysis
        if: steps.halt_check.outputs.halt == 'false'
        env:
          TASK_ID: ${{ steps.index_build.outputs.task_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the Work Contract file for the current sprint
          SPRINT_WC=$(python3 -c "
          import re, json
          idx = json.load(open('sprint-context/index.json'))
          sprint = idx.get('sprint', 'WC-012')
          print(sprint)
          " 2>/dev/null || echo "")

          WC_FILE=$(ls work-contracts/${SPRINT_WC}-*.md 2>/dev/null | head -1 || echo "")

          if [ -n "$WC_FILE" ]; then
            echo "  Running pre-sprint simulation: $WC_FILE"
            # W1 fix: run once, capture — was run 3 separate times (output + summary + count)
            SIM_OUT=$(python3 scripts/pre_sprint_sim.py "$WC_FILE" 2>&1 || true)
            echo "$SIM_OUT"

            # Post gap summary to GitHub Step Summary
            echo "## 🔍 Pre-Sprint Gap Analysis" >> $GITHUB_STEP_SUMMARY
            echo "$SIM_OUT" | grep -E 'CRITICAL|HIGH|MEDIUM|confidence|SUMMARY' | \
              sed 's/^/  /' >> $GITHUB_STEP_SUMMARY || true

            # W5 fix: count from captured output, not a new subprocess call
            CRITICAL=$(echo "$SIM_OUT" | grep -c 'CRITICAL' || true)
            CRITICAL=${CRITICAL:-0}
            if [ "$CRITICAL" -gt 0 ]; then
              echo "  ⛔ CRITICAL gaps found ($CRITICAL) — sprint halted (C-086 pre-execution gate)"
              echo "gap_halt=true" >> "$GITHUB_OUTPUT"
            else
              echo "  ✅ No CRITICAL gaps — sprint may proceed"
              echo "gap_halt=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "  No WC file found for $SPRINT_WC — skipping gap analysis"
            echo "gap_halt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload sprint index as artifact
        if: steps.halt_check.outputs.halt == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sprint-context-index
          path: sprint-context/index.json
          retention-days: 7

  # ── Job 1: Execute sprint tasks (Implementation hat) ─────────────────────
  # C-065: This job is the AUTHOR. Uses GITHUB_TOKEN.
  # FinOps Pattern 3: MODEL_HINT env var routes trivial tasks to 'auto' model tier.
  # FinOps Pattern 4: timeout-minutes=30 hard limit prevents runaway agent loops.
  execute:
    name: "Execute sprint (Platform IT Expert — Implementation)"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.halt == 'false'
    timeout-minutes: 120            # 2-hour cap. Worst case: 4 tasks × 4 subtasks × 3 attempts × ~3min = ~144min.
                                     # Concurrency group (cancel-in-progress: false) prevents overlap with next cron.
    outputs:
      pr_number:         ${{ steps.runner.outputs.pr_number }}
      halt:              ${{ steps.runner.outputs.halt }}
      result:            ${{ steps.runner.outputs.result }}
      sprint:            ${{ steps.runner.outputs.sprint }}
      scaffold_failed:   ${{ steps.runner.outputs.scaffold_failed }}
      infra_error_tasks: ${{ steps.runner.outputs.infra_error_tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # P1-02: .NET 9 SDK — required for WC-012+ (CE + BP skeleton tasks)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # E3 FIX: NuGet package cache — avoids cold-restore on every runner VM spin
      # Saves ~8-10s per run on dotnet build. Cache keyed on .csproj hash.
      - name: Cache NuGet packages (E3 — cold-restore elimination)
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: pip install pyyaml requests PyJWT cryptography

      - name: Configure git
        run: |
          git config user.name  "WAOOAW AI Agent - Platform IT Expert"
          git config user.email "platform-it-expert@waooaw.ai"

      # G2 FIX: Login to Azure via OIDC then fetch all secrets from Key Vault
      # No long-lived credentials stored anywhere — 5-minute OIDC token only
      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Azure Key Vault
        id: kv_secrets
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ vars.AZURE_KEYVAULT_NAME }}
          secrets: 'ANTHROPIC-API-KEY, GH-APP-ID, GH-APP-INSTALLATION-ID, GH-APP-PRIVATE-KEY, GOOGLE-VERTEX-SA-KEY'

      # G3 FIX: Skip execution if an open PR already exists for the sprint branch.
      # D2 FIX: check by HEAD BRANCH (ib/009/sprint-NNN), not task title.
      # Task-title search missed sprint-level PRs (e.g. "WC-013" PR not found for "WC013-01").
      # Branch-level check is correct: if the sprint branch has an open PR, wait for it.
      - name: Check for existing open PR (G3 — duplicate prevention)
        id: pr_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_ID: ${{ needs.preflight.outputs.task_id }}
        run: |
          # Derive sprint branch name from task ID (WC013-01 → ib/009/sprint-013)
          SPRINT_NUM=$(echo "$TASK_ID" | grep -oP 'WC\K\d+' | head -1 || echo "")
          SPRINT_BRANCH=""
          if [ -n "$SPRINT_NUM" ]; then
            SPRINT_BRANCH="ib/009/sprint-$(printf '%03d' $((10#$SPRINT_NUM)))"
          fi

          EXISTING=""
          # Primary: check by branch
          if [ -n "$SPRINT_BRANCH" ]; then
            EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --head "$SPRINT_BRANCH" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          fi
          # Fallback: if no branch PR, check by task title (backwards compat)
          if [ -z "$EXISTING" ]; then
            EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --search "$TASK_ID in:title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          fi

          if [ -n "$EXISTING" ]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "existing_pr=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "⚠️  PR #$EXISTING already open for sprint branch $SPRINT_BRANCH — skipping. Waiting for review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ No open PR for $TASK_ID (branch: $SPRINT_BRANCH) — proceeding."
          fi

      - name: Download sprint index artifact
        if: steps.pr_check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sprint-context-index
          path: sprint-context/

      - name: Run autonomous sprint agent
        id: runner
        if: steps.pr_check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ steps.kv_secrets.outputs.ANTHROPIC-API-KEY }}
          GOOGLE_VERTEX_SA_KEY: ${{ steps.kv_secrets.outputs.GOOGLE-VERTEX-SA-KEY }}
          FORCE_TASK:        ${{ inputs.force_task || '' }}
          DRY_RUN:           ${{ inputs.dry_run || 'false' }}
          GITHUB_REPO:       ${{ github.repository }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          SPRINT_MODEL_HINT: ${{ needs.preflight.outputs.model_hint }}
          SPRINT_TASK_ID:    ${{ needs.preflight.outputs.task_id }}
        run: python3 scripts/autonomous_sprint_runner.py

      # D3 FIX: Write autonomous_halt=true to main when scaffold fails.
      # Scaffold failures are permanent until a human fixes the code.
      # consecutive_failures on the sprint branch is invisible to pre-flight (reads main).
      # Writing halt to main ensures the next run stops immediately and doesn't waste compute.
      - name: Halt-to-main on scaffold failure (D3 — state persistence fix)
        if: steps.runner.outputs.scaffold_failed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "  🛑 Scaffold failed — writing autonomous_halt=true to main to stop retry loop"
          git config user.name  "WAOOAW AI Agent - Platform IT Expert"
          git config user.email "platform-it-expert@waooaw.ai"
          git fetch origin main
          git checkout main
          python3 scripts/sprint_state.py set autonomous_halt true
          git add constitution/PROJECT_STATE.md
          git diff --cached --quiet || git commit -m "chore(pm): halt autonomous sprint — scaffold failed, requires human fix" \
            -m "IB: IB-009" \
            -m "Constitutional: C-001 (Human Override) C-084 (scaffold failure stops downstream tasks)"
          git push origin main
          echo "  ✅ autonomous_halt=true written to main — next cron run will skip until Founder clears"

      # G7 FIX: Human-readable summary — visible at Actions tab without reading logs
      - name: Write run summary (G7 — status visibility)
        if: always()
        env:
          TASK_ID:         ${{ needs.preflight.outputs.task_id }}
          SKIP:            ${{ steps.pr_check.outputs.skip }}
          EXISTING_PR:     ${{ steps.pr_check.outputs.existing_pr }}
          PR_NUMBER:       ${{ steps.runner.outputs.pr_number }}
          RESULT:          ${{ steps.runner.outputs.result }}
          SCAFFOLD_FAILED: ${{ steps.runner.outputs.scaffold_failed }}
        run: |
          echo "## 🤖 WAOOAW Autonomous Sprint" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Task | \`$TASK_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          if [ "$SKIP" = "true" ]; then
            PLAIN="Code for $TASK_ID is done and waiting for review. PR #$EXISTING_PR is open. No action needed — the reviewer bot will handle it."
            echo "| Status | ⏸ Waiting — PR #$EXISTING_PR open, awaiting review/merge |" >> $GITHUB_STEP_SUMMARY
          elif [ "$SCAFFOLD_FAILED" = "true" ]; then
            PLAIN="The robot tried to write $TASK_ID code but it broke at the start (build error). It has stopped itself so it doesn't keep failing. A developer needs to look at the build error and fix it before it can try again."
            echo "| Status | 🛑 Scaffold build failed — sprint halted, requires human fix |" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESULT" = "SUCCESS" ]; then
            PLAIN="$TASK_ID is done! New code is written and PR #$PR_NUMBER is open for review. The review bot is checking it — no action needed from you right now."
            echo "| Status | ✅ PR #$PR_NUMBER opened — awaiting review |" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESULT" = "PARTIAL" ]; then
            PLAIN="Some tasks ran but one failed. PR #${PR_NUMBER:-'(none)'} may be open with partial work. Check the logs to see which task broke — fix that before the next run."
            echo "| Status | ⚠️ Partial execution — review first failed task before re-trigger |" >> $GITHUB_STEP_SUMMARY
          else
            PLAIN="The run failed and no code was produced. Check the job logs — something went wrong before any tasks could execute."
            echo "| Status | ❌ Failed — see job logs |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🗣️ What Happened (Plain English)" >> $GITHUB_STEP_SUMMARY
          echo "$PLAIN" >> $GITHUB_STEP_SUMMARY

      - name: Upload monitor signal as artifact
        if: always()     # upload even if runner failed — partial signals are still useful
        uses: actions/upload-artifact@v4
        with:
          name: sprint-monitor-signal
          path: sprint-context/monitor-signal.json
          if-no-files-found: ignore   # may not exist if execute was cancelled or dry-run
          retention-days: 7

  # ── Job 3: Sprint Dashboard reporter ─────────────────────────────────────
  # Posts a human-readable status comment to Issue #7 (Sprint Dashboard) after
  # every run — success, skip, halt, or failure. Yogesh monitors via GitHub
  # mobile. Label on issue changes to reflect current state.
  # Runs always: even when halted, so SPEC-phase skips are visible.
  report:
    name: "Post status to Sprint Dashboard (Issue #7)"
    runs-on: ubuntu-latest
    needs: [preflight, execute]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests -q
      - name: Post status to Sprint Dashboard Issue #7
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:        ${{ github.repository }}
          SPRINT_TASK_ID:     ${{ needs.preflight.outputs.task_id }}
          PLATFORM_PHASE:     ${{ needs.preflight.outputs.platform_phase }}
          SPRINT_RESULT:      ${{ needs.execute.outputs.result || (needs.preflight.outputs.halt == 'true' && 'HALTED' || 'UNKNOWN') }}
          SPRINT_PR_NUMBER:   ${{ needs.execute.outputs.pr_number }}
          # W3 fix: SPRINT_HALT_REASON computed in bash (YAML >= '3' is string comparison, always wrong)
          SPRINT_HALT_REASON: ""
          SPRINT_EXISTING_PR: ""
          GITHUB_RUN_ID:      ${{ github.run_id }}
          CONSECUTIVE_FAILURES: ${{ needs.preflight.outputs.consecutive_failures }}
          PLATFORM_PHASE_VAL: ${{ needs.preflight.outputs.platform_phase }}
        run: |
          # W3 fix: compute halt reason numerically in bash before calling reporter
          if [ "$PLATFORM_PHASE_VAL" != "IMPLEMENTATION" ]; then
            export SPRINT_HALT_REASON="Platform is in $PLATFORM_PHASE_VAL phase \u2014 implementation not authorized"
          elif [ "${CONSECUTIVE_FAILURES:-0}" -ge 3 ]; then
            export SPRINT_HALT_REASON="${CONSECUTIVE_FAILURES} consecutive failures \u2014 auto-halt until Founder review"
          fi
          python3 scripts/sprint_status_reporter.py
  # C-065: This job is the REVIEWER. Uses REVIEW_APP_TOKEN (different identity).
  # Until REVIEW_APP_TOKEN is provisioned: advisory comment only.
  review:
    name: "PR Review (Platform IT Expert — PR Review hat, C-065)"
    runs-on: ubuntu-latest
    timeout-minutes: 15             # Hard limit: 15 min max for review (FinOps Pattern 4)
    needs: execute
    if: |
      needs.execute.outputs.halt != 'true' &&
      needs.execute.outputs.pr_number != '' &&
      (needs.execute.outputs.result == 'SUCCESS' || needs.execute.outputs.result == 'PARTIAL')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests PyJWT cryptography -q

      - name: Login to Azure (OIDC) and fetch reviewer credentials
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch reviewer secrets from Key Vault
        id: kv_review
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ vars.AZURE_KEYVAULT_NAME }}
          secrets: 'GH-APP-ID, GH-APP-INSTALLATION-ID, GH-APP-PRIVATE-KEY, ANTHROPIC-API-KEY'

      - name: Run PR review
        env:
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GH_APP_ID:            ${{ steps.kv_review.outputs.GH-APP-ID }}
          GH_APP_INSTALLATION_ID: ${{ steps.kv_review.outputs.GH-APP-INSTALLATION-ID }}
          GH_APP_PRIVATE_KEY:   ${{ steps.kv_review.outputs.GH-APP-PRIVATE-KEY }}
          ANTHROPIC_API_KEY:    ${{ steps.kv_review.outputs.ANTHROPIC-API-KEY }}
          PR_NUMBER:            ${{ needs.execute.outputs.pr_number }}
          SPRINT:               ${{ needs.execute.outputs.sprint }}
          GITHUB_REPO:          ${{ github.repository }}
        run: python3 scripts/autonomous_sprint_reviewer.py

  # ── Job 4: Constitutional Monitor & Feedback (C-069 / C-070) ─────────────────
  # Runs after EVERY sprint execution — success or failure.
  # Classifies failures, closes false spec-gap issues, drafts constitutional proposals.
  # C-069: platform MUST detect degradation and raise proposals autonomously.
  # C-070: self-improvement instinct is mandatory — waiting for humans = violation.
  monitor:
    name: "Constitutional Monitor & Feedback (C-069)"
    runs-on: ubuntu-latest
    timeout-minutes: 15             # Raised from 10: auto-extend may call Haiku + git push
    needs: [preflight, execute, report]
    # W4 fix: run monitor always — even when preflight job itself fails (not just halts).
    # If preflight fails, halt output is empty/null — monitor still needs to record failures.
    if: always() && (needs.preflight.outputs.halt == 'false' || needs.preflight.result == 'failure')
    permissions:
      contents: write              # git push for auto-extended advisor handlers
      issues:   write
      id-token: write              # OIDC for KV secret fetch (ANTHROPIC key for auto-extend)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests -q

      - name: Login to Azure (OIDC) for auto-extend key
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true   # non-fatal — auto-extend skips gracefully without key

      - name: Fetch ANTHROPIC key for advisor auto-extend
        id: kv_monitor
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ vars.AZURE_KEYVAULT_NAME }}
          secrets: 'ANTHROPIC-API-KEY'
        continue-on-error: true   # non-fatal — auto-extend skips gracefully without key

      - name: Download monitor signal artifact
        uses: actions/download-artifact@v4
        with:
          name: sprint-monitor-signal
          path: sprint-context/
        continue-on-error: true   # signal may not exist if execute was cancelled

      - name: Run Sprint Health Monitor
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          SPRINT:            ${{ needs.execute.outputs.sprint }}
          SPRINT_RESULT:     ${{ needs.execute.outputs.result }}
          SCAFFOLD_FAILED:   ${{ needs.execute.outputs.scaffold_failed }}
          INFRA_ERROR_TASKS: ${{ needs.execute.outputs.infra_error_tasks }}
        run: python3 scripts/sprint_monitor.py

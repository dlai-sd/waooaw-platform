            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-migration-plan.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-migration-policy.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-migration-provenance.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-migration.tfplan
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-dependencies-plan.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-dependencies-policy.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-dependencies-provenance.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-dependencies.tfplan
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-dependencies-apply.log
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-activation-plan.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-activation-policy.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-activation-provenance.json
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-activation.tfplan
            infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload/workload-activation-apply.log
          if-no-files-found: warn
          retention-days: 90

      - name: Record Terraform job result
        id: apply_result
        if: always()
        run: echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  cleanup-private:
    # Skip when no broker execution was ever started: there is no runner to reconcile
    # (run 39433203446 surfaced this as a misleading AADSTS700213 login failure).
    if: >-
      always()
      && needs.resolve-environment.result == 'success'
      && needs.start-broker.outputs.runner_started == 'true'
    needs: [resolve-environment, start-broker, terraform]
    runs-on: ubuntu-latest
    env:
      RUNNER_CLEANUP_CLIENT_ID: ${{ needs.resolve-environment.outputs.cleanup_client_id }}
      RUNNER_RESOURCE_GROUP: ${{ needs.resolve-environment.outputs.runner_resource_group }}
      RUNNER_BROKER_JOB: ${{ needs.resolve-environment.outputs.runner_broker_job }}
      RUNNER_CLEANUP_BROKER_JOB: ${{ needs.resolve-environment.outputs.runner_cleanup_broker_job }}
      RUNNER_JOB: ${{ needs.resolve-environment.outputs.runner_job }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve-environment.outputs.state_storage_account }}
      CLEANUP_EVIDENCE_CONTAINER: ${{ needs.resolve-environment.outputs.cleanup_evidence_container }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          ref: ${{ inputs.control_sha }}

      - name: Install pinned Azure CLI extensions
        run: bash scripts/goal006_az_extensions.sh

      - name: Azure login with cleanup identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3 (Node 24)
        with:
          client-id: ${{ env.RUNNER_CLEANUP_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Start private cleanup broker
        env:
          PRIVATE_JOB_CONCLUSION: ${{ needs.terraform.result }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -eu
          blueprint_runner_image=$(jq -er '.parameters.runnerImage.value' \
            'infrastructure/deployment-stacks/goal006-runner/${{ inputs.environment }}.parameters.json')
          execution_runner_image="$blueprint_runner_image"
          az containerapp job show \
            --resource-group "$RUNNER_RESOURCE_GROUP" \
            --name "$RUNNER_CLEANUP_BROKER_JOB" \
            --output json > cleanup-job.json
          subscription_compact=${ARM_SUBSCRIPTION_ID//-/}
          runner_registry="acrwaooawrun${TARGET_ENVIRONMENT}${subscription_compact:0:6}"
          runner_login_server="${runner_registry}.azurecr.io"
          runner_registry_ready=false
          echo "[$(date +%T)] Resolving control image from ${runner_login_server} (verify)"
          if az acr login --name "$runner_registry" --expose-token --only-show-errors --query accessToken --output tsv 2>/dev/null \
            | docker login "$runner_login_server" --username 00000000-0000-0000-0000-000000000000 --password-stdin >/dev/null 2>&1; then
            runner_registry_ready=true
          fi
          execution_control_image=$(timeout 420 python3 scripts/goal006_runner_image_source.py \
            --mode verify \
            --blueprint-image "$blueprint_runner_image" \
            --login-server "$runner_login_server" \
            --job cleanup-job.json \
            --registry-ready "$runner_registry_ready" \
            --output cleanup-image-source.json) || execution_control_image="$blueprint_runner_image"
          docker logout "$runner_login_server" >/dev/null 2>&1 || true
          echo "[$(date +%T)] Control image: ${execution_control_image}"
          if test -f cleanup-image-source.json; then
            fallback=$(jq -r '.fallback_reason' cleanup-image-source.json)
            if test -n "$fallback"; then echo "::warning::Runner ACR not used, pulling control image from GHCR: $fallback"; fi
          fi
          python scripts/goal006_runner_execution.py cleanup \
            --job cleanup-job.json \
            --expected-image "$blueprint_runner_image" \
            --execution-image "$execution_runner_image" \
            --control-image "$execution_control_image" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --private-job-conclusion "$PRIVATE_JOB_CONCLUSION" \
            --output cleanup-execution.json
          environment_id=$(jq -er '.properties.environmentId' cleanup-job.json)
          workspace_customer_id=$(az resource show \
            --ids "$environment_id" \
            --api-version 2024-03-01 \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId \
            --output tsv)
          test -n "$workspace_customer_id"

          cleanup_succeeded=false
          for execution_attempt in 1 2; do
            execution=$(az containerapp job start \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$RUNNER_CLEANUP_BROKER_JOB" \
              --yaml cleanup-execution.json \
              --query name -o tsv)
            test -n "$execution"
            jq -n \
              --argjson attempt "$execution_attempt" \
              --arg execution "$execution" \
              '{attempt: $attempt, execution: $execution}' \
              >> cleanup-executions.jsonl
            status=
            for poll_attempt in $(seq 1 180); do
              status=$(az containerapp job execution show \
                --resource-group "$RUNNER_RESOURCE_GROUP" \
                --name "$RUNNER_CLEANUP_BROKER_JOB" \
                --job-execution-name "$execution" \
                --query properties.status -o tsv)
              case "$status" in
                Succeeded|Failed|Stopped) break ;;
                Processing|Running|Waiting) ;;
                *) echo "Private cleanup broker returned unknown status: ${status:-<empty>}" >&2; exit 1 ;;
              esac
              if [ "$poll_attempt" = 180 ]; then
                bash scripts/goal006_capture_aca_execution.sh \
                  --job "$RUNNER_CLEANUP_BROKER_JOB" \
                  --container cleanup-broker \
                  --execution "$execution" \
                  --status "$status" \
                  --attempt "$execution_attempt" \
                  --workspace "$workspace_customer_id" \
                  --resource-group "$RUNNER_RESOURCE_GROUP" \
                  --prefix "cleanup-attempt-${execution_attempt}"
                echo "Timed out waiting for private cleanup broker: $execution" >&2
                exit 1
              fi
              sleep 5
            done

            bash scripts/goal006_capture_aca_execution.sh \
              --job "$RUNNER_CLEANUP_BROKER_JOB" \
              --container cleanup-broker \
              --execution "$execution" \
              --status "$status" \
              --attempt "$execution_attempt" \
              --workspace "$workspace_customer_id" \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --prefix "cleanup-attempt-${execution_attempt}"
            if [ "$status" = Succeeded ]; then
              cp "cleanup-attempt-${execution_attempt}.log" cleanup-job.log
              cleanup_succeeded=true
              break
            fi
            if [ "$execution_attempt" = 1 ] &&
              jq -e '.retry_eligible' cleanup-attempt-1.classification.json >/dev/null; then
              echo "Retrying proven pre-image-pull cleanup failure: $execution" >&2
              continue
            fi
            cat "cleanup-attempt-${execution_attempt}.classification.json" >&2
            echo "Private cleanup broker failed without retry eligibility: $status" >&2
            exit 1
          done
          if [ "$cleanup_succeeded" != true ]; then
            echo "Private cleanup broker exhausted its single qualified retry" >&2
            exit 1
          fi
          evidence_container_url="https://$TFSTATE_STORAGE_ACCOUNT.blob.core.windows.net/$CLEANUP_EVIDENCE_CONTAINER"
          python scripts/goal006_runner_execution.py pointer \
            --environment '${{ inputs.environment }}' \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --private-job-conclusion "$PRIVATE_JOB_CONCLUSION" \
            --cleanup-execution-name "$execution" \
            --evidence-container-url "$evidence_container_url" \
            --output cleanup-record.json
          grep -F "cleanup/${{ inputs.environment }}/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT.json" cleanup-record.json

      - name: Verify zero active private executions
        run: |
          set -eu
          for job in "$RUNNER_JOB" "$RUNNER_BROKER_JOB" "$RUNNER_CLEANUP_BROKER_JOB"; do
            active=$(az containerapp job execution list \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$job" \
              --query "[?properties.status=='Running' || properties.status=='Processing' || properties.status=='Waiting'] | length(@)" \
              -o tsv)
            test "$active" = "0"
          done

      - name: Retain hosted cleanup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: goal006-private-runner-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cleanup-job.json
            cleanup-execution.json
            cleanup-executions.jsonl
            cleanup-record.json
            cleanup-job.log
            cleanup-attempt-*.execution.json
            cleanup-attempt-*.events.json
            cleanup-attempt-*.classification.json
            cleanup-attempt-*.log
          if-no-files-found: warn
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}

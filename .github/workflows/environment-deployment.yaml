name: Environment Deployment Engine

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release_run_id:
        required: true
        type: number
      release_sha:
        required: true
        type: string
      control_sha:
        required: true
        type: string
      apply:
        required: true
        type: boolean
      enforce_cost_controls:
        required: false
        type: boolean
        default: false
      lease_expires_at:
        required: false
        type: string
      initialize_configuration:
        required: false
        type: boolean
        default: false
      lifecycle_action:
        required: false
        type: string
        default: plan
      sleep_evidence_json:
        required: false
        type: string
        default: ""
      image_home:
        required: false
        type: string
        default: github
    outputs:
      verification_client_id:
        value: ${{ jobs.terraform.outputs.verification_client_id }}
      web_url:
        value: ${{ jobs.terraform.outputs.web_url }}
      apply_result:
        # jobs.<id>.result is empty in workflow_call outputs (actions/runner#3087) and rejected
        # by actionlint, so the Terraform job records its own status as a job output.
        description: Result of the private Terraform job, independent of runner cleanup
        value: ${{ jobs.terraform.outputs.apply_result }}

permissions:
  contents: read
  actions: read
  id-token: write

env:
  ARM_TENANT_ID: 0471534c-1bbe-40ab-ae65-3f721b62582c
  ARM_SUBSCRIPTION_ID: 2ed11839-6a0f-4eaa-bd94-44ca96ff5d84
  EVIDENCE_RETENTION_DAYS: "90"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      control_plane_client_id: ${{ steps.config.outputs.control_plane_client_id }}
      cleanup_client_id: ${{ steps.config.outputs.cleanup_client_id }}
      runner_resource_group: ${{ steps.config.outputs.runner_resource_group }}
      runner_private_endpoints_subnet_id: ${{ steps.config.outputs.runner_private_endpoints_subnet_id }}
      runner_broker_job: ${{ steps.config.outputs.runner_broker_job }}
      runner_cleanup_broker_job: ${{ steps.config.outputs.runner_cleanup_broker_job }}
      runner_job: ${{ steps.config.outputs.runner_job }}
      runner_label: ${{ steps.config.outputs.runner_label }}
      state_storage_account_id: ${{ steps.config.outputs.state_storage_account_id }}
      state_storage_account: ${{ steps.config.outputs.state_storage_account }}
      cleanup_evidence_container: ${{ steps.config.outputs.cleanup_evidence_container }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          ref: ${{ inputs.control_sha }}

      - name: Resolve active environment configuration
        id: config
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          config=$(python3 scripts/goal006_environment_config.py --environment "$TARGET_ENVIRONMENT")
          jq -e . >/dev/null <<< "$config"
          for key in control_plane_client_id cleanup_client_id runner_resource_group \
            runner_private_endpoints_subnet_id \
            runner_broker_job runner_cleanup_broker_job runner_job runner_label \
            state_storage_account_id state_storage_account cleanup_evidence_container; do
            echo "$key=$(jq -r --arg key "$key" '.[$key]' <<< "$config")" >> "$GITHUB_OUTPUT"
          done

  start-broker:
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      runner_started: ${{ steps.broker.outputs.runner_started }}
      image_home: ${{ steps.image-home.outputs.effective_image_home || 'github' }}
      image_registry_server: ${{ steps.image-home.outputs.registry_server }}
      image_pull_identity_id: ${{ steps.image-home.outputs.pull_identity_id }}
    env:
      ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
      RUNNER_RESOURCE_GROUP: ${{ needs.resolve-environment.outputs.runner_resource_group }}
      RUNNER_BROKER_JOB: ${{ needs.resolve-environment.outputs.runner_broker_job }}
      RUNNER_JOB: ${{ needs.resolve-environment.outputs.runner_job }}
    steps:
      - name: Require trusted release and authorized control SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test '${{ inputs.release_sha }}' = "$latest_main_sha"
          test "$GITHUB_SHA" = '${{ inputs.control_sha }}'
          test "$GITHUB_REF" = "refs/heads/main"
          test '${{ inputs.control_sha }}' = "$latest_main_sha"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          ref: ${{ inputs.control_sha }}

      - name: Download signed exact-seven tuple
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 (Node 24)
        with:
          pattern: goal006-exact-seven-release-*
          path: release-input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Verify tuple and GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=$(find release-input -name registry-release-manifest.json -type f -print -quit)
          evidence=$(find release-input -type d -name evidence -print -quit)
          test -n "$manifest"
          test -n "$evidence"
          python scripts/goal006_registry_manifest.py --verify-manifest "$manifest" \
            --expected-source-commit '${{ inputs.release_sha }}' \
            --expected-run-id '${{ inputs.release_run_id }}' \
            --evidence-directory "$evidence"
          gh attestation verify "$manifest" --repo "$GITHUB_REPOSITORY"
          while IFS= read -r image; do
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY"
          done < <(jq -r '.images | to_entries[] | .value' "$manifest")
          cp "$manifest" registry-release-manifest.json
          python scripts/goal006_release_verification.py create \
            --release-sha '${{ inputs.release_sha }}' \
            --release-run-id '${{ inputs.release_run_id }}' \
            --manifest registry-release-manifest.json \
            --record release-verification.json

      - name: Verify anonymous exact-seven GHCR pulls
        run: |
          verify_ghcr_digest() {
            image=$1
            repository=${image#ghcr.io/}
            repository=${repository%@*}
            expected_digest=${image##*@}
            actual_digest=$(python3 scripts/goal006_ghcr_digest.py \
              --repository "$repository" \
              --reference "$expected_digest" \
              --expected-digest "$expected_digest")
            test "$actual_digest" = "$expected_digest"
          }
          while IFS= read -r image; do
            verify_ghcr_digest "$image"
          done < <(jq -r '.images | to_entries[] | .value' registry-release-manifest.json)

      - name: Verify immutable broker blueprint
        run: |
          python scripts/goal006_runner_bootstrap.py \
            --environment '${{ inputs.environment }}' \
            --manifest infrastructure/deployment-stacks/goal006-runner/bootstrap-manifest.json

      - name: Install pinned Azure CLI extensions
        run: bash scripts/goal006_az_extensions.sh

      - name: Azure login with control-plane identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3 (Node 24)
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Select image home and mirror release images to ACR
        id: image-home
        if: inputs.apply && inputs.image_home != 'github'
        env:
          IMAGE_HOME: ${{ inputs.image_home }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$IMAGE_HOME" in azure|both) ;; *) echo "Unsupported image home: $IMAGE_HOME" >&2; exit 1 ;; esac
          subscription_compact=${ARM_SUBSCRIPTION_ID//-/}
          registry_name="acrwaooaw${TARGET_ENVIRONMENT}${subscription_compact:0:6}"
          login_server="${registry_name}.azurecr.io"
          resource_group="waooaw-${TARGET_ENVIRONMENT}-rg"
          pull_identity_id="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${resource_group}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-waooaw-${TARGET_ENVIRONMENT}-image-pull"
          registry_ready=false
          if az acr show --name "$registry_name" --resource-group "$resource_group" --only-show-errors --output none 2>/dev/null \
            && az identity show --ids "$pull_identity_id" --only-show-errors --output none 2>/dev/null \
            && az acr login --name "$registry_name" --expose-token --only-show-errors --query accessToken --output tsv 2>/dev/null \
              | docker login "$login_server" --username 00000000-0000-0000-0000-000000000000 --password-stdin >/dev/null 2>&1; then
            registry_ready=true
          fi
          runner_digest=$(python3 scripts/goal006_ghcr_digest.py \
            --repository dlai-sd/goal006-private-runner \
            --reference 'sha-${{ inputs.control_sha }}')
          set +e
          python3 scripts/goal006_image_mirror.py select \
            --image-home "$IMAGE_HOME" \
            --manifest registry-release-manifest.json \
            --image "goal006-private-runner=ghcr.io/dlai-sd/goal006-private-runner@${runner_digest}" \
            --login-server "$login_server" \
            --pull-identity-id "$pull_identity_id" \
            --registry-ready "$registry_ready" \
            --output image-home.json
          mirror_status=$?
          set -e
          docker logout "$login_server" >/dev/null 2>&1 || true
          test "$mirror_status" = 0
          {
            echo "effective_image_home=$(jq -er '.effective_image_home' image-home.json)"
            echo "registry_server=$(jq -r '.registry_server' image-home.json)"
            echo "pull_identity_id=$(jq -r '.pull_identity_id' image-home.json)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Image home"
            echo "- Requested: \`$IMAGE_HOME\`"
            echo "- Effective: \`$(jq -r '.effective_image_home' image-home.json)\`"
            echo "- Registry: \`$(jq -r '.registry_server // "" | if . == "" then "ghcr.io" else . end' image-home.json)\`"
            fallback=$(jq -r '.fallback_reason' image-home.json)
            if test -n "$fallback"; then echo "- Fallback reason: $fallback"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain image home evidence
        if: always() && steps.image-home.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: image-home-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-home.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record batch cost control mode
        env:
          COST_CONTROLS_ENFORCED: ${{ inputs.enforce_cost_controls }}
        run: |
          case "$COST_CONTROLS_ENFORCED" in true|false) ;; *) exit 1 ;; esac
          jq -n \
            --argjson enforced "$COST_CONTROLS_ENFORCED" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{cost_controls_enforced: $enforced, actor: $actor, run_id: $run_id, run_attempt: $run_attempt, mode: (if $enforced then "enforce" else "suppress-for-pipeline-build" end)}' \
            > cost-control.json
          if [ "$COST_CONTROLS_ENFORCED" = false ]; then
            echo "::warning::Azure cost and budget calls are suppressed for this pipeline-build batch"
          fi

      - name: Enforce cumulative cost gate
        if: inputs.enforce_cost_controls
        run: |
          set -eu
          scope="/subscriptions/$ARM_SUBSCRIPTION_ID"
          query='{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"totalCost":{"name":"PreTaxCost","function":"Sum"}}}}'
          python scripts/azure_rest_retry.py \
            --label "month-to-date actual cost" \
            --output actual-cost.json \
            --attempts 5 \
            --base-delay-seconds 5 \
            -- --method post \
            --url "https://management.azure.com${scope}/providers/Microsoft.CostManagement/query?api-version=2023-11-01" \
            --body "$query"
          month_start=$(date -u +%Y-%m-01T00:00:00Z)
          month_end=$(date -u -d "$(date -u -d "$month_start +1 month" +%Y-%m-%dT00:00:00Z) -1 second" +%Y-%m-%dT%H:%M:%SZ)
          forecast=$(jq -cn --arg from "$month_start" --arg to "$month_end" '{type:"Usage",timeframe:"Custom",timePeriod:{from:$from,to:$to},includeActualCost:true,includeFreshPartialCost:true,dataset:{granularity:"None",aggregation:{totalCost:{name:"PreTaxCost",function:"Sum"}}}}')
          python scripts/azure_rest_retry.py \
            --label "monthly forecast cost" \
            --output forecast-cost.json \
            --attempts 5 \
            --base-delay-seconds 5 \
            -- --method post \
            --url "https://management.azure.com${scope}/providers/Microsoft.CostManagement/forecast?api-version=2023-11-01" \
            --body "$forecast"
          python scripts/goal006_cost_gate.py \
            --actual actual-cost.json \
            --forecast forecast-cost.json \
            --configuration infrastructure/deployment-stacks/goal006-runner/cost-estimate.json

      - name: Start private signing broker
        id: broker
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -eu
          blueprint_runner_image=$(jq -er '.parameters.runnerImage.value' \
            'infrastructure/deployment-stacks/goal006-runner/${{ inputs.environment }}.parameters.json')
          execution_runner_image="$blueprint_runner_image"
          grep -Eq \
            "^ghcr.io/${GITHUB_REPOSITORY_OWNER}/goal006-private-runner@sha256:[0-9a-f]{64}$" \
            <<< "$execution_runner_image" || {
              echo "Runner execution image is not an immutable repository digest" >&2
              exit 1
            }
          az containerapp job show \
            --resource-group "$RUNNER_RESOURCE_GROUP" \
            --name "$RUNNER_BROKER_JOB" \
            --output json > broker-job.json
          subscription_compact=${ARM_SUBSCRIPTION_ID//-/}
          runner_registry="acrwaooawrun${TARGET_ENVIRONMENT}${subscription_compact:0:6}"
          runner_login_server="${runner_registry}.azurecr.io"
          runner_registry_ready=false
          echo "[$(date +%T)] Resolving control image from ${runner_login_server} (publish)"
          if az acr login --name "$runner_registry" --expose-token --only-show-errors --query accessToken --output tsv 2>/dev/null \
            | docker login "$runner_login_server" --username 00000000-0000-0000-0000-000000000000 --password-stdin >/dev/null 2>&1; then
            runner_registry_ready=true
          fi
          execution_control_image=$(timeout 420 python3 scripts/goal006_runner_image_source.py \
            --mode publish \
            --blueprint-image "$blueprint_runner_image" \
            --login-server "$runner_login_server" \
            --job broker-job.json \
            --registry-ready "$runner_registry_ready" \
            --output broker-image-source.json) || execution_control_image="$blueprint_runner_image"
          docker logout "$runner_login_server" >/dev/null 2>&1 || true
          echo "[$(date +%T)] Control image: ${execution_control_image}"
          if test -f broker-image-source.json; then
            fallback=$(jq -r '.fallback_reason' broker-image-source.json)
            if test -n "$fallback"; then echo "::warning::Runner ACR not used, pulling control image from GHCR: $fallback"; fi
          fi
          grep -Eq \
            "^(ghcr.io/${GITHUB_REPOSITORY_OWNER}|acrwaooawrun${TARGET_ENVIRONMENT}[0-9a-f]{6}[.]azurecr[.]io/dlai-sd)/goal006-(private-runner|runner-control)@sha256:[0-9a-f]{64}$" \
            <<< "$execution_control_image" || {
              echo "Control execution image is not an immutable repository digest" >&2
              exit 1
            }
          python scripts/goal006_runner_execution.py broker \
            --job broker-job.json \
            --expected-image "$blueprint_runner_image" \
            --execution-image "$execution_runner_image" \
            --control-image "$execution_control_image" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output broker-execution.json
          environment_id=$(jq -er '.properties.environmentId' broker-job.json)
          workspace_customer_id=$(az resource show \
            --ids "$environment_id" \
            --api-version 2024-03-01 \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId \
            --output tsv)
          test -n "$workspace_customer_id"

          broker_succeeded=false
          for execution_attempt in 1 2; do
            az containerapp job execution list \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$RUNNER_JOB" \
              --output json > "broker-runner-before-${execution_attempt}.json"
            execution=$(az containerapp job start \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$RUNNER_BROKER_JOB" \
              --yaml broker-execution.json \
              --query name -o tsv)
            test -n "$execution"
            # From here a broker execution exists, so private cleanup has something to reconcile.
            echo "runner_started=true" >> "$GITHUB_OUTPUT"
            jq -n \
              --argjson attempt "$execution_attempt" \
              --arg execution "$execution" \
              '{attempt: $attempt, execution: $execution}' \
              >> broker-executions.jsonl
            status=
            for poll_attempt in $(seq 1 132); do
              status=$(az containerapp job execution show \
                --resource-group "$RUNNER_RESOURCE_GROUP" \
                --name "$RUNNER_BROKER_JOB" \
                --job-execution-name "$execution" \
                --query properties.status -o tsv)
              case "$status" in
                Succeeded|Failed|Stopped) break ;;
                Processing|Running|Waiting) ;;
                *) echo "Private broker returned unknown status: ${status:-<empty>}" >&2; exit 1 ;;
              esac
              if [ "$poll_attempt" = 132 ]; then
                bash scripts/goal006_capture_aca_execution.sh \
                  --job "$RUNNER_BROKER_JOB" \
                  --container "$RUNNER_BROKER_JOB" \
                  --execution "$execution" \
                  --status "$status" \
                  --attempt "$execution_attempt" \
                  --workspace "$workspace_customer_id" \
                  --resource-group "$RUNNER_RESOURCE_GROUP" \
                  --prefix "broker-attempt-${execution_attempt}"
                echo "Timed out waiting for private broker: $execution" >&2
                exit 1
              fi
              sleep 5
            done

            bash scripts/goal006_capture_aca_execution.sh \
              --job "$RUNNER_BROKER_JOB" \
              --container "$RUNNER_BROKER_JOB" \
              --execution "$execution" \
              --status "$status" \
              --attempt "$execution_attempt" \
              --workspace "$workspace_customer_id" \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --prefix "broker-attempt-${execution_attempt}"
            for correlation_attempt in $(seq 1 24); do
              az containerapp job execution list \
                --resource-group "$RUNNER_RESOURCE_GROUP" \
                --name "$RUNNER_JOB" \
                --output json > "broker-runner-after-${execution_attempt}.json"
              jq --slurpfile before "broker-runner-before-${execution_attempt}.json" \
                '[.[] | select(.name as $name | ($before[0] | map(.name) | index($name) | not))]' \
                "broker-runner-after-${execution_attempt}.json" \
                > "broker-runner-delta-${execution_attempt}.json"
              python scripts/goal006_aca_execution_evidence.py correlate \
                --executions "broker-runner-delta-${execution_attempt}.json" \
                --run-id "$GITHUB_RUN_ID" \
                --run-attempt "$GITHUB_RUN_ATTEMPT" \
                --output "broker-runner-correlation-${execution_attempt}.json"
              child_count=$(jq -er '.matches | length' "broker-runner-correlation-${execution_attempt}.json")
              if [ "$child_count" != 0 ]; then
                break
              fi
              if [ "$status" != Succeeded ] &&
                jq -e '.retry_eligible' "broker-attempt-${execution_attempt}.classification.json" >/dev/null; then
                break
              fi
              if [ "$correlation_attempt" != 24 ]; then
                sleep 5
              fi
            done

            if [ "$status" = Succeeded ]; then
              if [ "$child_count" != 1 ]; then
                echo "Broker succeeded without exactly one correlated child runner: $child_count" >&2
                exit 1
              fi
              child_execution=$(jq -er '.matches[0].name' "broker-runner-correlation-${execution_attempt}.json")
              child_status=$(jq -er '.matches[0].status' "broker-runner-correlation-${execution_attempt}.json")
              az containerapp job execution show \
                --resource-group "$RUNNER_RESOURCE_GROUP" \
                --name "$RUNNER_JOB" \
                --job-execution-name "$child_execution" \
                --output json > "broker-child-attempt-${execution_attempt}.execution.json"
              case "$child_status" in
                Processing|Running|Waiting) ;;
                *)
                  echo "Broker succeeded but child runner is not active: $child_status" >&2
                  exit 1
                  ;;
              esac
              jq -n \
                --arg broker_execution "$execution" \
                --arg runner_execution "$child_execution" \
                --argjson attempts "$execution_attempt" \
                '{broker_execution: $broker_execution, runner_execution: $runner_execution, attempts: $attempts}' \
                > broker-result.json
              broker_succeeded=true
              break
            fi

            if [ "$child_count" = 0 ]; then
              if [ "$execution_attempt" = 1 ] &&
                jq -e '.retry_eligible' broker-attempt-1.classification.json >/dev/null; then
                echo "Retrying proven pre-image-pull broker failure: $execution" >&2
                continue
              fi
              cat "broker-attempt-${execution_attempt}.classification.json" >&2
              echo "Private broker failed before child creation without retry eligibility: $status" >&2
              exit 1
            fi
            if [ "$child_count" != 1 ]; then
              cat "broker-runner-correlation-${execution_attempt}.json" >&2
              echo "Private broker produced ambiguous child runners: $child_count" >&2
              exit 1
            fi
            child_execution=$(jq -er '.matches[0].name' "broker-runner-correlation-${execution_attempt}.json")
            child_status=$(jq -er '.matches[0].status' "broker-runner-correlation-${execution_attempt}.json")
            az containerapp job execution show \
              --resource-group "$RUNNER_RESOURCE_GROUP" \
              --name "$RUNNER_JOB" \
              --job-execution-name "$child_execution" \
              --output json > "broker-child-attempt-${execution_attempt}.execution.json"
            case "$child_status" in
              Failed|Stopped)
                bash scripts/goal006_capture_aca_execution.sh \
                  --job "$RUNNER_JOB" \
                  --container "$RUNNER_JOB" \
                  --execution "$child_execution" \
                  --status "$child_status" \
                  --attempt "$execution_attempt" \
                  --workspace "$workspace_customer_id" \
                  --resource-group "$RUNNER_RESOURCE_GROUP" \
                  --prefix "broker-child-attempt-${execution_attempt}"
                ;;
              *)
                echo "Broker failed while child runner is non-terminal: $child_status" >&2
                exit 1
                ;;
            esac
            if [ "$execution_attempt" = 1 ] &&
              jq -e '.retry_eligible' broker-child-attempt-1.classification.json >/dev/null; then
              echo "Retrying broker after proven pre-image-pull child failure: $child_execution" >&2
              continue
            fi
            cat "broker-child-attempt-${execution_attempt}.classification.json" >&2
            echo "Private broker failed without retry eligibility: $status" >&2
            exit 1
          done
          if [ "$broker_succeeded" != true ]; then
            echo "Private broker exhausted its single qualified retry" >&2
            exit 1
          fi

      - name: Retain hosted pre-start evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: goal006-private-runner-prestart-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            actual-cost.json
            cost-control.json
            forecast-cost.json
            registry-release-manifest.json
            release-verification.json
            broker-execution.json
            broker-executions.jsonl
            broker-result.json
            broker-attempt-*.execution.json
            broker-attempt-*.events.json
            broker-attempt-*.classification.json
            broker-attempt-*.log
            broker-runner-before-*.json
            broker-runner-after-*.json
            broker-runner-delta-*.json
            broker-runner-correlation-*.json
            broker-child-attempt-*.execution.json
            broker-child-attempt-*.events.json
            broker-child-attempt-*.classification.json
            broker-child-attempt-*.log
          if-no-files-found: warn
          retention-days: ${{ env.EVIDENCE_RETENTION_DAYS }}

  terraform:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }} ${{ inputs.environment }}
    needs: [resolve-environment, start-broker]
    runs-on:
      - self-hosted
      - ${{ needs.resolve-environment.outputs.runner_label }}
    environment: ${{ inputs.environment }}
    outputs:
      verification_client_id: ${{ steps.foundation.outputs.verification_client_id }}
      web_url: ${{ steps.workload.outputs.web_url }}
      apply_result: ${{ steps.apply_result.outputs.result }}
    env:
      ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
      TFSTATE_RESOURCE_GROUP: waooaw-platform-rg
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve-environment.outputs.state_storage_account }}
      TFSTATE_CONTAINER: tfstate
      TF_VAR_tfstate_resource_group: waooaw-platform-rg
      TF_VAR_runner_resource_group_name: ${{ needs.resolve-environment.outputs.runner_resource_group }}
      TF_VAR_runner_private_endpoints_subnet_id: ${{ needs.resolve-environment.outputs.runner_private_endpoints_subnet_id }}
      TF_VAR_tfstate_storage_account: ${{ needs.resolve-environment.outputs.state_storage_account }}
      TF_VAR_tfstate_container: tfstate
      TF_VAR_tfstate_storage_account_id: ${{ needs.resolve-environment.outputs.state_storage_account_id }}
      CONFIG_CONTAINER: deployment-config
      CONFIG_BLOB: ${{ inputs.environment }}/workload-configuration.json
      FOUNDATION_CACHE_BLOB: ${{ inputs.environment }}/foundation-cache.json
      SEEDER_IMAGE: mcr.microsoft.com/azure-cli@sha256:4faeb3c955086c3842d4f8cf0ff1d900ce3a1c68c6e6c6430c5e8a3cb882c5aa
      SEEDER_JOB: goal006-${{ inputs.environment }}-secret-seeder
    steps:
      - name: Enforce selected environment authorization
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_CALLER_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/deploy.yaml@refs/heads/main
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          APPLY_REQUESTED: ${{ inputs.apply }}
          COST_CONTROLS_ENFORCED: ${{ inputs.enforce_cost_controls }}
          LIFECYCLE_ACTION: ${{ inputs.lifecycle_action }}
        run: |
          test "$CALLER_WORKFLOW_REF" = "$EXPECTED_CALLER_WORKFLOW_REF"
          case "$TARGET_ENVIRONMENT" in demo|uat|prod) ;; *) exit 1 ;; esac
          case "$APPLY_REQUESTED" in true|false) ;; *) exit 1 ;; esac
          case "$COST_CONTROLS_ENFORCED" in true|false) ;; *) exit 1 ;; esac
          case "$LIFECYCLE_ACTION" in plan|activate|sleep) ;; *) exit 1 ;; esac
          test "$TARGET_ENVIRONMENT" != prod || test "$LIFECYCLE_ACTION" = plan

      - name: Reject stale release before cloud access
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          latest_main_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')
          test "$RELEASE_SHA" = "$latest_main_sha"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          ref: ${{ inputs.control_sha }}

      - name: Download pre-start cost evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 (Node 24)
        with:
          name: goal006-private-runner-prestart-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Verify pinned private runner Terraform
        run: |
          test "$(command -v terraform)" = "/usr/local/bin/terraform"
          test "$(terraform version -json | jq -r '.terraform_version')" = "1.9.8"

      - name: Install pinned Azure CLI extensions
        run: bash scripts/goal006_az_extensions.sh

      - name: Azure login with constrained bootstrap OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3 (Node 24)
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Verify bootstrap RBAC and required Azure providers
        run: |
          set -euo pipefail
          : "${TFSTATE_STORAGE_ACCOUNT:?TFSTATE_STORAGE_ACCOUNT is required}"
          test "$ARM_SUBSCRIPTION_ID" = "2ed11839-6a0f-4eaa-bd94-44ca96ff5d84"
          test "$(az account show --query id -o tsv)" = "$ARM_SUBSCRIPTION_ID"
          test "$TFSTATE_RESOURCE_GROUP" = "waooaw-platform-rg"
          test "$TFSTATE_CONTAINER" = "tfstate"
          test "$TF_VAR_tfstate_storage_account_id" = "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$TFSTATE_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$TFSTATE_STORAGE_ACCOUNT"
          subscription_scope="/subscriptions/$ARM_SUBSCRIPTION_ID"
          state_scope="$TF_VAR_tfstate_storage_account_id"
          environment_scope="$subscription_scope/resourceGroups/waooaw-${{ inputs.environment }}-rg"
          principal_id=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv | python3 -c 'import base64, json, sys; payload=sys.stdin.read().strip().split(".")[1]; print(json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))["oid"])')
          az role assignment list --assignee-object-id "$principal_id" --scope "$state_scope" > state-role-assignments.json
          az role assignment list --assignee-object-id "$principal_id" --scope "$environment_scope" > environment-role-assignments.json
          jq -s 'add' state-role-assignments.json environment-role-assignments.json > bootstrap-role-assignments.json
          require_role() {
            role=$1
            role_scope=$2
            jq -e --arg role "$role" --arg scope "$role_scope" \
              'any(.[]; .roleDefinitionName == $role and (.scope | ascii_downcase) == ($scope | ascii_downcase))' \
              bootstrap-role-assignments.json >/dev/null || {
                echo "Bootstrap identity is missing '$role' at '$role_scope'" >&2
                exit 1
              }
          }
          require_role "Storage Account Contributor" "$state_scope"
          require_role "Storage Blob Data Contributor" "$state_scope"
          require_role "Role Based Access Control Administrator" "$state_scope"
          require_role "Contributor" "$environment_scope"
          require_role "Role Based Access Control Administrator" "$environment_scope"
          for namespace in Microsoft.App Microsoft.Authorization Microsoft.KeyVault Microsoft.ManagedIdentity Microsoft.Network Microsoft.Resources Microsoft.Storage; do
            state=$(az provider show --namespace "$namespace" --query registrationState -o tsv)
            test "$state" = "Registered" || {
              echo "$namespace must be registered before ${{ inputs.environment }} deployment (current state: $state)" >&2
              exit 1
            }
          done

      - name: Verify subscription budget
        if: inputs.enforce_cost_controls
        run: |
          for attempt in $(seq 1 5); do
            if az rest --method get \
              --url "https://management.azure.com/subscriptions/$ARM_SUBSCRIPTION_ID/providers/Microsoft.Consumption/budgets/waooaw-phase3-monthly?api-version=2023-11-01" \
              > subscription-budget.json; then
              break
            fi
            test "$attempt" != 5
            sleep $((attempt * 5))
          done
          amount=$(jq -r '.properties.amount' subscription-budget.json)
          test "$amount" = "10000.0" || test "$amount" = "10000"
          jq -e '.properties.columns and .properties.rows' actual-cost.json >/dev/null

      - name: Initialize UAT configuration from Demo
        if: inputs.initialize_configuration
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          test "$TARGET_ENVIRONMENT" = uat
          target_exists=$(az storage blob exists \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name "$CONFIG_CONTAINER" \
            --name "$CONFIG_BLOB" \
            --auth-mode login \
            --query exists -o tsv)
          if test "$target_exists" = false; then
            source_blob=demo/workload-configuration.json
            python3 scripts/goal006_storage_download.py \
              --account-name "$TFSTATE_STORAGE_ACCOUNT" \
              --container-name "$CONFIG_CONTAINER" \
              --blob-name "$source_blob" \
              --output workload-configuration.source.json \
              --evidence configuration-promotion-download-attempts.jsonl
            jq '.lease_purpose = "UAT exact-seven qualification" | del(.founder_ipv4_cidr)' \
              workload-configuration.source.json > workload-configuration.seed.json
            issued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            expires_at=$(date -u -d '+10 days' +%Y-%m-%dT%H:%M:%SZ)
            python3 scripts/goal006_lease.py \
              --configuration workload-configuration.seed.json \
              --issued-at "$issued_at" \
              --expires-at "$expires_at" \
              --renewed-output workload-configuration.promoted.json \
              > configuration-promotion-lease.json
            promoted_sha256=$(sha256sum workload-configuration.promoted.json | cut -d' ' -f1)
            az storage blob upload \
              --account-name "$TFSTATE_STORAGE_ACCOUNT" \
              --container-name "$CONFIG_CONTAINER" \
              --name "$CONFIG_BLOB" \
              --file workload-configuration.promoted.json \
              --auth-mode login \
              --overwrite false \
              --only-show-errors \
              --output none
            python3 scripts/goal006_storage_download.py \
              --account-name "$TFSTATE_STORAGE_ACCOUNT" \
              --container-name "$CONFIG_CONTAINER" \
              --blob-name "$CONFIG_BLOB" \
              --output workload-configuration.promoted-verified.json \
              --evidence configuration-promotion-verification-attempts.jsonl
            verified_sha256=$(sha256sum workload-configuration.promoted-verified.json | cut -d' ' -f1)
            test "$promoted_sha256" = "$verified_sha256"
            jq -n \
              --arg source_blob "$source_blob" \
              --arg target_blob "$CONFIG_BLOB" \
              --arg sha256 "$verified_sha256" \
              --arg issued_at "$issued_at" \
              --arg expires_at "$expires_at" \
              '{schema:"waooaw.goal006-configuration-promotion/v1", source_blob:$source_blob, target_blob:$target_blob, source_environment:"demo", target_environment:"uat", create_only:true, sha256:("sha256:" + $sha256), lease_issued_at:$issued_at, lease_expires_at:$expires_at}' \
              > configuration-promotion.json
          else
            jq -n \
              --arg target_blob "$CONFIG_BLOB" \
              '{schema:"waooaw.goal006-configuration-promotion/v1", target_blob:$target_blob, target_environment:"uat", create_only:true, decision:"TARGET_ALREADY_EXISTS"}' \
              > configuration-promotion.json
          fi

      - name: Download environment configuration with OIDC
        id: configuration
        env:
          REQUESTED_LEASE_EXPIRES_AT: ${{ inputs.lease_expires_at }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          etag_before=$(az storage blob show \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name "$CONFIG_CONTAINER" \
            --name "$CONFIG_BLOB" \
            --auth-mode login \
            --query properties.etag -o tsv)
          python3 scripts/goal006_storage_download.py \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name "$CONFIG_CONTAINER" \
            --blob-name "$CONFIG_BLOB" \
            --output workload-configuration.json \
            --evidence configuration-download-attempts.jsonl
          etag_after=$(az storage blob show \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name "$CONFIG_CONTAINER" \
            --name "$CONFIG_BLOB" \
            --auth-mode login \
            --query properties.etag -o tsv)
          test "$etag_before" = "$etag_after"
          if test "$TARGET_ENVIRONMENT" = prod; then
            test -z "$REQUESTED_LEASE_EXPIRES_AT"
          else
            if test '${{ inputs.apply }}' = true; then
              issued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              python3 scripts/goal006_lease.py \
                --configuration workload-configuration.json \
                --issued-at "$issued_at" \
                --expires-at "$REQUESTED_LEASE_EXPIRES_AT" \
                --renewed-output workload-configuration.renewed.json \
                > configuration-lease-renewal.json
              renewed_sha256=$(sha256sum workload-configuration.renewed.json | cut -d' ' -f1)
              az storage blob upload \
                --account-name "$TFSTATE_STORAGE_ACCOUNT" \
                --container-name "$CONFIG_CONTAINER" \
                --name "$CONFIG_BLOB" \
                --file workload-configuration.renewed.json \
                --auth-mode login \
                --overwrite \
                --if-match "$etag_after" \
                --only-show-errors \
                --output none
              renewed_etag=$(az storage blob show \
                --account-name "$TFSTATE_STORAGE_ACCOUNT" \
                --container-name "$CONFIG_CONTAINER" \
                --name "$CONFIG_BLOB" \
                --auth-mode login \
                --query properties.etag -o tsv)
              python3 scripts/goal006_storage_download.py \
                --account-name "$TFSTATE_STORAGE_ACCOUNT" \
                --container-name "$CONFIG_CONTAINER" \
                --blob-name "$CONFIG_BLOB" \
                --output workload-configuration.verified.json \
                --evidence configuration-renewal-verification-attempts.jsonl
              verified_sha256=$(sha256sum workload-configuration.verified.json | cut -d' ' -f1)
              test "$renewed_sha256" = "$verified_sha256"
              jq \
                --arg previous_etag "$etag_after" \
                --arg renewed_etag "$renewed_etag" \
                --arg sha256 "$verified_sha256" \
                '. + {previous_etag: $previous_etag, renewed_etag: $renewed_etag, verified_sha256: $sha256}' \
                configuration-lease-renewal.json > configuration-lease-renewal.bound.json
              mv configuration-lease-renewal.bound.json configuration-lease-renewal.json
              mv workload-configuration.verified.json workload-configuration.json
              rm workload-configuration.renewed.json
            fi
            python3 scripts/goal006_lease.py \
              --configuration workload-configuration.json \
              > configuration-lease-validation.json
          fi
          manifest_digest="sha256:$(sha256sum registry-release-manifest.json | cut -d' ' -f1)"
          dma_admission_content_digest="sha256:$(sha256sum src/digital-marketing-agent/tests/fixtures/agent-admission/digital-marketing-local-service-v1.0.0.json | cut -d' ' -f1)"
          jq --arg manifest_digest "$manifest_digest" \
            --arg dma_admission_content_digest "$dma_admission_content_digest" \
            '.manifest_digest = $manifest_digest | .dma_admission_content_digest = $dma_admission_content_digest' \
            workload-configuration.json > workload-configuration.bound.json
          mv workload-configuration.bound.json workload-configuration.json
          jq -e '.planned_incremental_monthly_cost_inr != null and .cumulative_one_time_cost_inr != null' \
            workload-configuration.json >/dev/null
      - name: Capture configuration storage diagnostics
        if: failure() && steps.configuration.outcome == 'failure'
        run: |
          network_policy=$(az storage account show \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --name "$TFSTATE_STORAGE_ACCOUNT" \
            --query '{publicNetworkAccess:publicNetworkAccess,defaultAction:networkRuleSet.defaultAction,bypass:networkRuleSet.bypass}' \
            -o json)
          jq -n \
            --argjson network_policy "$network_policy" \
            --arg container "$CONFIG_CONTAINER" \
            --arg blob "$CONFIG_BLOB" \
            '$network_policy + {container: $container, blob: $blob}' \
            > configuration-storage-diagnostics.json
          az storage container-rm show \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --storage-account "$TFSTATE_STORAGE_ACCOUNT" \
            --name "$CONFIG_CONTAINER" \
            --query '{name:name,publicAccess:publicAccess,leaseState:leaseState}' \
            -o json > configuration-container-diagnostics.json

      - name: Enforce workload cost boundary
        if: inputs.enforce_cost_controls
        run: |
          python3 scripts/goal006_cost_gate.py \
            --actual actual-cost.json \
            --forecast forecast-cost.json \
            --configuration workload-configuration.json

      - name: Resolve foundation cache
        id: foundation-cache
        env:
          APPLY_REQUESTED: ${{ inputs.apply }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          external_environment=false
          case "$TARGET_ENVIRONMENT" in
            demo|uat|prod) external_environment=true ;;
          esac
          fingerprint=$(python3 scripts/goal006_foundation_cache.py fingerprint \
            --environment "$TARGET_ENVIRONMENT" \
            --context "subscription_id=$ARM_SUBSCRIPTION_ID" \
            --context "state_resource_group=$TFSTATE_RESOURCE_GROUP" \
            --context "state_account=$TFSTATE_STORAGE_ACCOUNT" \
            --context "state_container=$TFSTATE_CONTAINER" \
            --context "runner_resource_group=$TF_VAR_runner_resource_group_name" \
            --context "runner_private_endpoints_subnet_id=$TF_VAR_runner_private_endpoints_subnet_id" \
            --context "state_account_id=$TF_VAR_tfstate_storage_account_id" \
            --context "external_environment=$external_environment")
          cache_hit=false
          cache_reason="not-requested"
          if test "$APPLY_REQUESTED" = true; then
            cache_reason=missing
            cache_exists=$(az storage blob exists \
              --account-name "$TFSTATE_STORAGE_ACCOUNT" \
              --container-name "$CONFIG_CONTAINER" \
              --name "$FOUNDATION_CACHE_BLOB" \
              --auth-mode login \
              --query exists -o tsv)
            if test "$cache_exists" = true; then
              az storage blob download \
                --account-name "$TFSTATE_STORAGE_ACCOUNT" \
                --container-name "$CONFIG_CONTAINER" \
                --name "$FOUNDATION_CACHE_BLOB" \
                --auth-mode login \
                --file foundation-cache.json \
                --overwrite \
                --only-show-errors \
                --output none
              if python3 scripts/goal006_foundation_cache.py validate \
                --environment "$TARGET_ENVIRONMENT" \
                --fingerprint "$fingerprint" \
                --record foundation-cache.json > foundation-cache-outputs.json; then
                resource_group=$(jq -r '.resource_group_name' foundation-cache-outputs.json)
                live_valid=true
                az group show --name "$resource_group" --output none || live_valid=false
                for output_name in container_app_environment_id key_vault_id deployment_identity_id \
                  runner_key_vault_private_endpoint_id runner_key_vault_dns_record_id; do
                  resource_id=$(jq -r --arg name "$output_name" '.[$name]' foundation-cache-outputs.json)
                  az resource show --ids "$resource_id" --output none || live_valid=false
                done
                if test "$live_valid" = true; then
                  cache_hit=true
                  cache_reason=verified
                else
                  cache_reason="live-resource-missing"
                fi
              else
                cache_reason="fingerprint-or-contract-mismatch"
              fi
            fi
          fi
          jq -n \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg fingerprint "$fingerprint" \
            --argjson cache_hit "$cache_hit" \
            --arg reason "$cache_reason" \
            '{environment: $environment, fingerprint: $fingerprint, cache_hit: $cache_hit, reason: $reason}' \
            > foundation-cache-decision.json
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache_hit=$cache_hit" >> "$GITHUB_OUTPUT"

      - name: Resolve WC-124 database transition state
        if: inputs.environment == 'demo' || inputs.environment == 'uat'
        id: database-transition
        run: |
          set -euo pipefail
          resource_group="waooaw-${{ inputs.environment }}-rg"
          server_name="psql-waooaw-${{ inputs.environment }}-state"
          bootstrap_identity_name="id-waooaw-${{ inputs.environment }}-db-bootstrap"
          provisioner_identity_name="id-waooaw-${{ inputs.environment }}-db-provisioner"
          vault_name="kv-waooaw-${{ inputs.environment }}"
          server_exists=false
          password_auth=Absent
          bootstrap_admin_count=0
          provisioner_vault_role_count=0
          server=$(az postgres flexible-server list \
            --resource-group "$resource_group" \
            --query "[?name == '$server_name'] | [0]" \
            --output json)
          if [ "$server" != null ]; then
            server_exists=true
            password_auth=$(jq -er '.authConfig.passwordAuth' <<< "$server")
            bootstrap_admin_count=$(az postgres flexible-server microsoft-entra-admin list \
              --resource-group "$resource_group" \
              --server-name "$server_name" \
              --query "[?principalName == '$bootstrap_identity_name'] | length(@)" \
              --output tsv)
            provisioner_principal_id=$(az identity show \
              --resource-group "$resource_group" \
              --name "$provisioner_identity_name" \
              --query principalId \
              --output tsv)
            vault_id=$(az keyvault show \
              --resource-group "$resource_group" \
              --name "$vault_name" \
              --query id \
              --output tsv)
            provisioner_vault_role_count=$(az role assignment list \
              --assignee-object-id "$provisioner_principal_id" \
              --scope "$vault_id" \
              --query "[?roleDefinitionName == 'Key Vault Secrets Officer'] | length(@)" \
              --output tsv)
          fi
          python3 scripts/wc124_database_transition.py \
            --server-exists "$server_exists" \
            --password-auth "$password_auth" \
            --bootstrap-admin-count "$bootstrap_admin_count" \
            --provisioner-vault-role-count "$provisioner_vault_role_count" \
            > wc124-database-transition.json
          jq -r '
            to_entries[]
            | select(.value != null)
            | "\(.key)=\(.value)"
          ' wc124-database-transition.json >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.mutations_allowed' wc124-database-transition.json)" != true ]; then
            jq -r '"WC-124 RECOVERY_HOLD: \(.hold_reason)"' wc124-database-transition.json >&2
            exit 1
          fi

      - name: Resolve Plan B foundation mutation identity
        if: >-
          inputs.apply &&
          steps.database-transition.outputs.password_auth_enabled == 'true'
        id: plan-b-foundation-identity
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation
        run: |
          if test '${{ steps.foundation-cache.outputs.cache_hit }}' = true; then
            client_id=$(jq -er '.deployment_client_id' "$GITHUB_WORKSPACE/foundation-cache-outputs.json")
          else
            terraform init -input=false \
              -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=$TFSTATE_CONTAINER" \
              -backend-config="use_oidc=true" \
              -backend-config="use_azuread_auth=true"
            client_id=$(terraform output -raw deployment_client_id)
          fi
          test -n "$client_id"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"

      - name: Azure login with environment deployment identity for Plan B foundation mutation
        if: >-
          inputs.apply &&
          steps.database-transition.outputs.password_auth_enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3 (Node 24)
        with:
          client-id: ${{ steps.plan-b-foundation-identity.outputs.client_id }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform foundation plan
        if: inputs.apply || steps.foundation-cache.outputs.cache_hit != 'true'
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation
        env:
          APPLY_REQUESTED: ${{ inputs.apply }}
          CACHE_HIT: ${{ steps.foundation-cache.outputs.cache_hit }}
          ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TF_VAR_deployment_client_id: ${{ steps.plan-b-foundation-identity.outputs.client_id || needs.resolve-environment.outputs.control_plane_client_id }}
        run: |
          set -euo pipefail
          password_auth_enabled='${{ steps.database-transition.outputs.password_auth_enabled || 'false' }}'
          bootstrap_admin_enabled='${{ steps.database-transition.outputs.bootstrap_admin_enabled || 'true' }}'
          provisioner_vault_access_enabled='${{ steps.database-transition.outputs.provisioner_vault_access_enabled || 'true' }}'
          export TF_VAR_postgresql_password_auth_enabled="$password_auth_enabled"
          export TF_VAR_database_bootstrap_admin_enabled="$bootstrap_admin_enabled"
          export TF_VAR_database_provisioner_vault_access_enabled="$provisioner_vault_access_enabled"
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          resource_address=module.foundation.azurerm_resource_group.environment
          if terraform state show "$resource_address" >/dev/null 2>&1; then
            state_adopted=true
          else
            state_adopted=false
          fi
          adopt_state=$(python3 "$GITHUB_WORKSPACE/scripts/goal006_execution_gate.py" \
            --execution "$APPLY_REQUESTED" \
            --state-adopted "$state_adopted")
          if [ "$adopt_state" = "true" ]; then
            resource_group="waooaw-${{ inputs.environment }}-rg"
            resource_group_record=$(az group show --name "$resource_group" -o json)
            resource_group_id=$(jq -r \
              --arg environment '${{ inputs.environment }}' \
              'select(.location == "centralindia" and .tags.environment == $environment and .tags.goal == "GOAL-006" and .tags["managed-by"] == "waooaw-platform-bootstrap") | .id' \
              <<< "$resource_group_record")
            test -n "$resource_group_id"
            terraform import -input=false -lock-timeout=5m "$resource_address" "$resource_group_id"
          fi
          secret_address='module.foundation.azurerm_key_vault_secret.postgresql_breakglass_administrator[0]'
          if [ "$password_auth_enabled" = true ] &&
             ! terraform state show "$secret_address" >/dev/null 2>&1; then
            vault_name="kv-waooaw-${{ inputs.environment }}"
            if secret_id=$(az keyvault secret show \
              --vault-name "$vault_name" \
              --name db-server-breakglass-admin \
              --query id \
              --output tsv 2>/dev/null); then
              terraform import -input=false -lock-timeout=5m "$secret_address" "$secret_id"
            fi
          fi
          terraform validate
          set +e
          terraform plan -detailed-exitcode -input=false -lock-timeout=5m -out=foundation.tfplan
          plan_exit_code=$?
          set -e
          case "$plan_exit_code" in
            0) plan_has_changes=false ;;
            2) plan_has_changes=true ;;
            *) echo "Foundation planning failed with exit code $plan_exit_code" >&2; exit "$plan_exit_code" ;;
          esac
          terraform show -json foundation.tfplan > foundation-plan.json
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope foundation \
            --plan foundation-plan.json \
            --output foundation-plan-policy.json
          state_snapshot=$(mktemp)
          trap 'rm -f "$state_snapshot"' EXIT
          terraform state pull > "$state_snapshot"
          python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
            --environment "$TARGET_ENVIRONMENT" \
            --release-sha "$RELEASE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scope foundation \
            --terraform-root "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation" \
            --backend-key "goal006/$TARGET_ENVIRONMENT/foundation.tfstate" \
            --plan-json foundation-plan.json \
            --plan-binary foundation.tfplan \
            --policy-result foundation-plan-policy.json \
            --state "$state_snapshot" \
            --output foundation-plan-provenance.json
          if test "$CACHE_HIT" = true && test "$plan_has_changes" = true; then
            echo "Verified foundation cache contains drift; refusing automatic apply" >&2
            exit 1
          fi

      - name: Terraform foundation apply
        if: inputs.apply && steps.foundation-cache.outputs.cache_hit != 'true'
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation
        run: |
          latest_main_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')
          test '${{ inputs.release_sha }}' = "$latest_main_sha"
          terraform apply -input=false -auto-approve foundation.tfplan
        env:
          GH_TOKEN: ${{ github.token }}
          ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
          TF_VAR_deployment_client_id: ${{ steps.plan-b-foundation-identity.outputs.client_id || needs.resolve-environment.outputs.control_plane_client_id }}

      - name: Resolve foundation outputs
        if: inputs.apply || inputs.lifecycle_action == 'sleep'
        id: foundation
        env:
          CACHE_HIT: ${{ steps.foundation-cache.outputs.cache_hit }}
          FINGERPRINT: ${{ steps.foundation-cache.outputs.fingerprint }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if test "$CACHE_HIT" = true; then
            outputs=$(cat foundation-cache-outputs.json)
          else
            terraform -chdir="infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation" \
              output -json > foundation-terraform-outputs.json
            python3 scripts/goal006_foundation_cache.py create \
              --environment "$TARGET_ENVIRONMENT" \
              --fingerprint "$FINGERPRINT" \
              --terraform-outputs foundation-terraform-outputs.json \
              --output foundation-cache.json
            outputs=$(python3 scripts/goal006_foundation_cache.py validate \
              --environment "$TARGET_ENVIRONMENT" \
              --fingerprint "$FINGERPRINT" \
              --record foundation-cache.json)
            az storage blob upload \
              --account-name "$TFSTATE_STORAGE_ACCOUNT" \
              --container-name "$CONFIG_CONTAINER" \
              --name "$FOUNDATION_CACHE_BLOB" \
              --auth-mode login \
              --file foundation-cache.json \
              --overwrite \
              --only-show-errors \
              --output none
          fi
          {
            for key in deployment_client_id deployment_identity_id verification_client_id \
              resource_group_name container_app_environment_id container_app_environment_name \
              container_app_environment_default_domain \
              key_vault_id key_vault_name key_vault_uri postgresql_server_fqdn \
              database_bootstrap_client_id database_bootstrap_identity_id \
              database_provisioner_client_id database_provisioner_identity_id; do
              echo "$key=$(jq -r --arg key "$key" '.[$key]' <<< "$outputs")"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Azure login with environment deployment OIDC identity
        if: inputs.apply || inputs.lifecycle_action == 'sleep'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3 (Node 24)
        with:
          client-id: ${{ steps.foundation.outputs.deployment_client_id }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Verify environment deployment subscription
        if: inputs.apply || inputs.lifecycle_action == 'sleep'
        run: test "$(az account show --query id -o tsv)" = "$ARM_SUBSCRIPTION_ID"

      - name: Start persistent database before dependency activation
        if: inputs.lifecycle_action == 'activate'
        run: |
          python3 scripts/wc124_azure_lifecycle.py \
            --environment '${{ inputs.environment }}' \
            --action activate \
            --output wc124-lifecycle-execution.json

      - name: Execute retained-data sleep after all gates pass
        if: inputs.lifecycle_action == 'sleep'
        env:
          SLEEP_EVIDENCE_JSON: ${{ inputs.sleep_evidence_json }}
        run: |
          set -euo pipefail
          test -n "$SLEEP_EVIDENCE_JSON"
          printf '%s' "$SLEEP_EVIDENCE_JSON" | jq -e . > wc124-sleep-evidence.json
          python3 scripts/wc124_azure_lifecycle.py \
            --environment '${{ inputs.environment }}' \
            --action sleep \
            --sleep-evidence wc124-sleep-evidence.json \
            --output wc124-lifecycle-execution.json

      - name: Check credential inventory
        if: inputs.apply
        id: credential-inventory
        env:
          KEY_VAULT_NAME: ${{ steps.foundation.outputs.key_vault_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          credential_names=$(python3 scripts/goal006_deployment_credentials.py \
            --catalog infrastructure/environment-readiness/secret-catalog.json \
            --environment "$TARGET_ENVIRONMENT" \
            --web-session-mode disabled)
          external_credential_names=$(python3 scripts/goal006_deployment_credentials.py \
            --catalog infrastructure/environment-readiness/secret-catalog.json \
            --environment "$TARGET_ENVIRONMENT" \
            --web-session-mode disabled \
            --kind required-external)
          credential_schema=$(printf '%s\n%s\n' "$SEEDER_IMAGE" "$credential_names" | sha256sum | cut -d' ' -f1)
          seeding_required=false
          jq -n --arg schema "$credential_schema" '{schema: $schema, credentials: []}' > credential-inventory.json
          for name in $external_credential_names; do
            lookup_error=$(mktemp)
            if enabled=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$name" \
              --query attributes.enabled -o tsv 2>"$lookup_error"); then
              rm -f "$lookup_error"
              test "$enabled" = true || {
                echo "Required external credential $name is disabled" >&2
                exit 1
              }
            elif grep -q "SecretNotFound" "$lookup_error"; then
              rm -f "$lookup_error"
              echo "Required external credential $name is missing; provision it through the Founder Key Vault admin path" >&2
              exit 1
            else
              cat "$lookup_error" >&2
              rm -f "$lookup_error"
              exit 1
            fi
            jq --arg name "$name" \
              '.credentials += [{name: $name, status: "ready", schema: "external-operator"}]' \
              credential-inventory.json > credential-inventory.next.json
            mv credential-inventory.next.json credential-inventory.json
          done
          for name in $credential_names; do
            lookup_error=$(mktemp)
            if az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$name" -o json \
              > credential.json 2>"$lookup_error"; then
              rm -f "$lookup_error"
              enabled=$(jq -r '.attributes.enabled' credential.json)
              test "$enabled" = true || {
                echo "Credential $name is disabled and will not be re-enabled automatically" >&2
                exit 1
              }
              actual_schema=$(jq -r '.tags["goal006-credential-schema"] // ""' credential.json)
              status=ready
              if test "$name" = "conversation-cursor-hmac" \
                && test "$(jq -r '.value | length' credential.json)" -lt 32; then
                status=invalid-length
                seeding_required=true
              elif test "$actual_schema" != "$credential_schema"; then
                status=schema-update-required
                seeding_required=true
              fi
              rm -f credential.json
            elif grep -q "SecretNotFound" "$lookup_error"; then
              rm -f "$lookup_error"
              actual_schema=""
              status=missing
              seeding_required=true
            else
              cat "$lookup_error" >&2
              rm -f "$lookup_error"
              exit 1
            fi
            jq --arg name "$name" --arg status "$status" --arg schema "$actual_schema" \
              '.credentials += [{name: $name, status: $status, schema: $schema}]' \
              credential-inventory.json > credential-inventory.next.json
            mv credential-inventory.next.json credential-inventory.json
          done
          {
            echo "seeding_required=$seeding_required"
            echo "credential_schema=$credential_schema"
            echo "credential_names=$credential_names"
          } >> "$GITHUB_OUTPUT"

      - name: Create private digest-pinned credential seeder
        if: inputs.apply && steps.credential-inventory.outputs.seeding_required == 'true'
        env:
          CONTAINER_APP_ENVIRONMENT_ID: ${{ steps.foundation.outputs.container_app_environment_id }}
          CREDENTIAL_SCHEMA: ${{ steps.credential-inventory.outputs.credential_schema }}
          CREDENTIAL_NAMES: ${{ steps.credential-inventory.outputs.credential_names }}
          DEPLOYMENT_CLIENT_ID: ${{ steps.foundation.outputs.deployment_client_id }}
          DEPLOYMENT_IDENTITY_ID: ${{ steps.foundation.outputs.deployment_identity_id }}
          KEY_VAULT_NAME: ${{ steps.foundation.outputs.key_vault_name }}
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
        run: |
          repository=${SEEDER_IMAGE#mcr.microsoft.com/}
          repository=${repository%@*}
          expected_digest=${SEEDER_IMAGE##*@}
          actual_digest=$(curl --fail --silent --show-error --head \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json' \
            "https://mcr.microsoft.com/v2/$repository/manifests/$expected_digest" \
            | awk 'tolower($1) == "docker-content-digest:" {gsub("\r", "", $2); print tolower($2)}')
          test "$actual_digest" = "$expected_digest"
          az containerapp job delete --name "$SEEDER_JOB" --resource-group "$RESOURCE_GROUP" --yes --output none 2>/dev/null || true
          # shellcheck disable=SC2016
          seeder_script='set -eu; az login --identity --client-id "$AZURE_CLIENT_ID" --allow-no-subscriptions --output none; for name in $CREDENTIAL_NAMES; do lookup_error=$(mktemp); if secret_json=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$name" -o json 2>"$lookup_error"); then rm -f "$lookup_error"; test "$(printf "%s" "$secret_json" | jq -r ".attributes.enabled")" = true || { echo "credential_status name=$name status=disabled" >&2; exit 1; }; if test "$name" != "conversation-cursor-hmac" || test "$(printf "%s" "$secret_json" | jq -r ".value | length")" -ge 32; then az keyvault secret set-attributes --vault-name "$KEY_VAULT_NAME" --name "$name" --tags goal006-credential-schema="$CREDENTIAL_SCHEMA" --output none; echo "credential_status name=$name status=preserved"; continue; fi; echo "credential_status name=$name status=invalid-length"; else if ! grep -q "SecretNotFound" "$lookup_error"; then cat "$lookup_error" >&2; rm -f "$lookup_error"; exit 1; fi; rm -f "$lookup_error"; fi; credential=$(head -c 48 /dev/urandom | base64 | tr -d "\n"); created=false; for attempt in 1 2 3 4 5 6; do if az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name "$name" --value "$credential" --tags goal006-credential-schema="$CREDENTIAL_SCHEMA" --output none; then created=true; echo "credential_status name=$name status=created"; break; fi; test "$attempt" != 6; sleep 10; done; unset credential secret_json; test "$created" = true; done'
          jq -n \
            --arg name "$SEEDER_JOB" \
            --arg environment_id "$CONTAINER_APP_ENVIRONMENT_ID" \
            --arg identity_id "$DEPLOYMENT_IDENTITY_ID" \
            --arg image "$SEEDER_IMAGE" \
            --arg client_id "$DEPLOYMENT_CLIENT_ID" \
            --arg credential_schema "$CREDENTIAL_SCHEMA" \
            --arg credential_names "$CREDENTIAL_NAMES" \
            --arg key_vault_name "$KEY_VAULT_NAME" \
            --arg script "$seeder_script" \
            '{
              name: $name,
              identity: {
                type: "UserAssigned",
                userAssignedIdentities: {($identity_id): {}}
              },
              properties: {
                environmentId: $environment_id,
                configuration: {
                  triggerType: "Manual",
                  replicaTimeout: 600,
                  replicaRetryLimit: 1,
                  manualTriggerConfig: {
                    replicaCompletionCount: 1,
                    parallelism: 1
                  }
                },
                template: {
                  containers: [{
                    name: $name,
                    image: $image,
                    command: ["/bin/sh"],
                    args: ["-c", $script],
                    env: [
                      {name: "AZURE_CLIENT_ID", value: $client_id},
                      {name: "CREDENTIAL_SCHEMA", value: $credential_schema},
                      {name: "CREDENTIAL_NAMES", value: $credential_names},
                      {name: "KEY_VAULT_NAME", value: $key_vault_name}
                    ],
                    resources: {cpu: 0.25, memory: "0.5Gi"}
                  }]
                }
              }
            }' > secret-seeder-job-definition.json
          az containerapp job create \
            --name "$SEEDER_JOB" \
            --resource-group "$RESOURCE_GROUP" \
            --yaml secret-seeder-job-definition.json \
            --output none

      - name: Run private credential seeder
        if: inputs.apply && steps.credential-inventory.outputs.seeding_required == 'true'
        id: seeder
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
        run: |
          execution_name=$(az containerapp job start --name "$SEEDER_JOB" --resource-group "$RESOURCE_GROUP" --query name -o tsv)
          test -n "$execution_name"
          capture_seeder_evidence() {
            az containerapp job show \
              --name "$SEEDER_JOB" \
              --resource-group "$RESOURCE_GROUP" \
              --output json > secret-seeder-job.json
            az containerapp job execution show \
              --name "$SEEDER_JOB" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --output json > secret-seeder-execution.json
            az containerapp job logs show \
              --name "$SEEDER_JOB" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution_name" \
              --container "$SEEDER_JOB" \
              --tail 200 \
              --format text > secret-seeder-console.log 2>&1 || true
          }
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --name "$SEEDER_JOB" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status -o tsv)
            case "$status" in
              Succeeded)
                capture_seeder_evidence
                exit 0
                ;;
              Failed|Stopped)
                capture_seeder_evidence
                cat secret-seeder-console.log >&2
                echo "Private credential seeder failed with status: $status" >&2
                exit 1
                ;;
              Processing|Running) ;;
              # Azure reports Unknown until a fresh execution's replica is scheduled (run 39539976383);
              # tolerate it for the first six polls and fall through to the fatal branch if it persists.
              Unknown) if [ "$attempt" -le 6 ]; then sleep 10; continue; fi ;;&
              *)
                capture_seeder_evidence
                echo "Private credential seeder returned unknown status: ${status:-<empty>}" >&2
                exit 1
                ;;
            esac
            if [ "$attempt" = 60 ]; then
              capture_seeder_evidence
              cat secret-seeder-console.log >&2
              echo "Private credential seeder timed out with status: $status" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Open bounded WC-124 schema reconciliation authority
        if: inputs.apply && steps.database-transition.outputs.schema_reconciliation_required == 'true'
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation
        env:
          ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
          TF_VAR_deployment_client_id: ${{ steps.foundation.outputs.deployment_client_id }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          terraform plan -input=false -lock-timeout=5m \
            -var="postgresql_password_auth_enabled=true" \
            -var="database_bootstrap_admin_enabled=true" \
            -var="database_provisioner_vault_access_enabled=false" \
            -out=foundation-schema-reconciliation.tfplan
          terraform show -json foundation-schema-reconciliation.tfplan > foundation-schema-reconciliation.json
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope foundation \
            --transition wc124-schema-reconciliation \
            --plan foundation-schema-reconciliation.json
          terraform apply -input=false -auto-approve foundation-schema-reconciliation.tfplan
          admin_count=$(az postgres flexible-server microsoft-entra-admin list \
            --resource-group '${{ steps.foundation.outputs.resource_group_name }}' \
            --server-name "psql-waooaw-${{ inputs.environment }}-state" \
            --query "[?principalName == 'id-waooaw-${{ inputs.environment }}-db-bootstrap'] | length(@)" \
            --output tsv)
          test "$admin_count" = 1

      - name: Grant bounded WC-124 reconciliation authority
        if: inputs.apply && (inputs.environment == 'demo' || inputs.environment == 'uat')
        id: reconciliation-authority
        env:
          DATABASE_PROVISIONER_IDENTITY_ID: ${{ steps.foundation.outputs.database_provisioner_identity_id }}
          KEY_VAULT_ID: ${{ steps.foundation.outputs.key_vault_id }}
        run: |
          set -euo pipefail
          role_id="b86a8fe4-44ce-4948-aee5-eccb2c155cd7"
          foundation_root="infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation"
          principal_id=$(az identity show \
            --ids "$DATABASE_PROVISIONER_IDENTITY_ID" \
            --query principalId \
            --output tsv)
          assignment_name=$(python3 - "$KEY_VAULT_ID" "$principal_id" <<'PY'
          import sys
          import uuid

          print(uuid.uuid5(uuid.NAMESPACE_URL, "|".join(part.lower() for part in sys.argv[1:]) + "|wc124-reconciliation"))
          PY
          )
          transition_assignment_id=$(terraform -chdir="$foundation_root" show -json | jq -r '
            [
              .values.root_module.child_modules[]?.resources[]?
              | select(.address == "module.foundation.azurerm_role_assignment.database_provisioner_vault[0]")
              | .values.id
            ][0] // ""
          ')
          assignments=$(az role assignment list \
            --assignee-object-id "$principal_id" \
            --scope "$KEY_VAULT_ID" \
            --query "[?contains(roleDefinitionId, '$role_id')]" \
            --output json)
          unknown_assignments=$(jq \
            --arg name "$assignment_name" \
            --arg transition_id "${transition_assignment_id,,}" \
            '[
              .[]
              | select(.name != $name)
              | select($transition_id == "" or (.id | ascii_downcase) != $transition_id)
            ] | length' <<< "$assignments")
          if [ "$unknown_assignments" != 0 ]; then
            echo "Found WC-124 vault authority without positively established lifecycle ownership" >&2
            exit 1
          fi
          transition_assignment_count=$(jq \
            --arg transition_id "${transition_assignment_id,,}" \
            '[.[] | select($transition_id != "" and (.id | ascii_downcase) == $transition_id)] | length' \
            <<< "$assignments")
          if [ "$transition_assignment_count" -gt 1 ]; then
            echo "Found duplicate transition-owned WC-124 vault authority" >&2
            exit 1
          fi
          reconciliation_assignments=$(jq \
            --arg name "$assignment_name" \
            '[.[] | select(.name == $name)]' \
            <<< "$assignments")
          reconciliation_assignment_count=$(jq 'length' <<< "$reconciliation_assignments")
          case "$reconciliation_assignment_count" in
            0)
              assignment=$(az role assignment create \
                --name "$assignment_name" \
                --assignee-object-id "$principal_id" \
                --assignee-principal-type ServicePrincipal \
                --role "$role_id" \
                --scope "$KEY_VAULT_ID" \
                --output json)
              ownership="created-by-current-execution"
              ;;
            1)
              assignment=$(jq '.[0]' <<< "$reconciliation_assignments")
              test "$(jq -r '.principalId | ascii_downcase' <<< "$assignment")" = "${principal_id,,}"
              ownership="adopted-orphaned-reconciliation-authority"
              ;;
            *)
              echo "Found duplicate deterministic WC-124 reconciliation authority" >&2
              exit 1
              ;;
          esac
          assignment_id=$(jq -er '.id' <<< "$assignment")
          jq -n \
            --arg assignment_id "$assignment_id" \
            --arg assignment_name "$assignment_name" \
            --arg principal_id "$principal_id" \
            --arg role_id "$role_id" \
            --arg scope "$KEY_VAULT_ID" \
            --arg ownership "$ownership" \
            --arg transition_assignment_id "$transition_assignment_id" \
            '{
              schema: "waooaw.wc124-reconciliation-authority/v1",
              assignment_id: $assignment_id,
              assignment_name: $assignment_name,
              principal_id: $principal_id,
              role_id: $role_id,
              scope: $scope,
              ownership: $ownership,
              transition_assignment_id: (
                if $transition_assignment_id == "" then null else $transition_assignment_id end
              ),
              status: "temporary-authority-pending-data-plane-proof"
            }' > wc124-reconciliation-authority.json
          {
            echo "assignment_id=$assignment_id"
            echo "assignment_name=$assignment_name"
            echo "principal_id=$principal_id"
            echo "ownership=$ownership"
          } >> "$GITHUB_OUTPUT"

      - name: Quiesce Demo consumers before database reset
        id: demo-maintenance
        if: inputs.apply && inputs.environment == 'demo'
        run: |
          set -euo pipefail
          # A previously deployed realm must have its existing recovery job before any reset.
          existing_keycloak=$(az containerapp list --resource-group waooaw-demo-rg \
            --query "[?name == 'ca-demo-keycloak'].name | [0]" --output tsv)
          if [ -n "$existing_keycloak" ]; then
            az containerapp job show --resource-group waooaw-demo-rg \
              --name job-demo-keycloak-migration --output json > wc132-recovery-job-preflight.json
            PYTHONPATH=scripts python3 -c \
              'import json; from goal006_demo_reset_recovery import validate_job; validate_job(json.load(open("wc132-recovery-job-preflight.json")))'
          fi
          rm -f wc124-keycloak-migration-execution.json
          echo "[demo-reset] state=DEMO_DATABASE_RESET_MAINTENANCE_STARTED time=$(date -u +%FT%TZ)"
          python3 scripts/goal006_application_lifecycle.py \
            --environment demo --action Stop --component database-reset \
            --output wc132-demo-maintenance.json

      - name: Create WC-124 database provisioner
        if: inputs.apply && (inputs.environment == 'demo' || inputs.environment == 'uat')
        env:
          BOOTSTRAP_CLIENT_ID: ${{ steps.foundation.outputs.database_bootstrap_client_id }}
          BOOTSTRAP_IDENTITY_ID: ${{ steps.foundation.outputs.database_bootstrap_identity_id }}
          CONTAINER_APP_ENVIRONMENT_ID: ${{ steps.foundation.outputs.container_app_environment_id }}
          DATABASE_PROVISIONER_CLIENT_ID: ${{ steps.foundation.outputs.database_provisioner_client_id }}
          DATABASE_PROVISIONER_IDENTITY_ID: ${{ steps.foundation.outputs.database_provisioner_identity_id }}
          KEY_VAULT_NAME: ${{ steps.foundation.outputs.key_vault_name }}
          POSTGRESQL_SERVER_FQDN: ${{ steps.foundation.outputs.postgresql_server_fqdn }}
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_HOME: ${{ needs.start-broker.outputs.image_home }}
          IMAGE_REGISTRY_SERVER: ${{ needs.start-broker.outputs.image_registry_server }}
          IMAGE_PULL_IDENTITY_ID: ${{ needs.start-broker.outputs.image_pull_identity_id }}
        run: |
          set -euo pipefail
          recovery_verification='${{ steps.database-transition.outputs.revocation_verification_required }}'
          full_provisioning='${{ steps.database-transition.outputs.provisioner_required }}'
          job_name="job-${TARGET_ENVIRONMENT}-wc124-db-provisioner"
          repository="dlai-sd/goal006-private-runner"
          release_tag="sha-${{ inputs.control_sha }}"
          runner_digest=$(python3 scripts/goal006_ghcr_digest.py \
            --repository "$repository" \
            --reference "$release_tag")
          runner_image="ghcr.io/${repository}@${runner_digest}"
          acr_server=
          acr_pull_identity=
          if test "${IMAGE_HOME:-github}" = azure; then
            runner_image="${IMAGE_REGISTRY_SERVER}/${repository}@${runner_digest}"
            acr_server=$IMAGE_REGISTRY_SERVER
            acr_pull_identity=$IMAGE_PULL_IDENTITY_ID
          fi
          pgbouncer_host="ca-${TARGET_ENVIRONMENT}-pgbouncer"
          job_id=$(az containerapp job list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name == '$job_name'].id | [0]" \
            --output tsv)
          if [ -n "$job_id" ]; then
            az containerapp job delete \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --yes \
              --output none
            az resource wait \
              --deleted \
              --ids "$job_id" \
              --interval 5 \
              --timeout 300
          fi
          jq -n \
            --arg name "$job_name" \
            --arg environment_id "$CONTAINER_APP_ENVIRONMENT_ID" \
            --arg bootstrap_identity_id "$BOOTSTRAP_IDENTITY_ID" \
            --arg provisioner_identity_id "$DATABASE_PROVISIONER_IDENTITY_ID" \
            --arg image "$runner_image" \
            --arg target_environment "$TARGET_ENVIRONMENT" \
            --arg vault_name "$KEY_VAULT_NAME" \
            --arg server_fqdn "$POSTGRESQL_SERVER_FQDN" \
            --arg pgbouncer_host "$pgbouncer_host" \
            --arg bootstrap_client_id "$BOOTSTRAP_CLIENT_ID" \
            --arg bootstrap_name "id-waooaw-${TARGET_ENVIRONMENT}-db-bootstrap" \
            --arg provisioner_client_id "$DATABASE_PROVISIONER_CLIENT_ID" \
            --argjson recovery_verification "$recovery_verification" \
            --argjson full_provisioning "$full_provisioning" \
            --arg image_registry_server "$acr_server" \
            --arg image_pull_identity_id "$acr_pull_identity" \
            '{
              name: $name,
              identity: {
                type: "UserAssigned",
                userAssignedIdentities: (
                  if $full_provisioning then {
                    ($bootstrap_identity_id): {},
                    ($provisioner_identity_id): {}
                  }
                  else {($provisioner_identity_id): {}}
                  end
                )
              },
              properties: {
                environmentId: $environment_id,
                configuration: {
                  triggerType: "Manual",
                  replicaTimeout: 1800,
                  replicaRetryLimit: 1,
                  manualTriggerConfig: {
                    replicaCompletionCount: 1,
                    parallelism: 1
                  }
                },
                template: {
                  containers: [{
                    name: $name,
                    image: $image,
                    command: ["/usr/bin/python3"],
                    args: (
                      if $recovery_verification
                      then [
                        "/opt/waooaw/wc124_db_handoff.py",
                        "--environment", $target_environment,
                        "--vault-name", $vault_name,
                        "--server-fqdn", $server_fqdn,
                        "--bootstrap-name", $bootstrap_name,
                        "--provisioner-client-id", $provisioner_client_id,
                        "--verify-only"
                      ]
                      elif $full_provisioning
                      then ([
                        "/opt/waooaw/wc124_db_provisioner.py",
                        "--environment", $target_environment,
                        "--catalog", "/opt/waooaw/secret-catalog.json",
                        "--vault-name", $vault_name,
                        "--server-fqdn", $server_fqdn,
                        "--pgbouncer-host", $pgbouncer_host,
                        "--bootstrap-client-id", $bootstrap_client_id,
                        "--bootstrap-name", $bootstrap_name,
                        "--provisioner-client-id", $provisioner_client_id
                      ] + if $target_environment == "demo" then ["--reset-demo-databases"] else [] end)
                      else [
                        "/opt/waooaw/wc124_db_provisioner.py",
                        "--environment", $target_environment,
                        "--catalog", "/opt/waooaw/secret-catalog.json",
                        "--vault-name", $vault_name,
                        "--pgbouncer-host", $pgbouncer_host,
                        "--provisioner-client-id", $provisioner_client_id,
                        "--refresh-existing-urls"
                      ]
                      end
                    ),
                    resources: {cpu: 0.5, memory: "1Gi"}
                  }]
                }
              }
            }
            | if $image_registry_server == "" then .
              else
                .identity.userAssignedIdentities[$image_pull_identity_id] = {}
                | .properties.configuration.registries = [{server: $image_registry_server, identity: $image_pull_identity_id}]
              end' > wc124-db-provisioner-job-definition.json
          az containerapp job create \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --yaml wc124-db-provisioner-job-definition.json \
            --output none
          actual_identities=$(az containerapp job show \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'keys(identity.userAssignedIdentities)' \
            --output json | jq -c 'map(ascii_downcase) | sort')
          expected_identities=$(jq -cn \
            --arg bootstrap "$BOOTSTRAP_IDENTITY_ID" \
            --arg provisioner "$DATABASE_PROVISIONER_IDENTITY_ID" \
            --argjson full_provisioning "$full_provisioning" \
            --arg image_pull "$acr_pull_identity" \
            '(if $full_provisioning then [$bootstrap, $provisioner] else [$provisioner] end)
             + (if $image_pull == "" then [] else [$image_pull] end)
             | map(ascii_downcase) | sort')
          test "$actual_identities" = "$expected_identities"

      - name: Run WC-124 database provisioner
        id: demo-database-reset
        if: inputs.apply && (inputs.environment == 'demo' || inputs.environment == 'uat')
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          job_name="job-${TARGET_ENVIRONMENT}-wc124-db-provisioner"
          execution_name=$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)
          test -n "$execution_name"
          capture_database_provisioner_evidence() {
            az containerapp job show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --output json > wc124-db-provisioner-job.json
            az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --output json > wc124-db-provisioner-execution.json
            az containerapp job logs show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution_name" \
              --container "$job_name" \
              --tail 300 \
              --format text > wc124-db-provisioner-evidence.log 2>&1 || true
          }
          started=$(date +%s)
          for poll in $(seq 1 180); do
            status=$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status -o tsv)
            elapsed=$(( $(date +%s) - started ))
            printf '[wc124-db-provisioner] poll=%s elapsed=%ss status=%s time=%s\n' \
              "$poll" "$elapsed" "${status:-<empty>}" "$(date -u +%FT%TZ)"
            case "$status" in
              Succeeded)
                capture_database_provisioner_evidence
                break
                ;;
              Failed|Stopped)
                capture_database_provisioner_evidence
                cat wc124-db-provisioner-evidence.log >&2
                echo "WC-124 database provisioner failed with status: $status" >&2
                exit 1
                ;;
              Processing|Running) ;;
              # Azure reports Unknown until a fresh execution's replica is scheduled (run 39539976383);
              # tolerate it for the first six polls and fall through to the fatal branch if it persists.
              Unknown) if [ "$poll" -le 6 ]; then sleep 10; continue; fi ;;&
              *)
                capture_database_provisioner_evidence
                echo "WC-124 database provisioner returned unknown status: ${status:-<empty>}" >&2
                exit 1
                ;;
            esac
            if [ "$poll" = 180 ]; then
              capture_database_provisioner_evidence
              cat wc124-db-provisioner-evidence.log >&2
              echo "WC-124 database provisioner timed out with status: $status" >&2
              exit 1
            fi
            sleep 10
          done
          sed -n -E 's/^[^ ]+ stdout F ?//p' wc124-db-provisioner-evidence.log \
            > wc124-db-provisioner-result.json
          if [ ! -s wc124-db-provisioner-result.json ]; then
            cat wc124-db-provisioner-evidence.log >&2
            echo "::error title=WC-124 provisioner result missing::Execution $execution_name ended $status but its console log had no result line; see wc124-db-provisioner-evidence.log" >&2
            exit 1
          fi
          jq --arg execution "$execution_name" '. + {execution: $execution}' \
            wc124-db-provisioner-result.json > wc124-db-provisioner-result.bound.json
          mv wc124-db-provisioner-result.bound.json wc124-db-provisioner-result.json
          jq -e --arg environment "$TARGET_ENVIRONMENT" '
            .schema == "waooaw.wc124-db-provisioning/v1"
            and .mode != "canonical-url-refresh"
            and (
              if $environment == "demo"
              then (
                .database_reset.status == "completed"
                and (.database_reset.databases | sort) == ([
                  "waooaw_application",
                  "waooaw_keycloak",
                  "waooaw_temporal",
                  "waooaw_temporal_visibility"
                ] | sort)
                and .init_chain.reapplied == 0
                and .init_chain.skipped == 0
              )
              else .database_reset == null
              end
            )
            and (.init_chain.ledger == "wc124_provisioning.init_chain_ledger")
            and (.identity_schema.status == "passed")
            and (.identity_schema.required_relations | length == 6)
          ' wc124-db-provisioner-result.json > /dev/null

      - name: Revoke bounded WC-124 reconciliation authority
        if: always() && steps.reconciliation-authority.outputs.assignment_id != '' && steps.database-transition.outputs.schema_reconciliation_required != 'true'
        env:
          ASSIGNMENT_ID: ${{ steps.reconciliation-authority.outputs.assignment_id }}
          ASSIGNMENT_NAME: ${{ steps.reconciliation-authority.outputs.assignment_name }}
          KEY_VAULT_ID: ${{ steps.foundation.outputs.key_vault_id }}
          PRINCIPAL_ID: ${{ steps.reconciliation-authority.outputs.principal_id }}
        run: |
          set -euo pipefail
          az role assignment delete --ids "$ASSIGNMENT_ID"
          remaining=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$KEY_VAULT_ID" \
            --query "[?name == '$ASSIGNMENT_NAME'] | length(@)" \
            --output tsv)
          test "$remaining" = 0
          jq \
            '.status = "temporary-authority-revoked"
             | .cleanup = "immediate"' \
            wc124-reconciliation-authority.json > wc124-reconciliation-authority.revoked.json
          mv wc124-reconciliation-authority.revoked.json wc124-reconciliation-authority.json

      - name: Apply reviewed PostgreSQL Plan B compatibility
        if: inputs.apply && steps.database-transition.outputs.plan_b_required == 'true'
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation
        env:
          ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
          TF_VAR_deployment_client_id: ${{ steps.foundation.outputs.deployment_client_id }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          terraform plan -input=false -lock-timeout=5m \
            -var="postgresql_password_auth_enabled=true" \
            -var="database_bootstrap_admin_enabled=true" \
            -var="database_provisioner_vault_access_enabled=true" \
            -out=foundation-plan-b.tfplan
          terraform show -json foundation-plan-b.tfplan > foundation-plan-b.json
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope foundation \
            --transition wc124-plan-b \
            --plan foundation-plan-b.json
          terraform apply -input=false -auto-approve foundation-plan-b.tfplan
          test "$(az postgres flexible-server show \
            --resource-group '${{ steps.foundation.outputs.resource_group_name }}' \
            --name "psql-waooaw-${{ inputs.environment }}-state" \
            --query authConfig.passwordAuth -o tsv)" = "Enabled"

      - name: Finalize WC-124 PostgreSQL authority handoff
        id: database-handoff
        # Transition state resolves before foundation outputs; without them this step has no target.
        if: >-
          always() && inputs.apply &&
          steps.foundation.outcome == 'success' &&
          steps.database-transition.outputs.handoff_required == 'true'
        env:
          BOOTSTRAP_CLIENT_ID: ${{ steps.foundation.outputs.database_bootstrap_client_id }}
          BOOTSTRAP_IDENTITY_ID: ${{ steps.foundation.outputs.database_bootstrap_identity_id }}
          DATABASE_PROVISIONER_CLIENT_ID: ${{ steps.foundation.outputs.database_provisioner_client_id }}
          DATABASE_PROVISIONER_IDENTITY_ID: ${{ steps.foundation.outputs.database_provisioner_identity_id }}
          KEY_VAULT_NAME: ${{ steps.foundation.outputs.key_vault_name }}
          POSTGRESQL_SERVER_FQDN: ${{ steps.foundation.outputs.postgresql_server_fqdn }}
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_HOME: ${{ needs.start-broker.outputs.image_home }}
          IMAGE_PULL_IDENTITY_ID: ${{ needs.start-broker.outputs.image_pull_identity_id }}
        run: |
          set -euo pipefail
          job_name="job-${TARGET_ENVIRONMENT}-wc124-db-provisioner"
          az containerapp job show \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --output json |
            jq \
              --arg environment "$TARGET_ENVIRONMENT" \
              --arg vault "$KEY_VAULT_NAME" \
              --arg server "$POSTGRESQL_SERVER_FQDN" \
              --arg bootstrap "$BOOTSTRAP_CLIENT_ID" \
              --arg provisioner "$DATABASE_PROVISIONER_CLIENT_ID" \
              '.properties.template.containers[0] |= (
                .command = ["/usr/bin/python3"]
                | .args = [
                  "/opt/waooaw/wc124_db_handoff.py",
                  "--environment", $environment,
                  "--vault-name", $vault,
                  "--server-fqdn", $server,
                  "--bootstrap-client-id", $bootstrap,
                  "--bootstrap-name", ("id-waooaw-" + $environment + "-db-bootstrap"),
                  "--provisioner-client-id", $provisioner
                ]
              )' > wc124-db-handoff-job-definition.json
          az containerapp job update \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --yaml wc124-db-handoff-job-definition.json \
            --output none
          actual_identities=$(az containerapp job show \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'keys(identity.userAssignedIdentities)' \
            --output json | jq -c 'map(ascii_downcase) | sort')
          expected_identities=$(jq -cn \
            --arg bootstrap "$BOOTSTRAP_IDENTITY_ID" \
            --arg provisioner "$DATABASE_PROVISIONER_IDENTITY_ID" \
            --arg image_pull "${IMAGE_PULL_IDENTITY_ID:-}" \
            --arg image_home "${IMAGE_HOME:-github}" \
            '[$bootstrap, $provisioner] + (if $image_home == "azure" then [$image_pull] else [] end)
             | map(ascii_downcase) | sort')
          test "$actual_identities" = "$expected_identities"
          execution_name=$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)
          test -n "$execution_name"
          capture_database_handoff_evidence() {
            az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --output json > wc124-db-handoff-execution.json
            az containerapp job logs show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution_name" \
              --container "$job_name" \
              --tail 300 \
              --format text > wc124-db-handoff-evidence.log 2>&1 || true
          }
          started=$(date +%s)
          for poll in $(seq 1 180); do
            status=$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status -o tsv)
            elapsed=$(( $(date +%s) - started ))
            printf '[wc124-db-handoff] poll=%s elapsed=%ss status=%s time=%s\n' \
              "$poll" "$elapsed" "${status:-<empty>}" "$(date -u +%FT%TZ)"
            case "$status" in
              Succeeded)
                capture_database_handoff_evidence
                grep -F '"remaining_bootstrap_dependencies": 0' wc124-db-handoff-evidence.log
                break
                ;;
              Failed|Stopped)
                capture_database_handoff_evidence
                cat wc124-db-handoff-evidence.log >&2
                echo "WC-124 database handoff failed with status: $status" >&2
                exit 1
                ;;
              Processing|Running) ;;
              # Azure reports Unknown until a fresh execution's replica is scheduled (run 39539976383);
              # tolerate it for the first six polls and fall through to the fatal branch if it persists.
              Unknown) if [ "$poll" -le 6 ]; then sleep 10; continue; fi ;;&
              *)
                capture_database_handoff_evidence
                echo "WC-124 database handoff returned unknown status: ${status:-<empty>}" >&2
                exit 1
                ;;
            esac
            if [ "$poll" = 180 ]; then
              capture_database_handoff_evidence
              cat wc124-db-handoff-evidence.log >&2
              echo "WC-124 database handoff timed out with status: $status" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify interrupted WC-124 handoff before revocation
        id: database-handoff-verification
        if: inputs.apply && steps.database-transition.outputs.revocation_verification_required == 'true'
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          job_name="job-${TARGET_ENVIRONMENT}-wc124-db-provisioner"
          execution_name=$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)
          test -n "$execution_name"
          capture_recovery_handoff_evidence() {
            az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --output json > wc124-db-handoff-recovery-execution.json
            az containerapp job logs show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution_name" \
              --container "$job_name" \
              --tail 300 \
              --format text > wc124-db-handoff-recovery-evidence.log 2>&1 || true
          }
          for attempt in $(seq 1 180); do
            status=$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution_name" \
              --query properties.status -o tsv)
            case "$status" in
              Succeeded)
                capture_recovery_handoff_evidence
                grep -F '"remaining_bootstrap_dependencies": 0' wc124-db-handoff-recovery-evidence.log
                grep -F '"remaining_bootstrap_sessions": 0' wc124-db-handoff-recovery-evidence.log
                grep -F '"status": "verified-after-entra-bootstrap-removal"' wc124-db-handoff-recovery-evidence.log
                break
                ;;
              Failed|Stopped)
                capture_recovery_handoff_evidence
                cat wc124-db-handoff-recovery-evidence.log >&2
                echo "WC-124 recovery handoff verification failed with status: $status" >&2
                exit 1
                ;;
              Processing|Running) ;;
              # Azure reports Unknown until a fresh execution's replica is scheduled (run 39539976383);
              # tolerate it for the first six polls and fall through to the fatal branch if it persists.
              Unknown) if [ "$attempt" -le 6 ]; then sleep 10; continue; fi ;;&
              *)
                capture_recovery_handoff_evidence
                echo "WC-124 recovery handoff verification returned unknown status: ${status:-<empty>}" >&2
                exit 1
                ;;
            esac
            if [ "$attempt" = 180 ]; then
              capture_recovery_handoff_evidence
              cat wc124-db-handoff-recovery-evidence.log >&2
              echo "WC-124 recovery handoff verification timed out with status: $status" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Revoke reconciliation authority after schema handoff
        if: >-
          always() &&
          steps.reconciliation-authority.outputs.assignment_id != '' &&
          steps.database-transition.outputs.schema_reconciliation_required == 'true'
        env:
          ASSIGNMENT_ID: ${{ steps.reconciliation-authority.outputs.assignment_id }}
          ASSIGNMENT_NAME: ${{ steps.reconciliation-authority.outputs.assignment_name }}
          KEY_VAULT_ID: ${{ steps.foundation.outputs.key_vault_id }}
          PRINCIPAL_ID: ${{ steps.reconciliation-authority.outputs.principal_id }}
        run: |
          set -euo pipefail
          az role assignment delete --ids "$ASSIGNMENT_ID"
          remaining=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$KEY_VAULT_ID" \
            --query "[?name == '$ASSIGNMENT_NAME'] | length(@)" \
            --output tsv)
          test "$remaining" = 0
          jq \
            '.status = "temporary-authority-revoked"
             | .cleanup = "after-schema-handoff"' \
            wc124-reconciliation-authority.json > wc124-reconciliation-authority.revoked.json
          mv wc124-reconciliation-authority.revoked.json wc124-reconciliation-authority.json

      - name: Remove WC-124 Entra bootstrap authority
        if: >-
          always() && inputs.apply &&
          steps.foundation.outcome == 'success' &&
          steps.database-transition.outputs.revocation_required == 'true' &&
          (steps.database-transition.outputs.handoff_required != 'true' ||
           steps.database-handoff.outcome == 'success') &&
          (steps.database-transition.outputs.revocation_verification_required != 'true' ||
           steps.database-handoff-verification.outcome == 'success')
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation
        env:
          ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
          TF_VAR_deployment_client_id: ${{ steps.foundation.outputs.deployment_client_id }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m \
            -var="postgresql_password_auth_enabled=true" \
            -var="database_bootstrap_admin_enabled=false" \
            -var="database_provisioner_vault_access_enabled=false" \
            -out=foundation-bootstrap-removal.tfplan
          terraform show -json foundation-bootstrap-removal.tfplan > foundation-bootstrap-removal.json
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope foundation \
            --transition wc124-plan-b \
            --plan foundation-bootstrap-removal.json
          terraform apply -input=false -auto-approve foundation-bootstrap-removal.tfplan
          # shellcheck disable=SC2016
          test "$(az postgres flexible-server microsoft-entra-admin list \
            --resource-group '${{ steps.foundation.outputs.resource_group_name }}' \
            --server-name "psql-waooaw-${{ inputs.environment }}-state" \
            --query '[?contains(principalName, `db-bootstrap`)] | length(@)' -o tsv)" = 0
          provisioner_principal_id=$(az identity show \
            --ids '${{ steps.foundation.outputs.database_provisioner_identity_id }}' \
            --query principalId \
            --output tsv)
          provisioner_vault_role_count=$(az role assignment list \
            --assignee-object-id "$provisioner_principal_id" \
            --scope '${{ steps.foundation.outputs.key_vault_id }}' \
            --query "[?roleDefinitionName == 'Key Vault Secrets Officer'] | length(@)" \
            --output tsv)
          test "$provisioner_vault_role_count" = 0
          jq -n \
            --arg environment '${{ inputs.environment }}' \
            --argjson bootstrap_admin_count 0 \
            --argjson provisioner_vault_role_count "$provisioner_vault_role_count" \
            '{
              environment: $environment,
              bootstrap_admin_count: $bootstrap_admin_count,
              provisioner_vault_role_count: $provisioner_vault_role_count,
              status: "revocation-verified"
            }' > "$GITHUB_WORKSPACE/wc124-bootstrap-revocation-evidence.json"

      - name: Reconcile legacy PgBouncer credential metadata
        if: inputs.apply && (inputs.environment == 'demo' || inputs.environment == 'uat')
        env:
          KEY_VAULT_NAME: ${{ steps.foundation.outputs.key_vault_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          record=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name db-pgbouncer-auth \
            --query '{id:id, tags:tags}' \
            --output json)
          current_role=$(jq -r '.tags["wc124-role"] // ""' <<< "$record")
          if [ "$current_role" = pgbouncer_auth ]; then
            jq -n \
              --arg environment "$TARGET_ENVIRONMENT" \
              --arg status already-current \
              '{environment: $environment, secret: "db-pgbouncer-auth", status: $status}' \
              > wc124-pgbouncer-metadata-reconciliation.json
          else
            test "$current_role" = pgbouncer || {
              echo "Unsupported db-pgbouncer-auth legacy role tag: ${current_role:-<empty>}" >&2
              exit 1
            }
            database=$(jq -r '.tags["wc124-database"] // ""' <<< "$record")
            provisioner=$(jq -r '.tags["wc124-provisioner"] // ""' <<< "$record")
            grant_digest=$(jq -r '.tags["wc124-grant-digest"] // ""' <<< "$record")
            test "$database" = waooaw_application
            test "$provisioner" = wc124-db-provisioner
            test -n "$grant_digest"
            authfile=$(az keyvault secret show \
              --vault-name "$KEY_VAULT_NAME" \
              --name db-pgbouncer-auth \
              --query value \
              --output tsv)
            PGBOUNCER_AUTHFILE="$authfile" \
              TARGET_ENVIRONMENT="$TARGET_ENVIRONMENT" \
              PYTHONPATH="$GITHUB_WORKSPACE/scripts" \
              python3 - <<'PY'
          import os

          from wc124_db_provisioner import environment_specs, parse_authfile

          actual = set(parse_authfile(os.environ["PGBOUNCER_AUTHFILE"]))
          expected = {spec.role for spec in environment_specs(os.environ["TARGET_ENVIRONMENT"])}
          if actual != expected:
              raise SystemExit(
                  f"PgBouncer authfile role mismatch; missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}"
              )
          PY
            unset authfile
            az keyvault secret set-attributes \
              --id "$(jq -r '.id' <<< "$record")" \
              --tags \
                wc124-role=pgbouncer_auth \
                wc124-database="$database" \
                wc124-grant-digest="$grant_digest" \
                wc124-provisioner="$provisioner" \
              --output none
            jq -n \
              --arg environment "$TARGET_ENVIRONMENT" \
              --arg previous_role "$current_role" \
              '{
                environment: $environment,
                secret: "db-pgbouncer-auth",
                previous_role: $previous_role,
                current_role: "pgbouncer_auth",
                status: "legacy-metadata-reconciled"
              }' > wc124-pgbouncer-metadata-reconciliation.json
          fi

      - name: Verify WC-124 database credential handoff
        if: inputs.apply && (inputs.environment == 'demo' || inputs.environment == 'uat')
        env:
          KEY_VAULT_NAME: ${{ steps.foundation.outputs.key_vault_name }}
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          expected_count=$(jq \
            --arg environment "$TARGET_ENVIRONMENT" \
            '[.entries[]
              | select(
                  .provisioner == "wc124-db-provisioner"
                  and (.environments | index($environment))
                )
            ] | length' \
            infrastructure/environment-readiness/secret-catalog.json)
          jq -n \
            --arg environment "$TARGET_ENVIRONMENT" \
            '{schema: "waooaw.wc124-db-credential-inventory/v1", environment: $environment, credentials: []}' \
            > wc124-db-credential-inventory.json
          while IFS=$'\t' read -r secret_id vault_name role; do
            expected_role="$role"
            if [ "$secret_id" = "db-pgbouncer-auth" ]; then
              expected_role="pgbouncer_auth"
            fi
            record=$(az keyvault secret show \
              --vault-name "$KEY_VAULT_NAME" \
              --name "$vault_name" \
              --query '{id:id, enabled:attributes.enabled, tags:tags}' \
              -o json)
            test "$(jq -r '.enabled' <<< "$record")" = true || {
              echo "Disabled WC-124 credential: $vault_name" >&2
              exit 1
            }
            test "$(jq -r '.tags["wc124-role"] // ""' <<< "$record")" = "$expected_role" || {
              echo "Unexpected WC-124 role tag for $vault_name" >&2
              exit 1
            }
            test "$(jq -r '.tags["wc124-provisioner"] // ""' <<< "$record")" = "wc124-db-provisioner" || {
              echo "Unexpected WC-124 provisioner tag for $vault_name" >&2
              exit 1
            }
            version_id=$(jq -er '.id | split("/")[-1]' <<< "$record")
            database=$(jq -er '.tags["wc124-database"]' <<< "$record")
            jq \
              --arg secret_id "$secret_id" \
              --arg vault_name "$vault_name" \
              --arg role "$expected_role" \
              --arg database "$database" \
              --arg version_id "$version_id" \
              '.credentials += [{
                logical_secret_id: $secret_id,
                vault_secret_name: $vault_name,
                role: $role,
                database: $database,
                version_id: $version_id,
                status: "ready"
              }]' \
              wc124-db-credential-inventory.json > wc124-db-credential-inventory.next.json
            mv wc124-db-credential-inventory.next.json wc124-db-credential-inventory.json
          done < <(jq -r \
            --arg environment "$TARGET_ENVIRONMENT" \
            ".entries[]
             | select(
                 .provisioner == \"wc124-db-provisioner\"
                 and (.environments | index(\$environment))
               )
             | [.id, .vaultSecretName, .principal]
             | @tsv" \
            infrastructure/environment-readiness/secret-catalog.json)
          test "$(jq '.credentials | length' wc124-db-credential-inventory.json)" = "$expected_count"
          test "$(jq '[.credentials[].role] | unique | length' wc124-db-credential-inventory.json)" = "$expected_count"
          # shellcheck disable=SC2016
          test "$(az postgres flexible-server microsoft-entra-admin list \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "psql-waooaw-${TARGET_ENVIRONMENT}-state" \
            --query '[?contains(principalName, `db-bootstrap`)] | length(@)' -o tsv)" = 0

      - name: Build workload inputs from trusted foundation outputs
        if: inputs.apply
        env:
          IMAGE_HOME: ${{ needs.start-broker.outputs.image_home }}
          IMAGE_REGISTRY_SERVER: ${{ needs.start-broker.outputs.image_registry_server }}
          IMAGE_PULL_IDENTITY_ID: ${{ needs.start-broker.outputs.image_pull_identity_id }}
        run: |
          set -euo pipefail
          registry_arguments=()
          if test "${IMAGE_HOME:-github}" = azure; then
            registry_arguments=(--image-registry-server "$IMAGE_REGISTRY_SERVER" --image-pull-identity-id "$IMAGE_PULL_IDENTITY_ID")
          fi
          python3 scripts/goal006_deployment_inputs.py \
            --environment '${{ inputs.environment }}' \
            --manifest registry-release-manifest.json \
            --configuration workload-configuration.json \
            --key-vault-id '${{ steps.foundation.outputs.key_vault_id }}' \
            --key-vault-uri '${{ steps.foundation.outputs.key_vault_uri }}' \
            --output workload.auto.tfvars.json \
            --ghcr-packages-public-verified \
            "${registry_arguments[@]}"
          echo "Workload image home: ${IMAGE_HOME:-github} ${IMAGE_REGISTRY_SERVER:-ghcr.io}"
          if test -f wc124-db-credential-inventory.json; then
            jq --slurpfile inventory wc124-db-credential-inventory.json '
              ($inventory[0].credentials
                | map({key: .vault_secret_name, value: .version_id})
                | from_entries) as $versions
              | .database_secret_uris |= with_entries(
                  (.value | split("/")[-1]) as $secret_name
                  | if ($versions[$secret_name] | type) != "string"
                    then error("missing database secret version for " + $secret_name)
                    else .value = (.value + "/" + $versions[$secret_name])
                    end
                )
            ' workload.auto.tfvars.json > workload.versioned.tfvars.json
            mv workload.versioned.tfvars.json workload.auto.tfvars.json
          fi
          jq '.application_activation_enabled = false | .dependency_activation_enabled = false' \
            workload.auto.tfvars.json > workload.dormant.tfvars.json
          mv workload.dormant.tfvars.json workload.auto.tfvars.json

      - name: Terraform workload plan
        if: inputs.apply
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload
        env:
          ARM_CLIENT_ID: ${{ steps.foundation.outputs.deployment_client_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/workload.auto.tfvars.json" .
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          terraform state list > workload-state-before-plan.txt
          keycloak_identity_name="id-${TARGET_ENVIRONMENT}-keycloak-migration"
          keycloak_identity_inventory=$(az identity list \
            --resource-group '${{ steps.foundation.outputs.resource_group_name }}' \
            --query "[?name == '$keycloak_identity_name']" \
            --output json)
          keycloak_identity_count=$(jq 'length' <<< "$keycloak_identity_inventory")
          case "$keycloak_identity_count" in
            0) ;;
            1)
              keycloak_principal_id=$(jq -er '.[0].principalId' <<< "$keycloak_identity_inventory")
              web_secret_scope=$(jq -er '.key_vault_secret_resource_ids.web' workload.auto.tfvars.json)
              bp_secret_scope=$(jq -er '.key_vault_secret_resource_ids["business-platform"]' workload.auto.tfvars.json)
              vault_scope=${web_secret_scope%/secrets/web}
              test "$vault_scope" != "$web_secret_scope"
              test "${bp_secret_scope%/secrets/business-platform}" = "$vault_scope"
              printf '%s\t%s\n' \
                'module.workload.azurerm_role_assignment.keycloak_migration_realm_credential[0]' \
                "$web_secret_scope" > keycloak-role-assignment-adoption.tsv
              if [ "$TARGET_ENVIRONMENT" = demo ]; then
                printf '%s\t%s\n' \
                  'module.workload.azurerm_role_assignment.keycloak_migration_realm_secrets["google-client-id"]' \
                  "$vault_scope/secrets/google-client-id" \
                  'module.workload.azurerm_role_assignment.keycloak_migration_realm_secrets["google-client-secret"]' \
                  "$vault_scope/secrets/google-client-secret" \
                  'module.workload.azurerm_role_assignment.keycloak_migration_realm_secrets["meta-login-id"]' \
                  "$vault_scope/secrets/meta-login-client-id" \
                  'module.workload.azurerm_role_assignment.keycloak_migration_realm_secrets["meta-login-secret"]' \
                  "$vault_scope/secrets/meta-login-client-secret" \
                  'module.workload.azurerm_role_assignment.keycloak_migration_realm_secrets["bp-reader-secret"]' \
                  "$vault_scope/secrets/bp-identity-reader-client-secret" \
                  'module.workload.azurerm_role_assignment.keycloak_migration_realm_secrets["bp-writer-secret"]' \
                  "$vault_scope/secrets/keycloak-lifecycle-writer-client-secret" \
                  >> keycloak-role-assignment-adoption.tsv
              fi
              while IFS=$'\t' read -r assignment_address assignment_scope; do
                if grep -Fxq "$assignment_address" workload-state-before-plan.txt; then
                  continue
                fi
                assignment_inventory=$(az role assignment list \
                  --assignee-object-id "$keycloak_principal_id" \
                  --scope "$assignment_scope" \
                  --fill-principal-name false \
                  --fill-role-definition-name false \
                  --only-show-errors \
                  --output json)
                matching_assignments=$(jq -c \
                  --arg principal_id "${keycloak_principal_id,,}" \
                  --arg scope "${assignment_scope,,}" \
                  '[.[] | select(
                    (.principalId | ascii_downcase) == $principal_id and
                    (.scope | ascii_downcase) == $scope and
                    (.roleDefinitionId | ascii_downcase | endswith("/4633458b-17de-408a-b874-0445c86b69e6"))
                  )]' <<< "$assignment_inventory")
                assignment_count=$(jq 'length' <<< "$matching_assignments")
                case "$assignment_count" in
                  0) ;;
                  1)
                    assignment_id=$(jq -er '.[0].id' <<< "$matching_assignments")
                    terraform import -input=false -lock-timeout=5m "$assignment_address" "$assignment_id"
                    ;;
                  *)
                    echo "Expected zero or one Keycloak migration role assignment at $assignment_scope; found $assignment_count" >&2
                    exit 1
                    ;;
                esac
              done < keycloak-role-assignment-adoption.tsv
              ;;
            *)
              echo "Expected zero or one Keycloak migration identity named $keycloak_identity_name; found $keycloak_identity_count" >&2
              exit 1
              ;;
          esac
          resource_address='module.workload.azurerm_container_app.identity_edge[0]'
          if ! grep -Fxq "$resource_address" workload-state-before-plan.txt; then
            edge_name="ca-${{ inputs.environment }}-identity-edge"
            edge_resource_group='${{ steps.foundation.outputs.resource_group_name }}'
            edge_inventory=$(az containerapp list \
              --resource-group "$edge_resource_group" \
              --only-show-errors \
              --output json)
            edge_count=$(jq -r --arg name "$edge_name" '[.[] | select(.name == $name)] | length' <<< "$edge_inventory")
            if [ "$edge_count" = "1" ]; then
              azure_edge_id=$(jq -er \
                --arg name "$edge_name" \
                --arg environment_id '${{ steps.foundation.outputs.container_app_environment_id }}' \
                --arg image 'nginxinc/nginx-unprivileged@sha256:62a904036bfc0e4a4f2b556e34cbf17bc136b47fde8cdb4628762725f48c5782' \
                '.[] | select(
                  .name == $name and
                  .properties.managedEnvironmentId == $environment_id and
                  .properties.template.containers[0].image == $image and
                  .properties.configuration.ingress.external == true and
                  .properties.configuration.ingress.targetPort == 8080 and
                  .properties.provisioningState == "Succeeded"
                ) | .id' <<< "$edge_inventory")
              edge_id=$(python3 "$GITHUB_WORKSPACE/scripts/goal006_azure_resource_id.py" \
                --container-app-id "$azure_edge_id" \
                --expected-resource-group "$edge_resource_group" \
                --expected-name "$edge_name")
              test -n "$edge_id"
              terraform import -input=false -lock-timeout=5m "$resource_address" "$edge_id"
            elif [ "$edge_count" != "0" ]; then
              echo "Expected zero or one identity edge named $edge_name; found $edge_count" >&2
              exit 1
            fi
          fi
          terraform validate
          set +e
          terraform plan -detailed-exitcode -input=false -lock-timeout=5m -out=workload.tfplan
          plan_exit_code=$?
          set -e
          case "$plan_exit_code" in
            0|2) ;;
            *) echo "Workload planning failed with exit code $plan_exit_code" >&2; exit "$plan_exit_code" ;;
          esac
          terraform show -json workload.tfplan > workload-plan.json
          cp workload-plan.json "$GITHUB_WORKSPACE/workload-plan.json"
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope workload \
            --plan workload-plan.json \
            --output workload-plan-policy.json
          state_snapshot=$(mktemp)
          trap 'rm -f "$state_snapshot"' EXIT
          terraform state pull > "$state_snapshot"
          python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
            --environment "$TARGET_ENVIRONMENT" \
            --release-sha "$RELEASE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scope workload \
            --terraform-root "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload" \
            --backend-key "goal006/$TARGET_ENVIRONMENT/workload.tfstate" \
            --plan-json workload-plan.json \
            --plan-binary workload.tfplan \
            --policy-result workload-plan-policy.json \
            --state "$state_snapshot" \
            --output workload-plan-provenance.json

      - name: Generate internal WC-124 activation bundle
        if: inputs.apply
        env:
          LEASE_EXPIRY: ${{ inputs.lease_expires_at }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          for evidence_file in \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation-plan.json" \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation.tfplan" \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation-plan-provenance.json" \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation-plan-policy.json" \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload-plan.json" \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload.tfplan" \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload-plan-provenance.json" \
            "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload-plan-policy.json"; do
            test -s "$evidence_file" || {
              echo "Missing required activation evidence: $evidence_file" >&2
              exit 1
            }
          done
          schema_arguments=()
          for schema_file in infrastructure/postgres/init/*.sql; do
            schema_arguments+=(--schema-file "$schema_file")
          done
          python3 scripts/wc124_deployment_bundle.py \
            --environment "$TARGET_ENVIRONMENT" \
            --release-sha "$RELEASE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --actor "$GITHUB_ACTOR" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --lease-expiry "$LEASE_EXPIRY" \
            --foundation-plan "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation-plan.json" \
            --foundation-plan-binary "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation.tfplan" \
            --foundation-plan-provenance "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation-plan-provenance.json" \
            --foundation-policy-result "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/foundation/foundation-plan-policy.json" \
            --workload-plan "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload-plan.json" \
            --workload-plan-binary "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload.tfplan" \
            --workload-plan-provenance "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload-plan-provenance.json" \
            --workload-policy-result "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload/workload-plan-policy.json" \
            --secret-catalog infrastructure/environment-readiness/secret-catalog.json \
            --configuration workload-configuration.json \
            --dependency-file registry-release-manifest.json \
            --dependency-file infrastructure/terraform/phase2/modules/workload/main.tf \
            --migration-file src/billing-engine/migrate.py \
            --migration-file infrastructure/postgres/init/59-wc124-billing-authority.sql \
            "${schema_arguments[@]}" \
            --output wc124-deployment-activation-bundle.json
          jq '.authorization' wc124-deployment-activation-bundle.json > wc124-lifecycle-authorization.json
          jq '.tuple_digests' wc124-deployment-activation-bundle.json > wc124-lifecycle-tuple-digests.json
          python3 scripts/wc124_persistent_state_lifecycle.py \
            --operation-id "wc124-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --action activate \
            --environment "$TARGET_ENVIRONMENT" \
            --current-state SLEEPING \
            --authorization wc124-lifecycle-authorization.json \
            --tuple-digests wc124-lifecycle-tuple-digests.json \
            --output wc124-lifecycle-authorization-record.json

      - name: Terraform dormant workload and migration dependency apply
        if: inputs.apply
        id: dormant-workload
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload
        env:
          ARM_CLIENT_ID: ${{ steps.foundation.outputs.deployment_client_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')
          test "$RELEASE_SHA" = "$latest_main_sha"

          migration_targets=(
            "-target=module.workload.azurerm_container_app.pgbouncer[0]"
            "-target=module.workload.azurerm_container_app_job.keycloak_migration[0]"
            "-target=module.workload.azurerm_container_app_job.billing_migration[0]"
          )
          if [ "$TARGET_ENVIRONMENT" = demo ]; then
            migration_targets+=(
              "-target=module.workload.azurerm_container_app_job.temporal_migration[0]"
              "-target=module.workload.azurerm_container_app_job.temporal_startup_qualification[0]"
            )
          fi

          state_snapshot=$(mktemp)
          current_provenance=$(mktemp)
          trap 'rm -f "$state_snapshot" "$current_provenance"' EXIT

          plan_migration_dependencies() {
            set +e
            terraform plan -detailed-exitcode -input=false -lock-timeout=5m \
              -out=workload-migration.tfplan "${migration_targets[@]}"
            plan_exit_code=$?
            set -e
            case "$plan_exit_code" in
              0|2) ;;
              *) echo "Migration dependency planning failed with exit code $plan_exit_code" >&2; exit "$plan_exit_code" ;;
            esac
            terraform show -json workload-migration.tfplan > workload-migration-plan.json
            python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
              --scope workload-migration \
              --plan workload-migration-plan.json \
              --output workload-migration-policy.json
            terraform state pull > "$state_snapshot"
            python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
              --environment "$TARGET_ENVIRONMENT" \
              --release-sha "$RELEASE_SHA" \
              --release-run-id "$RELEASE_RUN_ID" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --scope workload-migration \
              --terraform-root "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload" \
              --backend-key "goal006/$TARGET_ENVIRONMENT/workload.tfstate" \
              --plan-json workload-migration-plan.json \
              --plan-binary workload-migration.tfplan \
              --policy-result workload-migration-policy.json \
              --state "$state_snapshot" \
              --output workload-migration-provenance.json
          }

          verify_migration_provenance() {
            terraform state pull > "$state_snapshot"
            python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
              --environment "$TARGET_ENVIRONMENT" \
              --release-sha "$RELEASE_SHA" \
              --release-run-id "$RELEASE_RUN_ID" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --scope workload-migration \
              --terraform-root "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload" \
              --backend-key "goal006/$TARGET_ENVIRONMENT/workload.tfstate" \
              --plan-json workload-migration-plan.json \
              --plan-binary workload-migration.tfplan \
              --policy-result workload-migration-policy.json \
              --state "$state_snapshot" \
              --output "$current_provenance"
            cmp --silent workload-migration-provenance.json "$current_provenance"
          }

          plan_migration_dependencies
          attempt=1
          max_attempts=3
          while true; do
            apply_log="workload-apply-attempt-${attempt}.log"
            verify_migration_provenance
            if terraform apply -input=false -auto-approve workload-migration.tfplan 2>&1 | tee "$apply_log"; then
              break
            fi
            if ! python3 "$GITHUB_WORKSPACE/scripts/goal006_keyvault_retry.py" \
              --apply-log "$apply_log" \
              --inventory credential-inventory.json \
              --plan workload-migration-plan.json; then
              echo "Migration dependency apply failed outside the bounded Key Vault propagation retry" >&2
              exit 1
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Key Vault managed-identity propagation did not converge after $max_attempts attempts" >&2
              exit 1
            fi
            delay=$((15 * 2 ** (attempt - 1)))
            echo "Known Key Vault propagation failure; waiting ${delay}s before replanning attempt $((attempt + 1))"
            sleep "$delay"
            plan_migration_dependencies
            attempt=$((attempt + 1))
          done
          web_url=$(terraform output -raw web_url)
          test -n "$web_url"
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"

      - name: Resume PgBouncer before migration preflight
        if: inputs.apply && (inputs.environment == 'demo' || inputs.environment == 'uat')
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 scripts/goal006_activation_readiness.py \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$TARGET_ENVIRONMENT" \
            --scope migration \
            --resume-stopped \
            --timeout-seconds 600 \
            --interval-seconds 15 \
            --output wc124-migration-readiness.json

      - name: Preflight PgBouncer from private ACA environment
        if: inputs.apply && (inputs.environment == 'demo' || inputs.environment == 'uat')
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          job_name="job-${TARGET_ENVIRONMENT}-wc124-billing-migration"
          az containerapp job show \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --output json > wc124-pgbouncer-preflight-job.before.json
          python3 scripts/wc124_pgbouncer_preflight_job.py \
            --job wc124-pgbouncer-preflight-job.before.json \
            --environment "$TARGET_ENVIRONMENT" \
            --subscription-id "$ARM_SUBSCRIPTION_ID" \
            --database-query \
            --output wc124-pgbouncer-preflight-template.json
          execution=$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --yaml wc124-pgbouncer-preflight-template.json \
            --query name \
            --output tsv)
          test -n "$execution"
          capture_pgbouncer_preflight_evidence() {
            az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --output json > wc124-pgbouncer-preflight-execution.json
            az containerapp job logs show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution" \
              --container billing-migration \
              --tail 100 \
              --format text > wc124-pgbouncer-preflight.log 2>&1 || true
          }
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status \
              --output tsv)
            case "$status" in
              Succeeded)
                capture_pgbouncer_preflight_evidence
                break
                ;;
              Failed|Stopped)
                capture_pgbouncer_preflight_evidence
                cat wc124-pgbouncer-preflight.log >&2
                echo "PgBouncer private ACA preflight failed: $status" >&2
                exit 1
                ;;
              Processing|Running) ;;
              # Azure reports Unknown until a fresh execution's replica is scheduled (run 39539976383);
              # tolerate it for the first six polls and fall through to the fatal branch if it persists.
              Unknown) if [ "$attempt" -le 6 ]; then sleep 10; continue; fi ;;&
              *)
                capture_pgbouncer_preflight_evidence
                echo "PgBouncer private ACA preflight returned unknown status: ${status:-<empty>}" >&2
                exit 1
                ;;
            esac
            if [ "$attempt" = 60 ]; then
              capture_pgbouncer_preflight_evidence
              cat wc124-pgbouncer-preflight.log >&2
              echo "PgBouncer private ACA preflight timed out with status: $status" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Reclaim PostgreSQL connection budget before vendor migrations
        if: inputs.apply
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          POSTGRESQL_SERVER_FQDN: ${{ steps.foundation.outputs.postgresql_server_fqdn }}
        run: |
          set -euo pipefail
          # Demo runs one provisioned instance with max_connections=50, of which Azure reserves
          # superuser_reserved_connections + reserved_connections; only the remainder is available to
          # the vendor migrators. A stale, still-active Container Apps revision (one that predates the
          # bounded pool configuration) keeps its old pools open and starves the migration job, so
          # retire every non-latest active revision first and then require measured headroom.
          server_name="${POSTGRESQL_SERVER_FQDN%%.*}"
          server_json=$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$server_name" --output json)
          server_id=$(jq -er '.id' <<< "$server_json")
          param() {
            az postgres flexible-server parameter show --resource-group "$RESOURCE_GROUP" \
              --server-name "$server_name" --name "$1" --query value --output tsv
          }
          max_connections=$(param max_connections)
          superuser_reserved=$(param superuser_reserved_connections)
          reserved=$(param reserved_connections)
          usable=$((max_connections - superuser_reserved - reserved))
          retired='[]'
          for app in ca-${TARGET_ENVIRONMENT}-temporal ca-${TARGET_ENVIRONMENT}-keycloak ca-${TARGET_ENVIRONMENT}-pgbouncer; do
            az containerapp show --resource-group "$RESOURCE_GROUP" --name "$app" --output json > /dev/null 2>&1 || continue
            latest=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$app" --query properties.latestRevisionName --output tsv)
            while IFS= read -r revision; do
              [ -n "$revision" ] || continue
              echo "Retiring stale active revision $revision of $app (latest is $latest)"
              az containerapp revision deactivate --resource-group "$RESOURCE_GROUP" --name "$app" --revision "$revision" --output none
              retired=$(jq -c --arg app "$app" --arg revision "$revision" '. + [{app: $app, revision: $revision}]' <<< "$retired")
            done < <(az containerapp revision list --resource-group "$RESOURCE_GROUP" --name "$app" \
              --query "[?properties.active && name != '$latest'].name" --output tsv)
          done
          # Vendor migrations run one group at a time (Keycloak, then Demo Temporal), so the gate only
          # needs the budget of a single group rather than both pools at once.
          required_headroom=4
          # The gate reads the latest completed one-minute bucket, so a transient spike (provisioner
          # sessions, revision restarts) ages out within the retry window instead of pinning a 5m max.
          # Retired revisions release their pools within the metric lag, so wait for that only when a
          # revision was actually retired; otherwise nothing is about to change and the gate fails fast
          # after one fresh bucket instead of idling for six minutes.
          if [ "$retired" = '[]' ]; then max_attempts=3; else max_attempts=18; fi
          for attempt in $(seq 1 "$max_attempts"); do
            active=$(az monitor metrics list --resource "$server_id" --metric active_connections \
              --interval PT1M --offset 2m --aggregation Maximum \
              --query "value[0].timeseries[0].data[-1].maximum" --output tsv)
            [[ "$active" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
              echo "Missing or malformed PostgreSQL connection metric: ${active:-<empty>}" >&2; exit 1;
            }
            active=$(jq -n --arg value "$active" '$value | tonumber | ceil')
            headroom=$((usable - active))
            echo "PostgreSQL connections: max=$max_connections reserved=$((superuser_reserved + reserved)) usable=$usable active(latest 1m)=$active headroom=$headroom required=$required_headroom"
            if [ "$headroom" -ge "$required_headroom" ]; then break; fi
            test "$attempt" != "$max_attempts" || { echo "Insufficient PostgreSQL connection headroom for vendor migrations" >&2; exit 1; }
            sleep 10
          done
          jq -n \
            --arg environment "$TARGET_ENVIRONMENT" --arg server "$server_name" --arg server_id "$server_id" \
            --argjson max "$max_connections" --argjson reserved "$((superuser_reserved + reserved))" \
            --argjson usable "$usable" --argjson active "$active" --argjson retired "$retired" \
            --argjson required "$required_headroom" \
            '{schema: "waooaw.wc124-connection-budget/v1", environment: $environment, server: $server,
              server_id: $server_id, max_connections: $max, reserved_connections: $reserved,
              usable_connections: $usable, active_connections_latest_1m: $active,
              required_headroom_per_group: $required, retired_revisions: $retired}' \
            | tee wc124-connection-budget.json

      - name: Run vendor schema migrations against private PostgreSQL
        if: inputs.apply
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          jq -n \
            --arg environment "$TARGET_ENVIRONMENT" \
            '{schema: "waooaw.wc124-vendor-migrations/v1", environment: $environment, groups: [], executions: []}' \
            > wc124-vendor-migrations.json
          # Keycloak and Temporal migrate independent databases, but Demo's instance only exposes 25
          # usable connections, so they run as two sequential groups: Keycloak first, then Temporal.
          # Each group starts only after the latest completed one-minute bucket shows the per-group
          # headroom recorded by the connection-budget gate; each still retains its own job,
          # execution, and sanitized log evidence.
          require_group_headroom() {
            group="$1"
            server_id=$(jq -er '.server_id' wc124-connection-budget.json)
            usable=$(jq -er '.usable_connections' wc124-connection-budget.json)
            required_headroom=$(jq -er '.required_headroom_per_group' wc124-connection-budget.json)
            # The previous group's connections close when its job finishes, but the metric lags by
            # about two buckets, so this wait is bounded to that lag rather than open-ended.
            for attempt in $(seq 1 18); do
              active=$(az monitor metrics list --resource "$server_id" --metric active_connections \
                --interval PT1M --offset 2m --aggregation Maximum \
                --query "value[0].timeseries[0].data[-1].maximum" --output tsv)
              [[ "$active" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
                echo "Missing or malformed PostgreSQL connection metric: ${active:-<empty>}" >&2; exit 1;
              }
              active=$(jq -n --arg value "$active" '$value | tonumber | ceil')
              headroom=$((usable - active))
              echo "PostgreSQL connections before $group migration group: usable=$usable active(latest 1m)=$active headroom=$headroom required=$required_headroom"
              if [ "$headroom" -ge "$required_headroom" ]; then break; fi
              test "$attempt" != 18 || { echo "Insufficient PostgreSQL connection headroom for $group migration group" >&2; exit 1; }
              sleep 10
            done
            jq \
              --arg group "$group" --argjson active "$active" --argjson headroom "$headroom" \
              --argjson required "$required_headroom" \
              '.groups += [{group: $group, active_connections_latest_1m: $active, headroom: $headroom, required_headroom: $required}]' \
              wc124-vendor-migrations.json > wc124-vendor-migrations.next.json
            mv wc124-vendor-migrations.next.json wc124-vendor-migrations.json
          }
          start_migration() {
            component="$1"
            case "$component" in
              keycloak|temporal) job_name="job-${TARGET_ENVIRONMENT}-${component}-migration" ;;
              *) echo "Unsupported vendor migration component: $component" >&2; exit 1 ;;
            esac
            job_evidence="wc124-${component}-migration-job.json"
            az containerapp job show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job_name" \
              --output json > "$job_evidence"
            test "$(jq -r '.name' "$job_evidence")" = "$job_name"
            jq -e '
              [
                .properties.configuration.secrets[]
                | select(.name == "migration-database" and .keyVaultUrl != null)
              ] as $database_secrets
              | ($database_secrets | length) == 1
                and ($database_secrets[0].keyVaultUrl | test("vault[.]azure[.]net/secrets/[^/]+/[^/]+$"))
            ' "$job_evidence" > /dev/null
            container_name=$(jq -er '.properties.template.containers[0].name' "$job_evidence")
            execution=$(az containerapp job start \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job_name" \
              --query name \
              --output tsv)
            test -n "$execution"
            printf '%s\t%s\t%s\t%s\n' "$component" "$job_name" "$container_name" "$execution" \
              >> wc124-vendor-migrations.started.tsv
          }
          capture_vendor_migration_evidence() {
            az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job_name" \
              --job-execution-name "$execution" \
              --output json > "$execution_evidence"
            az containerapp job logs show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job_name" \
              --execution "$execution" \
              --container "$container_name" \
              --tail 300 \
              --format text > "$console_evidence" 2>&1 || true
          }
          wait_migration() {
            component="$1"; job_name="$2"; container_name="$3"; execution="$4"
            execution_evidence="wc124-${component}-migration-execution.json"
            console_evidence="wc124-${component}-migration.log"
            status=
            for attempt in $(seq 1 240); do
              status=$(az containerapp job execution show \
                --resource-group "$RESOURCE_GROUP" \
                --name "$job_name" \
                --job-execution-name "$execution" \
                --query properties.status \
                --output tsv)
              case "$status" in
                Succeeded)
                  capture_vendor_migration_evidence
                  break
                  ;;
                Failed|Stopped)
                  capture_vendor_migration_evidence
                  cat "$console_evidence" >&2
                  echo "${component} migration failed: $status" >&2
                  exit 1
                  ;;
                Processing|Running) ;;
                # Azure reports Unknown until a fresh execution's replica is scheduled (run 39539976383);
                # tolerate it for the first six polls and fall through to the fatal branch if it persists.
                Unknown) if [ "$attempt" -le 6 ]; then sleep 10; continue; fi ;;&
                *)
                  capture_vendor_migration_evidence
                  cat "$console_evidence" >&2
                  echo "${component} migration returned unknown status: ${status:-<empty>}" >&2
                  exit 1
                  ;;
              esac
              if [ "$attempt" = 240 ]; then
                capture_vendor_migration_evidence
                cat "$console_evidence" >&2
                echo "${component} migration timed out with status: $status" >&2
                exit 1
              fi
              sleep 5
            done
            jq \
              --arg component "$component" \
              --arg job "$job_name" \
              --arg execution "$execution" \
              --arg status "$status" \
              '.executions += [{component: $component, job: $job, execution: $execution, status: $status}]' \
              wc124-vendor-migrations.json > wc124-vendor-migrations.next.json
            mv wc124-vendor-migrations.next.json wc124-vendor-migrations.json
          }
          run_migration_group() {
            group="$1"; shift
            : > wc124-vendor-migrations.started.tsv
            for component in "$@"; do start_migration "$component"; done
            while IFS=$'\t' read -r component job_name container_name execution; do
              wait_migration "$component" "$job_name" "$container_name" "$execution"
            done < wc124-vendor-migrations.started.tsv
          }
          # Group 1 reuses the gate's measurement, which was taken immediately before this step.
          run_migration_group keycloak keycloak
          if [ "$TARGET_ENVIRONMENT" = demo ]; then
            require_group_headroom temporal
            run_migration_group temporal temporal
          fi
          test "$(jq '[.executions[].status == "Succeeded"] | all' wc124-vendor-migrations.json)" = true

      - name: Run additive Billing authority migration through PgBouncer
        if: inputs.apply
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          job_name="job-${TARGET_ENVIRONMENT}-wc124-billing-migration"
          az containerapp job show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$job_name" \
            --output json > wc124-billing-migration-job.json
          test "$(jq -r '.name' wc124-billing-migration-job.json)" = "$job_name"
          jq -e '
            ([.properties.configuration.secrets[] | select(.keyVaultUrl != null)] | length) > 0
            and all(
                .properties.configuration.secrets[];
                (.keyVaultUrl // "") == ""
                or (.keyVaultUrl | test("vault[.]azure[.]net/secrets/[^/]+/[^/]+$"))
              )
          ' wc124-billing-migration-job.json > /dev/null
          execution=$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" \
            --name "$job_name" \
            --query name \
            --output tsv)
          test -n "$execution"
          echo "Billing migration execution: $execution"
          capture_billing_evidence() {
            az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job_name" \
              --job-execution-name "$execution" \
              --output json > wc124-billing-migration-execution.json
            az containerapp job logs show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job_name" \
              --execution "$execution" \
              --container billing-migration \
              --tail 300 \
              --format text > wc124-billing-migration.log 2>&1 || true
          }
          for attempt in $(seq 1 120); do
            status=$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job_name" \
              --job-execution-name "$execution" \
              --query properties.status \
              --output tsv)
            case "$status" in
              Succeeded)
                capture_billing_evidence
                break
                ;;
              Failed|Stopped)
                capture_billing_evidence
                cat wc124-billing-migration.log >&2
                echo "Billing migration failed: $status" >&2
                exit 1
                ;;
              Processing|Running) ;;
              # Azure reports Unknown until a fresh execution's replica is scheduled (run 39539976383);
              # tolerate it for the first six polls and fall through to the fatal branch if it persists.
              Unknown) if [ "$attempt" -le 6 ]; then sleep 10; continue; fi ;;&
              *)
                capture_billing_evidence
                cat wc124-billing-migration.log >&2
                echo "Billing migration returned unknown status: ${status:-<empty>}" >&2
                exit 1
                ;;
            esac
            if [ "$attempt" = 120 ]; then
              capture_billing_evidence
              cat wc124-billing-migration.log >&2
              echo "Billing migration timed out with status: $status" >&2
              exit 1
            fi
            sleep 10
          done

      # The OIDC client assertion expires 5 minutes after login; refresh before
      # the first Log Analytics token is required by Temporal qualification.
      - name: Refresh Azure login before Temporal qualification
        if: inputs.apply && inputs.environment == 'demo'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3 (Node 24)
        with:
          client-id: ${{ steps.foundation.outputs.deployment_client_id }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Qualify exact Temporal startup through PgBouncer
        if: inputs.apply && inputs.environment == 'demo'
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Acquire and cache the Log Analytics token while the OIDC assertion is fresh.
          az account get-access-token --resource https://api.loganalytics.io \
            --query expiresOn --output tsv >/dev/null
          job_name="job-${TARGET_ENVIRONMENT}-temporal-startup"
          az containerapp job show \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --output json > wc124-temporal-startup-job.json
          environment_id=$(jq -er '.properties.environmentId' wc124-temporal-startup-job.json)
          az resource show --ids "$environment_id" --api-version 2024-03-01 \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId \
            --output json > wc124-temporal-log-workspace.json
          workspace_id=$(jq -er 'select(type == "string" and test("^[0-9a-fA-F-]{36}$"))' \
            wc124-temporal-log-workspace.json)
          execution=$(az containerapp job start \
            --name "$job_name" \
            --resource-group "$RESOURCE_GROUP" \
            --query name \
            --output tsv)
          test -n "$execution"
          capture_temporal_startup_evidence() {
            az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --output json > wc124-temporal-startup-execution.json
            az containerapp job logs show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution" \
              --container temporal-startup-qualification \
              --tail 300 \
              --format text > wc124-temporal-startup.log 2>&1 || {
                echo "Temporal console capture failed; see retained diagnostics" >&2
                cat wc124-temporal-startup.log >&2
              }
            az containerapp job logs show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --execution "$execution" \
              --container pool-sampler \
              --tail 300 \
              --format text > wc124-temporal-sampler.log 2>&1 || {
                echo "Sampler console capture failed; see retained diagnostics" >&2
                cat wc124-temporal-sampler.log >&2
              }
          }
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status \
              --output tsv)
            case "$status" in
              Succeeded)
                capture_temporal_startup_evidence
                break
                ;;
              Failed|Stopped)
                capture_temporal_startup_evidence
                cat wc124-temporal-startup.log >&2
                echo "Temporal startup qualification failed: $status" >&2
                exit 1
                ;;
              Processing|Running) ;;
              Unknown) if [ "$attempt" -le 6 ]; then sleep 10; continue; fi ;;&
              *)
                capture_temporal_startup_evidence
                echo "Temporal startup qualification returned unknown status: ${status:-<empty>}" >&2
                exit 1
                ;;
            esac
            test "$attempt" != 60 || {
              capture_temporal_startup_evidence
              echo "Temporal startup qualification timed out with status: $status" >&2
              exit 1
            }
            sleep 10
          done
          sed -n -E 's/^[^ ]+ stdout F ?//p' wc124-temporal-startup.log \
            | grep -F '"schema":"waooaw.wc124-temporal-startup/v1"' \
            | tail -1 > wc124-temporal-startup-result.json
          jq -e '
            .status == "passed"
            and .qualification_seconds >= 60
            and .max_waiting_clients == 0
            and .max_wait_seconds == 0
            and .minimum_postgresql_headroom >= 5
          ' wc124-temporal-startup-result.json > /dev/null
          if grep -Eq 'driver: bad connection|query_wait_timeout|pooler error' wc124-temporal-startup.log; then
            echo "Temporal startup log contains a pool failure" >&2
            exit 1
          fi
          start_time=$(jq -er '.properties.startTime' wc124-temporal-startup-execution.json)
          end_time=$(jq -er '.properties.endTime' wc124-temporal-startup-execution.json)
          end_epoch=$(date -u -d "$end_time" +%s)
          for attempt in $(seq 1 18); do
            az monitor log-analytics query \
              --workspace "$workspace_id" \
              --analytics-query "
                ContainerAppConsoleLogs_CL
                | where TimeGenerated >= datetime($start_time)
                | where ContainerAppName_s == 'ca-${TARGET_ENVIRONMENT}-pgbouncer'
                | summarize timeout_events=countif(
                    TimeGenerated <= datetime($end_time) and Log_s contains 'query_wait_timeout'),
                    latest_log=max(TimeGenerated)
              " \
              --output json > wc124-temporal-timeout-events.json
            timeout_events=$(jq -er 'if type == "array" and length == 1 then .[0].timeout_events
              else error("Expected one Log Analytics result row") end' wc124-temporal-timeout-events.json)
            case "$timeout_events" in ''|*[!0-9]*) echo "Malformed PgBouncer timeout evidence" >&2; exit 1 ;; esac
            test "$timeout_events" = 0 || {
              echo "PgBouncer reported $timeout_events timeout log records during Temporal qualification" >&2
              exit 1
            }
            latest_log=$(jq -er '.[0] | if has("latest_log") and
              (.latest_log == null or (.latest_log | type) == "string") then .latest_log // ""
              else error("Malformed PgBouncer log watermark") end' wc124-temporal-timeout-events.json)
            if [ -n "$latest_log" ]; then
              latest_epoch=$(date -u -d "$latest_log" +%s)
              if [ "$latest_epoch" -ge "$end_epoch" ]; then break; fi
            fi
            test "$attempt" != 18 || {
              echo "PgBouncer logs have not been ingested through the qualification end time" >&2
              exit 1
            }
            sleep 10
          done
          jq \
            --arg execution "$execution" \
            --arg start_time "$start_time" \
            --arg end_time "$end_time" \
            --argjson pool_size 8 \
            --argjson sql_max_conns 1 \
            --argjson query_wait_timeout_events "$timeout_events" \
            '{
              schema: "waooaw.wc124-temporal-pool-evidence/v1",
              execution: $execution,
              observation: {start_time: $start_time, end_time: $end_time},
              temporal_pool_size_per_database: $pool_size,
              sql_max_connections_per_store_per_service: $sql_max_conns,
              qualification_seconds,
              max_waiting_clients,
              max_wait_seconds,
              minimum_postgresql_headroom,
              query_wait_timeout_events: $query_wait_timeout_events,
              status
            }' wc124-temporal-startup-result.json > wc124-temporal-pool-evidence.json

      - name: Verify migration evidence before application activation
        if: inputs.apply
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          test "$(jq -r '.properties.status' wc124-pgbouncer-preflight-execution.json)" = Succeeded
          test "$(jq -r '.properties.status' wc124-billing-migration-execution.json)" = Succeeded
          test "$(jq -r '.status' wc124-reconciliation-authority.json)" = temporary-authority-revoked
          test "$(jq -r '.identity_schema.status' wc124-db-provisioner-result.json)" = passed
          if [ "$TARGET_ENVIRONMENT" = demo ]; then
            expected_components='["keycloak","temporal"]'
            test "$(jq -r '.status' wc124-temporal-pool-evidence.json)" = passed
            test "$(jq -r '.query_wait_timeout_events' wc124-temporal-pool-evidence.json)" = 0
            test "$(jq -r '.qualification_seconds' wc124-temporal-pool-evidence.json)" -ge 60
          else
            expected_components='["keycloak"]'
          fi
          evidence_arguments=(
            --environment "$TARGET_ENVIRONMENT"
            --identity wc124-db-provisioner-result.json
            --identity-execution wc124-db-provisioner-execution.json
            --output wc124-pre-activation-evidence.json
          )
          if [ "$TARGET_ENVIRONMENT" = demo ]; then
            evidence_arguments+=(
              --temporal wc124-temporal-pool-evidence.json
              --temporal-execution wc124-temporal-startup-execution.json
            )
          fi
          python3 scripts/wc124_pre_activation_evidence.py "${evidence_arguments[@]}"
          test "$(jq -r '.status' wc124-pre-activation-evidence.json)" = accepted-for-activation
          jq -e \
            --arg environment "$TARGET_ENVIRONMENT" \
            --argjson expected "$expected_components" \
            '
              .environment == $environment
              and ([.executions[].component] | sort) == ($expected | sort)
              and all(.executions[]; .status == "Succeeded")
            ' wc124-vendor-migrations.json > /dev/null
          jq -n \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg pgbouncer_execution "$(jq -er '.name' wc124-pgbouncer-preflight-execution.json)" \
            --arg billing_execution "$(jq -er '.name' wc124-billing-migration-execution.json)" \
            --arg authority_evidence_sha256 "$(sha256sum wc124-reconciliation-authority.json | cut -d ' ' -f 1)" \
            --arg identity_evidence_sha256 "$(sha256sum wc124-db-provisioner-result.json | cut -d ' ' -f 1)" \
            --arg pre_activation_evidence_sha256 "$(sha256sum wc124-pre-activation-evidence.json | cut -d ' ' -f 1)" \
            --arg vendor_evidence_sha256 "$(sha256sum wc124-vendor-migrations.json | cut -d ' ' -f 1)" \
            --arg billing_evidence_sha256 "$(sha256sum wc124-billing-migration-execution.json | cut -d ' ' -f 1)" \
            --arg temporal_evidence_sha256 "$(
              if [ -f wc124-temporal-pool-evidence.json ]; then
                sha256sum wc124-temporal-pool-evidence.json | cut -d ' ' -f 1
              fi
            )" \
            '{
              schema: "waooaw.wc124-migration-acceptance/v1",
              environment: $environment,
              status: "accepted-for-activation",
              pgbouncer_execution: $pgbouncer_execution,
              billing_execution: $billing_execution,
              evidence_sha256: {
                reconciliation_authority: $authority_evidence_sha256,
                identity_schema: $identity_evidence_sha256,
                pre_activation_gates: $pre_activation_evidence_sha256,
                vendor_migrations: $vendor_evidence_sha256,
                billing_migration: $billing_evidence_sha256,
                temporal_pool: (
                  if $temporal_evidence_sha256 == "" then null else $temporal_evidence_sha256 end
                )
              }
            }' > wc124-migration-acceptance.json

      - name: Activate runtime dependencies before application revisions
        if: inputs.apply
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload
        env:
          ARM_CLIENT_ID: ${{ steps.foundation.outputs.deployment_client_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')
          test "$RELEASE_SHA" = "$latest_main_sha"
          jq '.application_activation_enabled = false | .dependency_activation_enabled = true' \
            workload.auto.tfvars.json > workload.dependencies.tfvars.json
          mv workload.dependencies.tfvars.json workload.auto.tfvars.json

          dependency_targets=(
            "-target=module.workload.azurerm_container_app.auth_redis[0]"
            "-target=module.workload.azurerm_container_app.keycloak[0]"
            "-target=module.workload.azurerm_container_app.identity_edge[0]"
          )
          if [ "$TARGET_ENVIRONMENT" = demo ]; then
            dependency_targets+=(
              "-target=module.workload.azurerm_container_app.temporal[0]"
            )
          fi

          set +e
          terraform plan -detailed-exitcode -input=false -lock-timeout=5m \
            -out=workload-dependencies.tfplan "${dependency_targets[@]}"
          plan_exit_code=$?
          set -e
          case "$plan_exit_code" in
            0|2) ;;
            *) echo "Runtime dependency planning failed with exit code $plan_exit_code" >&2; exit "$plan_exit_code" ;;
          esac
          terraform show -json workload-dependencies.tfplan > workload-dependencies-plan.json
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope workload-dependencies \
            --plan workload-dependencies-plan.json \
            --output workload-dependencies-policy.json

          state_snapshot=$(mktemp)
          current_provenance=$(mktemp)
          trap 'rm -f "$state_snapshot" "$current_provenance"' EXIT
          terraform state pull > "$state_snapshot"
          python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
            --environment "$TARGET_ENVIRONMENT" \
            --release-sha "$RELEASE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scope workload-dependencies \
            --terraform-root "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload" \
            --backend-key "goal006/$TARGET_ENVIRONMENT/workload.tfstate" \
            --plan-json workload-dependencies-plan.json \
            --plan-binary workload-dependencies.tfplan \
            --policy-result workload-dependencies-policy.json \
            --state "$state_snapshot" \
            --output workload-dependencies-provenance.json

          test "$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')" = "$RELEASE_SHA"
          terraform state pull > "$state_snapshot"
          python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
            --environment "$TARGET_ENVIRONMENT" \
            --release-sha "$RELEASE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scope workload-dependencies \
            --terraform-root "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload" \
            --backend-key "goal006/$TARGET_ENVIRONMENT/workload.tfstate" \
            --plan-json workload-dependencies-plan.json \
            --plan-binary workload-dependencies.tfplan \
            --policy-result workload-dependencies-policy.json \
            --state "$state_snapshot" \
            --output "$current_provenance"
          cmp --silent workload-dependencies-provenance.json "$current_provenance"
          terraform apply -input=false -auto-approve workload-dependencies.tfplan 2>&1 \
            | tee workload-dependencies-apply.log

      - name: Require runtime dependency revisions before application activation
        if: inputs.apply
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python3 scripts/goal006_activation_readiness.py \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$TARGET_ENVIRONMENT" \
            --scope dependencies \
            --resume-stopped \
            --timeout-seconds 600 \
            --interval-seconds 15 \
            --output wc124-dependency-readiness.json

      # The realm import overwrites Keycloak's database, but a replica that was already running keeps
      # stale cached realm/client models ("Client not found") while reporting Healthy (run 41014026210).
      - name: Refresh Keycloak replicas after realm import
        if: inputs.apply
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python3 scripts/goal006_keycloak_realm_refresh.py \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$TARGET_ENVIRONMENT" \
            --migration-execution wc124-keycloak-migration-execution.json \
            --timeout-seconds 420 \
            --interval-seconds 10 \
            --output wc124-keycloak-realm-refresh.json

      - name: Plan application activation after migration
        if: inputs.apply
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload
        env:
          ARM_CLIENT_ID: ${{ steps.foundation.outputs.deployment_client_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          jq '.application_activation_enabled = true | .dependency_activation_enabled = true' \
            workload.auto.tfvars.json > workload.active.tfvars.json
          mv workload.active.tfvars.json workload.auto.tfvars.json
          set +e
          terraform plan -detailed-exitcode -input=false -lock-timeout=5m -out=workload-activation.tfplan
          plan_exit_code=$?
          set -e
          case "$plan_exit_code" in
            0|2) ;;
            *) echo "Application activation planning failed with exit code $plan_exit_code" >&2; exit "$plan_exit_code" ;;
          esac
          terraform show -json workload-activation.tfplan > workload-activation-plan.json
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope workload \
            --plan workload-activation-plan.json \
            --output workload-activation-policy.json
          state_snapshot=$(mktemp)
          trap 'rm -f "$state_snapshot"' EXIT
          terraform state pull > "$state_snapshot"
          python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
            --environment "$TARGET_ENVIRONMENT" \
            --release-sha "$RELEASE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scope workload \
            --terraform-root "infrastructure/terraform/phase2/environments/$TARGET_ENVIRONMENT/workload" \
            --backend-key "goal006/$TARGET_ENVIRONMENT/workload.tfstate" \
            --plan-json workload-activation-plan.json \
            --plan-binary workload-activation.tfplan \
            --policy-result workload-activation-policy.json \
            --state "$state_snapshot" \
            --output workload-activation-provenance.json

      - name: Apply application activation
        if: inputs.apply
        id: workload
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload
        env:
          ARM_CLIENT_ID: ${{ steps.foundation.outputs.deployment_client_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')
          test '${{ inputs.release_sha }}' = "$latest_main_sha"
          state_snapshot=$(mktemp)
          current_provenance=$(mktemp)
          trap 'rm -f "$state_snapshot" "$current_provenance"' EXIT
          terraform state pull > "$state_snapshot"
          python3 "$GITHUB_WORKSPACE/scripts/goal006_plan_provenance.py" \
            --environment '${{ inputs.environment }}' \
            --release-sha '${{ inputs.release_sha }}' \
            --release-run-id '${{ inputs.release_run_id }}' \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --scope workload \
            --terraform-root 'infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload' \
            --backend-key 'goal006/${{ inputs.environment }}/workload.tfstate' \
            --plan-json workload-activation-plan.json \
            --plan-binary workload-activation.tfplan \
            --policy-result workload-activation-policy.json \
            --state "$state_snapshot" \
            --output "$current_provenance"
          cmp --silent workload-activation-provenance.json "$current_provenance"
          terraform apply -input=false -auto-approve workload-activation.tfplan 2>&1 \
            | tee workload-activation-apply.log
          web_url=$(terraform output -raw web_url)
          test -n "$web_url"
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"

      - name: Require every activated Container Apps revision to become ready
        if: inputs.apply
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # terraform apply returns once Azure accepts a revision, not once it serves traffic. Run
          # 39428513813 passed while web, business-platform, billing-engine and temporal were all
          # ActivationFailed on their latest revision; this gate fails the deployment instead.
          python3 scripts/goal006_activation_readiness.py \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$TARGET_ENVIRONMENT" \
            --resume-stopped \
            --timeout-seconds 600 \
            --interval-seconds 15 \
            --output wc124-activation-readiness.json

      - name: Retire obsolete Demo revisions after healthy activation
        if: inputs.apply && inputs.environment == 'demo'
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
        run: |
          python3 scripts/goal006_demo_revision_cleanup.py \
            --resource-group "$RESOURCE_GROUP" \
            --apply \
            --output demo-revision-cleanup.json

      - name: Measure PostgreSQL connection budget after activation
        if: inputs.apply
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          POSTGRESQL_SERVER_FQDN: ${{ steps.foundation.outputs.postgresql_server_fqdn }}
        run: |
          set -euo pipefail
          # The pre-migration budget only proves headroom before activation. Re-measure once every
          # runtime holds its steady-state pools so the next deployment's vendor migrations and the
          # provisioner are known to fit inside the same max_connections budget.
          server_name="${POSTGRESQL_SERVER_FQDN%%.*}"
          server_id=$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$server_name" --query id --output tsv)
          param() {
            az postgres flexible-server parameter show --resource-group "$RESOURCE_GROUP" \
              --server-name "$server_name" --name "$1" --query value --output tsv
          }
          max_connections=$(param max_connections)
          reserved=$(( $(param superuser_reserved_connections) + $(param reserved_connections) ))
          usable=$((max_connections - reserved))
          required_headroom=4  # one sequential vendor migration group
          # Readiness passes while startup pools (Temporal auto-setup, Keycloak) are still draining and
          # the latest completed bucket lags by about two minutes, so a single sample would fail a
          # healthy, already-live deployment on a spike. Allow the steady state to settle, bounded.
          for attempt in $(seq 1 18); do
            active=$(az monitor metrics list --resource "$server_id" --metric active_connections \
              --interval PT1M --offset 2m --aggregation Maximum \
              --query "value[0].timeseries[0].data[-1].maximum" --output tsv)
            [[ "$active" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
              echo "Missing or malformed PostgreSQL connection metric: ${active:-<empty>}" >&2; exit 1;
            }
            active=$(jq -n --arg value "$active" '$value | tonumber | ceil')
            headroom=$((usable - active))
            echo "PostgreSQL connections after activation: max=$max_connections reserved=$reserved usable=$usable active(latest 1m)=$active headroom=$headroom required=$required_headroom"
            if [ "$headroom" -ge "$required_headroom" ] || [ "$attempt" = 18 ]; then break; fi
            sleep 10
          done
          jq -n \
            --arg environment "$TARGET_ENVIRONMENT" --arg server "$server_name" \
            --argjson max "$max_connections" --argjson reserved "$reserved" --argjson usable "$usable" \
            --argjson active "$active" --argjson headroom "$headroom" --argjson required "$required_headroom" \
            '{schema: "waooaw.wc124-connection-budget/v1", phase: "post-activation", environment: $environment,
              server: $server, max_connections: $max, reserved_connections: $reserved, usable_connections: $usable,
              active_connections_latest_1m: $active, headroom: $headroom, required_headroom: $required,
              status: (if $headroom >= $required then "passed" else "failed" end)}' \
            | tee wc124-connection-budget-post-activation.json
          test "$headroom" -ge "$required_headroom" \
            || { echo "::error::Steady-state runtimes leave only $headroom PostgreSQL connections; the next migration window needs $required_headroom" >&2; exit 1; }

      - name: Bind Demo Azure-managed TLS certificates
        if: inputs.apply && inputs.environment == 'demo'
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          CONTAINER_APP_ENVIRONMENT: ${{ steps.foundation.outputs.container_app_environment_name }}
        run: |
          bash scripts/goal006_bind_demo_managed_certificates.sh \
            demo \
            "$RESOURCE_GROUP" \
            "$CONTAINER_APP_ENVIRONMENT" \
            | tee demo-managed-certificates.log
          jq -n \
            --argjson web "$(az containerapp show --resource-group "$RESOURCE_GROUP" --name ca-demo-web --query properties.configuration.ingress.customDomains --output json)" \
            --argjson business_platform "$(az containerapp show --resource-group "$RESOURCE_GROUP" --name ca-demo-business-platform --query properties.configuration.ingress.customDomains --output json)" \
            --argjson identity_edge "$(az containerapp show --resource-group "$RESOURCE_GROUP" --name ca-demo-identity-edge --query properties.configuration.ingress.customDomains --output json)" \
            '{
              schema: "waooaw.goal006-managed-tls/v1",
              applications: {
                web: $web,
                business_platform: $business_platform,
                identity_edge: $identity_edge
              }
            }' > demo-managed-certificates.json
          jq -e '
            all(
              .applications | to_entries[];
              ([.value[] | select(.bindingType == "SniEnabled")] | length) > 0
            )
          ' demo-managed-certificates.json > /dev/null

      - name: Preserve workload state after apply failure
        if: failure() && steps.workload.outcome == 'failure'
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/workload
        env:
          ARM_CLIENT_ID: ${{ steps.foundation.outputs.deployment_client_id }}
        run: |
          if ! terraform state list > workload-state-after-apply-failure.txt; then
            echo "Terraform state listing failed after workload apply failure" > workload-state-after-apply-failure.txt
          fi
          echo "::error::Workload apply failed; managed resources were preserved for reconciliation"

      - name: Ensure zero WC-124 database authority on terminal path
        if: always() && inputs.apply && steps.database-transition.outputs.revocation_required == 'true'
        working-directory: infrastructure/terraform/phase2/environments/${{ inputs.environment }}/foundation
        env:
          ARM_CLIENT_ID: ${{ needs.resolve-environment.outputs.control_plane_client_id }}
          DEPLOYMENT_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_JOB_STATUS" != success ]; then
            echo "::notice title=WC-124 post-failure safety cleanup::Deployment already ${DEPLOYMENT_JOB_STATUS}; removing temporary database authority only. This does not continue the deployment."
          fi
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
          export TF_VAR_deployment_client_id
          TF_VAR_deployment_client_id=$(terraform output -raw deployment_client_id)
          terraform plan -input=false -lock-timeout=5m \
            -var="postgresql_password_auth_enabled=true" \
            -var="database_bootstrap_admin_enabled=false" \
            -var="database_provisioner_vault_access_enabled=false" \
            -out=foundation-terminal-authority-removal.tfplan
          terraform show -json foundation-terminal-authority-removal.tfplan \
            > foundation-terminal-authority-removal.json
          python3 "$GITHUB_WORKSPACE/scripts/goal006_tfplan_policy.py" \
            --scope foundation \
            --transition wc124-schema-reconciliation \
            --plan foundation-terminal-authority-removal.json
          terraform apply -input=false -auto-approve foundation-terminal-authority-removal.tfplan
          resource_group="waooaw-${{ inputs.environment }}-rg"
          server_name="psql-waooaw-${{ inputs.environment }}-state"
          provisioner_principal_id=$(az identity show \
            --resource-group "$resource_group" \
            --name "id-waooaw-${{ inputs.environment }}-db-provisioner" \
            --query principalId \
            --output tsv)
          vault_id=$(az keyvault show \
            --resource-group "$resource_group" \
            --name "kv-waooaw-${{ inputs.environment }}" \
            --query id \
            --output tsv)
          bootstrap_admin_count=$(az postgres flexible-server microsoft-entra-admin list \
            --resource-group "$resource_group" \
            --server-name "$server_name" \
            --query "[?principalName == 'id-waooaw-${{ inputs.environment }}-db-bootstrap'] | length(@)" \
            --output tsv)
          provisioner_vault_role_count=$(az role assignment list \
            --assignee-object-id "$provisioner_principal_id" \
            --scope "$vault_id" \
            --query "[?roleDefinitionName == 'Key Vault Secrets Officer'] | length(@)" \
            --output tsv)
          test "$bootstrap_admin_count" = 0
          test "$provisioner_vault_role_count" = 0
          jq -n \
            --arg environment '${{ inputs.environment }}' \
            --argjson bootstrap_admin_count "$bootstrap_admin_count" \
            --argjson provisioner_vault_role_count "$provisioner_vault_role_count" \
            --arg deployment_status "$DEPLOYMENT_JOB_STATUS" \
            '{
              schema: "waooaw.wc124-terminal-authority-cleanup/v1",
              environment: $environment,
              deployment_status: $deployment_status,
              cleanup_mode: (if $deployment_status == "success" then "normal-terminal" else "post-failure-safety" end),
              bootstrap_admin_count: $bootstrap_admin_count,
              provisioner_vault_role_count: $provisioner_vault_role_count,
              status: "zero-authority-verified"
            }' > "$GITHUB_WORKSPACE/wc124-terminal-authority-cleanup.json"

      - name: Delete private credential seeder
        if: always() && steps.credential-inventory.outputs.seeding_required == 'true'
        env:
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
        run: az containerapp job delete --name "$SEEDER_JOB" --resource-group "$RESOURCE_GROUP" --yes --output none

      - name: Delete WC-124 database provisioner
        # Without foundation outputs there is no provisioner identity to target; the terminal
        # authority step removes its Key Vault access from Terraform state instead.
        if: >-
          always() &&
          inputs.apply &&
          steps.foundation.outcome == 'success' &&
          (inputs.environment == 'demo' || inputs.environment == 'uat')
        env:
          DATABASE_PROVISIONER_IDENTITY_ID: ${{ steps.foundation.outputs.database_provisioner_identity_id }}
          KEY_VAULT_ID: ${{ steps.foundation.outputs.key_vault_id }}
          RESOURCE_GROUP: ${{ steps.foundation.outputs.resource_group_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_JOB_STATUS" != success ]; then
            echo "::notice title=WC-124 post-failure safety cleanup::Deployment already ${DEPLOYMENT_JOB_STATUS}; deleting the temporary database provisioner only. This does not continue the deployment."
          fi
          cleanup_failed=0
          principal_id=$(az identity show \
            --ids "$DATABASE_PROVISIONER_IDENTITY_ID" \
            --query principalId \
            --output tsv)
          assignment_name=$(python3 - "$KEY_VAULT_ID" "$principal_id" <<'PY'
          import sys
          import uuid

          print(uuid.uuid5(uuid.NAMESPACE_URL, "|".join(part.lower() for part in sys.argv[1:]) + "|wc124-reconciliation"))
          PY
          )
          assignment_id=$(az role assignment list \
            --assignee-object-id "$principal_id" \
            --scope "$KEY_VAULT_ID" \
            --query "[?name == '$assignment_name'].id | [0]" \
            --output tsv)
          if [ -n "$assignment_id" ] && ! az role assignment delete --ids "$assignment_id"; then
            cleanup_failed=1
          fi
          remaining=$(az role assignment list \
            --assignee-object-id "$principal_id" \
            --scope "$KEY_VAULT_ID" \
            --query "[?name == '$assignment_name'] | length(@)" \
            --output tsv)
          if [ "$remaining" != 0 ]; then
            cleanup_failed=1
          fi
          all_officer_assignments=$(az role assignment list \
            --assignee-object-id "$principal_id" \
            --scope "$KEY_VAULT_ID" \
            --query "[?roleDefinitionName == 'Key Vault Secrets Officer'] | length(@)" \
            --output tsv)
          bootstrap_admin_count=$(az postgres flexible-server microsoft-entra-admin list \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "psql-waooaw-${TARGET_ENVIRONMENT}-state" \
            --query "[?principalName == 'id-waooaw-${TARGET_ENVIRONMENT}-db-bootstrap'] | length(@)" \
            --output tsv)
          if [ "$all_officer_assignments" != 0 ] || [ "$bootstrap_admin_count" != 0 ]; then
            cleanup_failed=1
          fi
          job_name="job-${TARGET_ENVIRONMENT}-wc124-db-provisioner"
          job_id=$(az containerapp job list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name == '$job_name'].id | [0]" \
            --output tsv)
          if [ "$cleanup_failed" = 0 ] && [ -n "$job_id" ] && ! az containerapp job delete \
              --name "$job_name" \
              --resource-group "$RESOURCE_GROUP" \
              --yes \
              --output none; then
            cleanup_failed=1
          fi
          if [ -f wc124-reconciliation-authority.json ]; then
            jq \
              --argjson cleanup_failed "$cleanup_failed" \
              '.status = (if $cleanup_failed == 0 then "temporary-authority-absent" else "cleanup-failed" end)
               | .cleanup = "final-idempotent"
               | .cleanup_failed = ($cleanup_failed != 0)' \
              wc124-reconciliation-authority.json > wc124-reconciliation-authority.cleanup.json
          else
            jq -n \
              --arg assignment_name "$assignment_name" \
              --arg principal_id "$principal_id" \
              --arg scope "$KEY_VAULT_ID" \
              --argjson cleanup_failed "$cleanup_failed" \
              '{
                schema: "waooaw.wc124-reconciliation-authority/v1",
                assignment_name: $assignment_name,
                principal_id: $principal_id,
                scope: $scope,
                ownership: "deterministic-recovery",
                status: (if $cleanup_failed == 0 then "temporary-authority-absent" else "cleanup-failed" end),
                cleanup: "final-idempotent",
                cleanup_failed: ($cleanup_failed != 0)
              }' > wc124-reconciliation-authority.cleanup.json
          fi
          mv wc124-reconciliation-authority.cleanup.json wc124-reconciliation-authority.json
          exit "$cleanup_failed"

      - name: Retain persistent-state lifecycle execution evidence
        if: >-
          always() &&
          inputs.lifecycle_action != 'plan' &&
          hashFiles('wc124-deployment-activation-bundle.json', 'wc124-lifecycle-execution.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: wc124-lifecycle-execution-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            wc124-deployment-activation-bundle.json
            wc124-lifecycle-authorization.json
            wc124-lifecycle-authorization-record.json
            wc124-lifecycle-tuple-digests.json
            wc124-lifecycle-execution.json

      - name: Refresh Azure login for failed Demo reset recovery
        if: >-
          always() && inputs.apply && inputs.environment == 'demo' &&
          (failure() || cancelled()) &&
          contains(fromJSON('["success","failure","cancelled"]'), steps.demo-database-reset.outcome)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3 (Node 24)
        with:
          client-id: ${{ steps.foundation.outputs.deployment_client_id }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Recover Keycloak after interrupted Demo reset
        id: demo-realm-recovery
        if: >-
          always() && inputs.apply && inputs.environment == 'demo' &&
          (failure() || cancelled()) &&
          contains(fromJSON('["success","failure","cancelled"]'), steps.demo-database-reset.outcome)
        run: |
          python3 scripts/goal006_demo_reset_recovery.py \
            --environment demo \
            --migration-execution wc124-keycloak-migration-execution.json \
            --output wc132-demo-reset-recovery.json

      - name: Record Demo maintenance window outcome
        if: always() && inputs.apply && inputs.environment == 'demo' && steps.demo-maintenance.outcome != 'skipped'
        env:
          DEPLOY_STATUS: ${{ job.status }}
          RECOVERY_STATUS: ${{ steps.demo-realm-recovery.outcome }}
        run: |
          if [ -f wc132-demo-maintenance.json ]; then
            echo "[demo-reset] state=DEMO_DATABASE_RESET_MAINTENANCE_ENDED deploy=$DEPLOY_STATUS realm_recovery=${RECOVERY_STATUS:-not-required} time=$(date -u +%FT%TZ)"
            if [ "$DEPLOY_STATUS" != success ]; then
              echo "::error title=DEMO_DATABASE_RESET_RECOVERY_HOLD::Deployment failed; application consumers remain quiesced until a successful deployment"
            fi
          fi

      - name: Upload plans and evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: goal006-${{ inputs.environment }}-${{ inputs.apply && 'apply' || 'plan' }}-${{ inputs.release_run_id }}
          path: |
            registry-release-manifest.json
            bootstrap-role-assignments.json
            cost-control.json

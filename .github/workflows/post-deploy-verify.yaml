name: GOAL-006 Independent Deployment Verification

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release_run_id:
        required: true
        type: number
      release_sha:
        required: true
        type: string
      verification_client_id:
        required: true
        type: string
      web_url:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-verification
    env:
      ARM_CLIENT_ID: ${{ inputs.verification_client_id }}
      ARM_TENANT_ID: 0471534c-1bbe-40ab-ae65-3f721b62582c
      ARM_SUBSCRIPTION_ID: 2ed11839-6a0f-4eaa-bd94-44ca96ff5d84
    steps:
      - name: Enforce trusted caller workflow and ref
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_CALLER_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/deploy-demo.yaml@refs/heads/main
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          test "$CALLER_WORKFLOW_REF" = "$EXPECTED_CALLER_WORKFLOW_REF"
          test "$TARGET_ENVIRONMENT" = "demo"

      - name: Reject stale release before independent verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          latest_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$RELEASE_SHA" = "$latest_main_sha"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Download signed exact-six tuple
        uses: actions/download-artifact@v4
        with:
          pattern: goal006-exact-six-release-*
          path: release-input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Verify tuple and GitHub attestation
        run: |
          manifest=$(find release-input -name registry-release-manifest.json -type f -print -quit)
          test -n "$manifest"
          python scripts/goal006_registry_manifest.py --verify-manifest "$manifest" \
            --expected-source-commit '${{ inputs.release_sha }}' \
            --expected-run-id '${{ inputs.release_run_id }}'
          gh attestation verify "$manifest" --repo "$GITHUB_REPOSITORY"
          cp "$manifest" registry-release-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Azure login with independent OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Verify independent deployment subscription
        run: test "$(az account show --query id -o tsv)" = "$ARM_SUBSCRIPTION_ID"

      - name: Verify signed release and pinned dependency inventory
        run: |
          az containerapp list --resource-group 'waooaw-${{ inputs.environment }}-rg' \
            --query '[].{name:name,image:properties.template.containers[0].image,provisioningState:properties.provisioningState}' \
            -o json > live-inventory.json
          python scripts/goal006_live_inventory.py \
            --environment '${{ inputs.environment }}' \
            --manifest registry-release-manifest.json \
            --inventory live-inventory.json

      - name: Verify active healthy revisions
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          mkdir -p revision-evidence
          for app in constitutional-engine business-platform professional-runtime ai-runtime web billing-engine keycloak identity-edge; do
            az containerapp show \
              --resource-group "waooaw-$TARGET_ENVIRONMENT-rg" \
              --name "ca-$TARGET_ENVIRONMENT-$app" \
              --query '{latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName}' \
              -o json > "revision-evidence/$app-app.json"
            latest_revision=$(jq -r '.latestRevision // empty' "revision-evidence/$app-app.json")
            latest_ready_revision=$(jq -r '.latestReadyRevision // empty' "revision-evidence/$app-app.json")
            test -n "$latest_revision"
            test "$latest_revision" = "$latest_ready_revision"
            az containerapp revision show \
              --resource-group "waooaw-$TARGET_ENVIRONMENT-rg" \
              --name "ca-$TARGET_ENVIRONMENT-$app" \
              --revision "$latest_revision" \
              -o json > "revision-evidence/$app-revision.json"
            jq -e '
              .properties.active == true and
              .properties.provisioningState == "Provisioned" and
              .properties.healthState == "Healthy" and
              ((.properties.runningState | startswith("Running")) or .properties.runningState == "ScaledToZero")
            ' "revision-evidence/$app-revision.json" >/dev/null
          done

      - name: Run internal functional verification
        id: functional
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          execution_name=""
          for attempt in $(seq 1 12); do
            execution_name=$(az containerapp job start \
              --name "job-$TARGET_ENVIRONMENT-deployment-verification" \
              --resource-group "waooaw-$TARGET_ENVIRONMENT-rg" \
              --query name -o tsv 2>/dev/null) && break
            test "$attempt" != 12
            sleep 10
          done
          test -n "$execution_name"
          capture_functional_evidence() {
            az containerapp job execution show \
              --name "job-$TARGET_ENVIRONMENT-deployment-verification" \
              --resource-group "waooaw-$TARGET_ENVIRONMENT-rg" \
              --job-execution-name "$execution_name" \
              --output json > functional-verification.json
            for container in http-probes constitutional-health; do
              az containerapp job logs show \
                --name "job-$TARGET_ENVIRONMENT-deployment-verification" \
                --resource-group "waooaw-$TARGET_ENVIRONMENT-rg" \
                --execution "$execution_name" \
                --container "$container" \
                --tail 200 \
                --format text > "functional-$container.log" 2>&1 || true
            done
          }
          for attempt in $(seq 1 40); do
            az containerapp job execution show \
              --name "job-$TARGET_ENVIRONMENT-deployment-verification" \
              --resource-group "waooaw-$TARGET_ENVIRONMENT-rg" \
              --job-execution-name "$execution_name" > functional-verification.json
            status=$(jq -r '.properties.status' functional-verification.json)
            case "$status" in
              Succeeded)
                capture_functional_evidence
                exit 0
                ;;
              Failed|Stopped)
                capture_functional_evidence
                cat functional-http-probes.log >&2
                cat functional-constitutional-health.log >&2
                echo "Internal Web/BP/Keycloak/CE verification failed with status: $status" >&2
                exit 1
                ;;
            esac
            if [ "$attempt" = 40 ]; then
              capture_functional_evidence
              cat functional-http-probes.log >&2
              cat functional-constitutional-health.log >&2
              echo "Internal Web/BP/Keycloak/CE verification timed out with status: $status" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify returned Web URL binds to the deployed app ingress
        env:
          EXPECTED_WEB_URL: ${{ inputs.web_url }}
        run: |
          live_fqdn=$(az containerapp show --resource-group 'waooaw-${{ inputs.environment }}-rg' \
            --name 'ca-${{ inputs.environment }}-web' --query properties.configuration.ingress.fqdn -o tsv)
          test "$EXPECTED_WEB_URL" = "https://$live_fqdn"
          jq -n \
            --arg environment '${{ inputs.environment }}' \
            --arg release_sha '${{ inputs.release_sha }}' \
            --arg web_url "$EXPECTED_WEB_URL" \
            '{environment: $environment, release_sha: $release_sha, web_url: $web_url, exact_six_verified: true, dependencies_verified: true, functional_verification: true}' \
            > deployment-verification.json

      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal006-${{ inputs.environment }}-independent-verification-${{ inputs.release_run_id }}
          path: |
            registry-release-manifest.json
            live-inventory.json
            functional-verification.json
            functional-http-probes.log
            functional-constitutional-health.log
            revision-evidence/
            deployment-verification.json
          if-no-files-found: warn
          retention-days: 90

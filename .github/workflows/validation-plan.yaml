name: Validation Plan

on:
  workflow_call:
    outputs:
      release_required:
        description: Whether the selected change requires release qualification
        value: ${{ jobs.plan.outputs.release_required }}
      selected_gates:
        description: JSON array of observational Shadow-selected validation gates
        value: ${{ jobs.plan.outputs.selected_gates }}
      execution_gates:
        description: JSON array of gates executed by hosted CI; full inventory in Shadow mode
        value: ${{ jobs.plan.outputs.execution_gates }}
      selective_enforcement:
        description: Whether focused hosted validation is authoritative
        value: ${{ jobs.plan.outputs.selective_enforcement }}
      required_runners:
        description: JSON array of required validation runners
        value: ${{ jobs.plan.outputs.required_runners }}
      service_build_matrix:
        description: JSON array of selected application image build definitions
        value: ${{ jobs.plan.outputs.service_build_matrix }}
      has_service_builds:
        description: Whether at least one application image must be built
        value: ${{ jobs.plan.outputs.has_service_builds }}
      dotnet_test_matrix:
        description: Selected .NET test matrix
        value: ${{ jobs.plan.outputs.dotnet_test_matrix }}
      python_test_matrix:
        description: Selected Python test matrix
        value: ${{ jobs.plan.outputs.python_test_matrix }}
      dotnet_quality_matrix:
        description: Selected .NET quality matrix
        value: ${{ jobs.plan.outputs.dotnet_quality_matrix }}
      python_quality_matrix:
        description: Selected Python quality matrix
        value: ${{ jobs.plan.outputs.python_quality_matrix }}

jobs:
  plan:
    name: WC-102 validation plan
    runs-on: ubuntu-latest
    outputs:
      release_required: ${{ steps.plan.outputs.release_required }}
      selected_gates: ${{ steps.plan.outputs.selected_gates }}
      execution_gates: ${{ steps.plan.outputs.execution_gates }}
      selective_enforcement: ${{ steps.plan.outputs.selective_enforcement }}
      required_runners: ${{ steps.plan.outputs.required_runners }}
      service_build_matrix: ${{ steps.plan.outputs.service_build_matrix }}
      has_service_builds: ${{ steps.plan.outputs.has_service_builds }}
      dotnet_test_matrix: ${{ steps.plan.outputs.dotnet_test_matrix }}
      python_test_matrix: ${{ steps.plan.outputs.python_test_matrix }}
      dotnet_quality_matrix: ${{ steps.plan.outputs.dotnet_quality_matrix }}
      python_quality_matrix: ${{ steps.plan.outputs.python_quality_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation-plan.txt
      - name: Install hash-pinned planning dependency
        run: python -m pip install --require-hashes --no-deps -r requirements-validation-plan.txt
      - name: Resolve exact validation range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha=$PR_BASE_SHA
            head_sha=$PR_HEAD_SHA
          elif [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            head_sha=$PUSH_HEAD_SHA
            base_sha=$(git rev-parse "$head_sha^")
          else
            base_sha=$PUSH_BASE_SHA
            head_sha=$PUSH_HEAD_SHA
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          mkdir -p test-results/wc102
          git diff --name-only --find-renames "$base_sha" "$head_sha" > test-results/wc102/changed-files.txt
          git diff --name-status --find-renames "$base_sha" "$head_sha" > test-results/wc102/changed-files.status
      - name: Record validation control-plane evidence
        run: |
          mkdir -p "$RUNNER_TEMP/control-plane-evidence"
          jq -n \
            --arg base_sha '${{ steps.range.outputs.base_sha }}' \
            --arg head_sha '${{ steps.range.outputs.head_sha }}' \
            --arg python_version "$(python --version 2>&1)" \
            --arg dependency_sha256 "$(sha256sum requirements-validation-plan.txt | cut -d' ' -f1)" \
            '{schema:"waooaw.validation-control-plane/v1",
              base_sha:$base_sha,head_sha:$head_sha,
              executor:"github-hosted-python",
              python_version:$python_version,
              dependency_manifest:"requirements-validation-plan.txt",
              dependency_manifest_sha256:$dependency_sha256}' \
            > "$RUNNER_TEMP/control-plane-evidence/validation-plan.json"
      - name: Compute Shadow selection and validate changed ledgers
        id: plan
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/validation_policy.py \
            --policy validation/engineering-validation.yaml \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$EVENT_NAME" \
            --changed-file-list test-results/wc102/changed-files.status \
            --output test-results/wc102/change-impact.json \
            > /dev/null
          python scripts/validation_control/orchestrator.py \
            --selection test-results/wc102/change-impact.json \
            --mode focused --head "$HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-focused" \
            --output test-results/wc102/focused-plan.json \
            > /dev/null
          python scripts/validation_control/orchestrator.py \
            --selection test-results/wc102/change-impact.json \
            --mode qualification --head "$HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-qualification" \
            --all-gates \
            --output test-results/wc102/qualification-plan.json \
            > /dev/null
          python scripts/validation_control/shadow.py plan \
            --selection test-results/wc102/change-impact.json \
            --output test-results/wc102/hosted-execution-plan.json \
            > /dev/null
          python scripts/validation_control/hosted_policy.py \
            --repository "$GITHUB_WORKSPACE" \
            --output test-results/wc102/hosted-policy.json \
            > /dev/null
          python scripts/validate_requirement_ledger.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --changed-file-list test-results/wc102/changed-files.txt
          release_required=$(jq -r '.release_required' test-results/wc102/hosted-execution-plan.json)
          {
            echo "release_required=$release_required"
            echo "selected_gates=$(jq -c '.selected_gates' test-results/wc102/change-impact.json)"
            echo "execution_gates=$(jq -c '.execution_gates' test-results/wc102/hosted-execution-plan.json)"
            echo "selective_enforcement=$(jq -r '.selective_enforcement' test-results/wc102/hosted-execution-plan.json)"
            echo "required_runners=$(jq -c '.required_runners' test-results/wc102/hosted-execution-plan.json)"
            echo "service_build_matrix=$(jq -c '.service_build_matrix' test-results/wc102/hosted-execution-plan.json)"
            echo "has_service_builds=$(jq -r '.service_build_matrix | length > 0' test-results/wc102/hosted-execution-plan.json)"
            echo "dotnet_test_matrix=$(jq -c '.dotnet_test_matrix' test-results/wc102/hosted-execution-plan.json)"
            echo "python_test_matrix=$(jq -c '.python_test_matrix' test-results/wc102/hosted-execution-plan.json)"
            echo "dotnet_quality_matrix=$(jq -c '.dotnet_quality_matrix' test-results/wc102/hosted-execution-plan.json)"
            echo "python_quality_matrix=$(jq -c '.python_quality_matrix' test-results/wc102/hosted-execution-plan.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Retain Shadow selection and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wc102-validation-plan-${{ github.run_id }}
          path: |
            test-results/wc102/change-impact.json
            test-results/wc102/changed-files.txt
            test-results/wc102/changed-files.status
            test-results/wc102/focused-plan.json
            test-results/wc102/qualification-plan.json
            test-results/wc102/hosted-execution-plan.json
            test-results/wc102/hosted-policy.json
            ${{ runner.temp }}/control-plane-evidence/validation-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain complete catalog execution plan
        uses: actions/upload-artifact@v4
        with:
          name: wc104-qualification-plan-${{ github.run_id }}
          path: test-results/wc102/qualification-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain hosted Shadow plan
        uses: actions/upload-artifact@v4
        with:
          name: wc109-shadow-plan-${{ github.run_id }}
          path: |
            test-results/wc102/change-impact.json
            test-results/wc102/hosted-execution-plan.json
            test-results/wc102/hosted-policy.json
          if-no-files-found: error
          retention-days: 90

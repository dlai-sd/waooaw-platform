services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: waooaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: waooaw
    volumes:
      - ./infrastructure/postgres/init/01-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ./infrastructure/postgres/init/02-users-and-permissions.sh:/docker-entrypoint-initdb.d/02-users-and-permissions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waooaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: waooaw
      DB_USER: waooaw
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LISTEN_PORT: 5433
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5433 -U waooaw"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:82c5b7a110456dbd42b86ea572e728878549954cc8bd03cd65410d75328095d2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      DEV_TEST_PASSWORD: ${DEV_TEST_PASSWORD:?DEV_TEST_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/waooaw
      KC_DB_USERNAME: waooaw
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_DB_SCHEMA: keycloak
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 15

  identity-edge:
    image: docker.io/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    environment:
      KEYCLOAK_REALM: waooaw
      KEYCLOAK_UPSTREAM: keycloak:8080
      WAOOAW_ENVIRONMENT: release
    volumes:
      - ./infrastructure/identity-edge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz | grep -q healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: waooaw
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address \"$$(hostname -i | awk '{print $$1}'):7233\" cluster health"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  constitutional-engine:
    build:
      context: .
      dockerfile: src/constitutional-engine/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      ConnectionStrings__DefaultConnection: Host=pgbouncer;Port=5433;Database=waooaw;Username=constitutional_app;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GRPC_PORT: "5002"
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:5002"]
      interval: 10s
      timeout: 3s
      retries: 5

  business-platform:
    build:
      context: .
      dockerfile: src/business-platform/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      ConnectionStrings__DefaultConnection: Host=pgbouncer;Port=5433;Database=waooaw;Username=business_app;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ConstitutionalEngine__Address: http://constitutional-engine:5002
      Temporal__Host: temporal:7233
      Keycloak__Authority: http://keycloak:8080/realms/waooaw
      Keycloak__Audience: waooaw-platform
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      constitutional-engine:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5001/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  professional-runtime:
    build:
      context: .
      dockerfile: src/professional-runtime/Dockerfile
    environment:
      ENVIRONMENT: release
      DATABASE_URL: postgresql+asyncpg://runtime_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:5433/waooaw
      CONSTITUTIONAL_ENGINE_ADDRESS: constitutional-engine:5002
      AI_RUNTIME_URL: http://ai-runtime:5004
      BUSINESS_PLATFORM_URL: http://business-platform:5001
      TEMPORAL_ADDRESS: temporal:7233
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/waooaw/protocol/openid-connect/certs
    depends_on:
      constitutional-engine:
        condition: service_healthy
      business-platform:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-runtime:
    build:
      context: .
      dockerfile: src/ai-runtime/Dockerfile
    environment:
      ENVIRONMENT: release
      DATABASE_URL: postgresql+asyncpg://runtime_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:5433/waooaw
      CONSTITUTIONAL_ENGINE_ADDRESS: constitutional-engine:5002
      BUSINESS_PLATFORM_URL: http://business-platform:5001
    depends_on:
      constitutional-engine:
        condition: service_healthy
      business-platform:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  billing-engine:
    build:
      context: .
      dockerfile: src/billing-engine/Dockerfile
    environment:
      ENVIRONMENT: release
      DATABASE_URL: postgresql+asyncpg://wbe_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:5433/waooaw
      REDIS_URL: redis://redis:6379/0
      OPS_AUTH_TOKEN: ${WBE_OPS_AUTH_TOKEN:?WBE_OPS_AUTH_TOKEN is required}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID is required}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET is required}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
      CONSTITUTIONAL_ENGINE_ADDRESS: constitutional-engine:5002
      BILLING_CONTRACT_ID: ${BILLING_CONTRACT_ID:?BILLING_CONTRACT_ID is required}
      BILLING_DECISION_SPACE_VERSION: ${BILLING_DECISION_SPACE_VERSION:-1}
    depends_on:
      constitutional-engine:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8140/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      WAOOAW_API_URL: http://business-platform:5001
      WAOOAW_KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      business-platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
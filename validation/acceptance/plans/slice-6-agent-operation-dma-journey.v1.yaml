schema: waooaw.journey-test-plan/v1
journey_id: slice-6-agent-operation-dma-journey
version: 1
status: ACCEPTED
architecture: architecture/reference/acceptance/customer-journey-acceptance-architecture.md
decisions: [ADR-054, ADR-055]
agent_under_test: digital-marketing-agent
customers:
  A: actor
verdicts: [PASS, FAIL, BLOCKED-BY-FLAG, NOT-COVERED, NOT-WITNESSED, ENV-UNAVAILABLE, FLAKY]
depth_levels:
  L1: rendered
  L2: acted_on
  L3: state_changed_confirmed_by_W2
  L4: evidence_recorded_visible_by_W2
  L5: declared_failure_path_correct

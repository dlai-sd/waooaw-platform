        path: infrastructure/deployment-stacks/goal006-runner/bootstrap-manifest.json
        sha256: 5234324f715ad2da53195fbe7125d5683ff6fde3e3b39311758f0890bc3ebb93
      classification: prerequisite_exit_contract_not_live_proof


      required_exit_contract:
        - exact environment OIDC subject and audience proven
        - private runner activation and ephemeral cleanup proven
        - isolated backend key ownership and locking proven
        - private backend access and public fallback denial proven
        - cross-environment identity/state denial proven
        - import map and no duplicate resource creation proven
        - drift and reviewed-plan retention proven
        - partial-apply recovery hold and roll-forward proven
        - separate Demo and UAT state Storage accounts proven before UAT qualification
      dependency_rule: PST_WC04_cannot_start_until_all_PST_WC09A_oracles_pass
    rationale: Live ownership cannot be inferred from repository manifests, but the Work Component expressly permits a bounded prerequisite delivery; accepting its exact exit contract resolves the design input without claiming evidence exists.
    source_constraints:

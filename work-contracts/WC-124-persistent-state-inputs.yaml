      - ADR-047
    acceptance_statement: INST-009 and INST-007 accept PST-WC09A as the mandatory prerequisite and do not accept current live ownership.
    rollback_stop_condition: Any failed/absent exit oracle blocks PST-WC04; no public fallback, shared state account for UAT qualification, or duplicate creation is permitted.

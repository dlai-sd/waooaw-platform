items:
  - id: CB-020-01
    subject: PostgreSQL capacity and availability
    status: RESOLVED
    deciding_owners: [INST-009, INST-006]
    selected_value:
      demo:
        sku: B_Standard_B1ms
        storage_gib: 32
        storage_autogrow: disabled
        availability: single_zone_no_ha
        postgresql_max_connections: 40
      uat:
        sku: B_Standard_B1ms
        storage_gib: 32
        storage_autogrow: disabled
        availability: single_zone_no_ha
        postgresql_max_connections: 100
      common:
        postgresql_major: 16
        backup_retention_days: 35
        private_tls_only: true
        geo_redundant_backup: false
        workload_destroy_protection: true
    rationale: >-
      B1ms is the lowest accepted burstable posture; fixed 32 GiB prevents
      unbounded storage spend, while no HA stays inside the Demo/UAT low-cost
      boundary. Recovery is supplied by the accepted backup/PITR contract.
    source_constraints:
      - Work Component §5.1, §7.1 and §12
      - Environment contract §3 and §3.1
      - Production and public/direct routes remain unchanged/prohibited
    acceptance_statement: INST-009 and INST-006 accept these exact Demo/UAT foundation inputs.
    rollback_stop_condition: >-
      Stop before plan if the provider rejects the SKU/storage/posture, predicted
      aggregate connections exceed 80%, or monthly cost exceeds item CB-020-02;
      return to the owners without substituting another SKU or enabling HA/autogrow.
    package_evidence:
      type: owner_decision
      oracle: Terraform policy must match every selected field and show no Production delta.

  - id: CB-020-02
    subject: Monthly estimate and reserve
    status: RESOLVED
    deciding_owners: [INST-009]
    selected_value:
      currency: INR
      tax_basis: before_GST
      demo_sleeping_estimate_monthly: 1100
      uat_sleeping_estimate_monthly: 1600
      combined_sleeping_estimate_monthly: 2700
      owner_approved_monthly_reserve: 3200
      hard_monthly_apply_stop: 10000
      estimate_includes: [storage, backup, private_dns, retained_telemetry, networking_control_plane]
    rationale: >-
      The exact estimates remain inside the accepted INR 350-1,600 per-environment
      range and the INR 700-3,200 combined range; the reserve equals, but does not
      exceed, the accepted combined ceiling and remains well below FA-052.
    source_constraints:
      - Environment contract §3.1 Cost boundary
      - Work Component §12 and §20
    acceptance_statement: INST-009 accepts INR 3,200/month before GST as the WC-124 owner reserve.
    rollback_stop_condition: >-
      Any plan above an environment estimate requires recorded variance review;
      any combined sleeping forecast above INR 3,200 or active monthly forecast
      above INR 10,000 stops before provider access.
    package_evidence:
      type: owner_decision_plus_future_plan_inventory
      oracle: Plan records each cost class and compares exact totals to both thresholds.


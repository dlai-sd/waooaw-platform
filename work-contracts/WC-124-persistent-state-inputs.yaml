      generated_per_cutover_fields: [source_revision_digest, source_volume_id, fence_timestamp, source_watermark, target_watermark, schema_digest, reconciliation_digest, rollback_point]
    rationale: All datasets are preserved and reconciled; no synthetic discard is needed or authorized, so Founder discard authority is not consumed.

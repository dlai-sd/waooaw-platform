    acceptance_statement: INST-006 accepts the fixture schema, deterministic generation, and exact recovery thresholds for both environments.
    rollback_stop_condition: Stop on non-synthetic/identifiable Demo data, stale backup, source route, RPO/RTO breach, invariant mismatch, or cleanup before evidence retention.
    package_evidence:

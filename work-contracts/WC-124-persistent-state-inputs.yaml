  - id: CB-020-06
    subject: Entra bootstrap and generated credential handoff
    status: RESOLVED
    deciding_owners: [INST-006, INST-007]
    selected_value:
      demo_entra_bootstrap_identity: id-waooaw-demo-db-bootstrap
      uat_entra_bootstrap_identity: id-waooaw-uat-db-bootstrap
      transition: [entra_only_plan_a, bootstrap_transaction, reviewed_plan_b, handoff, bootstrap_revocation]
      allowed_bootstrap_actions: [create_databases, create_nologin_owners, create_non_admin_roles, grant_accepted_rights, emit_secret_version_metadata]
      generated_login_roles:
        - keycloak_runtime
        - temporal_runtime_demo_only
        - ce_migrator
        - ce_runtime
        - bp_migrator
        - bp_runtime
        - pr_migrator
        - pr_runtime
        - air_migrator
        - air_runtime
        - billing_migrator
        - billing_runtime
        - web_session_migrator
        - web_session_app
        - pgbouncer_auth
        - recovery_verifier_ephemeral
      handoff:
        value_transport: in_memory_no_echo
        stored_result: environment_local_key_vault_secret_version
        evidence_fields: [environment, role, logical_secret_id, vault_name, version_id, grant_digest, created_at]
        forbidden_fields: [password, connection_string, token, private_key]
        bootstrap_access_removed_before: migration_or_workload_activation
    rationale: Logical managed-identity names are exact implementation inputs; provider object IDs and secret version IDs are generated evidence, not values an owner can fabricate before creation.
    source_constraints:
      - Work Component §7.2
      - ADR-014 and environment contract §5.1
    acceptance_statement: INST-006 and INST-007 accept the exact identities, role inventory, no-echo handoff, and revocation point.
    rollback_stop_condition: Stop on password authentication before Plan A acceptance, plaintext emission, shared credential, missing version metadata, or surviving bootstrap access.
    package_evidence:
      type: generated_handoff_contract
      oracle: Plan A/Plan B negative tests and metadata-only handoff ledger must pass.

  - id: CB-020-07
    subject: Billing Redis cutover and initial authority state
    status: RESOLVED
    deciding_owners: [INST-006, INST-007]
    selected_value:
      durable_authority: postgresql
      redis_permitted_use: reconstructible_cache_or_bounded_lease_only
      cutover_mapping:
        redis_halt_present: import_append_only_halt_as_ACTIVE_with_source_digest
        redis_halt_absent_and_audit_complete: create_UNHALTED_genesis_after_reconciliation
        redis_unavailable_missing_or_conflicting: create_RECONCILIATION_REQUIRED_and_block_writes
      initial_post_cutover_authority_state: RECONCILIATION_REQUIRED
      required_reconciliation:
        compare: [wallet_balances, reservations, payments, outcomes, halt_history, release_history, audit_watermark]
        discrepancy_threshold_paise: 1
        success_transition: UNHALTED_or_preserved_ACTIVE_halt
        uncertainty_transition: RECONCILIATION_REQUIRED
      source_redis_disposition: retained_read_only_until_PST_WC11_acceptance
    rationale: Starting fail-closed prevents Redis absence from becoming an unhalt decision and preserves every existing halt until durable reconciliation establishes the exact state.
    source_constraints:
      - Work Component §8 and ADR-034
      - No destructive Redis disposition before accepted recovery/rollback evidence
    acceptance_statement: INST-006 and INST-007 accept RECONCILIATION_REQUIRED as the only safe initial state.
    rollback_stop_condition: Stop consequential writes on missing/conflicting source data, digest mismatch, discrepancy above one paise, or incomplete halt/release history.
    package_evidence:
      type: owner_state_machine_decision
      oracle: Redis-loss, restart, one-paise boundary, and append-only release tests pass.

  - id: CB-020-08
    subject: Migration, compatibility, lease, restart, and activation timing
    status: RESOLVED
    deciding_owners: [INST-006, INST-009]
    selected_value:
      activation_order: [postgresql, role_rls_backup_watermarks, pgbouncer, expand_only_migrations, previous_release_compatibility, dependencies, exact_seven, reconciliation, verification, traffic]
      migration_order: [keycloak, demo_temporal, constitutional_engine, business_platform, professional_runtime, ai_runtime, billing, web_sessions]
      previous_release_compatibility_window_hours: 24
      prior_revision_retention: "24 hours and through the active environment lease, whichever is later"
      sleep_lease_hours: 24
      automatic_restart_reconciliation_interval_minutes: 5
      activation_timeout_minutes: 20
      retry_policy: {maximum_attempts_per_step: 3, backoff_seconds: [15, 30, 60]}
    rationale: The values use the upper accepted activation target, the accepted minimum prior-revision rollback window, and a bounded daily sleep lease with prompt restart detection.
    source_constraints:
      - Work Component §10, §11 and §19
      - Migrations are additive and previous-release readable
    acceptance_statement: INST-006 and INST-009 accept this exact order and timing set.
    rollback_stop_condition: Timeout, stale/expired lease, exhausted retry, migration disagreement, or previous-release incompatibility leaves traffic zero and enters a hold.
    package_evidence:
      type: owner_timing_decision
      oracle: Docker clock-controlled sequencing, interruption, lease, and timeout tests pass.


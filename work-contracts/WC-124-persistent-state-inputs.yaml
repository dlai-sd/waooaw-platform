        version: "1.22"
        current_digest: sha256:e8162131a43c54cd0ac7941e66eaaa802c5e5a49036f41b41260b70b290feea9
        accepted_reference: docker.io/pgbouncer/pgbouncer@sha256:e8162131a43c54cd0ac7941e66eaaa802c5e5a49036f41b41260b70b290feea9
        linux_amd64_manifest: sha256:9270fb71b4728abb2db605aa46ab406aba567e1977eb9f0909f3e65f57b2d38e
        decision: founder_authorized_read_only_registry_manifest_pin
      pool_mode: transaction
      min_replicas_outside_active_lease: 0

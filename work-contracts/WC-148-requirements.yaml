  - <<: *defaults
    requirement_id: WC148-R001
    source: WC-148 Canonical Requirement Index, R001
    observable_outcome: The registry schema holds category, agent type, test settings and credential versions with at most one active version per provider, and seeded rows start with no credential.
    test_path_or_plan: tests/business-platform.Tests ProviderCredentialSchemaTests against Postgres; tests/pipeline/test_wc124_db_provisioner.py.

  - <<: *defaults
    requirement_id: WC148-R002
    source: WC-148 Canonical Requirement Index, R002
    observable_outcome: Only the Founder with fresh step-up can test or change credentials, and no response, log or error contains a secret value.
    test_path_or_plan: tests/business-platform.Tests ProviderCredentialAdminControllerTests.

  - <<: *defaults
    requirement_id: WC148-R003
    source: WC-148 Canonical Requirement Index, R003
    observable_outcome: Test returns a sanitized outcome after one SSRF-limited call; Confirm re-tests and writes only on a pass or an explicit acknowledgement.
    test_path_or_plan: tests/business-platform.Tests ProviderCredentialTesterTests, ProviderCredentialAdminServiceTests.

  - <<: *defaults
    requirement_id: WC148-R004
    source: WC-148 Canonical Requirement Index, R004
    observable_outcome: Confirm writes a vault secret version and records one active version; rollback re-activates a recorded version without the value.
    test_path_or_plan: tests/business-platform.Tests ProviderCredentialAdminServiceTests, ProviderCredentialSchemaTests.

  - <<: *defaults
    requirement_id: WC148-R005
    source: WC-148 Canonical Requirement Index, R005
    observable_outcome: The AI runtime resolver uses a new or rolled-back version without restart and the Sarvam dispatch function uses it, proven with a stand-in registry and vault; no running service consumes a saved key until the follow-up contract.
    test_path_or_plan: tests/ai-runtime/test_provider_credential_resolver.py.

  - <<: *defaults

      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    evidence_location: test-results/wc120/CE-FIT-04/

  - id: CE-FIT-05
    stories: [CSA-CEWA-005, CSA-CEWA-006]
    requirements: [WC120-R005, WC120-R006, WC120-R024, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, repeat-question corpus row.
    oracle: The approved corpus detects questions that repeat current confirmed facts and reports each violation.
    negative_or_boundary_oracle: Known confirmed facts are not re-asked as unknown; inference is not treated as confirmation.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit05RepeatQuestionCorpusTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit05RepeatQuestionCorpusTests.ApprovedCorpus_ReportsRepeatedConfirmedFacts_WithoutPromotingInference
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit05RepeatQuestionCorpusTests.ApprovedCorpus_ReportsRepeatedConfirmedFacts_WithoutPromotingInference"
      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    evidence_location: test-results/wc120/CE-FIT-05/

  - id: CE-FIT-06
    stories: [CSA-CEWA-005]
    requirements: [WC120-R005, WC120-R024, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, material-conclusion row.
    oracle: Material conversations contain required conclusion fields or a typed reason indicating continuation.
    negative_or_boundary_oracle: An incomplete interaction cannot be represented as concluded or successful.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit06ConclusionContractTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit06ConclusionContractTests.MaterialConversation_RequiresConclusionFieldsOrTypedContinuation_AndRejectsFalseSuccess
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit06ConclusionContractTests.MaterialConversation_RequiresConclusionFieldsOrTypedContinuation_AndRejectsFalseSuccess"
      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    evidence_location: test-results/wc120/CE-FIT-06/

  - id: CE-FIT-07
    stories: [CSA-CEWA-003, CSA-CEWA-010, CSA-CEWA-014]
    requirements: [WC120-R004, WC120-R010, WC120-R014, WC120-R024, WC120-R039, WC120-R041, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, independent-state-dimensions row.
    oracle: Acceptance, provider delivery/read, professional execution, customer decision, and constitutional evidence transition independently.
    negative_or_boundary_oracle: A transport observation cannot imply execution completion, customer decision, or CE evidence.
    data_control_oracle: Delivery observations are immutable payload-minimized owner facts, deterministically rebuild the projection after duplicate/reordered/contradictory callbacks and restore, and obey relationship-closure-plus-seven-year retention without hold reactivating operational use.
    platform_slo_oracle: Eligible canonical outbound work reaches first provider-attempt state at p95 <=30 seconds and p99 <=60 seconds over rolling 15 minutes, no eligible queue item exceeds 120 seconds, and every unknown provider outcome becomes durable terminal or explicitly UNRESOLVED within 15 minutes without duplicate dispatch.
    customer_state_oracle: Accepted, delivered, read, executing, decided, evidenced, blocked, and unavailable remain separately labelled and projected.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit07IndependentStateTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit07IndependentStateTests.TransportExecutionDecisionAndEvidence_TransitionIndependently_WithoutSyntheticSuccess
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit07IndependentStateTests.TransportExecutionDecisionAndEvidence_TransitionIndependently_WithoutSyntheticSuccess"
      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    evidence_location: test-results/wc120/CE-FIT-07/

  - id: CE-FIT-08
    stories: [CSA-CEWA-003, CSA-CEWA-007, CSA-CEWA-010, CSA-CEWA-012]
    requirements: [WC120-R004, WC120-R007, WC120-R010, WC120-R012, WC120-R024, WC120-R039, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, concurrent protected-intent row.
    oracle: The same protected intent submitted concurrently across Web and WhatsApp commits at most once.
    negative_or_boundary_oracle: Idempotent replay returns the prior outcome; divergent key reuse or a race creates no second mutation.
    data_control_oracle: A 256-way race yields one logical effect and unique canonical sequences; crash at each inbox/outbox commit boundary, 60-second lease loss, 20-second heartbeat, takeover, and attempt-12 poison preserve replay identity, create no duplicate effect, and never silently discard.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit08ConcurrentIntentTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit08ConcurrentIntentTests.ConcurrentWebAndWhatsAppIntent_CommitsOnce_ReplaysPriorOutcome_AndRejectsDivergentReuse
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit08ConcurrentIntentTests.ConcurrentWebAndWhatsAppIntent_CommitsOnce_ReplaysPriorOutcome_AndRejectsDivergentReuse"
      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    supporting_existing_regression:
      node: Waooaw.BusinessPlatform.Tests.ConversationServiceTests.Send_ReplaysSameKeyAndHashWithoutDuplicateMutationOrDispatch
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationServiceTests.Send_ReplaysSameKeyAndHashWithoutDuplicateMutationOrDispatch"
      coverage: Same-channel replay only; it does not prove the concurrent cross-channel oracle.
    evidence_location: test-results/wc120/CE-FIT-08/

  - id: CE-FIT-09
    stories: [CSA-CEWA-009, CSA-CEWA-010]

data_architect_profile:
  source: WC-120 Section 2.3
  status: DATA_OWNER_VALUES_FIXED_EXTERNAL_ACCEPTANCES_EXPLICIT
  canonical_sequence:
    scope: [environment, tenant, relationship, conversation]
    allocator: SAME_TRANSACTION_COMPARE_AND_SWAP_OR_ROW_LOCK
    unique_key: [environment, tenant, relationship, conversation, sequence]
    concurrency_oracle: 256
    provider_time_orders_canonical_history: false
  inbox_outbox:
    ordering_key: [environment, tenant, relationship, owner, aggregate_id, sequence]
    lease: PT60S
    heartbeat: PT20S
    retry_initial: PT1S
    retry_cap: PT5M
    retry_formula: MIN_2_POWER_ATTEMPT_MINUS_1_SECONDS_300_SECONDS
    retry_jitter: NONE
    maximum_attempts: 12
    poison_disposition: BLOCKED
    silent_discard: false
  idempotency:
    canonical_json: RFC_8785_JCS_SHA_256
    authenticated_or_binary_payload: SHA_256_EXACT_BYTES
    unresolved_expiry: NEVER
    terminal_tombstone: P30D
    divergent_digest: CONFLICT_ZERO_ADDITIONAL_EFFECT
  tenant_isolation:
    context: TRANSACTION_LOCAL_SERVER_DERIVED
    row_level_security: ENABLE_AND_FORCE
    runtime_roles: NON_OWNER_NOBYPASSRLS
    keys_and_references: ENVIRONMENT_AND_TENANT_COMPLETE
    migration_role: TIME_BOUNDED_AUDITED_SCHEMA_ONLY_NO_RUNTIME_TRAFFIC
  lineage:
    correction: SAME_OWNER_ACYCLIC_APPEND_ONLY_COMPARE_AND_SWAP
    summary_sources: EXACT_SOURCE_IDS_AND_DIGESTS_OR_CANONICAL_SEQUENCE_INTERVAL
    derivation_versions: [contract, model, policy]
    invalidation: [source_correction, source_erasure, source_expiry, incompatible_derivation_version]
    invalid_before_current_read: true
  lifecycle:
    inbound_claim_metadata_and_tombstone: TERMINAL_OUTCOME_PLUS_P30D_UNRESOLVED_NEVER_EXPIRES
    authenticated_raw_provider_body: DELETE_WITHIN_PT24H_AFTER_DURABLE_NORMALIZATION_OR_REJECTION
    delivery_observation_and_opt_in_template_evidence: RELATIONSHIP_CLOSURE_PLUS_P7Y
    accepted_customer_projection_and_derivatives: RELATIONSHIP_CLOSURE_PLUS_P90D
    terminal_quarantine_payload_and_derivatives: DELETE_WITHIN_PT24H
    dead_letter: PAYLOAD_PROHIBITED_TERMINAL_OUTCOME_PLUS_P30D
    generated_export: DELETE_WITHIN_PT24H_OR_IMMEDIATELY_AFTER_VERIFIED_REVOCATION
    protected_diagnostic: ABSENT_UNLESS_AUTHORIZED_DELETE_WITHIN_P7D
    legal_hold: SUSPEND_ERASURE_NEVER_REACTIVATE_OPERATIONAL_USE
    release_erasure_queue_start: PT24H
    local_erasure_completion: PT72H
  recovery_targets:
    Demo: {rpo: PT24H, maximum_data_loss: PT24H, rto: PT8H}
    UAT: {rpo: PT4H, maximum_data_loss: PT4H, rto: PT4H}
    Production: {rpo: PT15M, maximum_data_loss: PT15M, rto: PT2H}
    acceptance: FOUNDER_REQUIRED
  migration:
    batch_maximum_rows: 1000
    order: OWNER_PRIMARY_KEY_ASCENDING
    checkpoint: EACH_BATCH
    backfill: RESUMABLE_IDEMPOTENT
    old_reader_minimum_window: P7D
    zero_old_reader_before_contraction: PT24H
    destructive_down_migration: PROHIBITED
  external_acceptances:
    lifecycle_legal_basis_and_hold_authority: LEGAL
    material_lifecycle_and_recovery_consequence: FOUNDER
    provider_deletion_capability: PROVIDER_CONTRACT_OWNER
    operation_schema_store_crosswalk: work-contracts/WC-120-operation-schema-owner-compatibility-crosswalk.md

selection_rule: >-
  Every listed planned selector is an expected-fail pre-implementation selector: its named
  test does not exist in the repository at this review point and no PASS is claimed. A selector
  becomes qualifying only when the exact node exists, directly proves the complete positive
  and boundary oracle, passes on the bound candidate, and deposits its result at the row's
  evidence location. Supporting existing regressions do not independently satisfy a CE-FIT row.

candidate_manifest: test-results/wc120/candidate-manifest.json
candidate_binding:
  required_fields:
    - source_commit
    - work_contract_digest
    - requirements_ledger_digest
    - solution_package_digest
    - api_contract_digest
    - product_matrix_digest
    - fitness_matrix_digest
    - image_digest
    - test_runner_image_digests
    - schema_version_and_migration_watermark
    - configuration_and_feature_flag_versions
    - targeted_test_results
    - recovery_test_results
    - ce_fitness_results
    - final_docker_qualification
  evidence_binding_rule: >-
    Every result reference must identify its command, exact test node, UTC execution time,
    exit status, artifact digest, and the candidate-manifest digest. Final Docker qualification
    must follow targeted, recovery, and CE-FIT evidence and use that same immutable candidate.
  invalidation: >-
    Any relevant source, solution package, API contract, image, schema, migration watermark,
    configuration, feature flag, test, or evidence-manifest change invalidates every affected
    result. Rerun the affected exact selectors, recovery qualification, CE-FIT qualification,
    and final Docker qualification; never carry a PASS across candidate identity changes.

test_champion_control_profile:
  status: ACCEPTED
  execution:
    docker_only: true
    host_python_or_virtual_environment: PROHIBITED
    runners:
      dotnet: docker compose --profile test-dotnet run --rm test-runner-dotnet
      python: docker compose --profile test-python run --rm test-runner-python
      browser: docker compose --profile test run --rm test-runner
  completion_targets:
    direct_ce_fit_rows_passing: 16
    skipped_xfailed_or_quarantined_direct_rows: 0
    flaky_retry_allowance: 0
    affected_service_line_coverage: ">=90%"
    affected_service_branch_coverage: ">=80%"
    cross_channel_race_trials_per_candidate: 100
    zero_mutation_denial_trials_per_matrix_case: 1
  accessibility_targets:
    playwright_projects:
      - chromium-expanded
      - firefox-expanded
      - webkit-expanded
      - chromium-compact-360
      - chromium-intermediate
    axe_serious_or_critical_violations: 0
    keyboard_reachable_required_controls: "100%"
    state_meaning_available_without_colour: "100%"
    zoom: "200%"
    compact_reflow_width_css_pixels: 360
    focus_oracle: >-
      After every state transition focus remains on the initiating control, moves to the
      announced result/required correction, or returns to the documented fallback; it is
      never lost, trapped, or moved behind an unavailable control.
    screen_reader_oracle: >-
      Every state and control exposes its accepted accessible name, role, value, and live
      announcement without revealing internal identifiers; Stop is always named
      "Stop all agent work now".
  evidence_artifact_contract:
    every_row:
      - selector-result.json
      - candidate-manifest-digest.txt
      - runner-image-digest.txt
    dotnet: test-results.trx
    python: junit.xml
    browser: playwright-report/
    selector_result_required_fields:
      - ce_fit_id
      - command
      - node
      - started_at_utc
      - completed_at_utc
      - exit_status
      - pass_fail_skip_counts
      - candidate_manifest_digest
      - artifact_digests

recovery_limits:
  status: DATA_TARGETS_DEFINED_PENDING_FOUNDER_ACCEPTANCE_AND_IMPLEMENTATION_EVIDENCE
  controlling_requirement: WC120-R023
  targets:
    Demo: {numeric_rpo: PT24H, numeric_rto: PT8H, numeric_data_loss_bound: PT24H}
    UAT: {numeric_rpo: PT4H, numeric_rto: PT4H, numeric_data_loss_bound: PT4H}
    Production: {numeric_rpo: PT15M, numeric_rto: PT2H, numeric_data_loss_bound: PT15M}
  required_evidence_per_environment:
    - injected_fault
    - exact_backup_restore_rollback_commands
    - invariant_or_checksum
    - schema_and_migration_watermark
    - provider_egress_denial
  rule: >-
    Data-owned numeric targets are fixed above. Founder acceptance is required because the
    recovery cost/risk is material. No recovery or teardown selector may be reported PASS until
    its applicable target is Founder-accepted and retained exact-candidate evidence meets it.

platform_slo_profile:
  source: WC-120 Section 3.3; WC120-R041; Platform Architect disposition
  status: PLATFORM_OWNER_ACCEPTED_SPECIFICATION_TARGETS
  eligible_interval: >-
    The exact environment is separately authorized, enabled, outside an announced maintenance
    window, and expected to accept traffic. Production-dark readiness uses non-routing synthetic
    configuration checks and does not authorize traffic or start a customer SLO.
  targets:
    callback_ingress_availability:
      demo: ">=99.0% over rolling 24 eligible hours"
      uat: ">=99.9% over rolling 30 eligible days"
      production_after_separate_activation: ">=99.95% per calendar month"
    durable_signed_event_acceptance:
      window: rolling 15 minutes
      target: "p95 <=1s; p99 <=2s; every eligible request <=5s"
      low_volume_rule: "Below 100 eligible events, apply the 5s per-event ceiling and environment-bound synthetic claim probe."
    outbound_queue:
      window: rolling 15 minutes
      target: "first attempt p95 <=30s; p99 <=60s; oldest eligible queued item <=120s"
      unknown_outcome_reconciliation: "<=15 minutes to durable terminal or explicit UNRESOLVED"
    emergency_stop:
      window: rolling 15 minutes
      target: "verified durable receipt to BP/PR latch p95 <=1s; p99 <=2s; hard ceiling 5s"
    zero_tolerance:
      cross_environment_fallback_or_mutation: 0
      isolated_restore_provider_egress: 0
      prohibited_telemetry_or_dead_letter_disclosure: 0
      demo_teardown_uat_or_production_binding_changes: 0
  alerts:
    zero_tolerance_or_stop_hard_ceiling:
      trigger: any occurrence
      detect: "<=1 minute"
      page_delivery: "<=5 minutes"
      acknowledge: "<=10 minutes"
      fence: "<=30 minutes"
    availability_burn:
      trigger: ">=14.4x over 1 hour or >=6x over 6 hours"
      page_delivery: "<=5 minutes"
      acknowledge: "<=15 minutes"
      mitigation_start: "<=30 minutes"
    durable_acceptance:
      trigger: "p99 >2s for 5 consecutive minutes or any request >5s"
      page_delivery: "<=5 minutes"
      acknowledge: "<=15 minutes"
    outbound_reconciliation:
      trigger: "oldest eligible queue item >120s for 5 minutes or unknown outcome >15 minutes"
      page_delivery: "<=5 minutes"
      acknowledge: "<=15 minutes"
    recovery:
      trigger: any checksum/invariant mismatch or any provider egress
      action: "fail qualification immediately; page <=5 minutes; remain non-routable"
    dead_letter:
      trigger: "oldest actionable item >15 minutes"
      notify_owner: "<=5 minutes"
      page: "at 30 minutes or after 15 minutes continuous growth"
  owner_boundary: >-
    Platform Architecture owns these service targets and Platform Operations owns routing and
    response clocks. Emitting owners own signal correctness. Data-owned numeric RPO/RTO,
    consistency-group, and data-loss limits remain blocked under recovery_limits. No target grants
    provider, cloud, DNS, deployment, traffic, recovery, teardown, or Production authority.

product_oracle_gate:
  status: PRODUCT_OWNER_ACCEPTED_EXTERNAL_ACTIVATION_GATES_EXPLICIT
  source: work-contracts/WC-120-product-acceptance-matrix.yaml
  decision_dispositions:
    PRODUCT-01: ACCEPTED
    PRODUCT-02: ACCEPTED
    PRODUCT-03: ACCEPTED
    PRODUCT-04: ACCEPTED
    PRODUCT-05: ACCEPTED
  accepted_values:
    initial_locale: en-IN
    maximum_flesch_kincaid_grade: 8
    maximum_sentence_words: 20
    primary_actions_per_turn: 1
    supported_media:
      class: WhatsApp voice contribution
      maximum_bytes: 5242880
      maximum_duration_seconds: 120
    accessibility: WCAG_2_2_AA
    stop_screen_reader_label: Stop all agent work now
  accessibility_dimensions:
    - locale
    - readability
    - text_audio_parity
    - accessible_label
    - keyboard_focus
    - screen_reader
    - non_color_state
    - stop_reachability
  customer_states:
    - MISSING_CONSENT
    - WITHDRAWN_CONSENT
    - WINDOW_EXPIRED
    - TEMPLATE_REJECTED
    - TEMPLATE_VERSION_MISMATCH
    - STALE
    - AMBIGUOUS
    - BLOCKED
    - AIR_UNAVAILABLE
    - CE_UNAVAILABLE
    - PROVIDER_UNAVAILABLE
    - STOPPED
  rule: >-
    The affected selectors must assert the Product-approved visible state and next action,
    preserve distinct stale/blocked/unavailable/Stop meanings, expose no synthetic success,
    remain keyboard and screen-reader operable, avoid color-only meaning, and keep Stop
    reachable. The exact copy, locale, readability, media, consent-presentation, and
    accessibility values are fixed by the Product matrix. Legal/Founder consent policy,
    Security/Data controls, provider constraints, activation authority, and implementation
    evidence remain separate fail-closed gates and do not reopen these Product values.

fitness_items:
  - id: CE-FIT-01
    stories: [CSA-CEWA-007, CSA-CEWA-021]
    requirements: [WC120-R007, WC120-R021, WC120-R024, WC120-R036, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, canonical continuity row.
    oracle: Web-to-WhatsApp-to-Web retains relationship, conversation, message, sequence, plan, and authority identity.
    negative_or_boundary_oracle: Handoff or channel resumption cannot create a second canonical conversation or expand authority.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit01CanonicalContinuityTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit01CanonicalContinuityTests.WebWhatsAppWeb_RetainsCanonicalIdentitySequencePlanAndAuthority_WithoutDuplicateConversation
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit01CanonicalContinuityTests.WebWhatsAppWeb_RetainsCanonicalIdentitySequencePlanAndAuthority_WithoutDuplicateConversation"
      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    evidence_location: test-results/wc120/CE-FIT-01/

  - id: CE-FIT-02
    stories: [CSA-CEWA-004, CSA-CEWA-008]
    requirements: [WC120-R005, WC120-R008, WC120-R024, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, server-resolved context row.
    oracle: Registered context resolves only from authenticated identity and current server-owned state.
    negative_or_boundary_oracle: Forged/unknown context keys and cross-subject references produce zero mutation and no disclosure.
    customer_state_oracle: Forged, unknown, and ambiguous context remains denied or blocked without disclosing whether another subject exists.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit02ServerContextTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit02ServerContextTests.RegisteredContext_UsesAuthenticatedCurrentServerState_AndRejectsForgedUnknownCrossSubjectReferences
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit02ServerContextTests.RegisteredContext_UsesAuthenticatedCurrentServerState_AndRejectsForgedUnknownCrossSubjectReferences"
      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    evidence_location: test-results/wc120/CE-FIT-02/

  - id: CE-FIT-03
    stories: [CSA-CEWA-004, CSA-CEWA-006]
    requirements: [WC120-R005, WC120-R006, WC120-R024, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, source-change staleness row.
    oracle: Decision Space, plan, or profile source-version changes stale affected context before the next execution.
    negative_or_boundary_oracle: Stale source versions cannot execute under an apparently current context.
    customer_state_oracle: STALE is distinct from unavailable or success and exposes only the approved refresh/reconfirm next action.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit03ContextStalenessTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit03ContextStalenessTests.SourceVersionChange_MarksAffectedContextStaleBeforeExecution_AndPreventsCurrentPresentation
      command: >-
        docker compose --profile test-dotnet run --rm test-runner-dotnet dotnet test tests/business-platform.Tests/business-platform.Tests.csproj
        --filter "FullyQualifiedName=Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit03ContextStalenessTests.SourceVersionChange_MarksAffectedContextStaleBeforeExecution_AndPreventsCurrentPresentation"
      preimplementation_result: EXPECTED_FAIL_TEST_NODE_ABSENT
    evidence_location: test-results/wc120/CE-FIT-03/

  - id: CE-FIT-04
    stories: [CSA-CEWA-005, CSA-CEWA-021]
    requirements: [WC120-R005, WC120-R021, WC120-R024, WC120-R044]
    source_oracle: Pinned solution Sections 20.1-20.2, semantic-equivalence corpus row.
    oracle: The same confirmed context and policy produce semantically equivalent recommendations across Web and WhatsApp.
    negative_or_boundary_oracle: Channel presentation differences cannot change recommendation authority, policy, or outcome.
    planned_test:
      path: tests/business-platform.Tests/ConversationWhatsAppFitness/CeFit04SemanticEquivalenceTests.cs
      node: Waooaw.BusinessPlatform.Tests.ConversationWhatsAppFitness.CeFit04SemanticEquivalenceTests.ConfirmedContextAndPolicy_ProduceEquivalentWebAndWhatsAppRecommendations

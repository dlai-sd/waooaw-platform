  solution_oracle:
    path: architecture/reference/components/conversation-engine-whatsapp-solution-work-component.md
    git_blob: 224d8f43f2a46e810eb5b13aac35570b6f0ebcda
    sections: [17, 19.2, 20.1, 20.2]
  requirements_oracle: work-contracts/WC-120-requirements.yaml

current_authority_paths:
  browser_session:
    owner: Web
    paths:
      - web/lib/auth.ts
      - web/lib/server-auth.ts
      - web/app/api/auth/keycloak-logout/route.ts
    legacy_creation:
      - NextAuth JWT callback copies Keycloak access, refresh, and ID tokens into browser-carried session state.
      - JWT callback refreshes and mutates browser-carried token state.
    removal_or_replacement:
      - Replace browser token custody with one random opaque __Host- cookie handle.
      - Move refresh, rotation, revocation, and token envelopes to Web-owned server persistence.
  customer_membership:
    owner: Business Platform
    paths:
      - src/business-platform/Infrastructure/CustomerMembershipMiddleware.cs
      - src/business-platform/Services/CustomerIdentityJourneyService.cs
      - src/business-platform/Controllers/IdentityController.cs
      - src/business-platform/Infrastructure/IdentityDbContext.cs
      - infrastructure/postgres/init/20-identity-boundary.sql
      - infrastructure/postgres/init/39-identity-sessions.sql
    retained_authority:
      - Exact Keycloak issuer and subject identify the application principal.
      - Current durable membership owns customer account, tenant, and role authority.
  tenant_and_rls:
    owner: Business Platform and each enabled resource owner
    paths:
      - src/business-platform/Infrastructure/TenantIsolationMiddleware.cs
      - src/business-platform/Infrastructure/CustomerMembershipMiddleware.cs
      - infrastructure/postgres/init/04-rls-policies.sql
      - infrastructure/postgres/init/20-identity-boundary.sql
    legacy_acceptance:
      - TenantIsolationMiddleware accepts tenant_id from JWT claims outside adapted customer routes.
      - Identity fallback paths can accept waooaw_roles claims.
    removal_or_replacement:
      - Resolve current membership from validated issuer and subject.
      - Set fresh transaction-local tenant context and retain independent FORCE RLS.
  identity_provider:
    owner: Stock Keycloak
    paths:
      - infrastructure/keycloak/waooaw-realm.json
      - adr/ADR-008-keycloak-identity-broker.md
    lifecycle_writer:
      client: waooaw-identity-lifecycle-writer
      pinned_version: 25.0.6
      role: realm-management/manage-users
      separation: WC-085 read-only client remains unchanged.


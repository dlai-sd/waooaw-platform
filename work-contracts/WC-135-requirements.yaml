requirement_defaults: &defaults
  component_owner: Platform IT Expert (INST-010)
  evidence_class: Planned local unit, contract, Postgres and pipeline evidence; Demo acceptance separate
  initial_state: new
  dependencies: Founder authorization of the implementing session; Founder decisions O-1 and O-2 (capability entries; acceptance of ADR-051, ADR-052, ADR-053).
  residual_risk: Live WhatsApp acceptance and real-traffic metrics need a separately authorized Demo deployment.
  result: PLANNED

requirements:
  - <<: *defaults
    requirement_id: WC135-R001
    source: WC-135 Canonical Requirement Index, R001
    observable_outcome: Conversations are classified as full success, lead only, intent only, opt-out or drop-off, with the state where the visitor stopped.
    test_path_or_plan: Outcome-classification unit tests and a fixed-transcript replay test (planned under tests/business-platform.Tests/VisitorConversation).
    completion_rule: Planned executable evidence for WC135-R001 passes.

  - <<: *defaults
    requirement_id: WC135-R002
    source: WC-135 Canonical Requirement Index, R002
    observable_outcome: The visitor conversation follows the contract state machine and failure matrix; every reply has one idea and at most one question; STOP is honored in every state.
    test_path_or_plan: State-machine unit tests and a per-state reply-shape test (planned).
    completion_rule: Planned executable evidence for WC135-R002 passes.

  - <<: *defaults
    requirement_id: WC135-R003
    source: WC-135 Canonical Requirement Index, R003
    observable_outcome: One channel-neutral core and endpoint serve WhatsApp, the simulator and future clients identically; customer mode is declared but not available; public anonymous web exposure is disabled by configuration.
    test_path_or_plan: Endpoint contract tests, WhatsApp-versus-endpoint parity test (F1) and a flag-off test (planned).
    completion_rule: Planned executable evidence for WC135-R003 passes.

  - <<: *defaults
    requirement_id: WC135-R004
    source: WC-135 Canonical Requirement Index, R004
    observable_outcome: Replies use the structured block model; WhatsApp renders interactive messages and link buttons and parses inbound button and list replies into choices; free text is always accepted; limits come from configuration.
    test_path_or_plan: Renderer, limit and inbound-parsing tests and a webhook-to-reply integration test (planned).
    completion_rule: Planned executable evidence for WC135-R004 passes.

  - <<: *defaults
    requirement_id: WC135-R005
    source: WC-135 Canonical Requirement Index, R005
    observable_outcome: Replies come from a scripted responder reading Conversation Policy layers per tenant and professional behind one interface; nothing tenant-specific is hardcoded; the generative responder cannot be selected; fixed-text categories stay fixed.
    test_path_or_plan: Responder selection and refusal tests, hardcoded-string guard (F3), content-version and fail-closed tests (planned).
    completion_rule: Planned executable evidence for WC135-R005 passes.

  - <<: *defaults
    requirement_id: WC135-R006
    source: WC-135 Canonical Requirement Index, R006
    observable_outcome: Content is simple English, explains the Digital Marketing Professional in depth, closes the other three with "coming soon", states no price or guarantee and carries the portal link; the Founder has approved the wording.
    dependencies: Founder decision O-7 (reply wording approval) before the content is built.
    test_path_or_plan: Content lint tests and recorded Founder approval (planned).
    completion_rule: Planned executable evidence for WC135-R006 passes and Founder approval is recorded.

  - <<: *defaults
    requirement_id: WC135-R007
    source: WC-135 Canonical Requirement Index, R007
    observable_outcome: The lead record, envelope v2 with key version, tenant isolation and write behavior follow the Data Contract; name and email are requested once with a reason and never required.
    dependencies: Founder decision O-5 (Security confirmation of personal-data classification).
    test_path_or_plan: Migration and RLS tests, envelope round-trip and rotation tests, write-failure test (planned).
    completion_rule: Planned executable evidence for WC135-R007 passes.

  - <<: *defaults
    requirement_id: WC135-R008
    source: WC-135 Canonical Requirement Index, R008
    observable_outcome: Lead and simulation retention are configurable, validated and applied at purge time by a single-replica job that logs counts only; converted leads are excluded; data-rights export and deletion cover leads.
    dependencies: Founder decision O-3 (retention bounds and simulation retention).
    test_path_or_plan: Options validation tests, purge tests with injected clock and concurrent runners, data-rights tests (planned).
    completion_rule: Planned executable evidence for WC135-R008 passes.

  - <<: *defaults
    requirement_id: WC135-R009
    source: WC-135 Canonical Requirement Index, R009
    observable_outcome: A stopped visitor can send START, is asked for consent again and resumes only after YES; the transition is audited; other text from a stopped visitor receives no reply.
    test_path_or_plan: Guest-session unit and Postgres tests for STOP, START and consent renewal (planned).
    completion_rule: Planned executable evidence for WC135-R009 passes.

  - <<: *defaults
    requirement_id: WC135-R010
    source: WC-135 Canonical Requirement Index, R010
    observable_outcome: Every webhook and endpoint response emits the Observability Contract event with status, reason code and state and no personal data.
    test_path_or_plan: Log-capture tests (F4) and a failure-class coverage test (planned).
    completion_rule: Planned executable evidence for WC135-R010 passes.

  - <<: *defaults
    requirement_id: WC135-R011
    source: WC-135 Canonical Requirement Index, R011
    observable_outcome: Per-tenant and per-visitor limits apply at BP middleware; the simulator uses a capped demo-only credential and can never reach the provider adapter or real numbers.
    test_path_or_plan: Limit tests and an isolation test (F6) (planned).
    completion_rule: Planned executable evidence for WC135-R011 passes.

  - <<: *defaults
    requirement_id: WC135-R012
    source: WC-135 Canonical Requirement Index, R012
    observable_outcome: A simulated-customer harness runs seven personas against the endpoint with a separate judge, anchored rubrics, repeated runs, separate success and policy scores and failure injection; a baseline and a post-change comparison are recorded.
    dependencies: Founder decision O-6 (evaluation targets) before the baseline run.
    test_path_or_plan: Harness tests with a fake model, recorded baseline and comparison (planned under tests/visitor_simulation).
    completion_rule: Planned executable evidence for WC135-R012 passes and the comparison is recorded.

  - <<: *defaults
    requirement_id: WC135-R013
    source: WC-135 Canonical Requirement Index, R013
    observable_outcome: The evaluation suite gates changes to visitor content and prompts, the Observability Contract metrics are emitted, and model use follows ADR-024 and ADR-029 with a per-run cost cap.
    test_path_or_plan: Gate-wiring pipeline test, metric-emission tests and a cost-cap test (planned).
    completion_rule: Planned executable evidence for WC135-R013 passes.

  - <<: *defaults
    requirement_id: WC135-R014
    source: WC-135 Canonical Requirement Index, R014
    observable_outcome: The portal handoff uses an opaque single-use reference, records INTENT on tap, pre-fills only non-sensitive fields by default and links the lead only on a verified identity match; conversion sets CONVERTED.
    test_path_or_plan: Handoff unit tests, reuse and expiry tests and an identity-mismatch test (planned).
    completion_rule: Planned executable evidence for WC135-R014 passes.

  - <<: *defaults
    requirement_id: WC135-R015
    source: WC-135 Canonical Requirement Index, R015
    observable_outcome: The component specification, OpenAPI definition, Conversation Policy content schema and generated client artifacts are updated and reviewed before any endpoint or renderer code.
    test_path_or_plan: Spec and generated-artifact consistency check and C-059 header trace (planned).
    completion_rule: Planned executable evidence for WC135-R015 passes.

  - <<: *defaults
    requirement_id: WC135-R016
    source: WC-135 Canonical Requirement Index, R016
    observable_outcome: Personal data is classified; logs and evaluation inputs carry none; the consent notice discloses quality review wherever production sampling is used; simulated conversations use only fabricated data.
    test_path_or_plan: Classification review record, log tests (F4) and a consent-disclosure content test (planned).
    completion_rule: Planned executable evidence for WC135-R016 passes.

  - <<: *defaults
    requirement_id: WC135-R017
    source: WC-135 Canonical Requirement Index, R017
    observable_outcome: Validation, author review and an exact-head PR are completed with new tests wired into the explicit CI and release-qualification lists.
    test_path_or_plan: Commands and results recorded in the PR (planned).

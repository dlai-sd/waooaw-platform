  - <<: *defaults
    requirement_id: WC174-R020
    source: WC-174 Canonical Requirement Index, R020
    observable_outcome: Operations shows results against each goal from connected and customer-owned sources, says not measured when no source exists and how to connect one, carries source and freshness on every number, and attributes only WAOOAW's own work.

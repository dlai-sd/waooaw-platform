    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC174-R019
    source: WC-174 Canonical Requirement Index, R019
    observable_outcome: Media providers and rates are Founder decisions on Pricing, off by default; no generation runs or spends without an authorized rate and the spend chain; the customer sees a plain not-enabled message.

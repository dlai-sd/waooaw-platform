  - <<: *defaults
    requirement_id: WC174-R017
    source: WC-174 Canonical Requirement Index, R017
    observable_outcome: The customer approves an exact version with a preview; any change is a new version; approval, rejection and rework are evidence; the ladder starts at approval of every piece.
    test_path_or_plan: Business Platform approval and evidence tests, Jest and Playwright tests.

  - <<: *defaults

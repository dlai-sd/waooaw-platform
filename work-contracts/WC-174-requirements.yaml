requirement_defaults: &defaults
  component_owner: Platform IT Expert (INST-010)
  evidence_class: Executable tests in the Docker runners (Business Platform, DMA agent, web, pipeline and contract suites), the single end-of-build validation pass, the Demo read-back and the slice 6 acceptance report; commands and results in the PR body
  initial_state: new
  dependencies: The Founder authorizes the build in the session that starts it; WC-171 and WC-149 merged; the Founder's MD1 to MD5 confirmed; outside approvals (Meta App Review and others) only for the connectors that need them
  residual_risk: The scope is large and spans the shared kernel, the web and the DMA agent; connectors beyond Meta, media providers and lawful public sources have outside lead times and Founder decisions; real customers and real money stay off
  completion_rule: Executable evidence at the exact head recorded in the PR body, plus the Demo read-back named in the row; no row grants real customers or real money
  result: PLANNED

requirements:
  - <<: *defaults
    requirement_id: WC174-R001
    source: WC-174 Canonical Requirement Index, R001
    observable_outcome: The Agent Experience Contract accepts an optional modes field with three fixed ids, labels, entries, readiness source and gates; admission refuses a fourth mode, markup, duplicates and empty targets; a declaration without modes still admits.
    test_path_or_plan: Contract and admission tests (tests/contract, Business Platform admission tests), schema copies and generated client digest tests.

  - <<: *defaults
    requirement_id: WC174-R002
    source: WC-174 Canonical Requirement Index, R002
    observable_outcome: The customer opens any mode at any time with a readiness line; a gate blocks only an action with a side effect and says what to do next; the mode is remembered; deep links work; the modes exist as WhatsApp conversation context.
    test_path_or_plan: Jest and Playwright tests of the mode shell, Business Platform state tests, conversation hand-off tests.

  - <<: *defaults
    requirement_id: WC174-R003
    source: WC-174 Canonical Requirement Index, R003
    observable_outcome: Choosing an agent shows the fixed platform surfaces then the current mode's entries; existing workbench views map onto Operations with no lost function; old links keep working.
    test_path_or_plan: Jest and Playwright tests, link redirect tests, WC-171 navigation tests rerun.

  - <<: *defaults
    requirement_id: WC174-R004
    source: WC-174 Canonical Requirement Index, R004
    observable_outcome: A declaration-only fixture agent renders its own modes, entries, event categories and hierarchy levels through the same code with no agent name in shared code.
    test_path_or_plan: Render test with the fixture declaration and a grep test over shared web and Business Platform code.

  - <<: *defaults
    requirement_id: WC174-R005
    source: WC-174 Canonical Requirement Index, R005
    observable_outcome: A shared Calendar block is the base screen with layers, month and list views, keyboard and screen-reader operation and a WhatsApp fallback, carrying owner, evidence state and freshness.
    test_path_or_plan: Component tests, Playwright at 360, 768 and 1440 in light and dark, axe, block fallback tests.

  - <<: *defaults
    requirement_id: WC174-R006
    source: WC-174 Canonical Requirement Index, R006
    observable_outcome: DMA proposes events from the confirmed profile with source, reason and confidence; the customer accepts, edits, hides or adds events and placeholders; sensitive categories stay off until chosen; every change is evidence; events never publish by themselves.
    test_path_or_plan: DMA agent tests for event research and categories, Business Platform state and evidence tests, Jest tests of the controls.
    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC174-R007
    source: WC-174 Canonical Requirement Index, R007
    observable_outcome: Themes, content and publish slots appear on the Calendar and can be moved under the item's approval rule, with package limits visible.
    test_path_or_plan: Business Platform tests of moves and limits, Jest and Playwright tests.

  - <<: *defaults
    requirement_id: WC174-R008
    source: WC-174 Canonical Requirement Index, R008
    observable_outcome: The Induct conversation asks one new question per cycle, opens with what the agent found, shows highlighted labels to confirm or correct, separates inference from fact, resumes across web and WhatsApp, and explains purpose before a sensitive item.
    test_path_or_plan: DMA conversation scenario tests, Business Platform tests, Jest tests of the label confirmation, WhatsApp hand-off tests.

  - <<: *defaults
    requirement_id: WC174-R009
    source: WC-174 Canonical Requirement Index, R009
    observable_outcome: The DMA induction contract 1.1.0 requires an explicit answer for each listed platform before READY, keeps connection optional, and shows INCOMPLETE, PARTIAL or READY with the next action.
    test_path_or_plan: DMA contract schema and readiness tests (src/digital-marketing-agent/tests), Business Platform projection tests.

  - <<: *defaults
    requirement_id: WC174-R010
    source: WC-174 Canonical Requirement Index, R010
    observable_outcome: Each platform shows its status; the customer connects by consent, the connection is tested and can be repaired or revoked; no password or secret is typed into or shown; Facebook and Instagram through Meta work first; the others say not yet connectable and offer public-only reading.
    test_path_or_plan: Business Platform connection tests, vault custody tests, Jest and Playwright tests, secret-absence scans of logs and responses; Demo read-back with a tester account.
    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC174-R011
    source: WC-174 Canonical Requirement Index, R011
    observable_outcome: Public enrichment reads website, public social pages and the Google listing, and registries only where the Founder confirms the lawful basis; each fact carries source, time, confidence and lawful basis; the customer can correct or remove it.
    test_path_or_plan: DMA agent tests with recorded fixtures, terms-of-use guard tests, Business Platform tests of the fact store.
    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC174-R012
    source: WC-174 Canonical Requirement Index, R012
    observable_outcome: The customer confirms the profile and reads the maturity report with evidence, confidence and a correction path; confirmation moves the Goals readiness; the score never excludes the customer.
    test_path_or_plan: DMA scoring and profile tests, Jest tests, a test that a low score never refuses a hire.

  - <<: *defaults

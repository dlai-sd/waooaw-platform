    source: WC-174 Canonical Requirement Index, R018
    observable_outcome: On the accepted DMA B2 publication contract, approved items are scheduled within the purchased post count through a Professional Runtime publication intent, the connection interface and the governed tool services with a separate publication authority; Facebook and Instagram only; on Demo only to a sandbox or tester account; published means reconciled provider evidence; Stop halts it; an expired connection becomes NEEDS_REPAIR and alerts.

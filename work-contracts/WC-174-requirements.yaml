  - <<: *defaults
    requirement_id: WC174-R028
    source: WC-174 Canonical Requirement Index, R028
    observable_outcome: The agent's conversation is the platform conversation, docked in every mode and view (a bottom sheet on a phone), one durable conversation shared with WhatsApp, surviving mode and view changes; the agent supplies domain meaning only through its manifest and induction set, with no conversation service of its own; the budget left is shown, metered by the billing engine; WhatsApp gets the next three items and a link.
    test_path_or_plan: Jest and Playwright tests, conversation hand-off tests, a test that the agent image exposes no conversation endpoint, budget display tests, WhatsApp fallback tests.
    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC174-R029
    source: WC-174 Canonical Requirement Index, R029
    observable_outcome: The conversation knows the mode, view, selection, readiness gap and package limits, opens with the one next step, asks one new question at a time, offers buttons, free text, Do it for me, Let me do it and Explain, and never invents an action the platform does not offer.
    test_path_or_plan: DMA conversation scenario tests per mode, context contract tests between web, Business Platform and the agent, a test that every offered action exists as a platform command.

  - <<: *defaults
    requirement_id: WC174-R030
    source: WC-174 Canonical Requirement Index, R030
    observable_outcome: Every tool action can be asked in words and every asked action appears on the workspace through the same idempotent commands and evidence; agent changes wait as suggestions until accepted; each item has an author state the customer can change; undo creates a new version and deletes nothing.
    test_path_or_plan: Business Platform command, idempotency and evidence tests, author-state transition tests, Jest and Playwright tests, a test that no agent change applies without acceptance.

  - <<: *defaults
    requirement_id: WC174-R031
    source: WC-174 Canonical Requirement Index, R031
    observable_outcome: The readiness line always names the one next step with one primary action per mode, computed from the readiness source and gates, with the same text in the conversation.
    test_path_or_plan: Business Platform projection tests, Jest tests of the line, a test that web and conversation text match.

  - <<: *defaults
    requirement_id: WC174-R032
    source: WC-174 Canonical Requirement Index, R032
    observable_outcome: Per relationship the platform records how each outcome was reached (asked, accepted from a suggestion, or tool) and shows the Founder the share reached with the assistant against a Founder-set target, with no conversation content in the measure.
    test_path_or_plan: Business Platform measure tests including a content-absence scan, Founder screen tests.
    initial_state: Founder-reserved


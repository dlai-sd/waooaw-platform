    observable_outcome: The customer creates their own events, themes at every level, stories, posts and assets by hand or by asking, in any mode; their work has the same states, review checks, approvals, exact-version rules and package counts as agent-made work, is not changed by the agent until handed over, and shows on the calendar and in the conversation.

  - <<: *defaults
    requirement_id: WC174-R021
    source: WC-174 Canonical Requirement Index, R021
    observable_outcome: A monthly digest and a two-month review give goal versus baseline, what worked, one recommendation and at most one customer request; recommendations are proposals; accepted ones become the next goal versions.
    test_path_or_plan: DMA review tests, Business Platform goal-version tests, Jest tests.

  - <<: *defaults

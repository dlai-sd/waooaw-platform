    requirement_id: WC174-R023
    source: WC-174 Canonical Requirement Index, R023
    observable_outcome: Package counts and prices are unchanged, every count shown equals the owner's count, B1 and B2 activation stays a separate Founder decision, and no mode bypasses a package limit.

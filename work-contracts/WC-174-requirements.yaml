  - <<: *defaults
    requirement_id: WC174-R016
    source: WC-174 Canonical Requirement Index, R016
    observable_outcome: On the accepted DMA B1 draft contract, an approved story becomes platform-ready text and pictures, and short video and audio only where a provider and an accepted customer-asset owner exist, with review checks, rights, likeness and content safety run before the customer sees a draft; model output never approves anything; counted by component.

    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC174-R020
    source: WC-174 Canonical Requirement Index, R020
    observable_outcome: Operations shows results against each goal from connected and customer-owned sources, says not measured when no source exists and how to connect one, carries source and freshness on every number, and attributes only WAOOAW's own work.
    test_path_or_plan: DMA measurement tests, Business Platform projection tests, Jest tests; Demo read-back from the tester account.

  - <<: *defaults
    requirement_id: WC174-R021
    source: WC-174 Canonical Requirement Index, R021
    observable_outcome: A monthly digest and a two-month review give goal versus baseline, what worked, one recommendation and at most one customer request; recommendations are proposals; accepted ones become the next goal versions.

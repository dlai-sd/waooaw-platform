requirement_defaults: &defaults
  component_owner: Platform IT Expert (INST-010)
  evidence_class: Executable tests in the Docker runners (web, Business Platform, Professional Runtime, billing engine, contracts), the single end-of-build validation pass, and the slice 5 acceptance report on Demo; commands and results in the PR body
  initial_state: new
  dependencies: The Founder authorizes the build in the session that starts it; WC-170 merged and its Demo deployment read back; decisions N1 to N3 confirmed by the Founder
  residual_risk: The build is large (four epics and the carry-ins); the proactive WhatsApp proof needs the Founder's rate authorization and template approval; no real customer, real money or non-sandbox recipient is in scope
  completion_rule: Executable evidence at the exact head recorded in the PR body, plus the Demo read-back or acceptance step named in the row
  result: PLANNED

requirements:
  - <<: *defaults
    requirement_id: WC171-R001
    source: WC-171 Canonical Requirement Index, R001
    observable_outcome: The global customer menu is the same for every agent, carries only platform concerns and no staff link, has mobile parity, and staff and Founder tools sit in a separate Operations group shown by grant.
    test_path_or_plan: Jest tests of the shell menus for a customer, a staff member and the Founder; Playwright UX-SHELL-03 and redirect checks for old URLs; the WC-167 R006 layers.

  - <<: *defaults
    requirement_id: WC171-R002
    source: WC-171 Canonical Requirement Index, R002
    observable_outcome: Choosing an agent opens a context menu with fixed platform surfaces followed by the agent's declared entries, chosen per relationship, with deep links and no lost workbench function.
    test_path_or_plan: Jest and Playwright tests of the context menu and deep links; a mapping test from every existing workbench tab to a fixed surface.

  - <<: *defaults
    requirement_id: WC171-R003
    source: WC-171 Canonical Requirement Index, R003
    observable_outcome: The Agent Experience Contract has an additive optional navigation field with admission validation, and a legacy declaration without it still admits and shows only the fixed surfaces.
    test_path_or_plan: Business Platform admission tests (unknown kinds, markup, duplicate ids, empty targets, legacy declaration); contract tests and the regenerated client digest.

  - <<: *defaults
    requirement_id: WC171-R004
    source: WC-171 Canonical Requirement Index, R004
    observable_outcome: DMA declares its entries and a declaration-only fixture agent of another profession declares different entries through the same code, with no agent name in shared navigation code.
    test_path_or_plan: Jest rendering tests for both declarations; a grep guard test over shared web and Business Platform navigation code.

  - <<: *defaults
    requirement_id: WC171-R005
    source: WC-171 Canonical Requirement Index, R005
    observable_outcome: One alert policy classifies every alert source and decides channel, deduplication and escalation, so one material event produces one primary message, and an agent cannot declare a class or channel the policy forbids.
    test_path_or_plan: Business Platform policy tests per source and scenario; admission test for a forbidden class or channel; a deduplication test across sources and channels.

  - <<: *defaults
    requirement_id: WC171-R006
    source: WC-171 Canonical Requirement Index, R006
    observable_outcome: Delivery follows the policy; the 30 proactive messages a month are consumed on send, idempotently, with portal fallback when exhausted; sending is behind a Founder gate to sandbox recipients on Demo and only after the rate is authorized and a template is approved; STOP is respected.
    test_path_or_plan: Billing engine and Business Platform tests (allowance, idempotency, exhaustion, uncounted classes, gate off by default, STOP); slice 5 step S24 on Demo.
    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC171-R007
    source: WC-171 Canonical Requirement Index, R007
    observable_outcome: A customer has one alert inbox across agents with a per-agent filter, acknowledge, snooze and per-category mute, and floor alerts can never be muted.
    test_path_or_plan: Business Platform controller and service tests; Jest and Playwright tests of the inbox and the agent filter; a test that a floor alert refuses mute.

  - <<: *defaults
    requirement_id: WC171-R008
    source: WC-171 Canonical Requirement Index, R008
    observable_outcome: An Operations console for the Founder and administrators shows open signals, queue and blocked counts with ages, alert delivery outcomes and service readiness, with separate grants, tenant scoping and no database access.
    test_path_or_plan: Business Platform authorization and scoping tests; Jest and Playwright tests of the console; Demo read-back through slice 5 step S27.

  - <<: *defaults
    requirement_id: WC171-R009
    source: WC-171 Canonical Requirement Index, R009
    observable_outcome: A governed route reads and resolves blocked outbound WhatsApp messages (retry, close with reason, mark undeliverable), audited, idempotent, step-up protected and never deleting, and resolving the Demo message stops the repeating page without muting it.
    test_path_or_plan: Real-database Business Platform tests (each action, replay, refused delete, scope); Demo read-back that the DEAD_LETTER_AGE_BREACH page stops after resolution; slice 5 step S25.

  - <<: *defaults
    requirement_id: WC171-R010
    source: WC-171 Canonical Requirement Index, R010
    observable_outcome: The Founder and administrators read a relationship's work timeline and spend chain and resolve a discrepancy with evidence through read routes and screens (WC-170 B7).
    test_path_or_plan: Billing engine and Business Platform tests for the read routes and discrepancy resolution; Jest tests of the screens; slice 5 step S26.

  - <<: *defaults
    requirement_id: WC171-R011
    source: WC-171 Canonical Requirement Index, R011
    observable_outcome: The running Professional Runtime dispatch calls the execution stream, step gate and spend client so a Demo run produces timeline events; ingest compares the signed tenant; stop fences survive a restart and a second replica; the controllers have unit tests (WC-170 B1, B2, B6, B8).
    test_path_or_plan: Professional Runtime tests of the dispatch path, restart and two-replica fence tests, Business Platform ingest tenant-mismatch and controller tests; slice 4 step S17 re-run on Demo.

  - <<: *defaults
    requirement_id: WC171-R012
    source: WC-171 Canonical Requirement Index, R012
    observable_outcome: The audit_evidence_log insert fault and the scheduler's meter daily-scan 503 (WC-169 G14) are investigated from Demo logs and fixed, or recorded with an owner.
    test_path_or_plan: Billing engine tests for the fix; Log Analytics read-back after deployment showing no recurrence; or a recorded owner and date.

  - <<: *defaults
    requirement_id: WC171-R013
    source: WC-171 Canonical Requirement Index, R013
    observable_outcome: Every changed page or component passes the WC-167 R006 layers, UX-SHELL-03 and UX-RESP-03 pass for the new menus, and the older navigation text in the UX vocabulary is reconciled with the shell.
    test_path_or_plan: Jest, Playwright at 360, 768 and 1440 in light and dark, axe, lint, strict types, production build and changed-line coverage; document diff of the vocabulary navigation section.

  - <<: *defaults
    requirement_id: WC171-R014
    source: WC-171 Canonical Requirement Index, R014
    observable_outcome: Acceptance slice 5 runs on Demo for a synthetic customer and an operator and produces one calibration report with an owner for every NOT-WITNESSED or FAIL item; the coverage ratchet rises and never falls.
    test_path_or_plan: validation/acceptance/plans slice 5 plan and specs, coverage ratchet test, calibration report attached to this ledger after the Demo deployment.
    initial_state: Founder-reserved

  - <<: *defaults
    requirement_id: WC171-R015
    source: WC-171 Canonical Requirement Index, R015
    observable_outcome: After the Demo read-back the WC-168 to WC-171 ledger rows are set from evidence, the ROADMAP.md progress record is refreshed, and PG-24 is SPEC_CLOSED with the proof pending.
    test_path_or_plan: Requirement ledger validation for WC-168 to WC-171, tests/pipeline/test_roadmap_single_source.py, platform state refresh and check.

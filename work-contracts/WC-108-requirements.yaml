requirements:
  - <<: *requirement_defaults
    requirement_id: WC108-R001
    source: Section 4.1
    observable_outcome: ADR-050 explicitly distinguishes runner, test-execution, candidate and evidence identities.
    component_owner: Enterprise Architecture decision record
    test_path_or_plan: Inspect ADR-050 decision and identity table for four non-conflated identities.
    completion_rule: ADR-050 names all four identities and assigns distinct authority inputs and lifecycle behavior.

  - <<: *requirement_defaults
    requirement_id: WC108-R002
    source: Sections 4.1 and 4.3
    observable_outcome: Runner identity excludes ordinary application source and includes every environment-producing input.
    component_owner: Docker validation reference architecture
    test_path_or_plan: Inspect runner identity inputs and invalidation rules in the amended strategy.
    completion_rule: Source-only edits preserve runner identity while every declared toolchain or dependency input invalidates it.

  - <<: *requirement_defaults
    requirement_id: WC108-R003
    source: Sections 4.1 and 4.2
    observable_outcome: Test execution is stack-specific, disposable and isolated from persistent correctness state.
    component_owner: Docker validation reference architecture
    test_path_or_plan: Inspect stack-runner, disposable-state and cache-boundary clauses.
    completion_rule: The strategy prohibits persistent process, database, generated-output and verdict authority.

  - <<: *requirement_defaults
    requirement_id: WC108-R004
    source: Sections 4.1 and 4.3
    observable_outcome: Candidate identity covers the complete effective build context and produces digest, SBOM and provenance.
    component_owner: Docker validation reference architecture
    test_path_or_plan: Inspect candidate-input and output requirements in ADR-050 and the strategy.
    completion_rule: Every effective build input is represented and every candidate emits immutable supply-chain evidence.

  - <<: *requirement_defaults
    requirement_id: WC108-R005
    source: Sections 4.1 and 4.4
    observable_outcome: Evidence reuse requires exact declared inputs, trust, freshness and new-head non-impact proof.
    component_owner: Validation evidence architecture
    test_path_or_plan: Inspect evidence identity and carry-forward clauses for equality, freshness and provenance.
    completion_rule: Reuse cannot occur on ambiguous, stale, untrusted or impacted inputs and is explicitly classified.

  - <<: *requirement_defaults
    requirement_id: WC108-R006
    source: Section 4.2 Tier 1
    observable_outcome: Static preflight precedes costly execution without using host language test tooling.
    component_owner: Validation lifecycle architecture
    test_path_or_plan: Inspect Tier 1 ordering and C-080 execution constraints.
    completion_rule: Tier 1 is first, bounded, Docker-executed and performs no runner or candidate build.

  - <<: *requirement_defaults
    requirement_id: WC108-R007
    source: Section 4.2 Tier 2
    observable_outcome: Story feedback uses mounted source and does not build runners or product images for ordinary edits.
    component_owner: Platform IT Expert implementation process
    test_path_or_plan: Inspect Tier 2 and agent-process requirements for mounted disposable execution.
    completion_rule: Ordinary story edits resolve an existing runner and execute focused tests without image build.

  - <<: *requirement_defaults
    requirement_id: WC108-R008
    source: Section 4.2 Tier 3
    observable_outcome: Milestone checks are dependency-complete and bounded rather than full qualification after every edit.
    component_owner: Validation lifecycle architecture
    test_path_or_plan: Inspect Tier 3 selection, reverse-dependency and milestone-boundary clauses.
    completion_rule: Milestone checks cover affected dependencies without invoking the complete inventory per edit.

  - <<: *requirement_defaults
    requirement_id: WC108-R009
    source: Sections 4.2 Tier 4 and 4.3
    observable_outcome: Full qualification occurs once per immutable candidate identity and every repair creates a new candidate.
    component_owner: Candidate qualification architecture
    test_path_or_plan: Inspect freeze, repair and requalification semantics.
    completion_rule: Qualification authority is bound to exact candidate bytes and cannot survive candidate mutation.

  - <<: *requirement_defaults
    requirement_id: WC108-R010
    source: Section 4.3
    observable_outcome: Cache policy separates untrusted download acceleration from disposable correctness state.
    component_owner: Runner and cache architecture
    test_path_or_plan: Inspect namespace, integrity, concurrency and prohibited-state clauses.
    completion_rule: No cache, executable dependency tree, generated output or verdict can independently authorize PASS.

  - <<: *requirement_defaults
    requirement_id: WC108-R011
    source: Section 4.4
    observable_outcome: Unknown impact selects full applicable validation while trust ambiguity blocks rather than fabricates authority.
    component_owner: Validation selection and trust architecture
    test_path_or_plan: Inspect separate fail-closed behavior for impact uncertainty and trust uncertainty.
    completion_rule: Selection uncertainty broadens execution; missing identity or trust remains a blocker.

  - <<: *requirement_defaults
    requirement_id: WC108-R012
    source: Section 4.5
    observable_outcome: Failure evidence uses bounded routing classes without converting infrastructure failure into PASS.
    component_owner: Validation failure evidence architecture
    test_path_or_plan: Inspect RUNNER, WORKFLOW, PRODUCT, EXTERNAL and EVIDENCE definitions and authority rule.
    completion_rule: Every class routes ownership, retains raw evidence and preserves failure status.

  - <<: *requirement_defaults
    requirement_id: WC108-R013
    source: Section 5
    observable_outcome: Platform IT Expert process enforces the four-tier order and reports story evidence before advancing.

    test_path_or_plan: Inspect full and compact process instructions for ordered tiers and advancement conditions.
    completion_rule: Both agent routes require Tier 1, Tier 2, bounded Tier 3, freeze and Tier 4 in order.

  - <<: *requirement_defaults

openapi: 3.1.0
info:
  contact:
    name: WAOOAW Architecture
  description: |
    Generic private adapter contract for agent-specific induction, planning, dependency,
    material-change and performance semantics. It owns no public relationship, lifecycle,
    billing, authority, constitutional evidence or customer ordering truth.
  title: WAOOAW Conversational Employment Domain Adapter Candidate API
  version: 1.0.0-candidate.2
servers:
- url: https://domain-adapter.internal.waooaw
security:
- ServiceBearerAuth: []
tags:
- name: Employment Domain Semantics
paths:
  /internal/v1/employment-interface/manifest:
    get:
      description: Returns exact protocol and manifest support without reading mutable
        repository text at action time.
      operationId: getEmploymentInterfaceManifest
      parameters:
      - $ref: "#/components/parameters/AgentType"
      - $ref: "#/components/parameters/AgentVersion"
      - $ref: "#/components/parameters/ManifestVersion"
      - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentInterfaceManifestV1"
          description: Exact manifest
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      summary: Resolve one exact immutable agent employment interface manifest
      tags:
      - Employment Domain Semantics
  /internal/v1/relationships/{relationshipId}/employment/induction-requirements:
    get:
      description: Returns versioned domain requirements and affected Skills without
        owning BP readiness.
      operationId: getInductionRequirementSet
      parameters:
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/ManifestVersion"
      - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InductionRequirementSetV1"
          description: Versioned induction requirement set
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      summary: Get profession-specific induction requirements in generic envelopes
      tags:
      - Employment Domain Semantics
  /internal/v1/relationships/{relationshipId}/employment/plan-validation:
    post:
      description: Assesses a candidate against admitted domain semantics while BP
        retains plan acceptance.
      operationId: validatePlanCandidate
      parameters:
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanValidationRequestV1"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanValidationAssessmentV1"
          description: Domain assessment
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      summary: Validate domain semantics without accepting or authorizing the plan
      tags:
      - Employment Domain Semantics
  /internal/v1/relationships/{relationshipId}/employment/material-change-classification:
    post:
      description: Returns domain materiality and affected references; protected BP
        materiality categories remain mandatory.
      operationId: classifyMaterialChange
      parameters:
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialChangeRequestV1"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialChangeAssessmentV1"
          description: Domain materiality assessment
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      summary: Classify domain materiality and affected work without changing plan
        state
      tags:
      - Employment Domain Semantics
  /internal/v1/relationships/{relationshipId}/employment/dependency-isolation:
    post:
      description: Proves bounded isolation or returns unknown so BP can fail closed
        for dependent work.
      operationId: evaluateDependencyIsolation
      parameters:
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DependencyIsolationRequestV1"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyIsolationAssessmentV1"
          description: Isolation assessment
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      summary: Prove or reject bounded Skill isolation after dependency change
      tags:
      - Employment Domain Semantics
  /internal/v1/relationships/{relationshipId}/employment/performance-assessments/{reviewPeriodRef}:
    get:
      description: Returns evidence-linked domain meaning without converting technical
        execution metrics into business outcomes.
      operationId: getPerformanceAssessment
      parameters:
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/ReviewPeriodRef"
      - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceAssessmentV1"
          description: Domain performance assessment
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      summary: Get domain business-outcome and agent-performance meanings separately
      tags:
      - Employment Domain Semantics
components:
  parameters:
    RelationshipId:
      explode: false
      in: path
      name: relationshipId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    AgentType:
      explode: true
      in: query
      name: agentType
      required: true
      schema:
        maxLength: 100
        minLength: 1
        type: string
      style: form
    AgentVersion:
      explode: true
      in: query
      name: agentVersion
      required: true
      schema:
        maxLength: 64
        minLength: 1
        type: string
      style: form
    ManifestVersion:
      explode: true
      in: query
      name: manifestVersion
      required: true
      schema:
        maxLength: 64
        minLength: 1
        type: string
      style: form
    ReviewPeriodRef:
      explode: false
      in: path
      name: reviewPeriodRef
      required: true
      schema:
        maxLength: 128
        minLength: 1
        type: string
      style: simple
    IdempotencyKey:
      explode: false
      in: header
      name: Idempotency-Key
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    CorrelationId:
      explode: false
      in: header
      name: X-Correlation-Id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  responses:
    InvalidRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DomainEmploymentProblemV1"
      description: Invalid generic envelope or unsupported domain reference
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DomainEmploymentProblemV1"
      description: "Invalid service assertion, audience, purpose or relationship delegation"
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DomainEmploymentProblemV1"
      description: Resource absent or inaccessible
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DomainEmploymentProblemV1"
      description: "Idempotency, exact-version or source conflict"
    Unavailable:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DomainEmploymentProblemV1"
      description: Adapter cannot provide current domain meaning

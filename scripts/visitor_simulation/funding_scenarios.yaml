  - id: PR01-pricing-version-cutover
    title: After a pricing cutover an existing customer stays on the pinned version until renewal and a new hire gets the new one
    source: architecture 6.11 pricing versions; contract C5-01
    steps:
      - id: hire-before-cutover
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: customer-2, agent: dma}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
          fields:
            "pinnedPricingVersion": price-v1
      - id: only-founder-publishes
        actor: SUPPORT
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: publish_pricing
        params: {versionId: price-v2, priceInclGstPaise: 250000}
        expect:
          status: 403
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: PRICING_FORBIDDEN}
      - id: founder-publishes
        actor: FOUNDER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: publish_pricing
        params: {versionId: price-v2, priceInclGstPaise: 250000}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: PRICING_EFFECTIVE}
          fields:
            "currentVersion": price-v2
      - id: existing-customer-stays-pinned
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: NONE
        action: read_relationship
        params: {relationship: h1}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: RELATIONSHIP_READ}
          fields:
            "pinnedPricingVersion": price-v1
            "pricePaise": 200000
            "currentPricingVersion": price-v2
      - id: work-before-renewal
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1, repeat: 3}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -300}
          customerVisible: {outcome: WORK_DONE, excludes: *money}
      - id: new-hire-gets-new-version
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h2, customer: customer-4, agent: dma}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
          fields:
            "pinnedPricingVersion": price-v2
      - id: renewal-re-pins
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: NONE
        action: renew
        params: {relationship: h1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: RENEWED, excludes: *money}
          fields:
            "lapsedPaise": 700
            "pinnedPricingVersion": price-v2
            "pricePaise": 250000

  - id: FC01-wbe-unavailable-fails-closed-to-free-path
    title: With the wallet service down metered spending stops with the free-path disclosure while safety stays on the floor
    source: architecture 6.10.2 failure table; contract C3-05
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: customer-2, agent: dma}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: wbe-goes-down
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: wbe_fault
        params: {available: false}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: FAULT_SET}
          fields:
            "wbeAvailable": false
      - id: work-fails-closed
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1}
        expect:
          status: 503
          accountClass: SUBSCRIPTION
          walletMovement: NONE
          customerVisible: {outcome: SPEND_COMMERCIAL_UNAVAILABLE, contains: ["answering without them"], excludes: *money}
          fields:
            "balances.relationships.h1.SUBSCRIPTION": 1000
      - id: visitor-fails-closed
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: visitor_turn
        params: {lead: visitor-1, tenant: marketplace-a}
        expect:
          status: 503
          accountClass: ACQUISITION
          walletMovement: NONE
          customerVisible: {outcome: SPEND_COMMERCIAL_UNAVAILABLE, contains: ["answering without them"], excludes: *money}
          fields:
            "balances.ACQUISITION": 0
      - id: onboarding-fails-closed
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: ONBOARDING
        action: onboarding_turn
        params: {relationship: h1}
        expect:
          status: 503
          accountClass: SETUP_GRANT
          walletMovement: NONE
          customerVisible: {outcome: SPEND_COMMERCIAL_UNAVAILABLE, excludes: *money}
      - id: safety-stays-on-floor
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: SAFETY_FLOOR
        action: emergency_stop
        params: {}
        expect:
          accountClass: PLATFORM_FLOOR
          walletMovement: {account: PLATFORM_FLOOR, unit: PAISE, delta: -60}
          customerVisible: {outcome: STOP_ACKNOWLEDGED, silent: false}
      - id: wbe-recovers
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: wbe_fault
        params: {available: true}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: FAULT_SET}
          fields:
            "wbeAvailable": true
      - id: work-resumes
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -100}
          customerVisible: {outcome: WORK_DONE, excludes: *money}

  - id: FC02-expired-trial-fails-closed

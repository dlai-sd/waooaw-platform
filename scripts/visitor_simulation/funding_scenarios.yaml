        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: pause_skill
        params: {relationship: h1, feeSharePaise: 50000, remainingSeconds: 1296000, periodSeconds: 2592000}
        expect:

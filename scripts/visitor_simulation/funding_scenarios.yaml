            "walletRefund": false
            "balances.relationships.h1.SUBSCRIPTION": 1000
      - id: pause-rounds-half-up
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: pause_skill
        params: {relationship: h1, feeSharePaise: 50001, remainingSeconds: 1296000, periodSeconds: 2592000}

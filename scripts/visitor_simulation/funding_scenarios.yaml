  - id: ST01-stop-is-acknowledged-once-and-resumes-on-start
    title: STOP is acknowledged exactly once, later turns are suppressed and START resumes with the resume notice
    source: protocol policy (Track A); architecture walk-through 8
    steps:
      - id: first-stop
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: SAFETY_FLOOR
        action: emergency_stop
        params: {}
        expect:
          accountClass: PLATFORM_FLOOR
          walletMovement: {account: PLATFORM_FLOOR, unit: PAISE, delta: -60}
          customerVisible: {outcome: STOP_ACKNOWLEDGED, silent: false, excludes: *money}
          fields:
            "acknowledgements": 1
      - id: second-stop-is-silent
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: SAFETY_FLOOR
        action: emergency_stop
        params: {}
        expect:
          accountClass: PLATFORM_FLOOR
          walletMovement: {account: PLATFORM_FLOOR, unit: PAISE, delta: -60}
          customerVisible: {outcome: STOP_ALREADY_ACKNOWLEDGED, silent: true}
          fields:
            "acknowledgements": 1
            "balances.PLATFORM_FLOOR": 120
      - id: turn-after-stop-suppressed
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: visitor_turn
        params: {lead: visitor-1, tenant: marketplace-a}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: SUPPRESSED_AFTER_STOP, silent: true}
          fields:
            "balances.ACQUISITION": 0
      - id: start
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PLATFORM_SUPPORT
        action: start_message
        params: {}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: START_NOTICE_SENT, silent: false, excludes: *money}
          fields:
            "consentRequiredAgain": true
      - id: turn-after-start
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: visitor_turn
        params: {lead: visitor-1, tenant: marketplace-a}
        expect:
          accountClass: ACQUISITION
          walletMovement: {account: ACQUISITION, unit: PAISE, delta: -40}
          customerVisible: {outcome: VISITOR_REPLIED, excludes: *money}

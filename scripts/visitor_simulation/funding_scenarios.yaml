  - id: WT10-pause-skill-pro-rata
    title: Pausing a skill is a pro-rata billing adjustment, never a wallet refund
    source: architecture 6.10 walk-through 10
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: customer-2, agent: dma}
        expect:
          accountClass: SUBSCRIPTION

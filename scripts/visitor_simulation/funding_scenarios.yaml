          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: 500}
          customerVisible: {outcome: TRIAL_STARTED, excludes: *money}
      - id: timed-out-work
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: t1, fault: TIMEOUT}
        expect:
          accountClass: TRIAL
          walletMovement: NONE
          customerVisible: {outcome: WORK_UNCONFIRMED, contains: ["confirm"], excludes: *money}
          fields:
            "reservation.open": 1
            "reservation.pinnedClass": TRIAL
            "balances.relationships.t1.reservedPaise": 100
            "balances.relationships.t1.openReservations": 1
      - id: convert
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: NONE
        action: convert_trial
        params: {relationship: t1}
        expect:
          accountClass: SUBSCRIPTION

          walletMovement: {account: TRIAL, unit: PAISE, delta: 500}
          customerVisible: {outcome: TRIAL_STARTED, excludes: *money}
      - id: agent-alert
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: TRIAL

  - id: WT11a-flood-absorbed-per-tenant
    title: A visitor flood exhausts only its tenant's ACQUISITION level, refuses the surplus and spares other tenants
    source: architecture 6.10 walk-through 11; S7
    steps:
      - id: flood-tenant-a
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: flood
        params: {tenant: marketplace-a, visitors: 30}
        expect:
          accountClass: ACQUISITION
          walletMovement: {account: ACQUISITION, unit: PAISE, delta: -1000}
          customerVisible: {outcome: FLOOD_ABSORBED, contains: ["short version"], excludes: *money}
          fields:
            "served": 25
            "refused": 5
            "exhaustedLevel": TENANT
            "balances.breaker.open": false
      - id: other-tenant-served
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: flood
        params: {tenant: marketplace-b, visitors: 5}
        expect:
          accountClass: ACQUISITION
          walletMovement: {account: ACQUISITION, unit: PAISE, delta: -200}
          customerVisible: {outcome: FLOOD_SERVED, silent: true}
          fields:
            "refused": 0
            "balances.ACQUISITION": 1200
      - id: exhausted-tenant-scripted
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: visitor_turn
        params: {lead: visitor-9, tenant: marketplace-a}
        expect:
          accountClass: ACQUISITION
          walletMovement: NONE
          customerVisible: {outcome: ACQUISITION_BUDGET_EXHAUSTED, contains: ["short version"], excludes: *money}


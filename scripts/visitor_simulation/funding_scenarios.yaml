        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: acknowledge-before-told
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: ONBOARDING
        action: acknowledge_setup_exhaustion
        params: {relationship: h1}
        expect:
          status: 409
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: SETUP_EXHAUSTION_NOT_DISCLOSED}
      - id: setup-turns
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: ONBOARDING
        action: onboarding_turn
        params: {relationship: h1, repeat: 3}
        expect:
          accountClass: SETUP_GRANT
          walletMovement: {account: SETUP_GRANT, unit: PAISE, delta: -300}
          customerVisible: {outcome: ONBOARDING_DONE, excludes: *money}
          fields:
            "continuesOnSubscription": false
            "balances.relationships.h1.SETUP_GRANT": 0
      - id: setup-exhausted
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: ONBOARDING
        action: onboarding_turn
        params: {relationship: h1}
        expect:
          accountClass: SETUP_GRANT
          walletMovement: NONE
          customerVisible: {outcome: SETUP_GRANT_EXHAUSTED, contains: ["limited help"], excludes: *money}
          fields:
            "balances.relationships.h1.SUBSCRIPTION": 1000
      - id: acknowledge
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: ONBOARDING
        action: acknowledge_setup_exhaustion
        params: {relationship: h1}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: SETUP_EXHAUSTION_ACKNOWLEDGED, excludes: *money}
      - id: setup-continues
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: ONBOARDING
        action: onboarding_turn
        params: {relationship: h1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -100}
          customerVisible: {outcome: ONBOARDING_DONE, excludes: *money}
          fields:
            "continuesOnSubscription": true
            "balances.relationships.h1.SUBSCRIPTION": 900
            "balances.relationships.h1.SETUP_GRANT": 0

  - id: SG02-setup-grant-exhaustion-in-trial
    title: A trial never continues setup on a paid account; the limitation stays honest after acknowledgement
    source: contract C4-06 setup grant; architecture 6.10.3
    steps:
      - id: start-trial
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: start_trial
        params: {relationship: t1, customer: customer-1, agent: dma, version: "1.0.0"}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: 500}
          customerVisible: {outcome: TRIAL_STARTED, excludes: *money}
      - id: setup-turns
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: ONBOARDING
        action: onboarding_turn
        params: {relationship: t1, repeat: 3}
        expect:
          accountClass: SETUP_GRANT
          walletMovement: {account: SETUP_GRANT, unit: PAISE, delta: -300}
          customerVisible: {outcome: ONBOARDING_DONE, excludes: *money}
      - id: setup-exhausted
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: ONBOARDING
        action: onboarding_turn
        params: {relationship: t1}
        expect:
          accountClass: SETUP_GRANT
          walletMovement: NONE
          customerVisible: {outcome: SETUP_GRANT_EXHAUSTED, contains: ["limited help"], excludes: *money}
      - id: acknowledge
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: ONBOARDING
        action: acknowledge_setup_exhaustion
        params: {relationship: t1}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: SETUP_EXHAUSTION_ACKNOWLEDGED}
      - id: still-limited
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: ONBOARDING
        action: onboarding_turn
        params: {relationship: t1}
        expect:
          accountClass: SETUP_GRANT
          walletMovement: NONE
          customerVisible: {outcome: SETUP_GRANT_EXHAUSTED, contains: ["limited help"], excludes: *money}
          fields:
            "balances.relationships.t1.TRIAL": 500

  - id: PA01-proactive-message-allowance-of-30
    title: Thirty agent-initiated messages per month are allowed; the next is delivered in the portal and the next turn instead
    source: contract C4-12 proactive allowance; architecture 6.10.3
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: customer-2, agent: dma}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: first-29
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: proactive_send
        params: {relationship: h1, kind: AGENT_ALERT, count: 29}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: MESSAGES, delta: -29}
          customerVisible: {outcome: PROACTIVE_SENT, excludes: *money}
          fields:
            "proactive.used": 29
            "proactive.allowance": 30
      - id: thirtieth
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: proactive_send
        params: {relationship: h1, kind: AGENT_ALERT, count: 1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: MESSAGES, delta: -1}
          customerVisible: {outcome: PROACTIVE_SENT, excludes: *money}
          fields:
            "proactive.used": 30
      - id: thirty-first
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: proactive_send
        params: {relationship: h1, kind: AGENT_ALERT, count: 1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: NONE
          customerVisible: {outcome: PROACTIVE_ALLOWANCE_EXHAUSTED, contains: ["portal"], excludes: *money}
          fields:
            "sent": 0
            "deliveredIn": PORTAL_AND_NEXT_TURN
            "proactive.used": 30
      - id: capacity-notice-still-sent
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: SAFETY_FLOOR
        action: proactive_send
        params: {relationship: h1, kind: CAPACITY_NOTICE, count: 1}
        expect:
          accountClass: PLATFORM_FLOOR
          walletMovement: {account: PLATFORM_FLOOR, unit: PAISE, delta: -60}
          customerVisible: {outcome: PROACTIVE_SENT, excludes: *money}
          fields:
            "counted": false
      - id: emergency-alert-still-sent
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: SAFETY_FLOOR
        action: proactive_send
        params: {relationship: h1, kind: EMERGENCY_ALERT, count: 1}
        expect:
          accountClass: PLATFORM_FLOOR
          walletMovement: {account: PLATFORM_FLOOR, unit: PAISE, delta: -60}
          customerVisible: {outcome: PROACTIVE_SENT, excludes: *money}
          fields:
            "counted": false
            "balances.relationships.h1.SUBSCRIPTION": 1000

  - id: PA02-trial-has-no-proactive-allowance
    title: A trial has no agent-initiated message allowance, so the message is held for the portal and the next turn
    source: contract C4-12 proactive allowance
    steps:
      - id: start-trial
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: start_trial
        params: {relationship: t1, customer: customer-1, agent: dma, version: "1.0.0"}
        expect:

          customerVisible: {outcome: TRIAL_CONVERTED, excludes: *money}
          fields:
            "lapsed.TRIAL": 400
            "balances.relationships.t1.TRIAL": 100
            "balances.relationships.t1.reservedPaise": 100
      - id: reconcile
        actor: PLATFORM
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: reconcile
        params: {relationship: t1}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: -100}
          customerVisible: {outcome: WORK_CONFIRMED, excludes: *money}
          fields:
            "pinnedClass": TRIAL
            "balances.relationships.t1.TRIAL": 0
            "balances.relationships.t1.SUBSCRIPTION": 1000
            "balances.relationships.t1.reservedPaise": 0
            "balances.relationships.t1.openReservations": 0

  - id: S01-beneficiary-never-sees-money
    title: A beneficiary never sees a price, a balance or a top-up control; the owner does and is the only one who can top up
    source: architecture S1
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: owner-1, agent: tutor}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: beneficiary-view
        actor: BENEFICIARY
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: render_for
        params: {relationship: h1, audience: BENEFICIARY}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible:
            outcome: RENDERED_FOR_BENEFICIARY
            excludes: &moneyUi ["₹", "rupee", "paise", "price", "top-up", "top up", "wallet", "balance", "invoice", "refund", "allowance", "%"]
          fields:
            "controls": []
      - id: beneficiary-half-used
        actor: BENEFICIARY
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1, repeat: 5}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -500}
          customerVisible: {outcome: WORK_DONE, contains: ["account holder"], excludes: *moneyUi}
          fields:
            "notices.0": CAPACITY_50
      - id: beneficiary-credit-running-out
        actor: BENEFICIARY
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1, repeat: 5}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -500}
          customerVisible: {outcome: WORK_DONE, contains: ["account holder"], excludes: *moneyUi}
          fields:
            "notices.0": CAPACITY_85
            "notices.1": CAPACITY_EMPTY
      - id: beneficiary-at-zero
        actor: BENEFICIARY
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: NONE
          customerVisible: {outcome: WALLET_EMPTY_FREE_PATH, contains: ["account holder"], excludes: *moneyUi}
      - id: beneficiary-cannot-top-up
        actor: BENEFICIARY
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: request_topup
        params: {relationship: h1}
        expect:
          status: 403
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: TOPUP_NOT_PERMITTED, contains: ["account holder"], excludes: *moneyUi}
          fields:
            "balances.relationships.h1.SUBSCRIPTION": 0
      - id: owner-sees-top-up
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: render_for
        params: {relationship: h1, audience: OWNER}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: RENDERED_FOR_OWNER, contains: ["100% used"]}
          fields:
            "controls.0": TOPUP_THIS_AGENT
      - id: owner-tops-up
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: request_topup
        params: {relationship: h1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 500}
          customerVisible: {outcome: TOPUP_APPLIED}


# Implements: work-contracts/WC-136-common-agent-workbench-spend-accounts-and-pricing-engine.md C7-01
# Constitutional basis: C-048, C-049, C-059, C-063
# Funding scenario pack: walk-throughs 1-12 of architecture 6.10 and the funding-related scenarios S1-S12, run against the
# loopback fake (scripts/visitor_simulation/funding_fake.py). Amounts are fabricated paise; assertions are on account
# class, wallet movement, outcome code and the absence of money words, never on customer copy.
schema: wc136-scenario-pack/1.0
pack: funding
seed: 136
scenarios:
  - id: WT01-anonymous-visitor-acquisition
    title: An anonymous visitor's turns are paid from the ACQUISITION budget
    source: architecture 6.10 walk-through 1
    steps:
      - id: first-turn
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: visitor_turn
        params: {lead: visitor-1, tenant: marketplace-a}
        expect:
          accountClass: ACQUISITION
          walletMovement: {account: ACQUISITION, unit: PAISE, delta: -40}
          customerVisible:
            outcome: VISITOR_REPLIED
            excludes: &money ["₹", "rupee", "paise", "price", "top-up", "top up", "wallet", "balance", "invoice", "refund"]
          fields:
            "leadRef": {$regex: "lead-[0-9a-f]{12}"}
            "balances.ACQUISITION": 40
            "balances.ACQUISITION_TENANTS.marketplace-a": 40
      - id: second-turn
        actor: VISITOR
        channel: WHATSAPP
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: visitor_turn
        params: {lead: visitor-1, tenant: marketplace-a}
        expect:
          accountClass: ACQUISITION
          walletMovement: {account: ACQUISITION, unit: PAISE, delta: -40}
          customerVisible: {outcome: VISITOR_REPLIED, excludes: *money}
          fields:
            "balances.ACQUISITION": 80
            "balances.PLATFORM_FLOOR": 0

  - id: WT02-web-handoff-pseudonymous-lead
    title: A web handoff stays on ACQUISITION and links the visitor through opaque references only
    source: architecture 6.10 walk-through 2; S12
    steps:
      - id: handoff
        actor: VISITOR
        channel: WEB
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: web_handoff
        params: {lead: visitor-1, customer: customer-1}
        expect:
          accountClass: ACQUISITION
          walletMovement: NONE
          customerVisible: {outcome: LEAD_ATTRIBUTED, excludes: *money}
          fields:
            "leadRef": {$regex: "lead-[0-9a-f]{12}"}
            "linkedSubject": {$regex: "subj-[0-9a-f]{12}"}
            "balances.ACQUISITION": 0
      - id: web-turn
        actor: VISITOR
        channel: WEB
        relationshipState: NONE
        purpose: PRESALES_OR_MARKETPLACE
        action: visitor_turn
        params: {lead: visitor-1, tenant: marketplace-a}
        expect:
          accountClass: ACQUISITION
          walletMovement: {account: ACQUISITION, unit: PAISE, delta: -40}
          customerVisible: {outcome: VISITOR_REPLIED, excludes: *money}
          fields:
            "leadRef": {$regex: "lead-[0-9a-f]{12}"}

  - id: WT03-trial-funding
    title: Starting a trial funds the TRIAL account and the setup grant, and trial work draws on TRIAL
    source: architecture 6.10 walk-through 3
    steps:
      - id: start-trial
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: start_trial
        params: {relationship: t1, customer: customer-1, agent: dma, version: "1.0.0"}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: 500}
          customerVisible: {outcome: TRIAL_STARTED, excludes: *money}
          fields:
            "relationshipId": {$regex: "rel-[0-9a-f]{12}"}
            "balances.relationships.t1.TRIAL": 500
            "balances.relationships.t1.SETUP_GRANT": 300
            "balances.relationships.t1.SUBSCRIPTION": 0
      - id: trial-work
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: t1}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: -100}
          customerVisible: {outcome: WORK_DONE, contains: ["Done"], excludes: *money}
          fields:
            "balances.relationships.t1.TRIAL": 400
            "balances.relationships.t1.SETUP_GRANT": 300

  - id: WT04-convert-trial-lapses-leftovers
    title: Converting a trial credits the SUBSCRIPTION account and lets the trial and setup leftovers lapse
    source: architecture 6.10 walk-through 4
    steps:
      - id: start-trial
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: start_trial
        params: {relationship: t1, customer: customer-1, agent: dma, version: "1.0.0"}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: 500}
          customerVisible: {outcome: TRIAL_STARTED, excludes: *money}
      - id: trial-work
        actor: CUSTOMER
        channel: WEB
        relationshipState: TRIAL
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: t1, repeat: 2}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: -200}
          customerVisible: {outcome: WORK_DONE, excludes: *money}
      - id: convert
        actor: CUSTOMER
        channel: WEB
        relationshipState: TRIAL
        purpose: NONE
        action: convert_trial
        params: {relationship: t1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: TRIAL_CONVERTED, excludes: *money}
          fields:
            "lapsed.TRIAL": 300
            "lapsed.SETUP_GRANT": 300
            "pinnedPricingVersion": price-v1
            "balances.relationships.t1.TRIAL": 0
            "balances.relationships.t1.SETUP_GRANT": 0
            "balances.relationships.t1.SUBSCRIPTION": 1000
      - id: hired-work
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: t1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -100}
          customerVisible: {outcome: WORK_DONE, excludes: *money}

  - id: WT05-hired-customer-presales-on-another-agent
    title: A hired customer browsing another agent is paid from ACQUISITION and leaves the wallet untouched
    source: architecture 6.10 walk-through 5
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: customer-2, agent: dma}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
          fields:
            "pinnedPricingVersion": price-v1
      - id: browse-other-agent
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: PRESALES_OR_MARKETPLACE
        action: marketplace_turn
        params: {relationship: h1, tenant: marketplace-a}
        expect:
          accountClass: ACQUISITION
          walletMovement: {account: ACQUISITION, unit: PAISE, delta: -40}
          customerVisible: {outcome: MARKETPLACE_REPLIED, excludes: *money}
          fields:
            "balances.relationships.h1.SUBSCRIPTION": 1000
            "balances.ACQUISITION": 40

  - id: WT06-switch-request-spends-nothing
    title: Asking to switch agents is offered without charging any agent's wallet
    source: architecture 6.10 walk-through 6
    steps:
      - id: hire-first
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: a1, customer: customer-3, agent: agent-a}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: hire-second
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: b1, customer: customer-3, agent: agent-b}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: switch
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: switch_request
        params: {relationship: a1, requested: b1}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: FOCUS_SWITCH_OFFERED, excludes: *money}
          fields:
            "agentWorkCharged": false
            "balances.relationships.a1.SUBSCRIPTION": 1000
            "balances.relationships.b1.SUBSCRIPTION": 1000
            "balances.ACQUISITION": 0

  - id: WT07a-trial-component-limit
    title: Reaching a trial component limit gives the honest limitation after the units that were available
    source: architecture 6.10 walk-through 7 (component limit)
    steps:
      - id: start-trial
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: start_trial
        params: {relationship: t1, customer: customer-1, agent: dma, version: "1.0.0"}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: 500}
          customerVisible: {outcome: TRIAL_STARTED, excludes: *money}
      - id: three-posts
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: TRIAL
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: t1, component: POSTS, repeat: 3}
        expect:
          accountClass: TRIAL
          walletMovement: {account: TRIAL, unit: PAISE, delta: -200}
          customerVisible: {outcome: COMPONENT_LIMIT_REACHED, contains: ["limited help"], excludes: *money}
          fields:
            "served": 2
            "componentUnitsUsed": 2

  - id: WT07b-hired-component-limit
    title: A hired agent that used its component units answers honestly and the wallet is not drained for it
    source: architecture 6.10 walk-through 7 (component limit)
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: customer-2, agent: dma}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: four-posts
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1, component: POSTS, repeat: 4}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -400}
          customerVisible: {outcome: WORK_DONE, excludes: *money}
          fields:
            "componentUnitsUsed": 4
      - id: fifth-post
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1, component: POSTS}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: NONE
          customerVisible: {outcome: COMPONENT_LIMIT_REACHED, contains: ["limited help"], excludes: *money}
          fields:
            "served": 0
            "balances.relationships.h1.SUBSCRIPTION": 600
      - id: owner-sees-units
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: render_for
        params: {relationship: h1, audience: OWNER, component: POSTS}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: RENDERED_FOR_OWNER, contains: ["0 posts left", "40% used"]}
          fields:
            "controls": []

  - id: WT07c-wallet-85-percent-and-empty
    title: Capacity notices at 50% and 85% and at empty, honest free path at zero, other agents unaffected, top-up for that agent only
    source: architecture 6.10 walk-through 7 (wallet 85% and 0)
    steps:
      - id: hire-first
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: a1, customer: customer-3, agent: agent-a}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: hire-second
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: b1, customer: customer-3, agent: agent-b}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: reach-50-percent
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: a1, repeat: 5}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -500}
          customerVisible: {outcome: WORK_DONE, contains: ["Half"], excludes: *money}
          fields:
            "notices.0": CAPACITY_50
            "notices.1": {$absent: true}
            "noticeDelivery": NEXT_TURN
      - id: reach-85-percent
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: a1, repeat: 4}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -400}
          customerVisible: {outcome: WORK_DONE, contains: ["Most"], excludes: *money}
          fields:
            "notices.0": CAPACITY_85
            "notices.1": {$absent: true}
      - id: owner-sees-top-up-control
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: render_for
        params: {relationship: a1, audience: OWNER}
        expect:
          accountClass: NONE
          walletMovement: NONE
          customerVisible: {outcome: RENDERED_FOR_OWNER, contains: ["90% used"]}
          fields:
            "controls.0": TOPUP_THIS_AGENT
      - id: reach-empty
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: a1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -100}
          customerVisible: {outcome: WORK_DONE, contains: ["used up"], excludes: *money}
          fields:
            "notices.0": CAPACITY_EMPTY
      - id: free-path-at-zero
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: a1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: NONE
          customerVisible: {outcome: WALLET_EMPTY_FREE_PATH, contains: ["limited help"], excludes: *money}
          fields:
            "balances.relationships.a1.SUBSCRIPTION": 0
      - id: other-agent-unaffected
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: b1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -100}
          customerVisible: {outcome: WORK_DONE, excludes: *money}
          fields:
            "balances.relationships.b1.SUBSCRIPTION": 900
      - id: top-up-this-agent
        actor: CUSTOMER
        channel: WEB
        relationshipState: HIRED
        purpose: PLATFORM_SUPPORT
        action: request_topup
        params: {relationship: a1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 500}
          customerVisible: {outcome: TOPUP_APPLIED}
          fields:
            "balances.relationships.a1.SUBSCRIPTION": 500
            "balances.relationships.b1.SUBSCRIPTION": 900
      - id: work-after-top-up
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: a1}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -100}
          customerVisible: {outcome: WORK_DONE, excludes: *money}

  - id: WT08-emergency-stop-at-zero-wallet
    title: An emergency stop is honoured from the PLATFORM_FLOOR when the agent's wallet is empty
    source: architecture 6.10 walk-through 8
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: NONE
        action: hire
        params: {relationship: h1, customer: customer-2, agent: dma}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: 1000}
          customerVisible: {outcome: HIRED, excludes: *money}
      - id: drain-wallet
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: HIRED
        purpose: AGENT_WORK
        action: work_turn
        params: {relationship: h1, repeat: 10}
        expect:
          accountClass: SUBSCRIPTION
          walletMovement: {account: SUBSCRIPTION, unit: PAISE, delta: -1000}
          customerVisible: {outcome: WORK_DONE, excludes: *money}
          fields:
            "balances.relationships.h1.SUBSCRIPTION": 0
      - id: stop
        actor: CUSTOMER
        channel: WHATSAPP
        relationshipState: NONE
        purpose: SAFETY_FLOOR
        action: emergency_stop
        params: {}
        expect:
          accountClass: PLATFORM_FLOOR
          walletMovement: {account: PLATFORM_FLOOR, unit: PAISE, delta: -60}
          customerVisible: {outcome: STOP_ACKNOWLEDGED, silent: false, excludes: *money}
          fields:
            "balances.relationships.h1.SUBSCRIPTION": 0
            "balances.PLATFORM_FLOOR": 60


  - id: SG01-setup-grant-exhaustion-on-hire
    title: When the setup grant runs out the customer is told honestly and, after acknowledging, setup continues on SUBSCRIPTION
    source: contract C4-06 setup grant; architecture 6.10.3
    steps:
      - id: hire
        actor: CUSTOMER
        channel: WEB
        relationshipState: NONE
        purpose: NONE

openapi: "3.1.0"
info:
  title: WAOOAW Pricing Admin API
  version: "1.0.0"
  contact:
    name: WAOOAW Architecture
  description: |
    Implements: work-contracts/WC-136-common-agent-workbench-spend-accounts-and-pricing-engine.md C2-05.
    Constitutional basis: C-059, C-051, C-088, C-089, C-090, C-091, DP-005.

    Public admin slice of the pricing and spend console. Business Platform is the only public
    facade; the Billing Engine (WBE) is reached only through the ADR-046 private boundary
    described by `wbe-pricing-admin.openapi.yaml`, and no raw WBE error is ever returned.

    Every change is a versioned draft that is simulated, submitted, authorized by the Founder and
    then effective. Versions are never edited in place. A version object always carries
    `effectiveFrom`, `supersedes`, `authorizedBy` and `evidenceId` (null until set).

    Roles: reads, drafts, simulation, submission, discarding and the safety operations require
    realm role `pricing_admin` or `founder`. Authorize and activate-for-sale require `founder`
    plus a step-up authentication. An administrator can never authorize or activate.

    Money is an integer number of paise. Prices carry `taxTreatment: GST_INCLUSIVE`. Aggregates in
    dashboards contain no personal data; lead references are pseudonymous.
servers:
  - url: https://api.waooaw.com
tags:
  - name: Pricing Drafts
    description: Draft, simulate, submit, authorize and discard versions of rates, packages, policy, grants, budgets and coupons.
  - name: Pricing Versions
    description: Version history, package activation for sale, export and import.
  - name: Pricing Safety
    description: Immediate safety-direction operations.
  - name: Pricing Reports
    description: Live margin watch and aggregate dashboards.
security:
  - bearerAuth: []
paths:
  /api/v1/admin/pricing/drafts:
    get:
      tags: [Pricing Drafts]
      summary: List pricing drafts
      operationId: listPricingDrafts
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/KindFilter"
        - $ref: "#/components/parameters/StateFilter"
        - $ref: "#/components/parameters/SubjectKeyFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of versions that are not yet effective
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Pricing Drafts]
      summary: Create a draft
      description: Creates a DRAFT version of the given kind for the subject. Nothing becomes effective by this call.
      operationId: createPricingDraft
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePricingDraftRequestV1" }
      responses:
        "200":
          description: Replayed draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionV1" }
        "201":
          description: Draft created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/drafts/{draftId}:
    get:
      tags: [Pricing Drafts]
      summary: Read a draft
      operationId: getPricingDraft
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Version
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [Pricing Drafts]
      summary: Replace the body of a draft
      description: Allowed only in DRAFT, SIMULATED or SUBMITTED-then-returned state; any edit returns the version to DRAFT and discards its simulation.
      operationId: updatePricingDraft
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePricingDraftRequestV1" }
      responses:
        "200":
          description: Updated draft
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/drafts/{draftId}/simulate:
    post:
      tags: [Pricing Drafts]
      summary: Simulate a draft
      description: |
        Computes the effect of the draft without writing any pricing state other than the
        simulated marker. For a PACKAGE draft it returns the cost floor, base price, GST, margin,
        minimum compliant price, the diff from the effective version and the expected monthly cost
        for the BEST_CASE (20 percent of every quantity), TYPICAL (60 percent) and WORST_CASE
        (everything on day one, then terminate on day two) profiles. For a RATE draft it lists the
        effective packages whose floor would change.
      operationId: simulatePricingDraft
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulatePricingDraftRequestV1" }
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingSimulationResultV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/drafts/{draftId}/submit:
    post:
      tags: [Pricing Drafts]
      summary: Submit a simulated draft for authorization
      description: |
        A draft that moves a price, rate or ceiling by more than the policy change-size guard, or
        prices a package above the price-multiple guard, is marked as needing a second confirmation
        and is refused with `PRICING_NEEDS_SECOND_CONFIRMATION` unless `secondConfirmation` is true.
      operationId: submitPricingDraft
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitPricingDraftRequestV1" }
      responses:
        "200":
          description: Submitted version
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/drafts/{draftId}/authorize:
    post:
      tags: [Pricing Drafts]
      summary: Authorize a submitted version
      description: |
        Founder only, with step-up authentication. Constitutional evidence is recorded before the
        transition commits; unavailability of the evidence validator fails the authorization
        closed. `effectiveFrom` defaults to now or is a future instant; at that instant the
        previous effective version of the subject becomes SUPERSEDED. Existing customers keep the
        version pinned at their activation or last renewal.
      operationId: authorizePricingDraft
      x-required-roles: [founder]
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizePricingDraftRequestV1" }
      responses:
        "200":
          description: Authorized version
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/drafts/{draftId}/discard:
    post:
      tags: [Pricing Drafts]
      summary: Discard a version that is not effective
      operationId: discardPricingDraft
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/DraftId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscardPricingDraftRequestV1" }
      responses:
        "200":
          description: Discarded version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/versions:
    get:
      tags: [Pricing Versions]
      summary: List the versions of a subject
      operationId: listPricingVersions
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/KindFilter"
        - $ref: "#/components/parameters/SubjectKeyFilter"
        - $ref: "#/components/parameters/StateFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of versions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingVersionListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/versions/export:
    get:
      tags: [Pricing Versions]
      summary: Export the effective and authorized versions
      description: Returns a signed, versioned bundle of all EFFECTIVE and AUTHORIZED versions with their digests.
      operationId: exportPricingVersions
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Signed bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingExportBundleV1" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/versions/import:
    post:
      tags: [Pricing Versions]
      summary: Import a signed bundle as drafts
      description: |
        Every entry is validated through the same validators as a draft and created as a DRAFT
        version, never directly effective. A tampered digest or a below-floor package is refused
        entry by entry. Recovery of a reset environment is import followed by Founder authorization.
      operationId: importPricingVersions
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportPricingBundleRequestV1" }
      responses:
        "200":
          description: Import outcome per entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingImportResultV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/packages/{packageId}/activate-for-sale:
    post:
      tags: [Pricing Versions]
      summary: Activate an authorized package for sale
      description: |
        Founder only, with step-up authentication. A package may be authorized while components
        are DEFAULT_OFF or UNAVAILABLE but cannot be activated for sale until every component is
        AVAILABLE; otherwise the call returns `PACKAGE_COMPONENT_NOT_AVAILABLE` naming the component.
      operationId: activatePackageForSale
      x-required-roles: [founder]
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/PackageId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivatePackageForSaleRequestV1" }
      responses:
        "200":
          description: Package sale state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPackageSaleV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/safety/lower-ceiling:
    post:
      tags: [Pricing Safety]
      summary: Lower a budget ceiling immediately
      description: |
        Safety direction: takes effect now, is recorded with `direction=SAFETY` and notifies the
        Founder. Refused when the new maximum is above the current maximum or below the amount
        currently reserved and settled in the window; the response names the blocking amount.
      operationId: lowerPricingCeiling
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LowerCeilingRequestV1" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingSafetyResultV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/safety/close-package:
    post:
      tags: [Pricing Safety]
      summary: Close a package to new customers immediately
      description: Safety direction. Takes effect now, existing customers keep their pinned version, and the Founder is notified.
      operationId: closePackageToNewCustomers
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClosePackageRequestV1" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingSafetyResultV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/safety/disable-grant:
    post:
      tags: [Pricing Safety]
      summary: Disable a trial or setup grant immediately
      description: Safety direction. Takes effect now, is recorded with `direction=SAFETY` and notifies the Founder.
      operationId: disablePricingGrant
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableGrantRequestV1" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingSafetyResultV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/live-margin:
    get:
      tags: [Pricing Reports]
      summary: Read the live margin watch
      description: Effective packages recomputed at current rates that are below their cost floor or the minimum margin.
      operationId: getPricingLiveMargin
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Live margin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingLiveMarginV1" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/dashboard/funding:
    get:
      tags: [Pricing Reports]
      summary: Read the funding dashboard
      description: Aggregates only; no personal data, and lead references are pseudonymous.
      operationId: getPricingFundingDashboard
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Funding dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingFundingDashboardV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/admin/pricing/dashboard/margin:
    get:
      tags: [Pricing Reports]
      summary: Read the margin dashboard
      description: Aggregates only; actual versus recipe cost per component with the implied margin and tolerance state.
      operationId: getPricingMarginDashboard
      x-required-roles: [pricing_admin, founder]
      parameters:
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Margin dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingMarginDashboardV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token. Realm role `pricing_admin` or `founder` is required; authorize and activate additionally require a step-up authentication claim. Tenant and role are never taken from the request.
  headers:
    ETag:
      description: Opaque version of the returned resource; send it back as `expectedVersion` on the next change.
      schema: { type: string, minLength: 1, maxLength: 128 }
  parameters:
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Same key and canonical request replay the stored outcome; divergent reuse conflicts with `PRICING_IDEMPOTENCY_CONFLICT`.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    OptionalCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    KindFilter:
      name: kind
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PricingVersionKindV1" }
    StateFilter:
      name: state
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PricingVersionStateV1" }
    SubjectKeyFilter:
      name: subjectKey
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 300 }
    PeriodFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date }
    PeriodTo:
      name: to
      in: query
      required: false
      schema: { type: string, format: date }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    BadRequest:
      description: Request, header or schema version is malformed (`PRICING_REQUEST_INVALID`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
    Unauthorized:
      description: Credential is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
    Forbidden:
      description: The role is not permitted (`PRICING_FORBIDDEN`) or step-up authentication is missing (`PRICING_STEP_UP_REQUIRED`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
    NotFound:
      description: The version, package or subject does not exist (`PRICING_NOT_FOUND`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
    Conflict:
      description: Stale `expectedVersion` (`PRICING_VERSION_CONFLICT`), divergent idempotency reuse (`PRICING_IDEMPOTENCY_CONFLICT`), a second confirmation is required (`PRICING_NEEDS_SECOND_CONFIRMATION`), an illegal transition (`PRICING_ILLEGAL_TRANSITION`) or a ceiling below open reservations (`PRICING_CEILING_BELOW_OPEN_RESERVATIONS`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
    Unprocessable:
      description: The change is well formed but invalid (`PRICING_DRAFT_INVALID`, `PRICING_BELOW_FLOOR`, `PRICING_CEILING_ABOVE_MAXIMUM`, `PACKAGE_COMPONENT_NOT_AVAILABLE`, `RECIPE_THREAD_NOT_AUTHORIZED`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
    TooManyRequests:
      description: Per-subject limit for state-changing admin calls reached; retry after the stated delay (`PRICING_RATE_LIMITED`).
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
    Unavailable:
      description: The billing engine or the evidence validator is unavailable (`PRICING_UNAVAILABLE`); the call fails closed and is retry-safe.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PricingProblemDetailV1" }
  schemas:
    PricingProblemCodeV1:
      type: string
      enum:
        - PRICING_FORBIDDEN
        - PRICING_STEP_UP_REQUIRED
        - PRICING_DRAFT_INVALID
        - PRICING_BELOW_FLOOR
        - PRICING_NEEDS_SECOND_CONFIRMATION
        - PRICING_ILLEGAL_TRANSITION
        - PRICING_CEILING_ABOVE_MAXIMUM
        - PRICING_CEILING_BELOW_OPEN_RESERVATIONS
        - PACKAGE_COMPONENT_NOT_AVAILABLE
        - RECIPE_THREAD_NOT_AUTHORIZED
        - PRICING_REQUEST_INVALID
        - PRICING_NOT_FOUND
        - PRICING_VERSION_CONFLICT
        - PRICING_IDEMPOTENCY_CONFLICT
        - PRICING_RATE_LIMITED
        - PRICING_UNAVAILABLE
    PricingViolationV1:
      type: object
      additionalProperties: false
      required: [code, path, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 120 }
        path: { type: string, minLength: 1, maxLength: 240 }
        message: { type: string, minLength: 1, maxLength: 500 }
    PricingProblemDetailV1:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, minLength: 1, maxLength: 240 }
        title: { type: string, minLength: 1, maxLength: 240 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: "#/components/schemas/PricingProblemCodeV1" }
        correlationId: { type: string, minLength: 1, maxLength: 64 }
        detail: { type: string, maxLength: 500 }
        violations:
          type: array
          maxItems: 100
          description: Machine-readable violations; present with `PRICING_DRAFT_INVALID`.
          items: { $ref: "#/components/schemas/PricingViolationV1" }
        minimumCompliantPricePaise:
          type: integer
          format: int64
          minimum: 0
          description: Present with `PRICING_BELOW_FLOOR`; GST inclusive.
        blockingPaise:
          type: integer
          format: int64
          minimum: 0
          description: Present with `PRICING_CEILING_BELOW_OPEN_RESERVATIONS`.
        componentId:
          type: string
          minLength: 1
          maxLength: 160
          description: Present with `PACKAGE_COMPONENT_NOT_AVAILABLE`.
    PricingVersionKindV1:
      type: string
      enum: [RATE, PACKAGE, POLICY, GRANT, BUDGET, COUPON]
    PricingVersionStateV1:
      type: string
      enum: [DRAFT, SIMULATED, SUBMITTED, AUTHORIZED, EFFECTIVE, SUPERSEDED, DISCARDED]
    PricingComponentKindV1:
      type: string
      enum: [COUNTED, SELECTED, TIME_ACCESS, CAPACITY]
    PricingComponentCadenceV1:
      type: string
      enum: [SPREAD, UPFRONT, DAILY, WEEKLY, MONTHLY]
    PricingRateBodyV1:
      type: object
      additionalProperties: false
      required: [threadId, provider, unit, rawCostPaise, fxBufferPct, opsOverheadPct, riskPremiumPct]
      properties:
        threadId: { type: string, minLength: 1, maxLength: 128 }
        provider: { type: string, minLength: 1, maxLength: 120 }
        unit: { type: string, minLength: 1, maxLength: 64 }
        rawCostPaise: { type: integer, format: int64, minimum: 0 }
        fxBufferPct: { type: number, minimum: 0, maximum: 1000 }
        opsOverheadPct: { type: number, minimum: 0, maximum: 1000 }
        riskPremiumPct: { type: number, minimum: 0, maximum: 1000 }
    PricingRecipeEntryV1:
      type: object
      additionalProperties: false
      required: [threadId, unitsPerUnit]
      properties:
        threadId: { type: string, minLength: 1, maxLength: 128 }
        unitsPerUnit: { type: number, exclusiveMinimum: 0 }
    PricingPackageComponentBodyV1:
      type: object
      additionalProperties: false
      required: [componentId, kind, quantity, cadence, priceAllocationPaise, recipe, topupAllowed]
      properties:
        componentId: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/PricingComponentKindV1" }
        quantity: { type: integer, minimum: 0 }
        cadence: { $ref: "#/components/schemas/PricingComponentCadenceV1" }
        selectableMaximum: { type: integer, minimum: 1 }
        priceAllocationPaise: { type: integer, format: int64, minimum: 0 }
        recipe:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/PricingRecipeEntryV1" }
        topupAllowed: { type: boolean }
    PricingCostLineV1:
      type: object
      additionalProperties: false
      required: [componentId, threadId, quantity, unitsPerUnit, authorized]
      description: One ingredient line of one component. An unknown rate has no unit or line cost; it is never shown as zero.
      properties:
        componentId: { type: string }
        threadId: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitsPerUnit: { type: integer, minimum: 1 }
        unitCostPaise: { type: integer, format: int64, minimum: 0 }
        lineCostPaise: { type: integer, format: int64, minimum: 0 }
        authorized: { type: boolean }
    PricingBuildUpV1:
      type: object
      additionalProperties: false
      required: [costLines, infrastructureSharePaise, costFloorPaise, unauthorizedThreadIds, uncostedComponentIds, suggestionStatus]
      description: The package price build-up shown to the Founder. The suggested price is advice only; the final price is typed and saved by the Founder.
      properties:
        costLines:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PricingCostLineV1" }
        infrastructureSharePaise: { type: integer, format: int64, minimum: 0 }
        costFloorPaise: { type: integer, format: int64, minimum: 0 }
        unauthorizedThreadIds:
          type: array
          maxItems: 100
          items: { type: string }
        uncostedComponentIds:
          type: array
          maxItems: 100
          items: { type: string }
        targetMarginPercent: { type: number }
        suggestedPriceInclGstPaise: { type: integer, format: int64, minimum: 0 }
        suggestionStatus: { type: string, enum: [COMPLETE, INCOMPLETE, UNUSABLE] }
    PricingPackageBodyV1:
      type: object
      additionalProperties: false
      required: [agentType, agentVersion, packageCode, displayName, billingPeriodDays, priceInclGstPaise, gstRatePercent, infrastructureSharePaise, components]
      properties:
        agentType: { type: string, minLength: 1, maxLength: 100 }
        agentVersion: { type: string, minLength: 1, maxLength: 64 }
        packageCode: { type: string, minLength: 1, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 240 }
        billingPeriodDays: { type: integer, minimum: 1, maximum: 366 }
        priceInclGstPaise: { type: integer, format: int64, minimum: 0 }
        gstRatePercent: { type: integer, minimum: 0, maximum: 100, default: 18 }
        taxTreatment: { type: string, enum: [GST_INCLUSIVE] }
        infrastructureSharePaise: { type: integer, format: int64, minimum: 0 }
        components:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/PricingPackageComponentBodyV1" }
        description: { type: string, maxLength: 500, description: The customer maturity this package suits. Optional. }
        targetMarginPct: { type: number, minimum: 0, maximum: 99.99, description: The Founder's target margin on revenue for this package. Optional; the policy minimum margin applies when absent. }
    PricingPolicyTimingV1:
      type: string
      enum: [IMMEDIATE, AT_RENEWAL]
    PricingPolicyBodyV1:
      type: object
      additionalProperties: false
      required: [minimumMarginPct, paymentGraceDays, sunsetNoticeDays, costToleranceFraction, costAlertFraction, upgradeTiming, downgradeTiming, changeSizeGuardPercent, priceMultipleGuard]
      properties:
        minimumMarginPct: { type: number, minimum: 0, maximum: 100, description: Changed by the Founder only. }
        paymentGraceDays: { type: integer, minimum: 0, maximum: 90 }
        sunsetNoticeDays: { type: integer, minimum: 0, maximum: 365 }
        costToleranceFraction: { type: number, minimum: 0, maximum: 1 }
        costAlertFraction: { type: number, minimum: 0, maximum: 1 }
        upgradeTiming: { $ref: "#/components/schemas/PricingPolicyTimingV1" }
        downgradeTiming: { $ref: "#/components/schemas/PricingPolicyTimingV1" }
        changeSizeGuardPercent: { type: number, minimum: 0, maximum: 1000 }
        priceMultipleGuard: { type: number, exclusiveMinimum: 0 }
    PricingGrantBodyV1:
      type: object
      additionalProperties: false
      required: [kind, agentType, agentVersion]
      properties:
        kind: { type: string, enum: [TRIAL, SETUP] }
        agentType: { type: string, minLength: 1, maxLength: 100 }
        agentVersion: { type: string, minLength: 1, maxLength: 64 }
        units:
          type: object
          description: Thread units granted, keyed by catalogue thread id.
          minProperties: 1
          maxProperties: 50
          additionalProperties: { type: integer, minimum: 1 }
        paise: { type: integer, format: int64, minimum: 1 }
        durationDays: { type: integer, minimum: 1, maximum: 366 }
        windowDays: { type: integer, minimum: 1, maximum: 366 }
      allOf:
        - anyOf:
            - required: [units]
            - required: [paise]
        - not:
            required: [units, paise]
        - anyOf:
            - required: [durationDays]
            - required: [windowDays]
        - not:
            required: [durationDays, windowDays]
    PricingBudgetScopeV1:
      type: string
      enum: [ENVIRONMENT_CEILING, ACQUISITION_TENANT, ACQUISITION_CAMPAIGN, ACQUISITION_LEAD, SIMULATION]
    PricingBudgetBodyV1:
      type: object
      additionalProperties: false
      required: [scope, ref, maximumPaise]
      properties:
        scope: { $ref: "#/components/schemas/PricingBudgetScopeV1" }
        ref: { type: string, minLength: 1, maxLength: 200 }
        maximumPaise: { type: integer, format: int64, minimum: 0 }
        perVisitorMessages: { type: integer, minimum: 1 }
        perDayNewSessions: { type: integer, minimum: 1 }
    PricingCouponBodyV1:
      type: object
      additionalProperties: false
      required: [code, agentType, agentVersion, capPaise, expiresAt, reason, maxRedemptions]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        agentType: { type: string, minLength: 1, maxLength: 100 }
        agentVersion: { type: string, minLength: 1, maxLength: 64 }
        percent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        amountPaise: { type: integer, format: int64, minimum: 1 }
        capPaise: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
        maxRedemptions: { type: integer, minimum: 1 }
      allOf:
        - anyOf:
            - required: [percent]
            - required: [amountPaise]
        - not:
            required: [percent, amountPaise]
    PricingDraftBodyV1:
      type: object
      description: The body of the version. Its shape depends on `kind` and is one of `PricingRateBodyV1`, `PricingPackageBodyV1`, `PricingPolicyBodyV1`, `PricingGrantBodyV1`, `PricingBudgetBodyV1` or `PricingCouponBodyV1`; the server validates it per kind.
      additionalProperties: true
    PricingVersionV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, versionId, kind, subjectKey, versionNo, state, body, bodyDigest, seed, effectiveFrom, supersedes, authorizedBy, evidenceId, needsSecondConfirmation, createdBy, createdAt]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        versionId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PricingVersionKindV1" }
        subjectKey: { type: string, minLength: 1, maxLength: 300 }
        versionNo: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/PricingVersionStateV1" }
        body: { $ref: "#/components/schemas/PricingDraftBodyV1" }
        bodyDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        seed: { type: boolean }
        effectiveFrom: { type: [string, "null"], format: date-time }
        supersedes: { type: [string, "null"], format: uuid }
        authorizedBy: { type: [string, "null"], minLength: 1, maxLength: 200 }
        authorizedAt: { type: [string, "null"], format: date-time }
        evidenceId: { type: [string, "null"], format: uuid }
        needsSecondConfirmation: { type: boolean }
        secondConfirmedBy: { type: [string, "null"], minLength: 1, maxLength: 200 }
        createdBy: { type: string, minLength: 1, maxLength: 200 }
        createdAt: { type: string, format: date-time }
        taxTreatment: { type: string, enum: [GST_INCLUSIVE], description: Present on PACKAGE and COUPON versions that carry a price. }
    PricingVersionListV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PricingVersionV1" }
        nextCursor: { type: string, minLength: 1, maxLength: 256 }
    CreatePricingDraftRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, kind, subjectKey, body]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        kind: { $ref: "#/components/schemas/PricingVersionKindV1" }
        subjectKey: { type: string, minLength: 1, maxLength: 300 }
        body: { $ref: "#/components/schemas/PricingDraftBodyV1" }
        reason: { type: string, minLength: 1, maxLength: 500 }
      allOf:
        - if:
            properties: { kind: { const: RATE } }
            required: [kind]
          then:
            properties:
              subjectKey: { pattern: '^thread:[A-Za-z0-9._-]{1,128}$' }
              body: { $ref: "#/components/schemas/PricingRateBodyV1" }
        - if:
            properties: { kind: { const: PACKAGE } }
            required: [kind]
          then:
            properties:
              subjectKey: { pattern: '^package:[^|]{1,100}\|[^|]{1,64}\|[A-Za-z0-9_-]{1,64}$' }
              body: { $ref: "#/components/schemas/PricingPackageBodyV1" }
        - if:
            properties: { kind: { const: POLICY } }
            required: [kind]
          then:
            properties:
              subjectKey: { const: "policy:platform" }
              body: { $ref: "#/components/schemas/PricingPolicyBodyV1" }
        - if:
            properties: { kind: { const: GRANT } }
            required: [kind]
          then:
            properties:
              subjectKey: { pattern: '^grant:(TRIAL|SETUP)\|[^|]{1,100}\|[^|]{1,64}$' }
              body: { $ref: "#/components/schemas/PricingGrantBodyV1" }
        - if:
            properties: { kind: { const: BUDGET } }
            required: [kind]
          then:
            properties:
              subjectKey: { pattern: '^budget:(ENVIRONMENT_CEILING|ACQUISITION_TENANT|ACQUISITION_CAMPAIGN|ACQUISITION_LEAD|SIMULATION)\|.{1,200}$' }
              body: { $ref: "#/components/schemas/PricingBudgetBodyV1" }
        - if:
            properties: { kind: { const: COUPON } }
            required: [kind]
          then:
            properties:
              subjectKey: { pattern: '^coupon:[A-Za-z0-9_-]{1,64}$' }
              body: { $ref: "#/components/schemas/PricingCouponBodyV1" }
    UpdatePricingDraftRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion, body]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        expectedVersion: { type: string, minLength: 1, maxLength: 128 }
        body: { $ref: "#/components/schemas/PricingDraftBodyV1" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PricingUsageProfileV1:
      type: object
      additionalProperties: false
      required: [name, quantityFraction]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        quantityFraction: { type: number, minimum: 0, maximum: 1, description: Share of every component quantity the persona uses in the period. }
    SimulatePricingDraftRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        expectedVersion: { type: string, minLength: 1, maxLength: 128 }
        usageProfiles:
          type: array
          maxItems: 10
          description: Extra personas on top of the three built-in profiles.
          items: { $ref: "#/components/schemas/PricingUsageProfileV1" }
    PricingVersionDiffEntryV1:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 240 }
        before: { type: string, maxLength: 500 }
        after: { type: string, maxLength: 500 }
    PricingVersionDiffV1:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        effectiveVersionId: { type: string, format: uuid }
        changes:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PricingVersionDiffEntryV1" }
    PricingProfileCostV1:
      type: object
      additionalProperties: false
      required: [profile, expectedMonthlyCostPaise, marginPercent]
      properties:
        profile: { type: string, enum: [BEST_CASE, TYPICAL, WORST_CASE, CUSTOM] }
        personaName: { type: string, minLength: 1, maxLength: 120 }
        expectedMonthlyCostPaise: { type: integer, format: int64, minimum: 0 }
        marginPercent: { type: number }
        dayOneExposurePaise: { type: integer, format: int64, minimum: 0, description: WORST_CASE only; shows that pacing limits the day-one exposure. }
        proRataRefundPaise: { type: integer, format: int64, minimum: 0, description: WORST_CASE only; the pro-rata fee refund if terminated on day two. }
    PricingWarningV1:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, enum: [NEEDS_SECOND_CONFIRMATION, PACKAGE_COMPONENT_NOT_AVAILABLE] }
        componentId: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 500 }
    PricingAffectedPackageV1:
      type: object
      additionalProperties: false
      required: [packageVersionId, subjectKey, currentFloorPaise, newFloorPaise, priceInclGstPaise, belowFloor]
      properties:
        packageVersionId: { type: string, format: uuid }
        subjectKey: { type: string, minLength: 1, maxLength: 300 }
        currentFloorPaise: { type: integer, format: int64, minimum: 0 }
        newFloorPaise: { type: integer, format: int64, minimum: 0 }
        priceInclGstPaise: { type: integer, format: int64, minimum: 0 }
        belowFloor: { type: boolean }
    PricingSimulationResultV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, draftId, kind, state, simulatedAt, warnings, profiles, affectedPackages]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        draftId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PricingVersionKindV1" }
        state: { $ref: "#/components/schemas/PricingVersionStateV1" }
        simulatedAt: { type: string, format: date-time }
        costFloorPaise: { type: integer, format: int64, minimum: 0 }
        basePricePaise: { type: integer, format: int64, minimum: 0 }
        gstPaise: { type: integer, format: int64, minimum: 0 }
        priceInclGstPaise: { type: integer, format: int64, minimum: 0 }
        taxTreatment: { type: string, enum: [GST_INCLUSIVE] }
        marginPercent: { type: number }
        minimumCompliantPricePaise: { type: integer, format: int64, minimum: 0 }
        buildUp: { $ref: "#/components/schemas/PricingBuildUpV1" }
        diff: { $ref: "#/components/schemas/PricingVersionDiffV1" }
        profiles:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/PricingProfileCostV1" }
        warnings:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PricingWarningV1" }
        affectedPackages:
          type: array
          maxItems: 200
          description: For a RATE draft, every effective package whose floor would change.
          items: { $ref: "#/components/schemas/PricingAffectedPackageV1" }
    SubmitPricingDraftRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        expectedVersion: { type: string, minLength: 1, maxLength: 128 }
        secondConfirmation: { type: boolean, default: false }
        note: { type: string, minLength: 1, maxLength: 500 }
    AuthorizePricingDraftRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        expectedVersion: { type: string, minLength: 1, maxLength: 128 }
        effectiveFrom: { type: string, format: date-time, description: Defaults to now; a future instant schedules the change. }
        secondConfirmation: { type: boolean, default: false }
    DiscardPricingDraftRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion, reason]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        expectedVersion: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ActivatePackageForSaleRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedVersion]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        expectedVersion: { type: string, minLength: 1, maxLength: 128 }
    PricingPackageSaleV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, packageId, forSale, activatedBy, activatedAt, evidenceId]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        packageId: { type: string, format: uuid }
        forSale: { type: boolean }
        activatedBy: { type: string, minLength: 1, maxLength: 200 }
        activatedAt: { type: string, format: date-time }
        evidenceId: { type: string, format: uuid }
    LowerCeilingRequestV1:
      type: object

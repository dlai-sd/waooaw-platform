        contextHint: { $ref: "#/components/schemas/RegisteredContextHintV1" }
        contextVersion: { type: string, minLength: 1, maxLength: 128 }
        expectedSourceVersion: { type: [string, "null"], maxLength: 128 }
        payloadDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
    ConversationOperationReceiptV1:
      type: object
      additionalProperties: false

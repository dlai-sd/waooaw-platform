          type: string
          enum: [NOT_APPLICABLE, QUEUED, SUBMITTED, PROVIDER_ACCEPTED, DELIVERED, READ, FAILED, EXPIRED, UNKNOWN]
        execution:
          type: string
          enum: [NOT_REQUESTED, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, STOPPED, UNAVAILABLE]
        customerDecision:
          type: string
          enum: [NOT_REQUIRED, PENDING, CONFIRMED, REJECTED, EXPIRED, SUPERSEDED]
        constitutionalEvidence:
          type: string

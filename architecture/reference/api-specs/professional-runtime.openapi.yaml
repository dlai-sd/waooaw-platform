openapi: "3.1.0"

info:
  title: WAOOAW Professional Runtime API
  version: "1.1.0"
  description: |
    Internal and WebSocket API for the WAOOAW Professional Runtime service.

    **Constitutional Basis:**
    - C-001 (Emergency Stop architecturally guaranteed — ≤250ms, dedicated WebSocket)
    - C-023 (Evidence First — all execution paths record evidence before returning success)
    - C-035 (Runtime Universality — all professional types use this API)
    - AD-001 (Emergency Stop ≤250ms — WebSocket pre-warmed at session start)
    - AD-005 (PAAS hot path < 50ms)

    **Audience:**
    This spec covers two audiences:
    1. **Business Platform** — internal REST/SSE calls for conversation execution, action submission, and PAAS session management
    2. **Customer browser/mobile** — the dedicated WebSocket for Emergency Stop only (via Business Platform proxy or direct)

    Ordinary conversation timeline, command, cancellation, and streaming traffic terminates
    at Business Platform. Browsers never connect to these internal PR operations or to model providers.

    **Note on WebSocket:**
    OpenAPI 3.1 does not natively describe WebSocket protocol. The Emergency Stop
    WebSocket is documented in the `x-websocket` extension blocks below and in
    `architecture/reference/api-specs/emergency-stop-ws.md`.

servers:
  - url: http://localhost:5003
    description: Local development
  - url: https://rt.waooaw.com
    description: Production (Azure Container Apps — WebSocket endpoint)

tags:
  - name: Emergency Stop
    description: Real-time Emergency Stop WebSocket and REST fallback
  - name: PAAS Sessions
    description: Pre-Authorized Action Space session lifecycle
  - name: Internal
    description: Internal endpoints called by Business Platform only (not customer-facing)
  - name: Conversation Execution
    description: Internal BP-only professional execution and typed event stream for WC-034 F3
  - name: Health
    description: Service health

security:
  - BearerAuth: []

paths:

  /health:
    get:
      tags: [Health]
      summary: Service health check
      security: []
      operationId: getPRHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ─── Emergency Stop ───────────────────────────────────────────────────────
  #
  # PRIMARY PATH: WebSocket at /ws/emergency-stop
  # The customer establishes this connection at login and keeps it alive.
  # Emergency Stop is sent as a JSON message on this connection.
  # This is the guaranteed ≤250ms path (AD-001).
  #
  # WEBSOCKET CONTRACT (x-websocket extension — not standard OpenAPI):
  #   Connection URL:   wss://rt.waooaw.com/ws/emergency-stop
  #   Auth:             Authorization header: Bearer <JWT>
  #                     (never in query string — ADR-004)
  #   Client → Server:  EmergencyStopCommand (JSON)
  #   Server → Client:  EmergencyStopConfirmation (JSON)
  #   Connection:       Pre-warmed at session start. One connection per active customer session.
  #   Latency SLA:      P99 ≤ 250ms from message sent to EmergencyStopConfirmation received.

  /api/v1/emergency-stop:
    post:
      tags: [Emergency Stop]
      summary: REST fallback Emergency Stop (use WebSocket as primary path)
      description: |
        REST fallback for Emergency Stop when WebSocket connection is unavailable.
        Uses the same underlying CE TriggerEmergencyStop gRPC call.
        Latency may exceed the WebSocket path but is still bounded by AD-001.

        **Primary path is the WebSocket at /ws/emergency-stop.**
        Use this endpoint only when the WebSocket connection cannot be established.
      operationId: triggerEmergencyStopREST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyStopCommand"
      responses:
        "200":
          description: Emergency Stop confirmed — all sessions halted and evidence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStopConfirmation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── PAAS Sessions ────────────────────────────────────────────────────────

  /api/v1/paas/sessions:
    post:
      tags: [PAAS Sessions]
      summary: Start a PAAS session (internal — called by Business Platform)
      description: |
        Starts a Pre-Authorized Action Space session for a contract.
        Loads the Decision Space into memory and starts the PAASSessionWorkflow
        in Temporal (ADR-018). Returns the session ID (Temporal workflow ID)
        used for Emergency Stop routing.

        **This endpoint is internal-only. It is not accessible from the internet.**
        Business Platform calls this after validating the customer's request.
      operationId: startPAASSession
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPAASSessionRequest"
      responses:
        "201":
          description: PAAS session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PAASSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A PAAS session already exists for this contract
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/paas/sessions/{sessionId}:
    get:
      tags: [PAAS Sessions]
      summary: Get PAAS session status (internal)
      operationId: getPAASSession
      x-internal: true
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: PAAS session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PAASSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [PAAS Sessions]
      summary: End a PAAS session normally (internal)
      description: Ends the PAAS session cleanly (market hours end, customer closes session). Different from Emergency Stop — no ABANDONED evidence records are created.
      operationId: endPAASSession
      x-internal: true
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PAASSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Internal — Action Submission ─────────────────────────────────────────

  /api/v1/internal/approvals/{approvalId}/signal:
    post:
      tags: [Internal]
      summary: Signal approval decision to Professional Runtime (internal)
      description: |
        Called by Business Platform after a customer approves or rejects an action.
        This sends a Temporal signal to the ApprovalGateWorkflow waiting for the decision.
        **Internal only — not accessible from the internet.**
      operationId: signalApprovalDecision
      x-internal: true
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalSignal"
      responses:
        "200":
          description: Signal delivered
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Internal — Conversation Execution (WC-034 F3) ────────────────────────

  /api/v1/internal/conversations/{conversationId}/executions:
    post:
      tags: [Conversation Execution]
      summary: Start or replay professional processing for one BP-accepted message
      description: |
        Internal-only operation called by Business Platform after it has authenticated the
        participant, authorized the relationship, persisted the canonical customer message,
        and accepted idempotent responsibility. PR derives tenant and relationship context
        from the signed BP service assertion; neither is accepted from the body.

        A 202 response means Temporal accepted durable execution responsibility. PR does not
        dispatch to AI Runtime while Emergency Stop is active, Decision Space is stale, or
        Constitutional Engine is unavailable.
      operationId: startConversationExecution
      x-internal: true
      security:
        - ServiceBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationExecutionRequestV1"
      responses:
        "202":
          description: Durable professional execution accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalExecutionV1"
        "200":
          description: Prior identical execution outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalExecutionV1"
        "400": { $ref: "#/components/responses/ExecutionInvalidRequest" }
        "401": { $ref: "#/components/responses/ExecutionUnauthorized" }
        "404": { $ref: "#/components/responses/ExecutionNotFound" }
        "409": { $ref: "#/components/responses/ExecutionConflict" }
        "423": { $ref: "#/components/responses/ExecutionStopped" }
        "503": { $ref: "#/components/responses/ExecutionUnavailable" }

  /api/v1/internal/conversations/{conversationId}/executions/{executionId}/stream:
    get:
      tags: [Conversation Execution]
      summary: Stream ordered typed professional execution events to BP
      description: |
        Internal-only Server-Sent Event stream consumed by Business Platform. Event IDs and
        sequences are monotonic within the execution. BP validates, persists, and maps events
        into its canonical public conversation projection; PR events are never browser truth.
      operationId: streamConversationExecution
      x-internal: true
      security:
        - ServiceBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/ProfessionalExecutionId"
        - $ref: "#/components/parameters/InternalLastEventId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Versioned internal professional execution event stream
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ProfessionalExecutionEventV1"
        "401": { $ref: "#/components/responses/ExecutionUnauthorized" }
        "404": { $ref: "#/components/responses/ExecutionNotFound" }
        "410": { $ref: "#/components/responses/ExecutionCursorExpired" }
        "423": { $ref: "#/components/responses/ExecutionStopped" }
        "503": { $ref: "#/components/responses/ExecutionUnavailable" }

  /api/v1/internal/conversations/{conversationId}/executions/{executionId}:
    delete:
      tags: [Conversation Execution]
      summary: Request cancellation of one professional execution
      description: |
        Internal-only BP command. Cancellation preserves accepted partial output and does not
        delete evidence or release Emergency Stop. A terminal execution replays its outcome.
      operationId: cancelConversationExecutionInternal
      x-internal: true
      security:
        - ServiceBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/ProfessionalExecutionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalExecutionV1"
        "200":
          description: Existing terminal outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalExecutionV1"
        "401": { $ref: "#/components/responses/ExecutionUnauthorized" }
        "404": { $ref: "#/components/responses/ExecutionNotFound" }
        "409": { $ref: "#/components/responses/ExecutionConflict" }
        "423": { $ref: "#/components/responses/ExecutionStopped" }
        "503": { $ref: "#/components/responses/ExecutionUnavailable" }

# ─── Components ─────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        BP service assertion with PR audience plus signed tenant_id, relationship_id, and
        delegated actor context. PR derives context only from these claims; request bodies,
        paths, and headers cannot override tenant or relationship authorization.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: PAAS session UUID (= Temporal workflow ID)

    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: BP-owned opaque durable conversation identifier

    ProfessionalExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: PR-owned Temporal execution identifier correlated to one BP message

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Same authenticated BP caller, operation, key, and canonical hash replay one execution outcome

    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Privacy-safe distributed correlation identifier; never contains customer content

    InternalLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Last PR event ID consumed by BP; never supplied in a URL

  responses:
    Unauthorized:
      description: JWT missing, expired, or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ExecutionInvalidRequest:
      description: Internal execution request or schema version is invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ExecutionProblemDetail" }
    ExecutionUnauthorized:
      description: BP service assertion is missing, invalid, expired, or lacks required scoped claims
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ExecutionProblemDetail" }
    ExecutionNotFound:
      description: Conversation or execution is absent or inaccessible to the asserted context
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ExecutionProblemDetail" }
    ExecutionConflict:
      description: Idempotency identity, schema, sequence, or execution state conflicts
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ExecutionProblemDetail" }
    ExecutionCursorExpired:
      description: Event cursor expired; BP must reconcile from its canonical persisted state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ExecutionProblemDetail" }
    ExecutionStopped:
      description: Emergency Stop is active; cancellation or reconnect cannot release it
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ExecutionProblemDetail" }
    ExecutionUnavailable:
      description: Runtime or Constitutional Engine is unavailable; no model dispatch occurs
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ExecutionProblemDetail" }

  schemas:

    ConversationExecutionSchemaVersion:
      type: string
      const: "1.0"

    ConversationExecutionTextV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, contentType, text, language]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationExecutionSchemaVersion" }
        contentType: { type: string, const: TEXT }
        text: { type: string, minLength: 1, maxLength: 32000 }
        language: { type: string, minLength: 2, maxLength: 35 }

    StartConversationExecutionRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, messageId, decisionSpaceVersion, locale, content]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationExecutionSchemaVersion" }
        messageId: { type: string, format: uuid, description: BP canonical customer message ID }
        decisionSpaceVersion: { type: integer, minimum: 1 }
        locale: { type: string, minLength: 2, maxLength: 35 }
        content: { $ref: "#/components/schemas/ConversationExecutionTextV1" }
        activeGoalContextId: { type: string, format: uuid }

    ProfessionalExecutionState:
      type: string
      enum: [ACCEPTED, QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED, STOPPED, UNRESOLVED]

    ProfessionalExecutionCompletionReason:
      type: string
      enum: [COMPLETE, PARTIAL_FAILURE, CANCELLED, EMERGENCY_STOPPED]

    ProfessionalExecutionV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, executionId, conversationId, messageId, state, partial, replayed, acceptedAt]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationExecutionSchemaVersion" }
        executionId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/ProfessionalExecutionState" }
        partial: { type: boolean }
        completionReason: { $ref: "#/components/schemas/ProfessionalExecutionCompletionReason" }
        replayed: { type: boolean }
        acceptedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProfessionalExecutionEventType:
      type: string
      enum: [execution.accepted, processing.started, response.delta, card.proposed, evidence.pending, evidence.recorded, execution.completed, execution.failed, execution.cancelled, execution.stopped, reconciliation.required, heartbeat]

    ProfessionalDeltaV1:
      type: object
      additionalProperties: false
      required: [contentIndex, appendText, partial]
      properties:
        contentIndex: { type: integer, minimum: 0 }
        appendText: { type: string, maxLength: 8000 }
        partial: { type: boolean, const: true }

    ProfessionalCardProposalV1:
      type: object
      additionalProperties: false
      description: Typed proposal validated and mapped by BP before public projection
      required: [schemaVersion, cardType, cardId, owner, state, effect, data]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationExecutionSchemaVersion" }
        cardType: { type: string, enum: [ACTION, PLAN, DELIVERABLE, DECISION] }
        cardId: { type: string, format: uuid }
        owner: { type: string, enum: [CUSTOMER, PROFESSIONAL, SHARED] }
        state: { type: string, minLength: 1, maxLength: 64 }
        effect: { type: string, minLength: 1, maxLength: 500 }
        data:
          type: object
          additionalProperties: true

    ProfessionalEvidenceEventV1:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [PENDING, RECORDED, FAILED] }
        evidenceRecordId: { type: string, format: uuid }

    ProfessionalTerminalEventV1:
      type: object
      additionalProperties: false
      required: [state, partial, completionReason]
      properties:
        state: { $ref: "#/components/schemas/ProfessionalExecutionState" }
        partial: { type: boolean }
        completionReason: { $ref: "#/components/schemas/ProfessionalExecutionCompletionReason" }
        errorCode: { type: string, maxLength: 64 }

    ProfessionalReconciliationEventV1:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [EVENT_CURSOR_EXPIRED, EVENT_GAP, STATE_CONFLICT] }

    ProfessionalHeartbeatV1:
      type: object
      additionalProperties: false
      required: [serverTime]
      properties:
        serverTime: { type: string, format: date-time }

    ProfessionalExecutionEventV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, eventType, conversationId, executionId, messageId, sequence, occurredAt, data]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationExecutionSchemaVersion" }
        eventId: { type: string, minLength: 1, maxLength: 256 }
        eventType: { $ref: "#/components/schemas/ProfessionalExecutionEventType" }
        conversationId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        data:
          oneOf:
            - $ref: "#/components/schemas/ProfessionalDeltaV1"
            - $ref: "#/components/schemas/ProfessionalCardProposalV1"
            - $ref: "#/components/schemas/ProfessionalEvidenceEventV1"
            - $ref: "#/components/schemas/ProfessionalTerminalEventV1"
            - $ref: "#/components/schemas/ProfessionalReconciliationEventV1"
            - $ref: "#/components/schemas/ProfessionalHeartbeatV1"

    ExecutionProblemCode:
      type: string
      enum: [EXECUTION_REQUEST_INVALID, EXECUTION_NOT_ACCESSIBLE, EXECUTION_IDEMPOTENCY_CONFLICT, EXECUTION_SCHEMA_UNSUPPORTED, EXECUTION_CURSOR_EXPIRED, EXECUTION_STOPPED, EXECUTION_DECISION_SPACE_STALE, EXECUTION_CONSTITUTIONAL_UNAVAILABLE, EXECUTION_RUNTIME_UNAVAILABLE]

    ExecutionProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: "#/components/schemas/ExecutionProblemCode" }
        correlationId: { type: string, format: uuid }
        retryAfterSeconds: { type: integer, minimum: 1 }

    EmergencyStopCommand:
      type: object
      description: |
        Sent by customer to trigger Emergency Stop.
        Works for both WebSocket (primary) and REST fallback paths.
      required: [contractId]
      properties:
        contractId:
          type: string
          format: uuid
          description: The contract whose professional sessions must halt
        activeSessionIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Known active PAAS session IDs (Temporal workflow IDs) — ADR-018.
            If omitted, Professional Runtime attempts to halt all known active
            sessions for the contract.

    EmergencyStopConfirmation:
      type: object
      description: |
        Returned after Emergency Stop is confirmed — all sessions halted,
        evidence recorded in Constitutional Audit Ledger.
        This response is only sent AFTER Constitutional Engine confirms
        the Emergency Stop evidence record is written (Evidence First — AD-002).
      required: [emergencyStopRecordId, affectedSessions, confirmedAt]
      properties:
        emergencyStopRecordId:
          type: string
          format: uuid
          description: UUID of the Emergency Stop evidence record in the Constitutional Audit Ledger
        affectedSessions:
          type: array
          items:
            type: string
            format: uuid
          description: Session IDs that were halted
        confirmedAt:
          type: string
          format: date-time
          description: When halt was confirmed and evidence recorded

    PAASSession:
      type: object
      required: [sessionId, contractId, decisionSpaceVersion, state, startedAt]
      properties:
        sessionId:
          type: string
          format: uuid
          description: Session ID = Temporal workflow ID (ADR-018)
        contractId:
          type: string
          format: uuid
        decisionSpaceVersion:
          type: integer
          description: Decision Space version loaded at session start
        state:
          type: string
          enum: [STARTING, ACTIVE, ENDED, EMERGENCY_STOPPED, INTERRUPTED]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        terminationReason:
          type: string
          nullable: true

    StartPAASSessionRequest:
      type: object
      required: [contractId]
      properties:
        contractId:
          type: string
          format: uuid

    ApprovalSignal:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string
          nullable: true

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        temporalConnected:
          type: boolean
        constitutionalEngineReachable:
          type: boolean
        activePAASSessions:
          type: integer

    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

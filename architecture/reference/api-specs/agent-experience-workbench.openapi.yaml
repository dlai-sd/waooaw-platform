openapi: "3.1.0"
info:
  title: WAOOAW Agent Experience Workbench API
  version: "1.0.0"
  contact:
    name: WAOOAW Architecture
  description: |
    Implements: work-contracts/WC-136-common-agent-workbench-spend-accounts-and-pricing-engine.md C2-04.
    Constitutional basis: C-059, C-063, ADR-051, ADR-052.

    The workbench is one Business Platform projection and command set that Web, WhatsApp and the
    future Mobile client render. It is composed from the existing owners (plan, goals, outcomes,
    performance, operations, work, results, usage, rights, evidence); it never becomes a second
    source of truth. Business Platform is the only public facade. The server sends content and
    typed fields, never layout.

    Every command requires `Idempotency-Key` and `X-Correlation-ID` and carries the
    `expectedVersion` the client last saw (the `ETag` of the workbench projection or of the
    addressed resource). A replay with the same key and canonical request returns the stored
    receipt; a changed replay conflicts. Success is never decided from a model or transport result.

    Customers see components remaining and the period end. Provider units, costs, margins and
    recipes never appear in any response. A beneficiary projection omits every money, price,
    top-up and purchase field.

    Reads accept `X-Experience-Capabilities`
    (`channel=WEB|WHATSAPP|MOBILE|API|SIMULATION;modality=text,voice;blocks=TEXT:1,CHOICES:1,...`)
    so the server can emit only block types and versions the client can render; unknown or
    unsupported blocks are replaced by their `fallback`. When the workbench flag is off every
    operation answers 404 `WORKBENCH_DISABLED`.
servers:
  - url: https://api.waooaw.com
tags:
  - name: Workbench
    description: Projection, goals, plans, capabilities, work, decisions, monitoring, wallet, evidence, controls and handoffs.
  - name: Subscription
    description: Customer subscription lifecycle changes.
  - name: Marketplace Packages
    description: Customer-facing for-sale package reads.
security:
  - bearerAuth: []
paths:
  /api/v1/employment/relationships/{relationshipId}/workbench:
    get:
      tags: [Workbench]
      summary: Read the workbench projection
      description: |
        Returns one audience-filtered projection of the relationship: phase and readiness, current
        goal and plan, decisions queue, monitor tiles, components remaining and period end, alerts,
        evidence state and source freshness, limitations, the recommended next action, available
        commands and negotiated blocks. A missing owner yields `limitations` and an `UNAVAILABLE`
        item state, not an error. The `ETag` is the `expectedVersion` for commands.
      operationId: getWorkbench
      x-capability: ["2.5", "4.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ExperienceCapabilities"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Workbench projection
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchProjectionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/goals:
    get:
      tags: [Workbench]
      summary: List goals
      operationId: listWorkbenchGoals
      x-capability: ["4.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of goals
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchGoalListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Workbench]
      summary: Create a goal
      description: |
        Creates a goal of a goal type declared by the agent's experience contract. Delegates to
        the existing goal owner; the goal is not active until the owner confirms it.
      operationId: createWorkbenchGoal
      x-capability: ["4.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkbenchGoalRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/goals/{goalId}:
    get:
      tags: [Workbench]
      summary: Read one goal
      operationId: getWorkbenchGoal
      x-capability: ["4.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/GoalId"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Goal
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchGoalV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/goals/{goalId}/revisions:
    post:
      tags: [Workbench]
      summary: Revise a goal
      description: Appends a new goal version. Earlier versions are never edited in place.
      operationId: reviseWorkbenchGoal
      x-capability: ["4.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/GoalId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviseWorkbenchGoalRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/goals/{goalId}/versions:
    get:
      tags: [Workbench]
      summary: List the versions of a goal
      operationId: listWorkbenchGoalVersions
      x-capability: ["4.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/GoalId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of goal versions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchGoalVersionListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/plans/current:
    get:
      tags: [Workbench]
      summary: Read the current plan
      operationId: getCurrentWorkbenchPlan
      x-capability: ["1.7", "2.7"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ExperienceCapabilities"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Current plan
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchPlanV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/plans:
    post:
      tags: [Workbench]
      summary: Propose a plan
      description: |
        Proposes a plan version from a goal, milestones of declared milestone types and calendar
        windows. The plan is validated by the domain adapter before it can be accepted.
      operationId: proposeWorkbenchPlan
      x-capability: ["1.7"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeWorkbenchPlanRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/plans/{planVersion}/accept:
    post:
      tags: [Workbench]
      summary: Accept a plan version
      description: Only the accountable customer owner can accept; the owner records the acceptance.
      operationId: acceptWorkbenchPlan
      x-capability: ["1.7"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/PlanVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptWorkbenchPlanRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/capabilities:
    get:
      tags: [Workbench]
      summary: List the capabilities of the agent
      description: |
        Skills of the employed agent version with their honest availability. A `DEFAULT_OFF` or
        `UNAVAILABLE` capability is shown as such and cannot be commanded.
      operationId: listWorkbenchCapabilities
      x-capability: ["5.4", "5.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ExperienceCapabilities"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Capabilities
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchCapabilityListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/capabilities/{skillId}/commands:
    post:
      tags: [Workbench]
      summary: Command one capability
      description: |
        Enables, pauses or resumes one skill. `RUN_NOW` and `CHANGE_APPROVAL_MODE` are reserved
        values: no owner accepts them yet, so they are refused with 400 `WORKBENCH_REQUEST_INVALID`
        and no client shows a control for them. A typed
        `SETUP_GRANT_EXHAUSTED` outcome is returned with status 200 when the setup grant is spent;
        it is a result, not an error.
      operationId: commandWorkbenchCapability
      x-capability: ["5.4", "5.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/SkillId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbenchCapabilityCommandRequestV1" }
      responses:
        "200":
          description: Replayed receipt, or the typed result of a command that was refused by a grant limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchCapabilityCommandResultV1" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/work-items:
    get:
      tags: [Workbench]
      summary: List work items
      description: Work items in the common item states, each with its owner and freshness.
      operationId: listWorkbenchWorkItems
      x-capability: ["2.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          required: false
          schema:
            $ref: "./conversational-employment-business-platform.openapi.yaml#/components/schemas/EmploymentItemState"
        - name: skillId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 160 }
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of work items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchWorkItemListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/decisions:
    get:
      tags: [Workbench]
      summary: List pending decisions
      operationId: listWorkbenchDecisions
      x-capability: ["2.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExperienceCapabilities"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of decisions
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchDecisionListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/decisions/{decisionId}/resolve:
    post:
      tags: [Workbench]
      summary: Resolve a decision
      description: |
        Authority is decided by the server when the decision is resolved, not by the block that
        displayed it. A consequential approval that a channel cannot safely perform is answered
        by a handoff (`POST .../handoffs`).
      operationId: resolveWorkbenchDecision
      x-capability: ["2.5", "2.7"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/DecisionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveWorkbenchDecisionRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/monitor:
    get:
      tags: [Workbench]
      summary: Read the monitor
      description: Tiles against target with freshness, alerts and negotiated blocks.
      operationId: getWorkbenchMonitor
      x-capability: ["2.5", "2.7"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ExperienceCapabilities"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Monitor
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchMonitorV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/monitor/narratives:
    get:
      tags: [Workbench]
      summary: List performance narratives
      description: Narratives in the agent's declared structure, newest first.
      operationId: listWorkbenchNarratives
      x-capability: ["2.7"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of narratives
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchNarrativeListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/wallet:
    get:
      tags: [Workbench]
      summary: Read the component wallet
      description: |
        Components remaining and the period end only. No price, cost, margin, recipe or provider
        unit is returned. A beneficiary receives `askAccountOwner` instead of purchase options.
      operationId: getWorkbenchWallet
      x-capability: ["9.2"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Wallet
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchWalletV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/topups:
    post:
      tags: [Workbench]
      summary: Top up one component
      description: |
        Buys more units of one component whose package allows top-ups. The price is derived on the
        server from the effective package version pinned for the relationship and is GST
        inclusive. Only the accountable customer owner may top up.
      operationId: createWorkbenchTopup
      x-capability: ["6.5", "9.2"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkbenchTopupRequestV1" }
      responses:
        "200":
          description: Replayed top-up receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchTopupReceiptV1" }
        "202":
          description: Top-up accepted; credit follows the confirmed payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchTopupReceiptV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/evidence:
    get:
      tags: [Workbench]
      summary: List evidence
      operationId: listWorkbenchEvidence
      x-capability: ["5.3"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of evidence entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchEvidenceListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/evidence/exports:
    post:
      tags: [Workbench]
      summary: Request an evidence export
      operationId: exportWorkbenchEvidence
      x-capability: ["5.3"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportWorkbenchEvidenceRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/controls/stop:
    post:
      tags: [Workbench]
      summary: Stop the relationship now
      description: |
        Emergency stop. It works with the credit at zero because it is paid from the PLATFORM
        FLOOR account, and it is reachable on every channel with the same meaning.
      operationId: stopWorkbenchRelationship
      x-capability: ["2.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbenchControlRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/controls/pause:
    post:
      tags: [Workbench]
      summary: Pause the relationship
      operationId: pauseWorkbenchRelationship
      x-capability: ["5.4"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbenchControlRequestV1" }
      responses:
        "200": { $ref: "#/components/responses/CommandReplayed" }
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/handoffs:
    post:
      tags: [Workbench]
      summary: Create a single-use handoff to the web workbench
      description: |
        Used when a channel cannot safely perform an action (for example a consequential
        approval or a payment). The returned reference is opaque, single use and expires.
      operationId: createWorkbenchHandoff
      x-capability: ["6.6"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkbenchHandoffRequestV1" }
      responses:
        "200":
          description: Replayed handoff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchHandoffV1" }
        "201":
          description: Handoff created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchHandoffV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/workbench/handoffs/consume:
    post:
      tags: [Workbench]
      summary: Redeem a single-use handoff
      description: |
        Redeems the opaque destination reference of a handoff exactly once for the signed-in
        participant of this relationship. A reference that is unknown, expired, already used or
        issued to someone else answers the same 404, so a reference cannot be probed.
      operationId: consumeWorkbenchHandoff
      x-capability: ["6.6"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumeWorkbenchHandoffRequestV1" }
      responses:
        "200":
          description: Handoff redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbenchHandoffConsumptionV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/employment/relationships/{relationshipId}/subscription/changes:
    post:
      tags: [Subscription]
      summary: Change the subscription
      description: |
        UPGRADE is immediate with a pro-rated fee difference. DOWNGRADE takes effect at the next
        renewal. PAUSE and TERMINATE record a pro-rata billing adjustment through the payment
        path, never a wallet refund; remaining wallet credit lapses and delivered work is kept.
        RESUME and TERMINATE need no target package. Timing is decided by the effective policy
        version, not by the client.
      operationId: changeSubscription
      x-capability: ["9.1", "6.5"]
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionChangeRequestV1" }
      responses:
        "200":
          description: Replayed subscription change receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionChangeReceiptV1" }
        "202":
          description: Subscription change accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionChangeReceiptV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/marketplace/agents/{agentType}/versions/{agentVersion}/packages:
    get:
      tags: [Marketplace Packages]
      summary: List the packages on sale for an agent version
      description: |
        Returns only EFFECTIVE packages that are for sale. Each package carries its price including
        GST, the base price, the GST, the billing period and its components in the agent's own
        vocabulary. Provider units, costs, margins and recipes are never returned.
      operationId: listMarketplaceAgentPackages
      x-capability: ["9.2"]
      parameters:
        - name: agentType
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: agentVersion
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: A page of for-sale packages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplacePackageListV1" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer identity token. The route additionally requires membership of the relationship; tenant and role are never taken from the request.
  headers:
    ETag:
      description: Opaque version of the returned resource; send it back as `expectedVersion` on the next command.
      schema: { type: string, minLength: 1, maxLength: 128 }
  parameters:
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanVersion:
      name: planVersion
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    SkillId:
      name: skillId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Same key and canonical request replay the stored receipt; divergent reuse conflicts with `WORKBENCH_IDEMPOTENCY_CONFLICT`.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    OptionalCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    ExperienceCapabilities:
      name: X-Experience-Capabilities
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 512, pattern: "^channel=(WEB|WHATSAPP|MOBILE|API|SIMULATION)(;modality=(text|voice)(,(text|voice))*)?(;blocks=[A-Z]+:[0-9]+(,[A-Z]+:[0-9]+)*)?$" }
      description: |
        Channel class, modality and the highest block version the client renders, for example
        `channel=WHATSAPP;modality=text,voice;blocks=TEXT:1,CHOICES:1,LINK:1`. Absent means the v1
        block set. Blocks above the stated version are replaced by their fallback.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Opaque cursor from the previous page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    CommandAccepted:
      description: Command accepted. The receipt names the operation; completion is confirmed by the owner, never by this response alone.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbenchCommandReceiptV1" }
    CommandReplayed:
      description: The same idempotency key and request were seen before; the stored receipt is returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbenchCommandReceiptV1" }
    BadRequest:
      description: Request, header or schema version is malformed or unsupported (`WORKBENCH_REQUEST_INVALID`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
    Unauthorized:
      description: Credential is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
    Forbidden:
      description: Not a member of the relationship, the audience may not perform the operation, or a spend authority refused it (`SPEND_PURPOSE_UNMAPPED`, `SPEND_AUTHORITY_UNAVAILABLE`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
    NotFound:
      description: The workbench is disabled (`WORKBENCH_DISABLED`) or the resource does not exist for this relationship.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
    Conflict:
      description: Stale `expectedVersion` (`WORKBENCH_VERSION_CONFLICT`), divergent idempotency reuse (`WORKBENCH_IDEMPOTENCY_CONFLICT`), or a wallet, component or trial conflict.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
    UnprocessableEntity:
      description: The request is well formed but the requested change is not allowed for the package or component.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
    TooManyRequests:
      description: Fair-use limit reached; retry after the stated delay.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
    Unavailable:
      description: A required owner or dependency is unavailable (`WORKBENCH_UNAVAILABLE`, `SPEND_COMMERCIAL_UNAVAILABLE`); the call is retry-safe.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkbenchProblemDetailV1" }
  schemas:
    WorkbenchProblemCodeV1:
      type: string
      enum:
        - WORKBENCH_DISABLED
        - WORKBENCH_REQUEST_INVALID
        - WORKBENCH_VERSION_CONFLICT
        - WORKBENCH_IDEMPOTENCY_CONFLICT
        - WORKBENCH_UNAVAILABLE
        - SPEND_PURPOSE_UNMAPPED
        - SPEND_AUTHORITY_UNAVAILABLE
        - SPEND_COMMERCIAL_UNAVAILABLE
        - WALLET_INSUFFICIENT
        - WALLET_IDEMPOTENCY_CONFLICT
        - COMPONENT_NOT_YET_RELEASED
        - PROACTIVE_ALLOWANCE_EXHAUSTED
        - TRIAL_ALREADY_USED
        - TRIAL_ALREADY_USED_BY_IDENTITY
        - PACKAGE_COMPONENT_NOT_AVAILABLE
    WorkbenchProblemDetailV1:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, minLength: 1, maxLength: 240 }
        title: { type: string, minLength: 1, maxLength: 240 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: "#/components/schemas/WorkbenchProblemCodeV1" }
        correlationId: { type: string, minLength: 1, maxLength: 64 }
        detail: { type: string, maxLength: 500 }
    WorkbenchAudienceV1:
      type: string
      enum: [customer_owner, delegate, beneficiary, steward]
    WorkbenchFreshnessV1:
      $ref: "./customer-engagement-workspace-business-platform.openapi.yaml#/components/schemas/ProjectionFreshnessV1"
    WorkbenchEvidenceStateV1:
      $ref: "./customer-engagement-workspace-business-platform.openapi.yaml#/components/schemas/ProjectionEvidenceStateV1"
    WorkbenchItemStateV1:
      $ref: "./conversational-employment-business-platform.openapi.yaml#/components/schemas/EmploymentItemState"
    WorkbenchPhaseV1:
      $ref: "./conversational-employment-business-platform.openapi.yaml#/components/schemas/EmploymentPhaseKind"
    WorkbenchReadinessV1:
      type: object
      additionalProperties: false
      required: [induction, plan, operations, performance]
      properties:
        induction:
          $ref: "./conversational-employment-business-platform.openapi.yaml#/components/schemas/InductionReadinessState"
        plan:
          $ref: "./conversational-employment-business-platform.openapi.yaml#/components/schemas/PlanReadinessState"
        operations:
          $ref: "./conversational-employment-business-platform.openapi.yaml#/components/schemas/OperationsEligibilityState"
        performance:
          $ref: "./conversational-employment-business-platform.openapi.yaml#/components/schemas/PerformanceAssuranceState"
    WorkbenchDecisionV1:
      type: object
      additionalProperties: false
      required: [decisionId, version, effect, authority, confirmLabel, cancelLabel, owner, freshness]
      properties:
        decisionId: { type: string, format: uuid }
        version: { type: string, minLength: 1, maxLength: 64 }
        effect: { type: string, minLength: 1, maxLength: 500 }
        authority: { type: string, minLength: 1, maxLength: 120 }
        cost: { type: string, minLength: 1, maxLength: 240, description: "Cost in business language, never provider units." }
        confirmLabel: { type: string, minLength: 1, maxLength: 20 }
        cancelLabel: { type: string, minLength: 1, maxLength: 20 }
        expiresAt: { type: string, format: date-time }
        itemRef: { type: string, minLength: 1, maxLength: 128 }
        owner: { type: string, minLength: 1, maxLength: 120 }
        freshness: { $ref: "#/components/schemas/WorkbenchFreshnessV1" }
    WorkbenchTileV1:
      type: object
      additionalProperties: false
      required: [tileId, measureId, label, value, unit, freshness, owner, blockType]
      properties:
        tileId: { type: string, minLength: 1, maxLength: 160 }
        measureId: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, minLength: 1, maxLength: 240 }
        value: { type: string, minLength: 1, maxLength: 64 }
        unit: { type: string, minLength: 1, maxLength: 64 }
        target: { type: string, minLength: 1, maxLength: 64 }
        trend: { type: string, enum: [UP, DOWN, FLAT] }
        basis: { type: string, minLength: 1, maxLength: 500, description: "The declared basis of any percentage; a percentage without a basis is never sent." }
        freshness: { $ref: "#/components/schemas/WorkbenchFreshnessV1" }
        owner: { type: string, minLength: 1, maxLength: 120 }
        blockType: { type: string, enum: [STATUS, METRIC, PLAN, DECISION, EVIDENCE, DOMAIN] }
    WorkbenchComponentBalanceV1:
      type: object
      additionalProperties: false
      required: [componentId, label, remaining, quantity, periodEnd]
      properties:
        componentId: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, minLength: 1, maxLength: 240 }
        remaining: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 0 }
        periodEnd: { type: string, format: date-time }
    WorkbenchAlertV1:
      type: object
      additionalProperties: false
      required: [alertId, signal, severity, message, raisedAt, freshness]
      properties:
        alertId: { type: string, minLength: 1, maxLength: 128 }
        signal: { type: string, minLength: 1, maxLength: 160 }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        message: { type: string, minLength: 1, maxLength: 500 }
        raisedAt: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/WorkbenchFreshnessV1" }
    WorkbenchRecommendedActionV1:
      type: object
      additionalProperties: false
      required: [commandId, label, reason]
      properties:
        commandId: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, minLength: 1, maxLength: 240 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    WorkbenchAvailableCommandV1:
      type: object
      additionalProperties: false
      required: [commandId, label, enabled]
      properties:
        commandId: { type: string, minLength: 1, maxLength: 160 }
        label: { type: string, minLength: 1, maxLength: 240 }
        enabled: { type: boolean }
        disabledReason: { type: string, minLength: 1, maxLength: 500 }
    ExperienceFallbackBlockV2:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, enum: [TEXT, CHOICES, LIST, LINK] }
        data: { type: object }
    ExperienceBlockV2:
      type: object
      additionalProperties: false
      description: One block of `ExperienceReplyV2`; the closed per-type `data` shapes are defined by `schemas/experience-blocks.v2.schema.json`.
      required: [id, type, version, sensitivity, data, fallback]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [TEXT, CHOICES, LIST, LINK, STATUS, METRIC, PLAN, DECISION, FORM, EVIDENCE, DOMAIN] }
        version: { type: integer, minimum: 1 }
        sensitivity: { type: string, enum: [PUBLIC, CUSTOMER, SENSITIVE] }
        data: { type: object }
        fallback:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/ExperienceFallbackBlockV2" }
        spoken: { type: string, minLength: 1, maxLength: 1024 }
        label: { type: string, minLength: 1, maxLength: 120 }
    WorkbenchProjectionV1:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - relationshipRef
        - audience
        - phase
        - readiness
        - decisions
        - tiles
        - alerts
        - evidenceState
        - sourceFreshness
        - limitations
        - availableCommands
        - blocks
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        relationshipRef: { type: string, format: uuid }
        audience: { $ref: "#/components/schemas/WorkbenchAudienceV1" }
        phase: { $ref: "#/components/schemas/WorkbenchPhaseV1" }
        readiness: { $ref: "#/components/schemas/WorkbenchReadinessV1" }
        currentGoalRef: { type: string, format: uuid }
        currentPlanVersion: { type: string, minLength: 1, maxLength: 64 }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/WorkbenchDecisionV1" }
        tiles:
          type: array
          items: { $ref: "#/components/schemas/WorkbenchTileV1" }
        components:
          type: array
          description: Components remaining and period end. Omitted for the beneficiary audience.
          items: { $ref: "#/components/schemas/WorkbenchComponentBalanceV1" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/WorkbenchAlertV1" }
        evidenceState: { $ref: "#/components/schemas/WorkbenchEvidenceStateV1" }
        sourceFreshness: { $ref: "#/components/schemas/WorkbenchFreshnessV1" }
        limitations:
          type: array
          items: { type: string, minLength: 1, maxLength: 500 }
        recommendedNextAction: { $ref: "#/components/schemas/WorkbenchRecommendedActionV1" }
        availableCommands:
          type: array
          items: { $ref: "#/components/schemas/WorkbenchAvailableCommandV1" }
        blocks:
          type: array
          maxItems: 6
          description: Blocks negotiated through `X-Experience-Capabilities`.
          items: { $ref: "#/components/schemas/ExperienceBlockV2" }
    WorkbenchCommandReceiptV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, operationRef, status, version, replayed, correlationId]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        operationRef: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, COMPLETED, REJECTED] }
        resourceRef: { type: string, minLength: 1, maxLength: 128 }
        version: { type: string, minLength: 1, maxLength: 128, description: The resulting resource version. }
        replayed: { type: boolean }
        correlationId: { type: string, minLength: 1, maxLength: 64 }
    WorkbenchGoalSummaryV1:
      type: object
      additionalProperties: false
      required: [goalId, goalTypeId, title, state, currentVersion, updatedAt]
      properties:
        goalId: { type: string, format: uuid }
        goalTypeId: { type: string, minLength: 1, maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 240 }
        state: { type: string, enum: [ACTIVE, SUPERSEDED, CLOSED] }
        currentVersion: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    WorkbenchGoalListV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/WorkbenchGoalSummaryV1" }
        nextCursor: { type: string, minLength: 1, maxLength: 256 }
    WorkbenchGoalParametersV1:
      type: object
      description: Values of the parameters the goal type declares, keyed by parameter name.
      maxProperties: 20
      additionalProperties:
        type: string
        maxLength: 500
    WorkbenchGoalMeasureV1:
      type: object
      additionalProperties: false
      required: [measureId, unit, freshness]
      properties:
        measureId: { type: string, minLength: 1, maxLength: 160 }
        unit: { type: string, minLength: 1, maxLength: 64 }
        target: { type: string, minLength: 1, maxLength: 64 }
        baseline: { type: string, minLength: 1, maxLength: 64 }
        freshness: { $ref: "#/components/schemas/WorkbenchFreshnessV1" }
    WorkbenchGoalV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, goal, parameters, measures, constraints]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        goal: { $ref: "#/components/schemas/WorkbenchGoalSummaryV1" }
        parameters: { $ref: "#/components/schemas/WorkbenchGoalParametersV1" }
        measures:

            Link: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyHireAgentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/activate:
    put:
      tags: [Employment]

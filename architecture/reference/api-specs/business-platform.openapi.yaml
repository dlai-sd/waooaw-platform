  /api/v1/employment/contracts/{contractId}/phase-bundle:
    get:
      tags: [Employment]
      summary: Get active phase bundle
      operationId: getPhaseBundle
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active phase bundle subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhaseBundleSubscription"
    put:
      tags: [Employment]
      summary: Upgrade or change phase bundle
      description: |
        Changes the active phase bundle. Bundle upgrades are Decision Space expansions (C-003).
        CE.GrantAuthorityLicense is called. Customer must have selected the new bundle explicitly.
        DP-014 — maturity score at activation is recorded.
      operationId: updatePhaseBundle
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle:
                  type: string
                  enum: [CURTAIN_RAISER, GROWTH_ENGINE, MATURITY_PHASE]
                maturity_score_at_activation:
                  type: integer
                  minimum: 1
                  maximum: 7
      responses:
        "200":
          description: Phase bundle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhaseBundleSubscription"

  /api/v1/approvals/{approvalId}/synthetic:
    post:
      tags: [Approvals]
      summary: Record a synthetic approval
      description: |
        Called by AI Runtime after CE.ValidateAction returns ALLOW for a SYNTHETIC approval.
        Creates the synthetic_approval_records extension row with confidence data and
        starts the override window timer. Customer is notified via delivery channels.
        C-044, AD-017.
      operationId: recordSyntheticApproval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyntheticApprovalRecord"
      responses:
        "201":
          description: Synthetic approval recorded. Customer notification dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyntheticApprovalRecord"

  /api/v1/approvals/{approvalId}/override:
    post:
      tags: [Approvals]
      summary: Customer retrospective override of synthetic approval
      description: |
        Customer exercises their C-001 unconditional retrospective override right on a
        synthetically approved action. Valid only within the override_window_hours period.
        Records override in synthetic_approval_records.overridden_at. Triggers action reversal
        where technically possible. Updates override rate counter for auto-downgrade check (DP-015).
      operationId: overrideSyntheticApproval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Override recorded. Reversal initiated where possible.
        "409":
          description: Override window expired — action sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/payments/subscriptions:
    post:
      tags: [Billing]
      summary: Create a Razorpay subscription for a contract
      description: |
        Creates a recurring subscription in Razorpay for the given employment contract.
        Called when trial converts to paid hire. Razorpay subscription_id is stored in
        subscription_billing_events.payment_processor_reference.
        ADR-022 (Razorpay India).
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created. Razorpay payment link returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCreated"
        "402":
          description: Payment required — Razorpay subscription creation failed

  /api/v1/payments/webhooks/razorpay:
    post:
      tags: [Billing]
      summary: Razorpay webhook receiver
      description: |
        Receives Razorpay webhook events (payment.captured, subscription.charged,
        subscription.cancelled, payment.failed). Validates webhook signature using
        RAZORPAY_WEBHOOK_SECRET. Updates employment contract state and billing events.
        ADR-022. NOT authenticated via Keycloak — authenticated via Razorpay signature.
      operationId: razorpayWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Razorpay webhook payload (varies by event type)
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid signature or unrecognised event type

  # ─── Conversation Core (WC-034 F3) ────────────────────────────────────────

  /api/v1/employment/relationships/{relationshipId}/conversation/messages:
    get:
      tags: [Conversation]
      summary: Read the authoritative durable conversation timeline
      description: |
        Returns tenant- and relationship-authorized messages in ascending canonical sequence.
        `cursor` pages backward and `afterCursor` reconciles forward; they are mutually exclusive.
        Cursors are opaque and relationship-bound. This read does not advance the unread position.
      operationId: listConversationMessages
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ConversationCursor"
        - $ref: "#/components/parameters/ConversationAfterCursor"
        - $ref: "#/components/parameters/ConversationPageLimit"
      responses:
        "200":
          description: Authoritative timeline page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTimelinePageV1"
        "400": { $ref: "#/components/responses/ConversationInvalidRequest" }
        "401": { $ref: "#/components/responses/ConversationUnauthorized" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "410": { $ref: "#/components/responses/ConversationCursorExpired" }
        "503": { $ref: "#/components/responses/ConversationUnavailable" }
    post:
      tags: [Conversation]
      summary: Send or replay one customer text contribution
      description: |
        Accepts durable responsibility for one customer contribution. A 202 response means
        accepted by BP; it does not mean delivered, professionally completed, or evidenced.
        Same actor, relationship, key, and canonical payload hash replay one outcome.
      operationId: sendConversationMessage
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendConversationMessageRequestV1"
      responses:
        "202":
          description: Message accepted and professional execution queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSubmissionV1"
        "200":
          description: Prior identical outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSubmissionV1"
        "400": { $ref: "#/components/responses/ConversationInvalidRequest" }
        "401": { $ref: "#/components/responses/ConversationUnauthorized" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "409": { $ref: "#/components/responses/ConversationConflict" }
        "423": { $ref: "#/components/responses/ConversationStopped" }
        "429": { $ref: "#/components/responses/ConversationRateLimited" }
        "503": { $ref: "#/components/responses/ConversationUnavailable" }

  /api/v1/employment/relationships/{relationshipId}/conversation/messages/{messageId}/retry:
    post:
      tags: [Conversation]
      summary: Reconcile and retry one failed or unresolved contribution
      description: |
        Requires the original Idempotency-Key. BP verifies the stored canonical payload hash
        and retries the same logical message; it never mints a duplicate message. Completed
        outcomes replay. Changed content must be sent as a new message with a new key.
      operationId: retryConversationMessage
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ConversationMessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Existing logical message accepted for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSubmissionV1"
        "200":
          description: Prior terminal or accepted outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSubmissionV1"
        "401": { $ref: "#/components/responses/ConversationUnauthorized" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "409": { $ref: "#/components/responses/ConversationConflict" }
        "422": { $ref: "#/components/responses/ConversationRetryNotAllowed" }
        "423": { $ref: "#/components/responses/ConversationStopped" }
        "503": { $ref: "#/components/responses/ConversationUnavailable" }

  /api/v1/employment/relationships/{relationshipId}/conversation/read-position:
    put:
      tags: [Conversation]
      summary: Advance the authenticated participant's unread position
      description: |
        Advances monotonically to a visible canonical message. It cannot mark unseen content
        read and cannot move backward. The tenant and participant come only from the JWT.
      operationId: updateConversationReadPosition
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationReadPositionRequestV1"
      responses:
        "200":
          description: Read position advanced or identical outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationReadPositionV1"
        "400": { $ref: "#/components/responses/ConversationInvalidRequest" }
        "401": { $ref: "#/components/responses/ConversationUnauthorized" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "409": { $ref: "#/components/responses/ConversationConflict" }

  /api/v1/employment/relationships/{relationshipId}/conversation/stream:
    get:
      tags: [Conversation]
      summary: Stream canonical conversation state as Server-Sent Events
      description: |
        Authenticated BP public stream. The browser never connects to PR or a model provider.
        Last-Event-ID resumes within retention; expired state requires timeline reconciliation.
        Heartbeats contain no protected payload and the stream is never service-worker cached.
      operationId: streamConversation
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ConversationLastEventId"
      responses:
        "200":
          description: Canonical versioned conversation event stream
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
            X-Accel-Buffering:
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ConversationStreamEventV1"
        "401": { $ref: "#/components/responses/ConversationUnauthorized" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "410": { $ref: "#/components/responses/ConversationCursorExpired" }
        "423": { $ref: "#/components/responses/ConversationStopped" }
        "503": { $ref: "#/components/responses/ConversationUnavailable" }

  /api/v1/employment/relationships/{relationshipId}/conversation/executions/{executionId}:
    delete:
      tags: [Conversation]
      summary: Request cancellation of one professional response execution
      description: |
        Routes cancellation through BP to PR. Accepted partial content remains canonical and
        labelled incomplete. Cancellation does not delete history or release Emergency Stop.
      operationId: cancelConversationExecution
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/ConversationExecutionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationExecutionStatusV1"
        "200":
          description: Existing terminal outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationExecutionStatusV1"
        "401": { $ref: "#/components/responses/ConversationUnauthorized" }
        "404": { $ref: "#/components/responses/ConversationNotFound" }
        "409": { $ref: "#/components/responses/ConversationConflict" }
        "423": { $ref: "#/components/responses/ConversationStopped" }
        "503": { $ref: "#/components/responses/ConversationUnavailable" }


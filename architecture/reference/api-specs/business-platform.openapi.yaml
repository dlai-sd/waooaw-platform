            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/skills/{skillId}/pause:
    put:
      tags: [Skills]

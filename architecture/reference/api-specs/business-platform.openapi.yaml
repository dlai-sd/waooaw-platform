      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/RelationshipWorkspaceEvidenceId"
      responses:
        "200":
          description: Evidence detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEvidenceDetailV1"
        "400": { $ref: "#/components/responses/RelationshipWorkspaceInvalidRequest" }
        "401": { $ref: "#/components/responses/RelationshipWorkspaceUnauthorized" }
        "404": { $ref: "#/components/responses/RelationshipWorkspaceNotAccessible" }
        "503": { $ref: "#/components/responses/RelationshipWorkspaceUnavailable" }

  /api/v1/employment/relationships/{relationshipId}/workspace/evidence-exports:
    post:
      tags: [Relationship Workspace]
      summary: Request or replay one relationship evidence export
      operationId: requestRelationshipEvidenceExport
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestRelationshipEvidenceExportV1"
      responses:
        "202":
          description: Export request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEvidenceExportReceiptV1"
        "200":
          description: Prior identical export request replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEvidenceExportReceiptV1"
        "400": { $ref: "#/components/responses/RelationshipWorkspaceInvalidRequest" }
        "401": { $ref: "#/components/responses/RelationshipWorkspaceUnauthorized" }
        "404": { $ref: "#/components/responses/RelationshipWorkspaceNotAccessible" }
        "409": { $ref: "#/components/responses/RelationshipWorkspaceConflict" }
        "423": { $ref: "#/components/responses/RelationshipWorkspaceBlocked" }
        "503": { $ref: "#/components/responses/RelationshipWorkspaceUnavailable" }

  /api/v1/employment/relationships/{relationshipId}/workspace/evidence-exports/{exportId}:
    get:
      tags: [Relationship Workspace]
      summary: Reconcile one relationship evidence export request
      operationId: getRelationshipEvidenceExport
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - $ref: "#/components/parameters/RelationshipWorkspaceExportId"
      responses:
        "200":
          description: Export outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEvidenceExportOutcomeV1"
        "400": { $ref: "#/components/responses/RelationshipWorkspaceInvalidRequest" }
        "401": { $ref: "#/components/responses/RelationshipWorkspaceUnauthorized" }
        "404": { $ref: "#/components/responses/RelationshipWorkspaceNotAccessible" }
        "503": { $ref: "#/components/responses/RelationshipWorkspaceUnavailable" }

  /api/v1/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get customer notification preferences
      operationId: getNotificationPreferences
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    put:
      tags: [Notifications]
      summary: Update customer notification preferences
      description: |
        Sets which channels receive which notification types.
        Channel preferences are stored per organisation and used by all delivery pipelines
        (Maturity Report, monthly narratives, approval requests, self-governance alerts).
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences updated

# ─── Components ─────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT. Must contain `tenant_id` claim (UUID).
    PreAccountBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued, actor-bound registration JWT. It does not yet assert a tenant.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Same key and canonical request hash replay the prior outcome; divergent reuse conflicts.

    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque registration identifier bound to the authenticated pre-account actor

    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque account-link challenge identifier bound to the authenticated account

    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant-scoped durable employment relationship UUID

    RelationshipWorkspaceCommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string, format: uuid }

    RelationshipWorkspaceEvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }

    RelationshipWorkspaceExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }

    RelationshipWorkspaceAfterCursor:
      name: afterCursor
      in: query
      required: true
      schema: { type: string, minLength: 16, maxLength: 2048 }

    RelationshipWorkspacePageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

    ConversationMessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Opaque BP canonical message UUID, authorized within the relationship

    ConversationExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Opaque professional execution UUID, authorized within the relationship

    ConversationCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 16, maxLength: 2048 }
      description: Opaque relationship-bound cursor for older timeline pages; mutually exclusive with afterCursor

    ConversationAfterCursor:
      name: afterCursor
      in: query
      required: false
      schema: { type: string, minLength: 16, maxLength: 2048 }
      description: Opaque relationship-bound cursor for forward reconnect reconciliation; mutually exclusive with cursor

    ConversationPageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

    ConversationLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Last BP canonical SSE event ID received; never supplied in a URL

    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Employment contract UUID

    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Approval request UUID

  responses:
    IdentityInvalidRequest:
      description: Identity request is malformed or unsupported; no submitted secret is echoed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityUnauthorized:
      description: Identity session is missing, invalid, or expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityNotFound:
      description: Identity resource is absent, inaccessible, or cross-tenant; one normalized shape and timing class prevents existence disclosure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityStepUpRequired:
      description: Fresh or stronger Keycloak assurance is required before the command can run
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityConflict:
      description: Idempotency conflict or duplicate resolution requires a safe recovery path
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityChallengeExpired:
      description: Verification or link challenge is no longer usable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityVerificationRequired:
      description: Mandatory identity verification or minimum profile completion remains outstanding
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityRateLimited:
      description: Identity operation is rate limited without disclosing account existence
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityUnavailable:
      description: Identity dependency is unavailable and the outcome remains unresolved
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"

    Unauthorized:
      description: JWT missing, expired, or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found (or not accessible to this tenant)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Operation not valid in current state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ValidationError:
      description: Request body failed validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    ConversationInvalidRequest:
      description: Conversation request or schema version is malformed or unsupported
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationUnauthorized:
      description: Authenticated customer session is missing, invalid, or expired
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationNotFound:
      description: Relationship or message is absent, inaccessible, or cross-tenant; one normalized shape prevents existence disclosure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationConflict:
      description: Idempotency identity conflicts or authoritative state must be reconciled
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationCursorExpired:
      description: Cursor can no longer be resumed; fetch a fresh authoritative timeline snapshot
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationRetryNotAllowed:
      description: Message is not failed/unresolved or the original retry identity was not supplied
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationStopped:
      description: Relationship execution is stopped; ordinary reconnect, retry, or cancellation cannot release it
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationRateLimited:
      description: Conversation command is rate limited without losing its idempotency identity
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }
    ConversationUnavailable:
      description: Professional execution or constitutional dependency is unavailable and the outcome remains explicit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConversationProblemDetail" }

    RelationshipWorkspaceInvalidRequest:
      description: Workspace request is malformed or unsupported
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RelationshipWorkspaceProblemDetailV1" }
    RelationshipWorkspaceUnauthorized:
      description: Workspace session is missing, invalid, or expired
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RelationshipWorkspaceProblemDetailV1" }
    RelationshipWorkspaceNotAccessible:
      description: Relationship or child resource is absent, inaccessible, or cross-tenant
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RelationshipWorkspaceProblemDetailV1" }
    RelationshipWorkspaceConflict:
      description: Idempotency or expected-version conflict requires reconciliation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RelationshipWorkspaceProblemDetailV1" }
    RelationshipWorkspaceBlocked:
      description: Command is blocked by policy, assurance, authority, or owner dependency
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RelationshipWorkspaceProblemDetailV1" }
    RelationshipWorkspaceCursorExpired:
      description: Workspace cursor expired and a fresh snapshot is required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RelationshipWorkspaceProblemDetailV1" }
    RelationshipWorkspaceUnavailable:
      description: Required owner projection or constitutional dependency is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/RelationshipWorkspaceProblemDetailV1" }

  schemas:

    ProfessionalDiscoveryResult:
      type: object
      additionalProperties: false
      required: [professionalType, projectionVersion, displayName, suitability, eligibility]
      properties:
        professionalType: { type: string, maxLength: 100 }
        projectionVersion: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        displayName: { type: string, maxLength: 200 }
        suitability:
          type: array
          minItems: 1
          items: { type: string, maxLength: 500 }
        eligibility: { $ref: "#/components/schemas/ProfessionalEligibility" }

    ProfessionalEligibility:
      type: object
      additionalProperties: false
      required: [eligible, explanation]
      properties:
        eligible: { type: boolean }
        explanation: { type: string, maxLength: 500 }

    ProfessionalDisclosure:
      type: object
      additionalProperties: false
      required: [professionalType, projectionVersion, displayName, suitability, skills, limitations, authorityNeeds, customerRights, trial, evidencePosture, indicativePrice, eligibility]
      properties:
        professionalType: { type: string, maxLength: 100 }
        projectionVersion: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        displayName: { type: string, maxLength: 200 }
        suitability:
          type: array
          minItems: 1
          items: { type: string, maxLength: 500 }
        skills:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProfessionalSkillDisclosure" }
        limitations:
          type: array
          minItems: 1
          items: { type: string, maxLength: 500 }
        authorityNeeds:
          type: array
          minItems: 1
          items: { type: string, maxLength: 500 }
        customerRights:
          type: array
          minItems: 1
          items: { type: string, maxLength: 500 }
        trial: { $ref: "#/components/schemas/ProfessionalTrialDisclosure" }
        evidencePosture: { type: string, maxLength: 1000 }
        indicativePrice: { $ref: "#/components/schemas/IndicativePriceDisclosure" }
        eligibility: { $ref: "#/components/schemas/ProfessionalEligibility" }

    ProfessionalSkillDisclosure:
      type: object
      additionalProperties: false
      required: [skillId, displayName, applicableInTrial]
      properties:
        skillId: { type: string, maxLength: 100 }
        displayName: { type: string, maxLength: 200 }
        applicableInTrial: { type: boolean }
        activationCondition: { type: string, maxLength: 500 }

    ProfessionalTrialDisclosure:
      type: object
      additionalProperties: false
      required: [available, durationDays, paidApiCallsAllowed, externalActionsAllowed]
      properties:
        available: { type: boolean }
        durationDays: { type: integer, minimum: 0, maximum: 14 }
        paidApiCallsAllowed: { type: boolean, enum: [false] }
        externalActionsAllowed: { type: boolean, enum: [false] }

    IndicativePriceDisclosure:
      type: object
      additionalProperties: false
      required: [currency, amountInrPaise, cadence, qualification]
      properties:
        currency: { type: string, const: INR }
        amountInrPaise: { type: integer, format: int64, minimum: 0 }
        cadence: { type: string, enum: [MONTHLY] }
        qualification: { type: string, maxLength: 500 }

    # ── Enumerations ──────────────────────────────────────────────────────

    IdentityRegistrationState:
      type: string
      enum: [STARTED, FEDERATED_IDENTITY_ACCEPTED, CREDENTIAL_IDENTITY_ACCEPTED, WHATSAPP_IDENTITY_ACCEPTED, EMAIL_VERIFICATION_REQUIRED, DUPLICATE_RESOLUTION_REQUIRED, PROFILE_COMPLETION_REQUIRED, READY_TO_COMPLETE, COMPLETED, EXPIRED, CANCELLED]

    IdentityNextAction:
      type: string
      enum: [VERIFY_EMAIL, VERIFY_MOBILE, COMPLETE_PROFILE, RESOLVE_DUPLICATE, COMPLETE_REGISTRATION, CONTINUE_TO_DEFAULT_TARGET, NONE]

    IdentityAuthenticationPath:
      type: string
      enum: [GOOGLE, META, APPLE, CREDENTIAL, WHATSAPP]

    IdentityAssuranceLevel:
      type: string
      enum: [AAL1_CHANNEL, AAL2_ACCOUNT, AAL3_FRESH, AAL4_PAYMENT]

    IdentityVerificationPurpose:
      type: string
      enum: [EMAIL, MOBILE]

    IdentityVerificationState:
      type: string
      enum: [PENDING, VERIFIED, EXPIRED, CONSUMED]

    IdentityAccountLinkState:
      type: string
      enum: [PENDING_PORTAL_APPROVAL, PENDING_WHATSAPP_CONFIRMATION, LINKED, DUPLICATE_RESOLUTION_REQUIRED, EXPIRED, CANCELLED]

    IdentityProblemCode:
      type: string
      enum: [IDENTITY_REQUEST_INVALID, IDENTITY_SESSION_REQUIRED, IDENTITY_STEP_UP_REQUIRED, IDENTITY_ACTION_DENIED, IDENTITY_RESOURCE_NOT_ACCESSIBLE, IDENTITY_IDEMPOTENCY_CONFLICT, DUPLICATE_RESOLUTION_REQUIRED, IDENTITY_CHALLENGE_EXPIRED, IDENTITY_VERIFICATION_REQUIRED, IDENTITY_RATE_LIMITED, IDENTITY_DEPENDENCY_UNAVAILABLE]

    EmploymentState:
      type: string
      enum: [EVALUATION, ACTIVE, SUSPENDED, TERMINATED]
      description: Employment contract lifecycle state (C-034)

    EmploymentRelationshipState:
      type: string
      enum: [DISCOVERED, INTERVIEWING, TRIAL_ACTIVE, CONFIGURING, CONTRACT_PENDING_ACCEPTANCE, CONTRACT_ACCEPTED_PENDING_PAYMENT, ACTIVATION_PENDING, ACTIVE, PAUSED, STOPPED_EMERGENCY, TERMINATED]
      description: Durable AE-01 relationship lifecycle state

    RelationshipParticipantRole:
      type: string
      enum: [EVALUATOR, EMPLOYER, OUTCOME_OWNER, RELATIONSHIP_MANAGER, CONSTITUTIONAL_AUTHORITY]

    ApprovalState:
      type: string
      enum: [PENDING, SCOPE_BOUNDARY_PENDING, APPROVED, REJECTED]

    EvidenceState:
      type: string
      enum: [PROPOSED, AWAITING_APPROVAL, APPROVED, REJECTED, EXECUTED, ABANDONED]
      description: Evidence record state machine state (C-028, evidence-schema.md)

    ExecutionModel:
      type: string
      enum: [APPROVAL_GATE, PRE_AUTHORIZED]
      description: How the professional executes work. APPROVAL_GATE requires per-action approval. PRE_AUTHORIZED is PAAS mode.

    SkillApprovalMode:
      type: string
      enum: [CUSTOMER_APPROVAL, EXCEPTION_APPROVAL, SYNTHETIC_APPROVAL]

    DigitalMarketingProfileStatus:
      type: string
      enum: [INCOMPLETE, MINIMUM_VIABLE, COMPLETE]

    DigitalMarketingNeedState:
      type: string
      enum: [VISIBILITY, LEADS, CONVERSION, EFFICIENCY, COMPETITION, CONSISTENCY, TRUST, CLARITY]

    DigitalMarketingNeedStatus:
      type: string
      enum: [ACTIVE, LATENT, NOT_APPLICABLE]

    DigitalMarketingPhaseBundle:
      type: string
      enum: [CURTAIN_RAISER, GROWTH_ENGINE, MATURITY_PHASE]

    # ── Domain Objects ────────────────────────────────────────────────────

    GstInvoiceSummary:
      type: object
      additionalProperties: false
      required: [id, invoice_number, invoice_date, customer_name, taxable_amount_paise, total_amount_paise, billing_period_start, billing_period_end, bundle, is_consolidated_parent, created_at]
      properties:
        id: { type: string, format: uuid }
        employment_contract_id: { type: string, format: uuid }
        invoice_number: { type: string, maxLength: 30 }
        invoice_date: { type: string, format: date }
        customer_name: { type: string, maxLength: 200 }
        customer_gstin: { type: [string, "null"], maxLength: 15 }
        taxable_amount_paise: { type: integer, format: int64, minimum: 0 }
        cgst_amount_paise: { type: integer, format: int64, minimum: 0 }
        sgst_amount_paise: { type: integer, format: int64, minimum: 0 }
        igst_amount_paise: { type: integer, format: int64, minimum: 0 }
        total_amount_paise: { type: integer, format: int64, minimum: 0 }
        billing_period_start: { type: string, format: date }
        billing_period_end: { type: string, format: date }
        bundle: { $ref: "#/components/schemas/DigitalMarketingPhaseBundle" }
        pdf_url: { type: [string, "null"], format: uri }
        consolidation_group_id: { type: [string, "null"], format: uuid }
        is_consolidated_parent: { type: boolean }
        parent_invoice_id: { type: [string, "null"], format: uuid }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    SubscriptionTier:
      type: object
      additionalProperties: false
      required: [id, professional_type, tier_id, display_name, monthly_price_inr_paise, base_amount_paise, gst_amount_paise, gst_sac_code, is_active, sort_order]
      properties:
        id: { type: string, format: uuid }
        professional_type: { type: string, maxLength: 100 }
        tier_id: { type: string, maxLength: 50 }
        display_name: { type: string, maxLength: 100 }
        monthly_price_inr_paise: { type: integer, format: int64, minimum: 0 }
        base_amount_paise: { type: integer, format: int64, minimum: 0 }
        gst_amount_paise: { type: integer, format: int64, minimum: 0 }
        gst_sac_code: { type: string, maxLength: 10 }
        is_active: { type: boolean }
        sort_order: { type: integer }

    SkillRuntimeConfig:
      type: object
      additionalProperties: false
      required: [id, employment_contract_id, skill_type, approval_mode, synthetic_confidence_threshold, synthetic_min_history, override_window_hours, goal_miss_escalation_months, mid_month_pace_threshold, delivery_channels, monthly_llm_budget, monthly_external_api_budget, stale_after_days, override_count_30d, synthetic_approval_count_30d, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        employment_contract_id: { type: string, format: uuid }
        skill_type: { type: string, maxLength: 100 }
        approval_mode: { $ref: "#/components/schemas/SkillApprovalMode" }
        synthetic_confidence_threshold: { type: number, minimum: 0.5, maximum: 1 }
        synthetic_min_history: { type: integer, minimum: 0 }
        override_window_hours: { type: integer, minimum: 1 }
        goal_miss_escalation_months: { type: integer, minimum: 1 }
        mid_month_pace_threshold: { type: number, minimum: 0, maximum: 1 }
        delivery_channels:
          type: array
          items: { type: string }
        monthly_llm_budget: { type: integer, minimum: 0 }
        monthly_external_api_budget: { type: integer, minimum: 0 }
        mode_upgrade_authorization_event: { type: [string, "null"], format: uuid }
        synthetic_model_last_calibrated: { type: [string, "null"], format: date-time }
        stale_after_days: { type: integer, minimum: 1 }
        override_count_30d: { type: integer, minimum: 0 }
        synthetic_approval_count_30d: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillRuntimeConfigUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        approval_mode: { $ref: "#/components/schemas/SkillApprovalMode" }
        synthetic_confidence_threshold: { type: number, minimum: 0.5, maximum: 1 }
        synthetic_min_history: { type: integer, minimum: 0 }
        override_window_hours: { type: integer, minimum: 1 }
        goal_miss_escalation_months: { type: integer, minimum: 1 }
        mid_month_pace_threshold: { type: number, minimum: 0, maximum: 1 }
        delivery_channels:
          type: array
          minItems: 1
          items: { type: string }
        monthly_llm_budget: { type: integer, minimum: 0 }
        monthly_external_api_budget: { type: integer, minimum: 0 }
        stale_after_days: { type: integer, minimum: 1 }

    DigitalMarketingProfile:
      type: object
      additionalProperties: false
      required: [id, organisation_id, profile_status, field_sources, last_exchange_index, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        owner_name: { type: [string, "null"], maxLength: 255 }
        business_name: { type: [string, "null"], maxLength: 255 }
        business_domain: { type: [string, "null"], maxLength: 100 }
        locality: { type: [string, "null"], maxLength: 255 }
        city: { type: [string, "null"], maxLength: 100 }
        prospective_customers: { type: [string, "null"] }
        aspiration: { type: [string, "null"] }
        geo_scope_km: { type: [integer, "null"], minimum: 0 }
        current_digital_channels:
          type: array
          items: { type: string }
        monthly_enquiry_volume: { type: [integer, "null"], minimum: 0 }
        monthly_enquiry_target: { type: [integer, "null"], minimum: 0 }
        team_size: { type: [integer, "null"], minimum: 0 }

        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        executionModel:
          $ref: "#/components/schemas/ExecutionModel"
        professionalType:
          type: string
          example: MARKETING
        authorizedActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        prohibitedActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        alwaysAskActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        budgetConstraints:
          $ref: "#/components/schemas/BudgetConstraints"
          nullable: true
        creativeStandardProfile:
          $ref: "#/components/schemas/CreativeStandardProfile"
          nullable: true
          description: Present for creative professions (Amendment A-005)
        paasParameters:
          $ref: "#/components/schemas/PAASParameters"
          nullable: true
          description: Present for PAAS execution model only
        isActive:
          type: boolean

    ApprovalRequest:
      type: object
      required: [id, contractId, evidenceRecordId, state, proposedContent, isScopeBoundary, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        evidenceRecordId:
          type: string
          format: uuid
          nullable: true
          description: Set when Constitutional Engine records the evidence
        state:
          $ref: "#/components/schemas/ApprovalState"
        proposedContent:
          type: object
          description: The action content as proposed by the professional
          additionalProperties: true
        isScopeBoundary:
          type: boolean
        scopeBoundaryName:
          type: string
          nullable: true
        customerResponse:
          type: string
          enum: [APPROVED, REJECTED]
          nullable: true
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true

    EvidenceRecord:
      type: object
      required: [id, tenantId, contractId, professionalId, actionInstanceId, actionType, state, isScopeBoundary, decisionSpaceVersion, constitutionalBasis, createdAt]
      description: Immutable record in the Constitutional Audit Ledger (C-007, C-027)
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        professionalId:
          type: string
          format: uuid
        actionInstanceId:
          type: string
          format: uuid
          description: Groups all evidence records for one logical action attempt
        actionType:
          type: string
          example: MARKETING_POST
        state:
          $ref: "#/components/schemas/EvidenceState"
        proposedContent:
          type: object
          nullable: true
          additionalProperties: true
        executedContent:
          type: object
          nullable: true
          additionalProperties: true
        isScopeBoundary:
          type: boolean
        scopeBoundaryName:
          type: string
          nullable: true
        scopeBoundaryAcknowledgment:
          type: string
          nullable: true
        decisionSpaceVersion:
          type: integer
        constitutionalBasis:
          type: string
          description: "Semicolon-separated list of claims/drivers (e.g., 'C-023; AD-002')"
        createdAt:
          type: string
          format: date-time


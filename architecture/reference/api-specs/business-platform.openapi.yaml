openapi: "3.1.0"

info:
  title: WAOOAW Business Platform API
  version: "1.1.0"
  description: |
    External customer-facing API for the WAOOAW Business Platform.
    Manages the employment lifecycle, approval workflows, evidence reading,
    and authority management for digital professionals.

    **Constitutional Basis:**
    - C-034 (Employment lifecycle)
    - C-023 (Evidence First — every approval action calls Constitutional Engine before returning success)
    - C-003 (Authority licensed — authority changes require evidence justification)
    - AD-004 (Multi-tenant isolation — all resources scoped to JWT tenant_id)

    **Authentication:**
    All endpoints require a valid Keycloak-issued JWT Bearer token unless an
    operation declares the pre-account authentication scheme explicitly.
    The `tenant_id` claim in the JWT is the authoritative tenant identifier.
    Never provide `tenant_id` in request bodies — it is always sourced from the JWT.

    **Constitutional Compliance:**
    Any response that represents a governance event (approval, authority change, etc.)
    will only return 200 OK after the Constitutional Engine has confirmed the evidence record
    was written (Evidence First — AD-002).

servers:
  - url: http://localhost:5001
    description: Local development
  - url: https://api.waooaw.com
    description: Production (Azure Container Apps)

tags:
  - name: Identity
    description: Registration, mandatory verification, and deterministic account linking
  - name: Employment
    description: Employment contract lifecycle management
  - name: Approvals
    description: Approval workflow for professional actions
  - name: Evidence
    description: Constitutional Audit Ledger (read-only for customers)
  - name: Authority
    description: Professional authority level management
  - name: Skills
    description: Skill lifecycle management (C-036 — independently governable units)
  - name: Performance
    description: Skill performance monitoring against business KPIs (C-037)
  - name: Billing
    description: Pro-rata billing and subscription management (C-038)
  - name: Configuration
    description: Conversational agent configuration (C-039)
  - name: Health
    description: Service health checks

security:
  - BearerAuth: []

paths:

  # ─── Health ───────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Service health check
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ─── Identity and Registration ────────────────────────────────────────────

  /api/v1/identity/registrations:
    post:
      tags: [Identity]
      summary: Start or replay a customer registration
      description: |
        Starts registration from a validated Keycloak pre-account session. Provider
        claims are accepted only through that brokered session. Duplicate resolution
        occurs only after verified identity proof; this operation never exposes whether
        an arbitrary email or mobile already exists and never creates an Employment Relationship.
      operationId: startIdentityRegistration
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIdentityRegistrationRequest"
      responses:
        "201":
          description: Registration started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistration"
        "200":
          description: Prior identical outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistration"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "429": { $ref: "#/components/responses/IdentityRateLimited" }
        "503": { $ref: "#/components/responses/IdentityUnavailable" }

  /api/v1/identity/registrations/{registrationId}:
    get:
      tags: [Identity]
      summary: Get the caller-bound registration state
      operationId: getIdentityRegistration
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Privacy-safe registration projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistration"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }

  /api/v1/identity/registrations/{registrationId}/profile:
    put:
      tags: [Identity]
      summary: Set the minimum registration profile
      description: Accepts only display name, business name, business domain, and language preference.
      operationId: updateIdentityRegistrationProfile
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityRegistrationProfileRequest"
      responses:
        "200":
          description: Registration profile accepted or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistration"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "422": { $ref: "#/components/responses/IdentityVerificationRequired" }

  /api/v1/identity/registrations/{registrationId}/email-verifications:
    post:
      tags: [Identity]
      summary: Start or replay mandatory email verification
      description: Returns the same accepted shape and timing class whether or not the email is already known.
      operationId: startIdentityEmailVerification
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEmailVerificationRequest"
      responses:
        "202":
          description: Challenge accepted or replayed without identity-existence disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationChallenge"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "429": { $ref: "#/components/responses/IdentityRateLimited" }
        "503": { $ref: "#/components/responses/IdentityUnavailable" }

  /api/v1/identity/registrations/{registrationId}/email-verifications/confirm:
    post:
      tags: [Identity]
      summary: Confirm mandatory email verification
      operationId: confirmIdentityEmailVerification
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmIdentityVerificationRequest"
      responses:
        "200":
          description: Email proof accepted or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistration"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "410": { $ref: "#/components/responses/IdentityChallengeExpired" }
        "429": { $ref: "#/components/responses/IdentityRateLimited" }

  /api/v1/identity/registrations/{registrationId}/mobile-verifications:
    post:
      tags: [Identity]
      summary: Start or replay mandatory mobile verification
      description: |
        Uses an approved OTP path when no ADR-023 Meta-verified proof is already bound.
        Returns no account-existence information.
      operationId: startIdentityMobileVerification
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMobileVerificationRequest"
      responses:
        "202":
          description: Challenge accepted or replayed without identity-existence disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityVerificationChallenge"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "429": { $ref: "#/components/responses/IdentityRateLimited" }
        "503": { $ref: "#/components/responses/IdentityUnavailable" }

  /api/v1/identity/registrations/{registrationId}/mobile-verifications/confirm:
    post:
      tags: [Identity]
      summary: Confirm mandatory mobile verification
      operationId: confirmIdentityMobileVerification
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmIdentityVerificationRequest"
      responses:
        "200":
          description: Mobile proof accepted or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRegistration"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "410": { $ref: "#/components/responses/IdentityChallengeExpired" }
        "429": { $ref: "#/components/responses/IdentityRateLimited" }

  /api/v1/identity/registrations/{registrationId}/complete:
    post:
      tags: [Identity]
      summary: Complete registration by minting or reusing one account
      description: |
        Requires verified email, verified mobile, and the approved minimum profile. Duplicate
        resolution is deterministic and proof-gated. ACCOUNT_CREATED and ACCOUNT_REUSED have
        the same customer-facing success treatment. No Employment Relationship is created.
      operationId: completeIdentityRegistration
      security:
        - PreAccountBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Account created, reused, or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityCompletion"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "422": { $ref: "#/components/responses/IdentityVerificationRequired" }
        "503": { $ref: "#/components/responses/IdentityUnavailable" }

  /api/v1/identity/account-links:
    post:
      tags: [Identity]
      summary: Start or replay a WhatsApp-to-web account link
      description: |
        Requires a freshly authenticated AAL3 portal session. The server selects or validates
        an opaque verified-mobile proof; raw mobile and client-generated hashes are not authority.
      operationId: startIdentityAccountLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIdentityAccountLinkRequest"
      responses:
        "201":
          description: Link challenge started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAccountLink"
        "200":
          description: Prior identical link outcome replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAccountLink"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "403": { $ref: "#/components/responses/IdentityStepUpRequired" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "429": { $ref: "#/components/responses/IdentityRateLimited" }

  /api/v1/identity/account-links/{linkId}/approve:
    post:
      tags: [Identity]
      summary: Explicitly approve a WhatsApp-to-web account link
      operationId: approveIdentityAccountLink
      parameters:
        - $ref: "#/components/parameters/LinkId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Approval recorded; fresh ADR-023 confirmation remains required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAccountLink"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "403": { $ref: "#/components/responses/IdentityStepUpRequired" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }
        "409": { $ref: "#/components/responses/IdentityConflict" }
        "410": { $ref: "#/components/responses/IdentityChallengeExpired" }

  /api/v1/identity/account-links/{linkId}:
    get:
      tags: [Identity]
      summary: Get caller-bound account-link status
      operationId: getIdentityAccountLink
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: Privacy-safe link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAccountLink"
        "401": { $ref: "#/components/responses/IdentityUnauthorized" }
        "404": { $ref: "#/components/responses/IdentityNotFound" }

  # ─── Employment ───────────────────────────────────────────────────────────

  /api/v1/employment/relationships:
    post:
      tags: [Employment]
      summary: Admit or replay an employment relationship
      description: |
        Mints the tenant's durable employment relationship for the authenticated
        participant and canonical evaluation intent. Replaying the same participant,
        professional type, and evaluation intent returns the existing relationship.
        Constitutional validation and evidence commitment complete before persistence.
      operationId: admitEmploymentRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmitEmploymentRelationshipRequest"
      responses:
        "201":
          description: Relationship admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentRelationship"
        "200":
          description: Existing relationship returned for an idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentRelationship"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated identity lacks tenant or participant authority
        "503":
          description: Constitutional validation or evidence commitment is unavailable

  /api/v1/employment/relationships/{relationshipId}:
    get:
      tags: [Employment]
      summary: Get an employment relationship
      operationId: getEmploymentRelationship
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      responses:
        "200":
          description: Tenant-scoped employment relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentRelationship"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/employment/relationships/{relationshipId}/timeline:
    get:
      tags: [Employment]
      summary: Get the evidence-linked relationship state timeline
      operationId: getEmploymentRelationshipTimeline
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      responses:
        "200":
          description: Ordered relationship state history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelationshipTimelineEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/employment/relationships/{relationshipId}/transitions:
    post:
      tags: [Employment]
      summary: Transition relationship state from an authorized internal service
      description: |
        Internal-service endpoint. The actor must have the asserted active participant-role
        binding in the same tenant. Legal-state, Emergency Stop release, constitutional
        validation, and evidence commitment checks all complete before state mutation.
      operationId: transitionEmploymentRelationship
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionEmploymentRelationshipRequest"
      responses:
        "200":
          description: Relationship transitioned with evidence committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentRelationship"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Service or participant-role authority denied
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: Constitutional validation or evidence commitment is unavailable

  /api/v1/employment/contracts:
    get:
      tags: [Employment]
      summary: List employment contracts for the authenticated customer
      operationId: listEmploymentContracts
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/EmploymentState"
          description: Filter by contract state
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of employment contracts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentContractPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Employment]
      summary: Compatibility adapter for relationship admission
      deprecated: true
      description: |
        Deprecated compatibility route. Admits or replays a canonical employment
        relationship and returns a legacy-shaped projection. Use
        POST /api/v1/employment/relationships for new integrations.
      operationId: formEmploymentContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyFormEmploymentContractRequest"
      responses:
        "201":
          description: Canonical relationship admitted through the compatibility adapter
          headers:
            Deprecation:
              schema: { type: string, const: "true" }
            Link:
              schema: { type: string }
              description: Canonical relationship URL with rel="successor-version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyEmploymentRelationshipAdapterResponse"
        "200":
          description: Existing canonical relationship returned for adapter replay
          headers:
            Deprecation:
              schema: { type: string, const: "true" }
            Link:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyEmploymentRelationshipAdapterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/employment/contracts/{contractId}:
    get:
      tags: [Employment]
      summary: Compatibility projection of an employment relationship
      deprecated: true
      operationId: getEmploymentContract
      parameters:
        - $ref: "#/components/parameters/ContractId"
      responses:
        "200":
          headers:
            Deprecation:
              schema: { type: string, const: "true" }
            Link:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyEmploymentRelationshipAdapterResponse"
          description: Legacy-shaped relationship projection
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Employment]
      summary: Terminate an employment contract
      description: |
        Terminates the contract (transitions to TERMINATED state).
        A Constitutional Engine evidence record is created before this returns 200.
        Termination is irreversible.
      operationId: terminateEmploymentContract
      parameters:
        - $ref: "#/components/parameters/ContractId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateContractRequest"
      responses:
        "200":
          description: Contract terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentContract"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agents/hire:
    post:
      tags: [Employment]
      summary: Deprecated v1 hire compatibility adapter
      deprecated: true
      operationId: hireAgentCompatibilityV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyHireAgentRequest"
      responses:
        "201":
          description: Relationship admitted through the hire adapter
          headers:
            Deprecation: { schema: { type: string, const: "true" } }
            Link: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyHireAgentResponse"
        "200":
          description: Existing relationship returned for hire replay
          headers:
            Deprecation: { schema: { type: string, const: "true" } }
            Link: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyHireAgentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/agents/hire:
    post:
      tags: [Employment]
      summary: Deprecated unversioned hire compatibility adapter
      deprecated: true
      operationId: hireAgentCompatibilityUnversioned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyHireAgentRequest"
      responses:
        "200":
          description: Canonical relationship projected through the legacy hire response
          headers:
            Deprecation: { schema: { type: string, const: "true" } }
            Link: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyHireAgentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/activate:
    put:
      tags: [Employment]
      summary: Activate an employment contract
      description: Transitions contract from EVALUATION to ACTIVE. Constitutional Engine evidence record created before return.
      operationId: activateEmploymentContract
      parameters:
        - $ref: "#/components/parameters/ContractId"
      responses:
        "200":
          description: Contract activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentContract"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/employment/contracts/{contractId}/suspend:
    put:
      tags: [Employment]
      summary: Suspend an employment contract
      operationId: suspendEmploymentContract
      parameters:
        - $ref: "#/components/parameters/ContractId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendContractRequest"
      responses:
        "200":
          description: Contract suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentContract"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/employment/contracts/{contractId}/skills:
    get:
      tags: [Skills]
      summary: List skills in an employment contract (C-036)
      operationId: listSkills
      parameters:
        - $ref: "#/components/parameters/ContractId"
        - name: state
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED, TERMINATED]
      responses:
        "200":
          description: Skills in the contract
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Skills]
      summary: Add a skill to an employment contract
      operationId: addSkill
      parameters:
        - $ref: "#/components/parameters/ContractId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSkillRequest"
      responses:
        "201":
          description: Skill added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/skills/{skillId}/pause:
    put:
      tags: [Skills]
      summary: Pause a skill (pro-rata billing stops — C-038)
      operationId: pauseSkill
      parameters:
        - $ref: "#/components/parameters/ContractId"
        - name: skillId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Skill paused — billing event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/skills/{skillId}/resume:
    put:
      tags: [Skills]
      summary: Resume a paused skill (pro-rata billing resumes — C-038)
      operationId: resumeSkill
      parameters:
        - $ref: "#/components/parameters/ContractId"
        - name: skillId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Skill resumed — billing event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/skills/{skillId}/goals:
    put:
      tags: [Skills]
      summary: Update skill business KPI goals (C-037)
      operationId: updateSkillGoals
      parameters:
        - $ref: "#/components/parameters/ContractId"
        - name: skillId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkillGoalsRequest"
      responses:
        "200":
          description: Goals updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/performance:
    get:
      tags: [Performance]
      summary: Get skill performance against business KPIs (C-037, AD-012)
      description: "Returns business KPI metrics as primary data. Technical metrics are available in supporting_metrics only."
      operationId: getContractPerformance
      parameters:
        - $ref: "#/components/parameters/ContractId"
        - name: skillId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to a specific skill
        - name: periods
          in: query
          schema:
            type: integer
            default: 4
          description: Number of historical periods to return
      responses:
        "200":
          description: Performance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillPerformanceRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/billing:
    get:
      tags: [Billing]
      summary: Get itemised billing statement (C-038, AD-014)
      description: "Pro-rata billing calculated from event ledger. Itemised per skill. For COMBINED billing preference, returns the consolidated invoice; for SEPARATE, returns per-agent invoices."
      operationId: getBillingStatement
      parameters:
        - name: month
          in: query
          schema:
            type: string
            format: date
          description: "Billing period (YYYY-MM). Defaults to current month."
      responses:
        "200":
          description: Itemised billing statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatement"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/billing/preference:
    get:
      tags: [Billing]
      summary: Get billing preference (SEPARATE or COMBINED)
      description: Returns the customer's current multi-agent billing preference.
      operationId: getBillingPreference
      responses:
        "200":
          description: Current billing preference
          content:
            application/json:
              schema:
                type: object
                properties:
                  billing_preference: { type: string, enum: [SEPARATE, COMBINED] }
                  combined_billing_anchor_day: { type: integer, minimum: 1, maximum: 28 }
                  active_agents: { type: integer, description: "Count of currently active employment contracts" }
    put:
      tags: [Billing]
      summary: Update billing preference
      description: |
        Changes between SEPARATE and COMBINED billing. Effective from next billing period.
        Requires at least 2 active employment contracts for COMBINED to be meaningful.
      operationId: updateBillingPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billing_preference]
              properties:
                billing_preference: { type: string, enum: [SEPARATE, COMBINED] }
                combined_billing_anchor_day:
                  type: integer
                  minimum: 1
                  maximum: 28
                  description: "Day of month for consolidated invoice. Default 1."
      responses:
        "200":
          description: Preference updated. Effective from next billing period.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/billing/invoices:
    get:
      tags: [Billing]
      summary: List all GST invoices
      description: |
        Returns all GST invoices for the customer. For COMBINED preference, includes
        consolidated parent invoices. Each invoice includes a signed PDF URL valid for 1 hour.
      operationId: listInvoices
      parameters:
        - name: from_date
          in: query
          schema: { type: string, format: date }
        - name: to_date
          in: query
          schema: { type: string, format: date }
        - name: agent_type
          in: query
          schema: { type: string }
          description: "Filter by professional_type. Omit to get all agents."
      responses:
        "200":
          description: List of GST invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GstInvoiceSummary"

  /api/v1/billing/subscription-tiers:
    get:
      tags: [Billing]
      summary: List available subscription tiers for an agent type
      description: Returns available tiers and pricing for a given professional_type.
      operationId: getSubscriptionTiers
      parameters:
        - name: professional_type
          in: query
          required: true
          schema: { type: string }
          description: "e.g. DIGITAL_MARKETING_HEALTHCARE, TRADING_FO_CRYPTO, AGRICULTURAL_ADVISOR_INDIA"
      responses:
        "200":
          description: Available subscription tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionTier"

  /api/v1/billing/whatsapp-upi-link:
    post:
      tags: [Billing]
      summary: Generate WhatsApp UPI AutoPay mandate link (Agricultural Advisor)
      description: |
        Generates a Razorpay UPI AutoPay (Standing Instruction) mandate link for WhatsApp delivery.
        This is a ONE-TIME SETUP — the farmer taps the link, approves a ₹200/month standing
        instruction in their UPI app (GPay/PhonePe/Paytm), and Razorpay auto-collects every month.
        NOT a one-time payment link — this creates a recurring mandate.
        
        Only applicable for AGRICULTURAL_ADVISOR_INDIA professional type.
        
        WhatsApp message template (HSM required — pre-approved):
        "नमस्कार {{farmer_name}}! शेतकरी मित्र सेवा ₹200/महिना.
         एकदाच approve करा — दर महिना आपोआप होईल: {{mandate_link}}"
        
        R016-01 fix: Changed from one-time UPI link to UPI AutoPay mandate (ADR-022).
      operationId: generateWhatsappUpiAutopayLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_id]
              properties:
                contract_id: { type: string, format: uuid }
      responses:
        "200":
          description: UPI AutoPay mandate link ready for WhatsApp delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  mandate_link: { type: string, format: uri, description: "Razorpay UPI AutoPay link" }
                  mandate_id: { type: string, description: "Razorpay mandate ID for status tracking" }
                  amount_inr: { type: integer, description: "Monthly amount in INR" }
                  expires_at: { type: string, format: date-time, description: "Link expiry — 24 hours" }
                  whatsapp_message: { type: string, description: "Pre-formatted HSM message body in farmer's language" }
        "422":
          description: Agent type not eligible for UPI AutoPay or farmer language not available

  /api/v1/configure/conversational:
    post:
      tags: [Configuration]
      summary: Configure agent via natural language conversation (C-039, AD-013)
      description: |
        Accepts a natural language message from the customer and returns either:
        - A clarifying question (when more information is needed)
        - A proposed DecisionSpaceInput (when enough information has been gathered)
        The customer confirms the proposed Decision Space before it is committed.
        Target: complete configuration in under 15 minutes (AD-013).
      operationId: conversationalConfigure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationalConfigRequest"
      responses:
        "200":
          description: Clarifying question or proposed configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationalConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/employment/contracts/{contractId}/renew:
    post:
      tags: [Employment]
      summary: Renew an employment contract
      operationId: renewEmploymentContract
      parameters:
        - $ref: "#/components/parameters/ContractId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewContractRequest"
      responses:
        "200":
          description: Contract renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentContract"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/employment/contracts/{contractId}/convert-trial:
    post:
      tags: [Employment]
      summary: Convert a trial contract to paid subscription (FR-002)
      description: |
        Converts an active trial contract to a paid subscription.
        Trial outputs produced during the trial period are retained by the customer
        regardless of conversion (FR-002 — trial outputs owned by customer).
        A Constitutional Engine evidence record is created before this returns 200.
      operationId: convertTrialToPaid
      parameters:
        - $ref: "#/components/parameters/ContractId"
      responses:
        "200":
          description: Trial converted to paid subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentContract"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Contract is not a trial, or trial has already been converted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ─── Approvals ────────────────────────────────────────────────────────────

  /api/v1/approvals:
    get:
      tags: [Approvals]
      summary: List pending approval requests
      operationId: listApprovals
      parameters:
        - name: contractId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by contract
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalState"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: List of approval requests
          content:

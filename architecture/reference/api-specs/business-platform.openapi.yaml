              schema:
                $ref: "#/components/schemas/ApprovalRequestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/approvals/{approvalId}:
    get:
      tags: [Approvals]
      summary: Get a single approval request
      operationId: getApproval
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/approvals/{approvalId}/approve:
    post:
      tags: [Approvals]
      summary: Approve a proposed action
      description: |
        Records customer approval. Constitutional Engine RecordEvidence (state=APPROVED)
        is called and confirmed before this returns 200. Only returns 200 after evidence
        is confirmed durable (Evidence First — AD-002).
      operationId: approveAction
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Action approved and evidence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/approvals/{approvalId}/reject:
    post:
      tags: [Approvals]
      summary: Reject a proposed action
      description: |
        Records customer rejection. Constitutional Engine RecordEvidence (state=REJECTED)
        is called and confirmed before this returns 200.
      operationId: rejectAction
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectActionRequest"
      responses:
        "200":
          description: Action rejected and evidence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/approvals/{approvalId}/confirm-boundary:
    post:
      tags: [Approvals]
      summary: Confirm a scope-boundary crossing
      description: |
        Customer explicitly acknowledges the professional has reached or crossed
        a scope boundary. A ScopeBoundaryConfirmation evidence record is created.
        This is a constitutional record — the customer's acknowledgment is permanent.
      operationId: confirmBoundary
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBoundaryRequest"
      responses:
        "200":
          description: Boundary confirmed and evidence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Evidence ─────────────────────────────────────────────────────────────

  /api/v1/evidence:
    get:
      tags: [Evidence]
      summary: List evidence records (read-only view of Constitutional Audit Ledger)
      description: Returns evidence records for the authenticated customer's contracts. All records are immutable.
      operationId: listEvidence
      parameters:
        - name: contractId
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceState"
        - name: actionType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Evidence records (paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRecordPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/evidence/{evidenceId}:
    get:
      tags: [Evidence]
      summary: Get a single evidence record
      operationId: getEvidenceRecord
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evidence record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/evidence/export:
    get:
      tags: [Evidence]
      summary: Export full evidence ledger (data portability — Article IX right)
      description: |
        Returns a zip archive of all evidence records for the authenticated customer.
        This is a constitutional right (Article IX) — it cannot be withheld or rate-limited
        beyond reasonable technical constraints.
      operationId: exportEvidence
      parameters:
        - name: contractId
          in: query
          schema:
            type: string
            format: uuid
          description: Optional — export for a specific contract only
      responses:
        "200":
          description: Evidence export zip
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Export rate limit (max 1 full export per hour per customer)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ─── Authority ────────────────────────────────────────────────────────────

  /api/v1/authority/current:
    get:
      tags: [Authority]
      summary: Get current authority level for a contract
      operationId: getCurrentAuthority
      parameters:
        - name: contractId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current authority level and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/authority/expand:
    post:
      tags: [Authority]
      summary: Expand professional authority level
      description: |
        Grants an authority expansion. Requires evidence IDs that justify the expansion.
        Constitutional Engine GrantAuthorityLicense is called and confirmed before return.
      operationId: expandAuthority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyAuthorityRequest"
      responses:
        "200":
          description: Authority expanded and license recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/authority/restrict:
    post:
      tags: [Authority]
      summary: Restrict professional authority level
      description: |
        Restricts or suspends authority. Constitutional Engine RevokeAuthorityLicense
        is called and confirmed before return.
      operationId: restrictAuthority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyAuthorityRequest"
      responses:
        "200":
          description: Authority restricted and license recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── DMA v2.0 Endpoints (v0.18.0) ───────────────────────────────────────────

  /api/v1/employment/contracts/{contractId}/skills/{skillId}/runtime-config:
    get:
      tags: [Skills]
      summary: Get skill runtime configuration
      description: Returns the current approval mode, thresholds, delivery channels, and API budget for a skill.
      operationId: getSkillRuntimeConfig
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Skill runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRuntimeConfig"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Skills]
      summary: Update skill runtime configuration
      description: |
        Updates approval mode, thresholds, delivery channels, or API budget.
        Mode upgrades (CUSTOMER_APPROVAL → EXCEPTION_APPROVAL → SYNTHETIC_APPROVAL) are
        Decision Space amendments — CE.GrantAuthorityLicense is called and a constitutional
        evidence record is created. C-003, C-044, DP-015.
      operationId: updateSkillRuntimeConfig
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: skillId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRuntimeConfigUpdate"
      responses:
        "200":
          description: Configuration updated. If approval_mode changed, evidence_record_id is populated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRuntimeConfig"
        "409":
          description: Approval mode upgrade rejected — insufficient approval history or confidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/digital-marketing/profiles/{organisationId}:
    get:
      tags: [DigitalMarketing]
      summary: Get customer digital marketing profile
      description: Returns the Customer Profile built during Skill 0 (Customer Profiling). Tier 2 — tenant-scoped.
      operationId: getDMProfile
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalMarketingProfile"
        "404":
          description: No profile exists yet (profiling not completed)
    put:
      tags: [DigitalMarketing]
      summary: Update customer digital marketing profile
      description: |
        Customer confirms or updates profile fields. Sets profile_status to COMPLETE
        when all minimum fields are confirmed. C-039 — confirmation required.
      operationId: updateDMProfile
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigitalMarketingProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalMarketingProfile"

  /api/v1/digital-marketing/maturity-scores/{organisationId}:
    get:
      tags: [DigitalMarketing]
      summary: Get maturity score history
      description: Returns all Digital Marketing Maturity assessments for the organisation, most recent first. Append-only — no updates.
      operationId: getDMMaturityScores
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: Maturity score history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaturityScore"

  /api/v1/digital-marketing/maturity-scores/{organisationId}/latest/report:
    get:
      tags: [DigitalMarketing]
      summary: Get the latest Maturity Report PDF URL
      description: Returns a signed URL for the most recent Digital Marketing Maturity Report PDF. URL valid for 1 hour.
      operationId: getLatestMaturityReportPdfUrl
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Signed PDF URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "404":
          description: No maturity report generated yet

  /api/v1/digital-marketing/needs-heatmap/{organisationId}:
    get:
      tags: [DigitalMarketing]
      summary: Get current needs heat map
      description: Returns the 8-need assessment from the most recent Market Research run.
      operationId: getDMNeedsHeatmap
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Needs heat map
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeedsHeatmapEntry"

  /api/v1/employment/contracts/{contractId}/phase-bundle:
    get:
      tags: [Employment]
      summary: Get active phase bundle
      operationId: getPhaseBundle
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active phase bundle subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhaseBundleSubscription"
    put:
      tags: [Employment]
      summary: Upgrade or change phase bundle
      description: |
        Changes the active phase bundle. Bundle upgrades are Decision Space expansions (C-003).
        CE.GrantAuthorityLicense is called. Customer must have selected the new bundle explicitly.
        DP-014 — maturity score at activation is recorded.
      operationId: updatePhaseBundle
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle:
                  type: string
                  enum: [CURTAIN_RAISER, GROWTH_ENGINE, MATURITY_PHASE]
                maturity_score_at_activation:
                  type: integer
                  minimum: 1
                  maximum: 7
      responses:
        "200":
          description: Phase bundle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhaseBundleSubscription"

  /api/v1/approvals/{approvalId}/synthetic:
    post:
      tags: [Approvals]
      summary: Record a synthetic approval
      description: |
        Called by AI Runtime after CE.ValidateAction returns ALLOW for a SYNTHETIC approval.
        Creates the synthetic_approval_records extension row with confidence data and
        starts the override window timer. Customer is notified via delivery channels.
        C-044, AD-017.
      operationId: recordSyntheticApproval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyntheticApprovalRecord"
      responses:
        "201":
          description: Synthetic approval recorded. Customer notification dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyntheticApprovalRecord"

  /api/v1/approvals/{approvalId}/override:
    post:
      tags: [Approvals]
      summary: Customer retrospective override of synthetic approval
      description: |
        Customer exercises their C-001 unconditional retrospective override right on a
        synthetically approved action. Valid only within the override_window_hours period.
        Records override in synthetic_approval_records.overridden_at. Triggers action reversal
        where technically possible. Updates override rate counter for auto-downgrade check (DP-015).
      operationId: overrideSyntheticApproval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Override recorded. Reversal initiated where possible.
        "409":
          description: Override window expired — action sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/payments/subscriptions:
    post:
      tags: [Billing]
      summary: Create a Razorpay subscription for a contract
      description: |
        Creates a recurring subscription in Razorpay for the given employment contract.
        Called when trial converts to paid hire. Razorpay subscription_id is stored in
        subscription_billing_events.payment_processor_reference.
        ADR-022 (Razorpay India).
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created. Razorpay payment link returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCreated"
        "402":
          description: Payment required — Razorpay subscription creation failed

  /api/v1/payments/webhooks/razorpay:
    post:
      tags: [Billing]
      summary: Razorpay webhook receiver
      description: |
        Receives Razorpay webhook events (payment.captured, subscription.charged,
        subscription.cancelled, payment.failed). Validates webhook signature using
        RAZORPAY_WEBHOOK_SECRET. Updates employment contract state and billing events.
        ADR-022. NOT authenticated via Keycloak — authenticated via Razorpay signature.
      operationId: razorpayWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Razorpay webhook payload (varies by event type)
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid signature or unrecognised event type

  /api/v1/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get customer notification preferences
      operationId: getNotificationPreferences
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    put:
      tags: [Notifications]
      summary: Update customer notification preferences
      description: |
        Sets which channels receive which notification types.
        Channel preferences are stored per organisation and used by all delivery pipelines
        (Maturity Report, monthly narratives, approval requests, self-governance alerts).
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences updated

# ─── Components ─────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT. Must contain `tenant_id` claim (UUID).
    PreAccountBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued, actor-bound registration JWT. It does not yet assert a tenant.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Same key and canonical request hash replay the prior outcome; divergent reuse conflicts.

    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque registration identifier bound to the authenticated pre-account actor

    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque account-link challenge identifier bound to the authenticated account

    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant-scoped durable employment relationship UUID

    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Employment contract UUID

    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Approval request UUID

  responses:
    IdentityUnauthorized:
      description: Identity session is missing, invalid, or expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityNotFound:
      description: Identity operation is absent, expired, or inaccessible; existence is not disclosed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityStepUpRequired:
      description: Fresh or stronger Keycloak assurance is required before the command can run
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityConflict:
      description: Idempotency conflict or duplicate resolution requires a safe recovery path
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityChallengeExpired:
      description: Verification or link challenge is no longer usable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityVerificationRequired:
      description: Mandatory identity verification or minimum profile completion remains outstanding
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityRateLimited:
      description: Identity operation is rate limited without disclosing account existence
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"
    IdentityUnavailable:
      description: Identity dependency is unavailable and the outcome remains unresolved
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdentityProblemDetail"

    Unauthorized:
      description: JWT missing, expired, or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found (or not accessible to this tenant)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Operation not valid in current state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ValidationError:
      description: Request body failed validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:

    # ── Enumerations ──────────────────────────────────────────────────────

    IdentityRegistrationState:
      type: string
      enum: [STARTED, FEDERATED_IDENTITY_ACCEPTED, CREDENTIAL_IDENTITY_ACCEPTED, WHATSAPP_IDENTITY_ACCEPTED, EMAIL_VERIFICATION_REQUIRED, MOBILE_VERIFICATION_REQUIRED, DUPLICATE_RESOLUTION_REQUIRED, PROFILE_COMPLETION_REQUIRED, READY_TO_COMPLETE, COMPLETED, EXPIRED, CANCELLED]

    IdentityNextAction:
      type: string
      enum: [VERIFY_EMAIL, VERIFY_MOBILE, COMPLETE_PROFILE, RESOLVE_DUPLICATE, COMPLETE_REGISTRATION, CONTINUE_TO_DEFAULT_TARGET, NONE]

    IdentityAuthenticationPath:
      type: string
      enum: [GOOGLE, META, CREDENTIAL, WHATSAPP]

    IdentityAssuranceLevel:
      type: string
      enum: [AAL1_CHANNEL, AAL2_ACCOUNT, AAL3_FRESH, AAL4_PAYMENT]

    IdentityVerificationPurpose:
      type: string
      enum: [EMAIL, MOBILE]

    IdentityVerificationState:
      type: string
      enum: [PENDING, VERIFIED, EXPIRED, CONSUMED]

    IdentityAccountLinkState:
      type: string
      enum: [PENDING_PORTAL_APPROVAL, PENDING_WHATSAPP_CONFIRMATION, LINKED, DUPLICATE_RESOLUTION_REQUIRED, EXPIRED, CANCELLED]

    IdentityProblemCode:
      type: string
      enum: [IDENTITY_REQUEST_INVALID, IDENTITY_SESSION_REQUIRED, IDENTITY_STEP_UP_REQUIRED, IDENTITY_ACTION_DENIED, IDENTITY_IDEMPOTENCY_CONFLICT, DUPLICATE_RESOLUTION_REQUIRED, IDENTITY_CHALLENGE_EXPIRED, IDENTITY_VERIFICATION_REQUIRED, IDENTITY_RATE_LIMITED, IDENTITY_DEPENDENCY_UNAVAILABLE]

    EmploymentState:
      type: string
      enum: [EVALUATION, ACTIVE, SUSPENDED, TERMINATED]
      description: Employment contract lifecycle state (C-034)

    EmploymentRelationshipState:
      type: string
      enum: [DISCOVERED, INTERVIEWING, TRIAL_ACTIVE, CONFIGURING, CONTRACT_PENDING_ACCEPTANCE, CONTRACT_ACCEPTED_PENDING_PAYMENT, ACTIVATION_PENDING, ACTIVE, PAUSED, STOPPED_EMERGENCY, TERMINATED]
      description: Durable AE-01 relationship lifecycle state

    RelationshipParticipantRole:
      type: string
      enum: [EVALUATOR, EMPLOYER, OUTCOME_OWNER, RELATIONSHIP_MANAGER, CONSTITUTIONAL_AUTHORITY]

    ApprovalState:
      type: string
      enum: [PENDING, SCOPE_BOUNDARY_PENDING, APPROVED, REJECTED]

    EvidenceState:
      type: string
      enum: [PROPOSED, AWAITING_APPROVAL, APPROVED, REJECTED, EXECUTED, ABANDONED]
      description: Evidence record state machine state (C-028, evidence-schema.md)

    ExecutionModel:
      type: string
      enum: [APPROVAL_GATE, PRE_AUTHORIZED]
      description: How the professional executes work. APPROVAL_GATE requires per-action approval. PRE_AUTHORIZED is PAAS mode.

    # ── Domain Objects ────────────────────────────────────────────────────

    StartIdentityRegistrationRequest:
      type: object
      additionalProperties: false
      required: [authenticationPath, languagePreference]
      properties:
        authenticationPath:
          $ref: "#/components/schemas/IdentityAuthenticationPath"
        languagePreference:
          type: string
          pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          maxLength: 5

    IdentityRegistrationProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, businessName, businessDomain, languagePreference]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        businessDomain:
          type: string
          minLength: 1
          maxLength: 100
          description: Plain-language business type, not an internet domain
        languagePreference:
          type: string
          pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          maxLength: 5

    IdentityRegistrationProfile:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, maxLength: 120 }
        businessName: { type: string, maxLength: 160 }
        businessDomain: { type: string, maxLength: 100 }
        languagePreference: { type: string, maxLength: 5 }

    IdentityRegistration:
      type: object
      additionalProperties: false
      required: [registrationId, state, nextAction, authenticationPath, emailVerified, mobileVerified, profile, expiresAt, updatedAt]
      properties:
        registrationId: { type: string, format: uuid }
        state:
          $ref: "#/components/schemas/IdentityRegistrationState"
        nextAction:
          $ref: "#/components/schemas/IdentityNextAction"
        authenticationPath:
          $ref: "#/components/schemas/IdentityAuthenticationPath"
        providerLabel:
          type: string
          maxLength: 40
          nullable: true
        emailVerified: { type: boolean }
        mobileVerified: { type: boolean }
        maskedEmail:
          type: string
          maxLength: 254
          nullable: true
        maskedMobile:
          type: string
          maxLength: 32
          nullable: true
        profile:
          $ref: "#/components/schemas/IdentityRegistrationProfile"
        expiresAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StartEmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    StartMobileVerificationRequest:
      type: object
      additionalProperties: false
      required: [mobile]
      properties:
        mobile:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"

    ConfirmIdentityVerificationRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true

    IdentityVerificationChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, purpose, state, maskedDestination, expiresAt, resendAfter]
      properties:
        challengeId: { type: string, format: uuid }
        purpose:
          $ref: "#/components/schemas/IdentityVerificationPurpose"
        state:
          $ref: "#/components/schemas/IdentityVerificationState"
        maskedDestination: { type: string, maxLength: 254 }
        expiresAt: { type: string, format: date-time }
        resendAfter: { type: string, format: date-time }

    IdentityCompletion:
      type: object
      additionalProperties: false
      required: [outcome, accountReference, assuranceLevel, defaultTarget]
      properties:
        outcome:
          type: string
          enum: [ACCOUNT_CREATED, ACCOUNT_REUSED]
        accountReference:
          type: string
          format: uuid
          description: Opaque account reference for the authenticated server session
        assuranceLevel:
          $ref: "#/components/schemas/IdentityAssuranceLevel"
        defaultTarget:
          type: string
          enum: [APPLICATION_HOME, MOST_RECENT_RELATIONSHIP]

    StartIdentityAccountLinkRequest:
      type: object
      additionalProperties: false
      required: [verifiedMobileProofId]
      properties:
        verifiedMobileProofId:
          type: string
          format: uuid
          description: Opaque server-issued proof; raw mobile and client-generated hashes are prohibited

    IdentityAccountLink:
      type: object
      additionalProperties: false
      required: [linkId, state, requiredAssurance, maskedMobile, expiresAt, updatedAt]
      properties:
        linkId: { type: string, format: uuid }
        state:
          $ref: "#/components/schemas/IdentityAccountLinkState"
        requiredAssurance:
          $ref: "#/components/schemas/IdentityAssuranceLevel"
        maskedMobile: { type: string, maxLength: 32 }
        expiresAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IdentityProblemDetail:
      type: object
      additionalProperties: false
      description: RFC 9457 identity error with privacy-safe extension fields
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          maxLength: 300
          description: Safe display text with no identity value or existence disclosure
        code:
          $ref: "#/components/schemas/IdentityProblemCode"
        correlationId: { type: string, format: uuid }
        retryAfterSeconds:
          type: integer
          minimum: 1
          nullable: true
        stepUpIntentId:
          type: string
          format: uuid
          nullable: true

    AdmitEmploymentRelationshipRequest:
      type: object
      additionalProperties: false
      required: [evaluationIntentId, professionalType]
      properties:
        evaluationIntentId:
          type: string
          format: uuid
        professionalType:
          type: string
          minLength: 1
          maxLength: 64
        correlationId:
          type: string
          format: uuid
          nullable: true

    TransitionEmploymentRelationshipRequest:
      type: object
      additionalProperties: false
      required: [targetState, actorParticipantId, actorRole, correlationId]
      properties:
        targetState:
          $ref: "#/components/schemas/EmploymentRelationshipState"
        actorParticipantId:
          type: string
          format: uuid
        actorRole:
          $ref: "#/components/schemas/RelationshipParticipantRole"
        correlationId:
          type: string
          format: uuid
        explicitEmergencyRelease:
          type: boolean
          default: false

    EmploymentRelationship:
      type: object
      additionalProperties: false
      required: [relationshipId, professionalType, state, stateVersion, createdAt, updatedAt]
      properties:
        relationshipId:
          type: string
          format: uuid
        professionalType:
          type: string
        state:
          $ref: "#/components/schemas/EmploymentRelationshipState"
        stateVersion:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RelationshipTimelineEntry:
      type: object
      additionalProperties: false
      required: [stateVersion, toState, actorParticipantId, actorRole, correlationId, evidenceId, occurredAt]
      properties:
        stateVersion:
          type: integer
          minimum: 0
        fromState:
          allOf:
            - $ref: "#/components/schemas/EmploymentRelationshipState"
          nullable: true
        toState:
          $ref: "#/components/schemas/EmploymentRelationshipState"
        actorParticipantId:
          type: string
          format: uuid
        actorRole:
          $ref: "#/components/schemas/RelationshipParticipantRole"
        correlationId:
          type: string
          format: uuid
        evidenceId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time

    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [approvalRequests, maturityReports, monthlyNarratives, selfGovernanceAlerts]
      properties:
        approvalRequests:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
        maturityReports:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
        monthlyNarratives:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
        selfGovernanceAlerts:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"

    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL, WHATSAPP]

    LegacyEmploymentRelationshipAdapterResponse:
      type: object
      additionalProperties: false
      required: [id, relationshipId, professionalType, state, relationshipState, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        relationshipId: { type: string, format: uuid }
        professionalId: { type: string, format: uuid, nullable: true }
        professionalType: { type: string }
        state: { type: string, const: EVALUATION }
        relationshipState:
          $ref: "#/components/schemas/EmploymentRelationshipState"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LegacyFormEmploymentContractRequest:
      type: object
      additionalProperties: true
      required: [professionalId, decisionSpace]
      properties:
        professionalId: { type: string, format: uuid }
        decisionSpace:
          type: object
          required: [professionalType]
          properties:
            professionalType: { type: string, minLength: 1, maxLength: 64 }
        evaluationIntentId: { type: string, format: uuid, nullable: true }
        correlationId: { type: string, format: uuid, nullable: true }

    LegacyHireAgentRequest:
      type: object
      required: [contractId, professionalType, skillId, decisionSpaceVersion, approvedBudgetInrPaise, billingCycleAnchorDay]
      properties:
        contractId: { type: string }
        professionalType: { type: string }
        skillId: { type: string }
        decisionSpaceVersion: { type: string }
        approvedBudgetInrPaise: { type: integer, format: int64 }
        billingCycleAnchorDay: { type: string }

    LegacyHireAgentResponse:
      type: object
      required: [contract_id, relationship_id, professional_type, skill_id, decision_space_version, approved_budget_inr_paise, billing_cycle_anchor_day, pro_rata_billing_start_date, state]
      properties:
        hire_id: { type: string, format: uuid }
        contract_id: { type: string }
        relationship_id: { type: string, format: uuid }
        professional_type: { type: string }
        skill_id: { type: string }
        decision_space_version: { type: string }
        approved_budget_inr_paise: { type: integer, format: int64 }
        billing_cycle_anchor_day: { type: string }
        pro_rata_billing_start_date: { type: string, format: date-time }
        hired_at: { type: string, format: date-time }
        state: { type: string, const: EVALUATION }

    EmploymentContract:
      type: object
      required: [id, tenantId, professionalId, decisionSpaceId, state, authorityLevel, goals, reviewCadence, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          description: Sourced from JWT — not settable by caller
        professionalId:
          type: string
          format: uuid
        decisionSpaceId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/EmploymentState"
        authorityLevel:
          type: integer
          minimum: 1
          description: Current authority level. Starts at 1 (minimum).
        goals:
          type: array
          items:
            $ref: "#/components/schemas/BusinessGoal"
        reviewCadence:
          $ref: "#/components/schemas/ReviewCadence"
        # FR-002: Trial = full constitutional employment. All rights (Emergency Stop,
        # Evidence First, audit ledger, data portability) apply from day one of trial.
        isTrial:
          type: boolean
          description: "True if this is a 7-day trial engagement. No billing commitment. All constitutional rights apply."
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
          description: Auto-termination datetime for trial contracts. Null for paid contracts.
        trialConvertedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when customer converts trial to paid subscription.
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
          nullable: true
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        terminatedAt:
          type: string
          format: date-time
          nullable: true

    DecisionSpace:
      type: object
      required: [id, contractId, version, executionModel, professionalType, authorizedActions, prohibitedActions, alwaysAskActions]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        executionModel:
          $ref: "#/components/schemas/ExecutionModel"
        professionalType:
          type: string
          example: MARKETING
        authorizedActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        prohibitedActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        alwaysAskActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        budgetConstraints:
          $ref: "#/components/schemas/BudgetConstraints"
          nullable: true
        creativeStandardProfile:
          $ref: "#/components/schemas/CreativeStandardProfile"
          nullable: true
          description: Present for creative professions (Amendment A-005)
        paasParameters:
          $ref: "#/components/schemas/PAASParameters"
          nullable: true
          description: Present for PAAS execution model only
        isActive:
          type: boolean

    ApprovalRequest:
      type: object
      required: [id, contractId, evidenceRecordId, state, proposedContent, isScopeBoundary, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        evidenceRecordId:
          type: string
          format: uuid
          nullable: true
          description: Set when Constitutional Engine records the evidence
        state:
          $ref: "#/components/schemas/ApprovalState"
        proposedContent:
          type: object
          description: The action content as proposed by the professional
          additionalProperties: true
        isScopeBoundary:
          type: boolean
        scopeBoundaryName:
          type: string
          nullable: true
        customerResponse:
          type: string
          enum: [APPROVED, REJECTED]
          nullable: true
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true

    EvidenceRecord:
      type: object
      required: [id, tenantId, contractId, professionalId, actionInstanceId, actionType, state, isScopeBoundary, decisionSpaceVersion, constitutionalBasis, createdAt]
      description: Immutable record in the Constitutional Audit Ledger (C-007, C-027)
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        professionalId:
          type: string
          format: uuid
        actionInstanceId:
          type: string
          format: uuid
          description: Groups all evidence records for one logical action attempt
        actionType:
          type: string
          example: MARKETING_POST
        state:
          $ref: "#/components/schemas/EvidenceState"
        proposedContent:
          type: object
          nullable: true
          additionalProperties: true
        executedContent:
          type: object
          nullable: true
          additionalProperties: true
        isScopeBoundary:
          type: boolean
        scopeBoundaryName:
          type: string
          nullable: true
        scopeBoundaryAcknowledgment:
          type: string
          nullable: true
        decisionSpaceVersion:
          type: integer
        constitutionalBasis:
          type: string
          description: "Semicolon-separated list of claims/drivers (e.g., 'C-023; AD-002')"
        createdAt:
          type: string
          format: date-time

    AuthorityStatus:
      type: object
      required: [contractId, currentLevel, history]
      properties:
        contractId:
          type: string
          format: uuid
        currentLevel:
          type: integer
          minimum: 1
        history:
          type: array
          items:
            $ref: "#/components/schemas/AuthorityLicenseEvent"

    AuthorityLicenseEvent:
      type: object
      required: [id, contractId, authorityLevel, grantedBy, grantedAt, constitutionalBasis]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        authorityLevel:
          type: integer
        grantedBy:
          type: string
          format: uuid
        grantedAt:
          type: string
          format: date-time
        constitutionalBasis:
          type: string
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid

    # ── Request Bodies ────────────────────────────────────────────────────

    FormEmploymentContractRequest:
      type: object
      required: [professionalId, decisionSpace, goals, reviewCadence]
      properties:
        professionalId:
          type: string
          format: uuid
        decisionSpace:
          $ref: "#/components/schemas/DecisionSpaceInput"
        goals:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BusinessGoal"
        reviewCadence:
          $ref: "#/components/schemas/ReviewCadence"
        isTrial:
          type: boolean
          default: false
          description: "Start as a 7-day trial. FR-002: all constitutional rights apply from day one."

    DecisionSpaceInput:
      type: object
      required: [executionModel, professionalType, authorizedActions, prohibitedActions, alwaysAskActions]
      properties:
        executionModel:
          $ref: "#/components/schemas/ExecutionModel"
        professionalType:
          type: string
        authorizedActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        prohibitedActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        alwaysAskActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        budgetConstraints:
          $ref: "#/components/schemas/BudgetConstraints"
          nullable: true
        creativeStandardProfile:
          $ref: "#/components/schemas/CreativeStandardProfile"
          nullable: true
        paasParameters:
          $ref: "#/components/schemas/PAASParameters"
          nullable: true

    TerminateContractRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          description: Customer-provided reason for termination (recorded in Constitutional Audit Ledger)

    SuspendContractRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10

    RenewContractRequest:
      type: object
      required: [decisionSpace, goals, reviewCadence]
      properties:
        decisionSpace:
          $ref: "#/components/schemas/DecisionSpaceInput"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/BusinessGoal"
        reviewCadence:
          $ref: "#/components/schemas/ReviewCadence"

    RejectActionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional customer-provided rejection reason

    ConfirmBoundaryRequest:
      type: object
      required: [acknowledgmentText]
      properties:
        acknowledgmentText:
          type: string
          minLength: 10
          description: |
            Customer's explicit acknowledgment of the scope boundary.
            This text is recorded permanently in the Constitutional Audit Ledger
            as the ScopeBoundaryConfirmation evidence record.

    ModifyAuthorityRequest:
      type: object
      required: [contractId, newAuthorityLevel, evidenceIds]
      properties:
        contractId:
          type: string
          format: uuid
        newAuthorityLevel:
          type: integer
          minimum: 1
        evidenceIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Evidence records that justify this authority change (C-003)
        reason:
          type: string
          description: Optional customer-provided reason

    # ── Supporting Types ──────────────────────────────────────────────────

    BusinessGoal:
      type: object
      required: [description, target]
      properties:
        description:
          type: string
        target:
          type: string

    ReviewCadence:
      type: object
      required: [frequencyDays]
      properties:
        frequencyDays:
          type: integer
          minimum: 1
        notificationChannel:
          type: string
          enum: [EMAIL, IN_APP, BOTH]
          default: BOTH

    ActionDefinition:
      type: object
      required: [actionType, description]
      properties:
        actionType:
          type: string
          description: Machine-readable action type identifier
        description:
          type: string
          description: Human-readable description of this action
        parameters:
          type: object
          additionalProperties: true
          description: Action-type-specific constraint parameters (e.g., spend limits)

    BudgetConstraints:
      type: object
      properties:
        dailySpendLimitInr:
          type: number
          format: decimal
          minimum: 0
        monthlySpendLimitInr:
          type: number
          format: decimal
          minimum: 0
        maxPositionSizePercent:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          description: PAAS trading only — maximum position size as % of portfolio

    CreativeStandardProfile:
      type: object
      description: Constitutional document for creative professions (Amendment A-005)
      properties:
        voiceDescription:
          type: string
        toneKeywords:
          type: array
          items:
            type: string
        visualStyleDescription:
          type: string
        brandGuidelinesUrl:
          type: string
          format: uri

    PAASParameters:
      type: object
      description: Configuration for PAAS execution model
      properties:
        sessionWindowStart:
          type: string
          format: time
          description: "Trading session start (e.g., 09:15 IST)"
        sessionWindowEnd:
          type: string
          format: time
          description: "Trading session end (e.g., 15:25 IST)"
        maxActionsPerSession:
          type: integer
          minimum: 1

    # ── Pagination ────────────────────────────────────────────────────────

    EmploymentContractPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentContract"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ApprovalRequestPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRequest"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    EvidenceRecordPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRecord"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ── Common ────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        constitutionalEngineReachable:
          type: boolean

    # ── Skills (C-036) ────────────────────────────────────────────────────────

    SkillState:
      type: string
      enum: [ACTIVE, PAUSED, TERMINATED]
      description: "C-036 — Skill has independent lifecycle from parent contract"

    SkillGoal:
      type: object
      required: [kpiName, targetValue, measurementPeriod]
      properties:
        kpiName:
          type: string
          description: "Business KPI name — e.g., 'appointments_per_week', 'enquiries_per_month', 'daily_return_pct'"
        targetValue:
          type: number
        currentValue:
          type: number
          nullable: true
        measurementPeriod:
          type: string
          enum: [day, week, month]

    Skill:
      type: object
      required: [id, contractId, skillType, name, state, goals, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        skillType:
          type: string
          example: INSTAGRAM_MARKETING
        name:
          type: string
          example: "Instagram Content & Posting"
        state:
          $ref: "#/components/schemas/SkillState"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/SkillGoal"
          description: "C-037 — business KPI targets, not technical metrics"
        pricePerMonth:
          type: number
          nullable: true
        activatedAt:
          type: string
          format: date-time
          nullable: true
        pausedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AddSkillRequest:
      type: object
      required: [skillType, name, goals]
      properties:
        skillType:
          type: string
        name:
          type: string
        goals:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SkillGoal"
        configuration:
          type: object
          additionalProperties: true
          description: "C-039 — typically derived from conversational configuration, not filled manually"

    UpdateSkillGoalsRequest:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SkillGoal"

    # ── Performance (C-037) ───────────────────────────────────────────────────

    SkillPerformanceRecord:
      type: object
      required: [id, skillId, periodStart, periodEnd, businessKpiName, businessKpiActual, businessKpiAchieved]
      description: "AD-012 — business KPI is always the primary metric"
      properties:
        id:
          type: string
          format: uuid
        skillId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        businessKpiName:
          type: string
        businessKpiTarget:
          type: number
          nullable: true
        businessKpiActual:
          type: number
        businessKpiAchieved:
          type: boolean
        technicalMetrics:
          type: object
          additionalProperties: true
          description: "Supporting evidence only — never the primary metric (AD-012)"
          nullable: true

    # ── Billing (C-038) ───────────────────────────────────────────────────────

    BillingStatement:
      type: object
      required: [tenantId, periodStart, periodEnd, totalAmount, lineItems]
      properties:
        tenantId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        totalAmount:
          type: number
          description: "Pro-rata total for the period (C-038, AD-014)"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/BillingLineItem"

    BillingLineItem:
      type: object
      required: [skillId, skillName, activeDurationMinutes, pricePerMonth, chargeAmount]
      properties:
        skillId:
          type: string
          format: uuid
          nullable: true
        skillName:
          type: string
        activeDurationMinutes:
          type: integer
          description: "Exact minutes the skill was active in this period (AD-014)"
        pricePerMonth:
          type: number
        chargeAmount:
          type: number
          description: "pricePerMonth * (activeDurationMinutes / minutesInMonth)"

    # ── Conversational Configuration (C-039) ─────────────────────────────────

    ConversationalConfigRequest:
      type: object
      required: [message, sessionId]
      properties:
        message:
          type: string
          description: "Customer's natural language input"
        sessionId:
          type: string
          format: uuid
          description: "Conversation session ID — groups messages in one onboarding conversation"
        professionalType:
          type: string
          nullable: true
          description: "Provide on first message; omit for follow-up messages"

    ConversationalConfigResponse:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [QUESTION, PROPOSED_CONFIG, COMPLETE]
        question:
          type: string
          nullable: true
          description: "Present to customer when type=QUESTION"
        proposedConfig:
          $ref: "#/components/schemas/DecisionSpaceInput"
          nullable: true
          description: "Present for customer confirmation when type=PROPOSED_CONFIG"
        confirmationRequired:
          type: boolean
          description: "If true, customer must call /confirm before config is applied"

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

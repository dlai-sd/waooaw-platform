      description: Returns the Customer Profile built during Skill 0 (Customer Profiling). Tier 2 — tenant-scoped.
      operationId: getDMProfile
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalMarketingProfile"
        "404":
          description: No profile exists yet (profiling not completed)
    put:
      tags: [DigitalMarketing]
      summary: Update customer digital marketing profile
      description: |
        Customer confirms or updates profile fields. Sets profile_status to COMPLETE
        when all minimum fields are confirmed. C-039 — confirmation required.
      operationId: updateDMProfile
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigitalMarketingProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalMarketingProfile"

  /api/v1/digital-marketing/maturity-scores/{organisationId}:
    get:
      tags: [DigitalMarketing]
      summary: Get maturity score history
      description: Returns all Digital Marketing Maturity assessments for the organisation, most recent first. Append-only — no updates.
      operationId: getDMMaturityScores
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: Maturity score history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaturityScore"

  /api/v1/digital-marketing/maturity-scores/{organisationId}/latest/report:
    get:
      tags: [DigitalMarketing]
      summary: Get the latest Maturity Report PDF URL
      description: Returns a signed URL for the most recent Digital Marketing Maturity Report PDF. URL valid for 1 hour.
      operationId: getLatestMaturityReportPdfUrl
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Signed PDF URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "404":
          description: No maturity report generated yet

  /api/v1/digital-marketing/needs-heatmap/{organisationId}:
    get:
      tags: [DigitalMarketing]
      summary: Get current needs heat map
      description: Returns the 8-need assessment from the most recent Market Research run.
      operationId: getDMNeedsHeatmap
      parameters:
        - { name: organisationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":

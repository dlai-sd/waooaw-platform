        workspaceVersion: { type: string, minLength: 1, maxLength: 64 }
        occurredAt: { type: string, format: date-time }

    RelationshipWorkspaceChangePageV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, relationshipId, authoritativeCursor, items]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        relationshipId: { type: string, format: uuid }
        authoritativeCursor: { type: string, minLength: 16, maxLength: 2048 }
        nextCursor: { type: string, minLength: 16, maxLength: 2048 }
        items:
          type: array
          items: { $ref: "#/components/schemas/RelationshipWorkspaceChangeEntryV1" }

    RelationshipPlanV1:
      allOf:
        - $ref: "#/components/schemas/RelationshipWorkspaceSectionV1"
        - type: object
          additionalProperties: false
          required: [planId]
          properties:
            planId: { type: string, format: uuid }
            goals:
              type: array
              items: { type: string, minLength: 1, maxLength: 240 }

    RelationshipAttentionItemV1:
      type: object
      additionalProperties: false
      required: [attentionItemId, reason, consequence, authoritativeSequence]
      properties:
        attentionItemId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
        consequence: { type: string, minLength: 1, maxLength: 500 }
        authoritativeSequence: { type: integer, format: int64, minimum: 1 }

    RelationshipAttentionPageV1:
      allOf:
        - $ref: "#/components/schemas/RelationshipWorkspaceSectionV1"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/RelationshipAttentionItemV1" }

    RelationshipWorkPageV1:
      allOf:
        - $ref: "#/components/schemas/RelationshipWorkspaceSectionV1"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [itemId, state, effect]
                properties:
                  itemId: { type: string, format: uuid }
                  state: { type: string, minLength: 1, maxLength: 64 }
                  effect: { type: string, minLength: 1, maxLength: 500 }

    RelationshipResultsV1:
      allOf:
        - $ref: "#/components/schemas/RelationshipWorkspaceSectionV1"
        - type: object
          additionalProperties: false
          required: [outcomes]
          properties:
            outcomes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [outcomeId, label, attributionBasis]
                properties:
                  outcomeId: { type: string, format: uuid }
                  label: { type: string, minLength: 1, maxLength: 240 }
                  attributionBasis: { type: string, minLength: 1, maxLength: 240 }

    RelationshipUsageBudgetV1:
      allOf:
        - $ref: "#/components/schemas/RelationshipWorkspaceSectionV1"
        - type: object
          additionalProperties: false
          required: [actualAmount, forecastRange]
          properties:
            actualAmount: { type: string, minLength: 1, maxLength: 64 }
            forecastRange: { type: string, minLength: 1, maxLength: 64 }
            thresholdState: { type: string, minLength: 1, maxLength: 64 }
            wbeProjectionVersion: { type: string, minLength: 1, maxLength: 64 }

    RelationshipRightsControlsV1:
      allOf:
        - $ref: "#/components/schemas/RelationshipWorkspaceSectionV1"
        - type: object
          additionalProperties: false
          required: [scopeVersion, authorityVersion, lifecycleState, emergencyStopReachable]
          properties:
            scopeVersion: { type: string, minLength: 1, maxLength: 64 }
            authorityVersion: { type: string, minLength: 1, maxLength: 64 }
            lifecycleState: { $ref: "#/components/schemas/EmploymentRelationshipState" }
            emergencyStopReachable: { type: boolean }

    RelationshipCommandKindV1:
      type: string
      enum: [
        CANCEL_PLAN,
        CONFIRM_BASELINE,
        DISPUTE_RESULT,
        AMEND_GOAL,
        REPLACE_GOAL,
        CONFIRM_SCOPE_BOUNDARY,
        PAUSE_RELATIONSHIP,
        RESUME_RELATIONSHIP,
        CHANGE_BUDGET_CEILING,
        CHANGE_PACING,
        REQUEST_ALLOWANCE_ADDITION,
        RENEW_RELATIONSHIP,
        TERMINATE_RELATIONSHIP
      ]

    CancelPlanPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, planId]
      properties:
        commandKind: { type: string, const: CANCEL_PLAN }
        planId: { type: string, format: uuid }

    ConfirmBaselinePayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, resultId]
      properties:
        commandKind: { type: string, const: CONFIRM_BASELINE }
        resultId: { type: string, format: uuid }

    DisputeResultPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, resultId, reason]
      properties:
        commandKind: { type: string, const: DISPUTE_RESULT }
        resultId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }

    AmendGoalPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, goalId, amendment]
      properties:
        commandKind: { type: string, const: AMEND_GOAL }
        goalId: { type: string, format: uuid }
        amendment: { type: string, minLength: 1, maxLength: 500 }

    ReplaceGoalPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, goalId, replacement]
      properties:
        commandKind: { type: string, const: REPLACE_GOAL }
        goalId: { type: string, format: uuid }
        replacement: { type: string, minLength: 1, maxLength: 500 }

    ConfirmScopeBoundaryPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, boundaryId, acknowledgmentText]
      properties:
        commandKind: { type: string, const: CONFIRM_SCOPE_BOUNDARY }
        boundaryId: { type: string, format: uuid }
        acknowledgmentText: { type: string, minLength: 10, maxLength: 500 }

    PauseRelationshipPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, reason]
      properties:
        commandKind: { type: string, const: PAUSE_RELATIONSHIP }
        reason: { type: string, minLength: 1, maxLength: 240 }

    ResumeRelationshipPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind]
      properties:
        commandKind: { type: string, const: RESUME_RELATIONSHIP }

    ChangeBudgetCeilingPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, amountInrPaise]
      properties:
        commandKind: { type: string, const: CHANGE_BUDGET_CEILING }
        amountInrPaise: { type: integer, format: int64, minimum: 0 }

    ChangePacingPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, pacingChoice]
      properties:
        commandKind: { type: string, const: CHANGE_PACING }
        pacingChoice: { type: string, minLength: 1, maxLength: 64 }

    RequestAllowanceAdditionPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, amountInrPaise]
      properties:
        commandKind: { type: string, const: REQUEST_ALLOWANCE_ADDITION }
        amountInrPaise: { type: integer, format: int64, minimum: 1 }

    RenewRelationshipPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind]
      properties:
        commandKind: { type: string, const: RENEW_RELATIONSHIP }

    TerminateRelationshipPayloadV1:
      type: object
      additionalProperties: false
      required: [commandKind, reason]
      properties:
        commandKind: { type: string, const: TERMINATE_RELATIONSHIP }
        reason: { type: string, minLength: 1, maxLength: 240 }

    RelationshipTypedCommandPayloadV1:
      oneOf:
        - $ref: "#/components/schemas/CancelPlanPayloadV1"
        - $ref: "#/components/schemas/ConfirmBaselinePayloadV1"
        - $ref: "#/components/schemas/DisputeResultPayloadV1"
        - $ref: "#/components/schemas/AmendGoalPayloadV1"
        - $ref: "#/components/schemas/ReplaceGoalPayloadV1"
        - $ref: "#/components/schemas/ConfirmScopeBoundaryPayloadV1"
        - $ref: "#/components/schemas/PauseRelationshipPayloadV1"
        - $ref: "#/components/schemas/ResumeRelationshipPayloadV1"
        - $ref: "#/components/schemas/ChangeBudgetCeilingPayloadV1"
        - $ref: "#/components/schemas/ChangePacingPayloadV1"
        - $ref: "#/components/schemas/RequestAllowanceAdditionPayloadV1"
        - $ref: "#/components/schemas/RenewRelationshipPayloadV1"
        - $ref: "#/components/schemas/TerminateRelationshipPayloadV1"
      discriminator:
        propertyName: commandKind
        mapping:
          CANCEL_PLAN: "#/components/schemas/CancelPlanPayloadV1"
          CONFIRM_BASELINE: "#/components/schemas/ConfirmBaselinePayloadV1"
          DISPUTE_RESULT: "#/components/schemas/DisputeResultPayloadV1"
          AMEND_GOAL: "#/components/schemas/AmendGoalPayloadV1"
          REPLACE_GOAL: "#/components/schemas/ReplaceGoalPayloadV1"
          CONFIRM_SCOPE_BOUNDARY: "#/components/schemas/ConfirmScopeBoundaryPayloadV1"
          PAUSE_RELATIONSHIP: "#/components/schemas/PauseRelationshipPayloadV1"
          RESUME_RELATIONSHIP: "#/components/schemas/ResumeRelationshipPayloadV1"
          CHANGE_BUDGET_CEILING: "#/components/schemas/ChangeBudgetCeilingPayloadV1"
          CHANGE_PACING: "#/components/schemas/ChangePacingPayloadV1"
          REQUEST_ALLOWANCE_ADDITION: "#/components/schemas/RequestAllowanceAdditionPayloadV1"
          RENEW_RELATIONSHIP: "#/components/schemas/RenewRelationshipPayloadV1"
          TERMINATE_RELATIONSHIP: "#/components/schemas/TerminateRelationshipPayloadV1"

    SubmitRelationshipCommandRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, expectedWorkspaceVersion, payload]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        expectedWorkspaceVersion: { type: string, minLength: 1, maxLength: 64 }
        expectedSubjectVersion: { type: string, minLength: 1, maxLength: 64 }
        payload: { $ref: "#/components/schemas/RelationshipTypedCommandPayloadV1" }

    RelationshipCommandReceiptV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, commandId, commandKind, status, acceptedAt, replayed]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        commandId: { type: string, format: uuid }
        commandKind: { $ref: "#/components/schemas/RelationshipCommandKindV1" }
        status: { $ref: "#/components/schemas/RelationshipCommandStatus" }
        acceptedAt: { type: string, format: date-time }
        replayed: { type: boolean }

    RelationshipCommandOutcomeStepV1:
      type: object
      additionalProperties: false
      required: [owner, status]
      properties:
        owner: { type: string, minLength: 1, maxLength: 64 }
        status: { $ref: "#/components/schemas/RelationshipCommandStatus" }
        detail: { type: string, minLength: 1, maxLength: 500 }

    RelationshipCommandOutcomeV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, commandId, commandKind, status, steps, relationshipId]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        commandId: { type: string, format: uuid }
        commandKind: { $ref: "#/components/schemas/RelationshipCommandKindV1" }
        status: { $ref: "#/components/schemas/RelationshipCommandStatus" }
        relationshipId: { type: string, format: uuid }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RelationshipCommandOutcomeStepV1" }
        resolvedAt: { type: string, format: date-time }

    RelationshipEvidenceSummaryV1:
      type: object
      additionalProperties: false
      required: [evidenceId, subject, state]
      properties:
        evidenceId: { type: string, format: uuid }
        subject: { type: string, minLength: 1, maxLength: 240 }
        state: { $ref: "#/components/schemas/RelationshipEvidenceState" }

    RelationshipEvidencePageV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, relationshipId, items]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        relationshipId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/RelationshipEvidenceSummaryV1" }

    RelationshipEvidenceDetailV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, evidenceId, subject, state]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        evidenceId: { type: string, format: uuid }
        subject: { type: string, minLength: 1, maxLength: 240 }
        state: { $ref: "#/components/schemas/RelationshipEvidenceState" }
        completeness: { type: string, minLength: 1, maxLength: 120 }

    RequestRelationshipEvidenceExportV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, purpose]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        purpose: { type: string, minLength: 1, maxLength: 200 }
        expectedEvidenceVersion: { type: string, minLength: 1, maxLength: 64 }

    RelationshipEvidenceExportReceiptV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, exportId, status, acceptedAt]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        exportId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RelationshipCommandStatus" }
        acceptedAt: { type: string, format: date-time }

    RelationshipEvidenceExportOutcomeV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, exportId, status]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        exportId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RelationshipCommandStatus" }
        downloadAvailableUntil: { type: string, format: date-time }

    RelationshipWorkspaceProblemCodeV1:
      type: string
      enum: [
        RELATIONSHIP_WORKSPACE_REQUEST_INVALID,
        RELATIONSHIP_WORKSPACE_SESSION_REQUIRED,
        RELATIONSHIP_WORKSPACE_NOT_ACCESSIBLE,
        RELATIONSHIP_STATE_CONFLICT,
        RELATIONSHIP_IDEMPOTENCY_CONFLICT,
        RELATIONSHIP_WORKSPACE_BLOCKED,
        RELATIONSHIP_WORKSPACE_CURSOR_EXPIRED,
        RELATIONSHIP_WORKSPACE_OWNER_UNAVAILABLE,
        CONSTITUTIONAL_ENGINE_UNAVAILABLE,
        RELATIONSHIP_SCHEMA_UNSUPPORTED
      ]

    RelationshipWorkspaceProblemDetailV1:
      type: object
      additionalProperties: false
      description: RFC 9457 relationship workspace error with privacy-safe extensions
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 400 }
        code: { $ref: "#/components/schemas/RelationshipWorkspaceProblemCodeV1" }
        correlationId: { type: string, format: uuid }
        reconciliationRequired: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 1 }

    # ── Conversational Configuration (C-039) ─────────────────────────────────

    ConversationalConfigRequest:
      type: object
      required: [message, sessionId]
      properties:
        message:
          type: string
          description: "Customer's natural language input"
        sessionId:
          type: string
          format: uuid
          description: "Conversation session ID — groups messages in one onboarding conversation"
        professionalType:
          type: string
          nullable: true
          description: "Provide on first message; omit for follow-up messages"

    ConversationalConfigResponse:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [QUESTION, PROPOSED_CONFIG, COMPLETE]
        question:
          type: string
          nullable: true
          description: "Present to customer when type=QUESTION"
        proposedConfig:
          $ref: "#/components/schemas/DecisionSpaceInput"
          nullable: true
          description: "Present for customer confirmation when type=PROPOSED_CONFIG"
        confirmationRequired:
          type: boolean
          description: "If true, customer must call /confirm before config is applied"

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

          items:
            $ref: "#/components/schemas/ActionDefinition"
        prohibitedActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        alwaysAskActions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDefinition"
        budgetConstraints:
          $ref: "#/components/schemas/BudgetConstraints"
          nullable: true
        creativeStandardProfile:
          $ref: "#/components/schemas/CreativeStandardProfile"
          nullable: true
        paasParameters:
          $ref: "#/components/schemas/PAASParameters"
          nullable: true

    TerminateContractRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          description: Customer-provided reason for termination (recorded in Constitutional Audit Ledger)

    SuspendContractRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10

    RenewContractRequest:
      type: object
      required: [decisionSpace, goals, reviewCadence]
      properties:
        decisionSpace:
          $ref: "#/components/schemas/DecisionSpaceInput"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/BusinessGoal"
        reviewCadence:
          $ref: "#/components/schemas/ReviewCadence"

    RejectActionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional customer-provided rejection reason

    ConfirmBoundaryRequest:
      type: object
      required: [acknowledgmentText]
      properties:
        acknowledgmentText:
          type: string
          minLength: 10
          description: |
            Customer's explicit acknowledgment of the scope boundary.
            This text is recorded permanently in the Constitutional Audit Ledger
            as the ScopeBoundaryConfirmation evidence record.

    ModifyAuthorityRequest:
      type: object
      required: [contractId, newAuthorityLevel, evidenceIds]
      properties:
        contractId:
          type: string
          format: uuid
        newAuthorityLevel:
          type: integer
          minimum: 1
        evidenceIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Evidence records that justify this authority change (C-003)
        reason:
          type: string
          description: Optional customer-provided reason

    # ── Supporting Types ──────────────────────────────────────────────────

    BusinessGoal:
      type: object
      required: [description, target]
      properties:
        description:
          type: string
        target:
          type: string

    ReviewCadence:
      type: object
      required: [frequencyDays]
      properties:
        frequencyDays:
          type: integer
          minimum: 1
        notificationChannel:
          type: string
          enum: [EMAIL, IN_APP, BOTH]
          default: BOTH

    ActionDefinition:
      type: object
      required: [actionType, description]
      properties:
        actionType:
          type: string
          description: Machine-readable action type identifier
        description:
          type: string
          description: Human-readable description of this action
        parameters:
          type: object
          additionalProperties: true
          description: Action-type-specific constraint parameters (e.g., spend limits)

    BudgetConstraints:
      type: object
      properties:
        dailySpendLimitInr:
          type: number
          format: decimal
          minimum: 0
        monthlySpendLimitInr:
          type: number
          format: decimal
          minimum: 0
        maxPositionSizePercent:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          description: PAAS trading only — maximum position size as % of portfolio

    CreativeStandardProfile:
      type: object
      description: Constitutional document for creative professions (Amendment A-005)
      properties:
        voiceDescription:
          type: string
        toneKeywords:
          type: array
          items:
            type: string
        visualStyleDescription:
          type: string
        brandGuidelinesUrl:
          type: string
          format: uri

    PAASParameters:
      type: object
      description: Configuration for PAAS execution model
      properties:
        sessionWindowStart:
          type: string
          format: time
          description: "Trading session start (e.g., 09:15 IST)"
        sessionWindowEnd:
          type: string
          format: time
          description: "Trading session end (e.g., 15:25 IST)"
        maxActionsPerSession:
          type: integer
          minimum: 1

    # ── Pagination ────────────────────────────────────────────────────────

    EmploymentContractPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentContract"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ApprovalRequestPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRequest"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    EvidenceRecordPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRecord"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ── Common ────────────────────────────────────────────────────────────

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        constitutionalEngineReachable:
          type: boolean

    # ── Skills (C-036) ────────────────────────────────────────────────────────

    SkillState:
      type: string
      enum: [ACTIVE, PAUSED, TERMINATED]
      description: "C-036 — Skill has independent lifecycle from parent contract"

    SkillGoal:
      type: object
      required: [kpiName, targetValue, measurementPeriod]
      properties:
        kpiName:
          type: string
          description: "Business KPI name — e.g., 'appointments_per_week', 'enquiries_per_month', 'daily_return_pct'"
        targetValue:
          type: number
        currentValue:
          type: number
          nullable: true
        measurementPeriod:
          type: string
          enum: [day, week, month]

    Skill:
      type: object
      required: [id, contractId, skillType, name, state, goals, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        skillType:
          type: string
          example: INSTAGRAM_MARKETING
        name:
          type: string
          example: "Instagram Content & Posting"
        state:
          $ref: "#/components/schemas/SkillState"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/SkillGoal"
          description: "C-037 — business KPI targets, not technical metrics"
        pricePerMonth:
          type: number
          nullable: true
        activatedAt:
          type: string
          format: date-time
          nullable: true
        pausedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AddSkillRequest:
      type: object
      required: [skillType, name, goals]
      properties:
        skillType:
          type: string
        name:
          type: string
        goals:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SkillGoal"
        configuration:
          type: object
          additionalProperties: true
          description: "C-039 — typically derived from conversational configuration, not filled manually"

    UpdateSkillGoalsRequest:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SkillGoal"

    # ── Performance (C-037) ───────────────────────────────────────────────────

    SkillPerformanceRecord:
      type: object
      required: [id, skillId, periodStart, periodEnd, businessKpiName, businessKpiActual, businessKpiAchieved]
      description: "AD-012 — business KPI is always the primary metric"
      properties:
        id:
          type: string
          format: uuid
        skillId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        businessKpiName:
          type: string
        businessKpiTarget:
          type: number
          nullable: true
        businessKpiActual:
          type: number
        businessKpiAchieved:
          type: boolean
        technicalMetrics:
          type: object
          additionalProperties: true
          description: "Supporting evidence only — never the primary metric (AD-012)"
          nullable: true

    # ── Billing (C-038) ───────────────────────────────────────────────────────

    BillingStatement:
      type: object
      required: [tenantId, periodStart, periodEnd, totalAmount, lineItems]
      properties:
        tenantId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        totalAmount:
          type: number
          description: "Pro-rata total for the period (C-038, AD-014)"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/BillingLineItem"

    BillingLineItem:
      type: object
      required: [skillId, skillName, activeDurationMinutes, pricePerMonth, chargeAmount]
      properties:
        skillId:
          type: string
          format: uuid
          nullable: true
        skillName:
          type: string
        activeDurationMinutes:
          type: integer
          description: "Exact minutes the skill was active in this period (AD-014)"
        pricePerMonth:
          type: number
        chargeAmount:
          type: number
          description: "pricePerMonth * (activeDurationMinutes / minutesInMonth)"

    # ── Conversation Core (WC-034 F3) ────────────────────────────────────────

    ConversationSchemaVersion:
      type: string
      const: "1.0"

    ConversationActorType:
      type: string
      enum: [CUSTOMER, PROFESSIONAL, SYSTEM]

    ConversationChannel:
      type: string
      enum: [WEB, WHATSAPP, SYSTEM]

    ConversationDeliveryState:
      type: string
      enum: [LOCAL_ONLY, ACCEPTED, FAILED, UNRESOLVED]

    ConversationProcessingState:
      type: string
      enum: [NOT_STARTED, QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED, STOPPED]

    ConversationEvidenceState:
      type: string
      enum: [NOT_APPLICABLE, PENDING, RECORDED, FAILED]

    ConversationCompletionReason:
      type: string
      enum: [COMPLETE, PARTIAL_FAILURE, CANCELLED, EMERGENCY_STOPPED]

    ConversationTextBlockV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, blockType, text]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        blockType: { type: string, const: TEXT }
        text: { type: string, minLength: 1, maxLength: 32000 }
        language: { type: string, minLength: 2, maxLength: 35 }

    ConversationCardCommandV1:
      type: object
      additionalProperties: false
      required: [commandId, label, availability]
      properties:
        commandId: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,63}$" }
        label: { type: string, minLength: 1, maxLength: 120 }
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE, COMPLETED] }
        unavailableReason: { type: string, maxLength: 240 }

    ConversationCardBaseV1:
      type: object
      required: [schemaVersion, cardId, cardType, owner, state, effect, commands]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        cardId: { type: string, format: uuid }
        cardType: { type: string, enum: [ACTION, PLAN, DELIVERABLE, DECISION] }
        owner: { type: string, enum: [CUSTOMER, PROFESSIONAL, SHARED] }
        state: { type: string, minLength: 1, maxLength: 64 }
        effect: { type: string, minLength: 1, maxLength: 500 }
        commands:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/ConversationCardCommandV1" }

    ActionCardV1:
      allOf:
        - $ref: "#/components/schemas/ConversationCardBaseV1"
        - type: object
          required: [goal]
          properties:
            cardType: { type: string, const: ACTION }
            goal: { type: string, minLength: 1, maxLength: 240 }
            dueAt: { type: string, format: date-time }

    PlanCardV1:
      allOf:
        - $ref: "#/components/schemas/ConversationCardBaseV1"
        - type: object
          required: [goal, progressState]
          properties:
            cardType: { type: string, const: PLAN }
            goal: { type: string, minLength: 1, maxLength: 240 }
            progressState: { type: string, minLength: 1, maxLength: 64 }

    DeliverableCardV1:
      allOf:
        - $ref: "#/components/schemas/ConversationCardBaseV1"
        - type: object
          required: [title, deliverableState]
          properties:
            cardType: { type: string, const: DELIVERABLE }
            title: { type: string, minLength: 1, maxLength: 240 }
            deliverableState: { type: string, minLength: 1, maxLength: 64 }

    DecisionAlternativeV1:
      type: object
      additionalProperties: false
      required: [alternativeId, label, effect]
      properties:
        alternativeId: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 120 }
        effect: { type: string, minLength: 1, maxLength: 500 }

    DecisionCardV1:
      allOf:
        - $ref: "#/components/schemas/ConversationCardBaseV1"
        - type: object
          required: [decisionState, authorityImpact, alternatives]
          properties:
            cardType: { type: string, const: DECISION }
            decisionState: { type: string, minLength: 1, maxLength: 64 }
            authorityImpact: { type: string, minLength: 1, maxLength: 500 }
            alternatives:
              type: array
              minItems: 1
              maxItems: 8
              items: { $ref: "#/components/schemas/DecisionAlternativeV1" }

    GovernedConversationCardV1:
      oneOf:
        - $ref: "#/components/schemas/ActionCardV1"
        - $ref: "#/components/schemas/PlanCardV1"
        - $ref: "#/components/schemas/DeliverableCardV1"
        - $ref: "#/components/schemas/DecisionCardV1"
      discriminator:
        propertyName: cardType
        mapping:
          ACTION: "#/components/schemas/ActionCardV1"
          PLAN: "#/components/schemas/PlanCardV1"
          DELIVERABLE: "#/components/schemas/DeliverableCardV1"
          DECISION: "#/components/schemas/DecisionCardV1"

    ConversationMessageV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, messageId, relationshipId, sequence, actor, channel, content, cards, deliveryState, processingState, evidenceState, partial, acceptedAt]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        messageId: { type: string, format: uuid }
        relationshipId: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        actor: { $ref: "#/components/schemas/ConversationActorType" }
        channel: { $ref: "#/components/schemas/ConversationChannel" }
        content:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ConversationTextBlockV1" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/GovernedConversationCardV1" }
        deliveryState: { $ref: "#/components/schemas/ConversationDeliveryState" }
        processingState: { $ref: "#/components/schemas/ConversationProcessingState" }
        evidenceState: { $ref: "#/components/schemas/ConversationEvidenceState" }
        evidenceRecordId: { type: string, format: uuid }
        partial: { type: boolean }
        completionReason: { $ref: "#/components/schemas/ConversationCompletionReason" }
        retryOfMessageId: { type: string, format: uuid }
        clientMessageId: { type: string, format: uuid }
        acceptedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    ConversationTimelinePageV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, relationshipId, items, authoritativeCursor, hasMore, serverTime]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        relationshipId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessageV1" }
        authoritativeCursor: { type: string }
        nextCursor: { type: string }
        unreadBoundaryMessageId: { type: string, format: uuid }
        hasMore: { type: boolean }
        serverTime: { type: string, format: date-time }

    SendConversationMessageRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, clientMessageId, content, locale]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        clientMessageId: { type: string, format: uuid }
        content:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: "#/components/schemas/ConversationTextBlockV1" }
        locale: { type: string, minLength: 2, maxLength: 35 }
        expectedCursor: { type: string, minLength: 16, maxLength: 2048 }

    ConversationSubmissionV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, outcome, message, authoritativeCursor, replayed]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        outcome: { type: string, enum: [ACCEPTED, REPLAYED, FAILED, UNRESOLVED] }
        message: { $ref: "#/components/schemas/ConversationMessageV1" }
        executionId: { type: string, format: uuid }
        authoritativeCursor: { type: string }
        replayed: { type: boolean }

    UpdateConversationReadPositionRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, lastVisibleMessageId, authoritativeCursor]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        lastVisibleMessageId: { type: string, format: uuid }
        authoritativeCursor: { type: string, minLength: 16, maxLength: 2048 }

    ConversationReadPositionV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, relationshipId, lastReadMessageId, updatedAt]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        relationshipId: { type: string, format: uuid }
        lastReadMessageId: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }

    ConversationExecutionStatusV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, executionId, state, partial, updatedAt]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        executionId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/ConversationProcessingState" }
        partial: { type: boolean }
        completionReason: { $ref: "#/components/schemas/ConversationCompletionReason" }
        updatedAt: { type: string, format: date-time }

    ConversationStreamEventType:
      type: string
      enum: [message.accepted, processing.started, response.delta, card.upserted, message.completed, message.failed, stream.cancelled, stop.applied, reconciliation.required, heartbeat]

    ConversationDeltaPayloadV1:
      type: object
      additionalProperties: false
      required: [contentIndex, appendText, partial]
      properties:
        contentIndex: { type: integer, minimum: 0 }
        appendText: { type: string, maxLength: 8000 }
        partial: { type: boolean, const: true }

    ConversationMessagePayloadV1:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/ConversationMessageV1" }

    ConversationCardPayloadV1:
      type: object
      additionalProperties: false
      required: [card]
      properties:
        card: { $ref: "#/components/schemas/GovernedConversationCardV1" }

    ConversationFailurePayloadV1:
      type: object
      additionalProperties: false
      required: [code, retryable, partial]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        retryable: { type: boolean }
        partial: { type: boolean }

    ConversationReconciliationPayloadV1:
      type: object
      additionalProperties: false
      required: [reason, authoritativeCursor]
      properties:
        reason: { type: string, enum: [EVENT_CURSOR_EXPIRED, EVENT_GAP, STATE_CONFLICT] }
        authoritativeCursor: { type: string }

    ConversationHeartbeatPayloadV1:
      type: object
      additionalProperties: false
      required: [serverTime]
      properties:
        serverTime: { type: string, format: date-time }

    ConversationStreamEventV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, eventType, relationshipId, sequence, occurredAt, data]
      properties:
        schemaVersion: { $ref: "#/components/schemas/ConversationSchemaVersion" }
        eventId: { type: string, minLength: 1, maxLength: 256 }
        eventType: { $ref: "#/components/schemas/ConversationStreamEventType" }
        relationshipId: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        messageId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        data:
          oneOf:
            - $ref: "#/components/schemas/ConversationDeltaPayloadV1"
            - $ref: "#/components/schemas/ConversationMessagePayloadV1"
            - $ref: "#/components/schemas/ConversationCardPayloadV1"
            - $ref: "#/components/schemas/ConversationFailurePayloadV1"
            - $ref: "#/components/schemas/ConversationReconciliationPayloadV1"
            - $ref: "#/components/schemas/ConversationHeartbeatPayloadV1"

    ConversationProblemCode:
      type: string
      enum: [CONVERSATION_REQUEST_INVALID, CONVERSATION_SESSION_REQUIRED, CONVERSATION_NOT_ACCESSIBLE, CONVERSATION_IDEMPOTENCY_CONFLICT, CONVERSATION_STATE_CONFLICT, CONVERSATION_CURSOR_EXPIRED, CONVERSATION_RETRY_NOT_ALLOWED, CONVERSATION_STOPPED, CONVERSATION_RATE_LIMITED, CONVERSATION_EXECUTION_UNAVAILABLE, CONSTITUTIONAL_ENGINE_UNAVAILABLE]

    ConversationProblemDetail:
      type: object
      additionalProperties: false
      description: Privacy-safe RFC 9457 problem; submitted content and internal dependency detail are never echoed
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: "#/components/schemas/ConversationProblemCode" }
        correlationId: { type: string, format: uuid }
        retryAfterSeconds: { type: integer, minimum: 1 }

    # ── Relationship Workspace (WC-034 F4) ─────────────────────────────────

    RelationshipWorkspaceSchemaVersion:
      type: string
      const: "1.0"

    RelationshipWorkspaceCurrencyState:
      type: string
      enum: [CURRENT, STALE, UNKNOWN, UNAVAILABLE, BLOCKED]

    RelationshipWorkspaceSnapshotState:
      type: string
      enum: [CONSISTENT, PARTIAL, STALE, UNKNOWN]

    RelationshipWorkspaceSectionType:
      type: string
      enum: [PLAN, ATTENTION, WORK, RESULTS, USAGE_BUDGET, RIGHTS_CONTROLS]

    RelationshipWorkspaceCommandAvailability:
      type: string
      enum: [AVAILABLE, BLOCKED, UNAVAILABLE]

    RelationshipCommandStatus:
      type: string
      enum: [COMPLETED, PENDING, PARTIAL, UNKNOWN, REJECTED, CONFLICT, BLOCKED]

    RelationshipEvidenceState:
      type: string
      enum: [PENDING, RECORDED, FAILED, UNKNOWN, STALE, DISPUTED, SUPERSEDED, UNAVAILABLE]

    RelationshipWorkspaceProvenanceV1:
      type: object
      additionalProperties: false
      required: [owner, sourceProjectionVersion, producedAt]
      properties:
        owner: { type: string, minLength: 1, maxLength: 64 }
        sourceProjectionVersion: { type: string, minLength: 1, maxLength: 64 }
        producedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }

    RelationshipPolicySelectionV1:
      type: object
      additionalProperties: false
      required: [f4Pol01, f4Pol02, f4Pol03, f4Pol04, f4Pol05, f4Pol06]
      properties:
        f4Pol01: { type: string, const: A }
        f4Pol02: { type: string, const: A }
        f4Pol03: { type: string, const: B }
        f4Pol04: { type: string, const: A }
        f4Pol05: { type: string, const: B }
        f4Pol06: { type: string, const: A }

    RelationshipAvailableCommandV1:
      type: object
      additionalProperties: false
      required: [commandKind, availability]
      properties:
        commandKind:
          $ref: "#/components/schemas/RelationshipCommandKindV1"
        availability:
          $ref: "#/components/schemas/RelationshipWorkspaceCommandAvailability"
        policyDecisionRef:
          type: string
          enum: [F4-POL-01, F4-POL-02, F4-POL-03, F4-POL-04, F4-POL-05, F4-POL-06]
        reasonCode: { type: string, minLength: 1, maxLength: 96 }

    RelationshipWorkspaceSectionV1:
      type: object
      additionalProperties: false
      required: [sectionType, currencyState, provenance]
      properties:
        sectionType:
          $ref: "#/components/schemas/RelationshipWorkspaceSectionType"
        currencyState:
          $ref: "#/components/schemas/RelationshipWorkspaceCurrencyState"
        provenance:
          $ref: "#/components/schemas/RelationshipWorkspaceProvenanceV1"
        availableCommands:
          type: array
          items: { $ref: "#/components/schemas/RelationshipAvailableCommandV1" }

    RelationshipContextV1:
      type: object
      additionalProperties: false
      required: [relationshipId, lifecycleState, policySelection]
      properties:
        relationshipId: { type: string, format: uuid }
        lifecycleState: { $ref: "#/components/schemas/EmploymentRelationshipState" }
        policySelection:
          $ref: "#/components/schemas/RelationshipPolicySelectionV1"

    RelationshipWorkspaceV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, relationshipId, workspaceVersion, snapshotState, currencyState, authoritativeCursor, context, sections, producedAt]
      properties:
        schemaVersion: { $ref: "#/components/schemas/RelationshipWorkspaceSchemaVersion" }
        relationshipId: { type: string, format: uuid }
        workspaceVersion: { type: string, minLength: 1, maxLength: 64 }

openapi: "3.1.0"
info:
  title: WAOOAW WBE Money Controls Private API
  version: "1.0.0"
  contact:
    name: WAOOAW Architecture
  description: |
    Implements: work-contracts/WC-172-safe-to-charge-real-customers.md WC172-R006, WC172-R010, WC172-R011.
    Constitutional basis: C-007, C-059, C-063, C-066, C-088, ADR-022, ADR-046.

    Private Business Platform to WAOOAW Billing Engine contract for the Founder's money controls: the real-money gate,
    the money discrepancies found by the provider-to-invoice reconciliation, and every GST tax document. This API is
    BP-only and has no browser ingress. Every route requires the BP mTLS workload identity and a signed delegated
    context bound to the route, operation, method, body digest, correlation id and, for writes, the idempotency key.

    Real money is off in every environment by default. It can be turned on only in production, in LIVE mode, by the
    Founder's step-up action (purpose `PRICING_ADMIN_STEP_UP`) with a reason, and can be turned off at once without
    step-up. Every change is audited with who and when. An unresolved money discrepancy blocks every new charge until
    the Founder resolves it with evidence.
servers:
  - url: https://wbe.internal.waooaw
    description: Private service network only
tags:
  - name: Money Controls
    description: Real-money gate, money discrepancies and tax documents.
security:
  - ServiceBearerAuth: []
paths:
  /internal/v1/money/tax-documents:
    get:
      tags: [Money Controls]
      summary: List GST tax invoices and credit notes across tenants (Founder)
      description: Requires `effective_role` FOUNDER. Documents are immutable; a correction is a new document.
      operationId: wbeFounderListTaxDocuments
      x-internal: true
      x-required-roles: [FOUNDER]
      parameters:
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Tax documents, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxDocumentListV1" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /internal/v1/money/tax-documents/{documentId}:
    get:
      tags: [Money Controls]
      summary: Read one tax document (Founder)
      description: Requires `effective_role` FOUNDER.
      operationId: wbeFounderGetTaxDocument
      x-internal: true
      x-required-roles: [FOUNDER]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: The tax document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxDocumentEnvelopeV1" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /internal/v1/money/gate:
    get:
      tags: [Money Controls]
      summary: Read the environment's payment mode and the real-money gate
      description: Requires `effective_role` PRICING_ADMIN or FOUNDER. The gate is off by default in every environment.
      operationId: wbeGetMoneyGate
      x-internal: true
      x-required-roles: [PRICING_ADMIN, FOUNDER]
      parameters:
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Gate state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyGateStateV1" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Money Controls]
      summary: Turn real money on or off
      description: |
        Requires `effective_role` FOUNDER. Turning it ON is accepted only in production in LIVE mode, with the Founder's
        step-up context and a reason; it is refused with 403 `MONEY_GATE_STEP_UP_REQUIRED` without step-up and with 409
        `MONEY_GATE_NOT_PRODUCTION` elsewhere. Turning it OFF needs no step-up, so it is instantly reversible.
      operationId: wbeSetMoneyGate
      x-internal: true
      x-required-roles: [FOUNDER]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMoneyGateRequestV1" }
      responses:
        "200":
          description: New gate state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyGateStateV1" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /internal/v1/money/discrepancies:
    get:
      tags: [Money Controls]
      summary: List money discrepancies found by the provider-to-invoice reconciliation
      description: Requires `effective_role` PRICING_ADMIN or FOUNDER. An unresolved discrepancy blocks every new charge.
      operationId: wbeListMoneyDiscrepancies
      x-internal: true
      x-required-roles: [PRICING_ADMIN, FOUNDER]
      parameters:
        - $ref: "#/components/parameters/OptionalCorrelationId"
      responses:
        "200":
          description: Discrepancies, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyDiscrepancyListV1" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /internal/v1/money/discrepancies/{discrepancyId}/resolve:
    post:
      tags: [Money Controls]
      summary: Resolve a money discrepancy with evidence (Founder)
      description: Requires `effective_role` FOUNDER. Only the Founder, citing an evidence id, clears a discrepancy; a later clean run never does.
      operationId: wbeResolveMoneyDiscrepancy
      x-internal: true
      x-required-roles: [FOUNDER]
      parameters:
        - { name: discrepancyId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveMoneyDiscrepancyRequestV1" }
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, resolved]
                properties:
                  schemaVersion: { type: string, enum: ["1.0"] }
                  resolved: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    ServiceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: BP workload assertion bound to the WBE audience and a delegated Founder context.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    OptionalCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    Problem:
      description: A published problem (RFC 9457) with a typed `code`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/MoneyProblemV1" }
  schemas:
    MoneyProblemV1:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, maxLength: 80 }
        detail: { type: string, maxLength: 500 }
        correlationId: { type: string, maxLength: 64 }
    TaxDocumentV1:
      type: object
      additionalProperties: false
      required: [documentId, documentKind, documentNumber, issuedAt, supplier, billTo, payerCustomerId, placeOfSupply, supplyType, lines, taxablePaise, cgstPaise, sgstPaise, igstPaise, totalPaise, currency, bodyDigest]
      properties:
        documentId: { type: string, format: uuid }
        documentKind: { type: string, enum: [TAX_INVOICE, CREDIT_NOTE] }
        documentNumber: { type: string, description: "WAOOAW/2026-27/000042 for invoices, WAOOAW/CN/2026-27/000042 for credit notes; gap-free per series and financial year." }
        issuedAt: { type: string, format: date-time }
        supplier: { type: object, additionalProperties: { type: string } }
        billTo: { type: object, additionalProperties: true }
        payerCustomerId: { type: string, format: uuid }
        funderCustomerId: { type: [string, "null"], format: uuid }
        originalDocumentId: { type: [string, "null"], format: uuid, description: "Set on a credit note: the invoice it credits." }
        placeOfSupply: { type: string, pattern: "^[0-9]{2}$" }
        supplyType: { type: string, enum: [INTRA_STATE, INTER_STATE] }
        lines: { type: array, items: { type: object, additionalProperties: true } }
        taxablePaise: { type: integer, format: int64, minimum: 0 }
        cgstPaise: { type: integer, format: int64, minimum: 0 }
        sgstPaise: { type: integer, format: int64, minimum: 0 }
        igstPaise: { type: integer, format: int64, minimum: 0 }
        totalPaise: { type: integer, format: int64, minimum: 1, description: "Equals taxable + CGST + SGST + IGST exactly." }
        currency: { type: string, enum: [INR] }
        bodyDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
    TaxDocumentListV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, documents]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        documents: { type: array, items: { $ref: "#/components/schemas/TaxDocumentV1" } }
    TaxDocumentEnvelopeV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, document]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        document: { $ref: "#/components/schemas/TaxDocumentV1" }
    MoneyGateStateV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, environment, paymentMode, realMoneyEnabled]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        environment: { type: string, enum: [demo, uat, production] }
        paymentMode: { type: string, enum: [TEST, LIVE] }
        realMoneyEnabled: { type: boolean }
        changedBy: { type: [string, "null"] }
        changedAt: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"] }
    SetMoneyGateRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, enabled, reason]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        enabled: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 500 }
    MoneyDiscrepancyV1:
      type: object
      additionalProperties: false
      required: [discrepancyId, kind, reference, expectedPaise, observedPaise, detectedAt]
      properties:
        discrepancyId: { type: string, format: uuid }
        kind: { type: string, enum: [PAYMENT_WITHOUT_INVOICE, INVOICE_WITHOUT_PAYMENT, AMOUNT_MISMATCH, REFUND_WITHOUT_CREDIT_NOTE, CREDIT_NOTE_WITHOUT_REFUND] }
        reference: { type: string }
        expectedPaise: { type: integer, format: int64, minimum: 0 }
        observedPaise: { type: integer, format: int64, minimum: 0 }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
        resolvedBy: { type: [string, "null"] }
        resolutionEvidenceId: { type: [string, "null"], format: uuid }
    MoneyDiscrepancyListV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, discrepancies]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        discrepancies: { type: array, items: { $ref: "#/components/schemas/MoneyDiscrepancyV1" } }
    ResolveMoneyDiscrepancyRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, evidenceId]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        evidenceId: { type: string, format: uuid }

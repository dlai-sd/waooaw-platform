openapi: "3.1.0"
info:
  title: WAOOAW Visitor Conversation API
  version: "1.0.0"
  contact:
    name: WAOOAW Architecture
  description: |
    Channel-neutral visitor conversation contract for WC-135. Business Platform is the only
    public conversation facade (ADR-052). A visitor has no Employment Relationship and no
    account; the conversation is pre-relationship guest scope and is never merged into a
    relationship conversation (ADR-051).

    Tenant, professional and policy context are resolved on the server from the host or the
    credential. Clients cannot supply tenant, authority, prompt or policy content.

    WhatsApp does not call these paths. The Meta-signed webhook (ADR-053) authenticates the
    sender and invokes the same conversation core; the channel adapter renders the same
    structured reply. Public anonymous WEB and MOBILE exposure is disabled by configuration in
    the first release. The SIMULATION channel exists for Demo-only simulated customers.
servers:
  - url: https://api.waooaw.com
tags:
  - name: Visitor Conversation
paths:
  /api/v1/visitor/sessions:
    post:
      tags: [Visitor Conversation]
      summary: Open or resume a visitor conversation session
      description: |
        The first reply (welcome and consent) is returned with the session. A repeated open for
        the same subject resumes the existing session (200).
      operationId: openVisitorSession
      security:
        - VisitorSessionAuth: []
        - VisitorSimulatorAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenVisitorSessionRequestV1" }
      responses:
        "201":
          description: Visitor session opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorSessionV1" }
        "200":
          description: Existing session resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorSessionV1" }
        "400": { $ref: "#/components/responses/VisitorInvalidRequest" }
        "401": { $ref: "#/components/responses/VisitorUnauthorized" }
        "429": { $ref: "#/components/responses/VisitorRateLimited" }
        "503": { $ref: "#/components/responses/VisitorUnavailable" }

  /api/v1/visitor/sessions/{sessionId}:
    get:
      tags: [Visitor Conversation]
      summary: Read a visitor session state and captured outcome
      description: |
        Returns the conversation state, the classified outcome and non-sensitive captured fields
        (business domain, city, goal code). Name, email and phone are never returned.
      operationId: getVisitorSession
      security:
        - VisitorSessionAuth: []
        - VisitorSimulatorAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitorSessionId"
      responses:
        "200":
          description: Visitor session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorSessionV1" }
        "401": { $ref: "#/components/responses/VisitorUnauthorized" }
        "404": { $ref: "#/components/responses/VisitorNotFound" }
        "503": { $ref: "#/components/responses/VisitorUnavailable" }

  /api/v1/visitor/sessions/{sessionId}/messages:
    get:
      tags: [Visitor Conversation]
      summary: Read the visitor transcript
      operationId: listVisitorMessages
      security:
        - VisitorSessionAuth: []
        - VisitorSimulatorAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitorSessionId"
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
      responses:
        "200":
          description: Bounded transcript page, own session only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorTranscriptPageV1" }
        "400": { $ref: "#/components/responses/VisitorInvalidRequest" }
        "401": { $ref: "#/components/responses/VisitorUnauthorized" }
        "404": { $ref: "#/components/responses/VisitorNotFound" }
        "503": { $ref: "#/components/responses/VisitorUnavailable" }
    post:
      tags: [Visitor Conversation]
      summary: Send one visitor message and receive the structured reply
      description: |
        A repeated Idempotency-Key with the same canonical body returns the original reply and
        creates no second message, lead update or outbound send; the same key with a different
        body conflicts. A stopped visitor receives 200 with state STOPPED and no reply blocks.
        Clients may retry 429 and 503 safely.
      operationId: sendVisitorMessage
      security:
        - VisitorSessionAuth: []
        - VisitorSimulatorAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitorSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendVisitorMessageRequestV1" }
      responses:
        "200":
          description: Reply (also returned for an idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorTurnV1" }
        "400": { $ref: "#/components/responses/VisitorInvalidRequest" }
        "401": { $ref: "#/components/responses/VisitorUnauthorized" }
        "404": { $ref: "#/components/responses/VisitorNotFound" }
        "409": { $ref: "#/components/responses/VisitorConflict" }
        "429": { $ref: "#/components/responses/VisitorRateLimited" }
        "503": { $ref: "#/components/responses/VisitorUnavailable" }

  /api/v1/visitor/handoffs/{reference}/tap:
    post:
      tags: [Visitor Conversation]
      summary: Record that the visitor opened the portal handoff link
      description: |
        Called by the portal landing page (or the simulator) when the opaque, server-recorded, single-use
        lead reference from a LINK block is opened. Records INTENT on the lead. The reference
        carries only a lead id and an expiry, never personal data. A reused, expired or unknown
        reference yields 200 with `recorded: false` and no further detail.
      operationId: tapVisitorHandoff
      security:
        - {}
        - VisitorSimulatorAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Tap processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorHandoffTapV1" }
        "429": { $ref: "#/components/responses/VisitorRateLimited" }
        "503": { $ref: "#/components/responses/VisitorUnavailable" }

  /api/v1/visitor/handoffs/{reference}/open:
    get:
      tags: [Visitor Conversation]
      summary: Open the shared portal link, recording the tap first
      description: |
        The address shared in a LINK block when a public open base URL is configured. Records INTENT
        exactly like the tap operation, then redirects to the portal registration page with the
        reference as `lead`. An unknown, expired or reused reference still redirects, without
        recording anything and without saying why.
      operationId: openVisitorHandoff
      security:
        - {}
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, maxLength: 512 }
      responses:
        "302":
          description: Redirect to the portal registration page
          headers:
            Location: { schema: { type: string, format: uri } }
        "503": { $ref: "#/components/responses/VisitorUnavailable" }

components:
  securitySchemes:
    VisitorSessionAuth:
      type: http
      scheme: bearer
      description: |
        Server-issued, signed, short-lived visitor session token bound to channel and tenant.
        Not a Keycloak token and never an authority for tenant or role.
    VisitorSimulatorAuth:
      type: apiKey
      in: header
      name: X-Visitor-Signature
      description: |
        Demo-only simulated-customer credential: lowercase-hex HMAC-SHA256, keyed by the shared
        simulator secret, over "{timestamp}.{METHOD}.{path}.{sha256-hex(body)}", with the unix
        timestamp in X-Visitor-Timestamp (accepted within five minutes). Valid only for the
        SIMULATION channel and only when the simulator is enabled by configuration.

  parameters:
    VisitorSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Same key and canonical request hash replay the prior outcome; divergent reuse conflicts.

  responses:
    VisitorInvalidRequest:
      description: Request or schema version is malformed or unsupported
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/VisitorProblemDetailV1" }
    VisitorUnauthorized:
      description: Visitor credential is missing, invalid, expired or not permitted for this session
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/VisitorProblemDetailV1" }
    VisitorNotFound:
      description: Session not found for this credential
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/VisitorProblemDetailV1" }
    VisitorConflict:
      description: Idempotency key reused with a different request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/VisitorProblemDetailV1" }
    VisitorRateLimited:
      description: Per-tenant or per-visitor fair-use limit reached; retry after the stated delay
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/VisitorProblemDetailV1" }
    VisitorUnavailable:
      description: A required dependency or content set is unavailable; the call is retry-safe
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/VisitorProblemDetailV1" }

  schemas:
    VisitorHandoffTapV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, recorded]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        recorded: { type: boolean }
    VisitorProblemCodeV1:
      type: string
      enum:
        - VISITOR_REQUEST_INVALID
        - VISITOR_SESSION_REQUIRED
        - VISITOR_SESSION_NOT_FOUND
        - VISITOR_IDEMPOTENCY_CONFLICT
        - VISITOR_RATE_LIMITED
        - VISITOR_UNAVAILABLE
        - VISITOR_CONTENT_UNAVAILABLE
        - VISITOR_DISABLED
    VisitorProblemDetailV1:
      type: object
      additionalProperties: false
      description: Privacy-safe RFC 9457 problem; submitted content is never echoed
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, maxLength: 400 }
        code: { $ref: "#/components/schemas/VisitorProblemCodeV1" }
        correlationId: { type: string, format: uuid }
        retryAfterSeconds: { type: integer, minimum: 1 }
    VisitorChannelV1:
      type: string
      enum: [WEB, MOBILE, SIMULATION]
      description: WHATSAPP enters through the signed webhook, not this API.
    VisitorStateV1:
      type: string
      enum: [NEW, CONSENT_PENDING, DISCOVER, QUALIFY, SHOW_VALUE, OTHER_PROFESSIONALS, HANDOFF, STOPPED]
    VisitorOutcomeV1:
      type: string
      enum: [NONE, LEAD, INTENT, FULL_SUCCESS, OPT_OUT]
    OpenVisitorSessionRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, channel]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        channel: { $ref: "#/components/schemas/VisitorChannelV1" }
        subjectKey:
          type: string
          minLength: 8
          maxLength: 64
          description: SIMULATION only. A fabricated subject identifier; hashed on the server.
        resumeToken: { type: string, maxLength: 512 }
    VisitorChoiceV1:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, maxLength: 64 }
        label: { type: string, maxLength: 20 }
    VisitorListRowV1:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 24 }
        description: { type: string, maxLength: 72 }
    VisitorReplyBlockV1:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [TEXT, CHOICES, LIST, LINK] }
        text: { type: string, maxLength: 1024 }
        choices:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/VisitorChoiceV1" }
        listTitle: { type: string, maxLength: 24 }
        rows:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/VisitorListRowV1" }
        label: { type: string, maxLength: 20 }
        url: { type: string, format: uri, maxLength: 1024 }
    VisitorReplyV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, state, contentVersion, blocks]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        state: { $ref: "#/components/schemas/VisitorStateV1" }
        contentVersion: { type: string, maxLength: 64 }
        blocks:
          type: array
          maxItems: 6
          description: Empty when the visitor is STOPPED. Free text is always accepted in addition to any choices.
          items: { $ref: "#/components/schemas/VisitorReplyBlockV1" }
    VisitorCapturedV1:
      type: object
      additionalProperties: false
      properties:
        businessDomain: { type: [string, "null"], maxLength: 64 }
        city: { type: [string, "null"], maxLength: 80 }
        goalCode: { type: [string, "null"], maxLength: 48 }
        hasName: { type: boolean }
        hasEmail: { type: boolean }
    VisitorSessionV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, sessionId, channel, state, outcome]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        sessionId: { type: string, format: uuid }
        channel: { $ref: "#/components/schemas/VisitorChannelV1" }
        state: { $ref: "#/components/schemas/VisitorStateV1" }
        outcome: { $ref: "#/components/schemas/VisitorOutcomeV1" }
        captured: { $ref: "#/components/schemas/VisitorCapturedV1" }
        sessionToken:
          type: string
          description: Signed short-lived visitor session token (WEB and MOBILE). Absent for SIMULATION.
        expiresAt: { type: string, format: date-time }
        reply: { $ref: "#/components/schemas/VisitorReplyV1" }
    VisitorMessageContentV1:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [TEXT, CHOICE] }
        text: { type: string, maxLength: 1000 }
        choiceId: { type: string, maxLength: 64 }
    SendVisitorMessageRequestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, content]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        content: { $ref: "#/components/schemas/VisitorMessageContentV1" }
        expectedCursor: { type: string, maxLength: 256 }
    VisitorTurnV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, sessionId, messageId, cursor, state, outcome, reply]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        sessionId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        cursor: { type: string, maxLength: 256 }
        state: { $ref: "#/components/schemas/VisitorStateV1" }
        outcome: { $ref: "#/components/schemas/VisitorOutcomeV1" }
        captured: { $ref: "#/components/schemas/VisitorCapturedV1" }
        reply: { $ref: "#/components/schemas/VisitorReplyV1" }
    VisitorTranscriptItemV1:
      type: object
      additionalProperties: false
      required: [sequence, role, at]
      properties:
        sequence: { type: integer, minimum: 1 }
        role: { type: string, enum: [VISITOR, WAOOAW] }
        content: { $ref: "#/components/schemas/VisitorMessageContentV1" }
        reply: { $ref: "#/components/schemas/VisitorReplyV1" }
        at: { type: string, format: date-time }
    VisitorTranscriptPageV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, items]
      properties:
        schemaVersion: { type: string, enum: ["1.0"] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/VisitorTranscriptItemV1" }
        nextCursor: { type: [string, "null"], maxLength: 256 }

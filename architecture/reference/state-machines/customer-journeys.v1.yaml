contract: waooaw.customer-journeys
version: 1.0.0
work_contract: WC-112
illegal_transition:
  http_status: 409
  code: JOURNEY_TRANSITION_CONFLICT
  mutation: forbidden

access:
  initial: ANONYMOUS
  states:
    - ANONYMOUS
    - AUTHENTICATED_UNREGISTERED
    - REGISTRATION_IN_PROGRESS
    - AUTHENTICATED_REGISTERED
    - LOGOUT_LOCAL_CLEARED
    - LOGOUT_IDP_PENDING
    - LOGGED_OUT
    - LOGOUT_PARTIAL_FAILURE
  transitions:
    - { from: ANONYMOUS, event: LOGIN_SUCCEEDED_UNREGISTERED, to: AUTHENTICATED_UNREGISTERED }
    - { from: ANONYMOUS, event: LOGIN_SUCCEEDED_REGISTERED, to: AUTHENTICATED_REGISTERED }
    - { from: AUTHENTICATED_UNREGISTERED, event: REGISTRATION_STARTED, to: REGISTRATION_IN_PROGRESS }
    - { from: REGISTRATION_IN_PROGRESS, event: REGISTRATION_COMPLETED, to: AUTHENTICATED_REGISTERED }
    - { from: REGISTRATION_IN_PROGRESS, event: REGISTRATION_CANCELLED, to: AUTHENTICATED_UNREGISTERED }
    - { from: AUTHENTICATED_UNREGISTERED, event: LOGOUT_REQUESTED, to: LOGOUT_LOCAL_CLEARED }
    - { from: AUTHENTICATED_REGISTERED, event: LOGOUT_REQUESTED, to: LOGOUT_LOCAL_CLEARED }
    - { from: LOGOUT_LOCAL_CLEARED, event: WAOOAW_SESSION_REVOKED, to: LOGOUT_IDP_PENDING }
    - { from: LOGOUT_IDP_PENDING, event: IDP_LOGOUT_CONFIRMED, to: LOGGED_OUT }
    - { from: LOGOUT_IDP_PENDING, event: IDP_LOGOUT_UNRESOLVED, to: LOGOUT_PARTIAL_FAILURE }
    - { from: AUTHENTICATED_UNREGISTERED, event: SWITCH_ACCOUNT_REQUESTED, to: LOGOUT_LOCAL_CLEARED }
    - { from: AUTHENTICATED_REGISTERED, event: SWITCH_ACCOUNT_REQUESTED, to: LOGOUT_LOCAL_CLEARED }

acquisition:
  initial: OFFER_DISCOVERED
  terminal: [MY_AGENT_READY, ACQUISITION_FAILED, EXPIRED, CANCELLED]
  states:
    - OFFER_DISCOVERED
    - ACQUISITION_INTENT_HELD
    - IDENTITY_REQUIRED
    - CONTRACT_ACCEPTED
    - CHECKOUT_PREVIEWED
    - TRIAL_STARTING
    - COUPON_RESERVED
    - ORDER_CREATING
    - PAYMENT_PENDING
    - COMMERCIAL_SATISFIED
    - RELATIONSHIP_CREATING
    - PORTAL_HANDOFF_PENDING
    - MY_AGENT_READY
    - ACQUISITION_RECONCILING
    - ACQUISITION_FAILED
    - EXPIRED
    - CANCELLED
  transitions:
    - { from: OFFER_DISCOVERED, event: CONTRACT_ACCEPTED, to: ACQUISITION_INTENT_HELD, guard: exact_agent_version_contract_hash }
    - { from: ACQUISITION_INTENT_HELD, event: REGISTRATION_REQUIRED, to: IDENTITY_REQUIRED }
    - { from: IDENTITY_REQUIRED, event: REGISTRATION_COMPLETED, to: CONTRACT_ACCEPTED, guard: same_actor_and_intent }
    - { from: ACQUISITION_INTENT_HELD, event: REGISTERED_IDENTITY_CONFIRMED, to: CONTRACT_ACCEPTED }
    - { from: CONTRACT_ACCEPTED, event: CHECKOUT_PREVIEWED, to: CHECKOUT_PREVIEWED }
    - { from: CHECKOUT_PREVIEWED, event: TRIAL_CONFIRMED, to: TRIAL_STARTING, guard: trial_eligible }
    - { from: TRIAL_STARTING, event: TRIAL_ALLOCATED, to: RELATIONSHIP_CREATING }
    - { from: CHECKOUT_PREVIEWED, event: COUPON_RESERVED, to: COUPON_RESERVED, guard: exact_agent_version_capacity }
    - { from: COUPON_RESERVED, event: PAYABLE_ORDER_REQUESTED, to: ORDER_CREATING }
    - { from: COUPON_RESERVED, event: ZERO_PRICE_CONFIRMED, to: COMMERCIAL_SATISFIED }
    - { from: ORDER_CREATING, event: ORDER_CREATED, to: PAYMENT_PENDING }
    - { from: ORDER_CREATING, event: ORDER_UNRESOLVED, to: ACQUISITION_RECONCILING }
    - { from: PAYMENT_PENDING, event: CAPTURE_VERIFIED, to: COMMERCIAL_SATISFIED }
    - { from: COMMERCIAL_SATISFIED, event: RELATIONSHIP_CREATED, to: PORTAL_HANDOFF_PENDING }
    - { from: RELATIONSHIP_CREATING, event: RELATIONSHIP_CREATED, to: PORTAL_HANDOFF_PENDING }
    - { from: PORTAL_HANDOFF_PENDING, event: SELECTION_CREATED, to: MY_AGENT_READY }
    - { from: COUPON_RESERVED, event: CHECKOUT_CANCELLED, to: CANCELLED, effect: release_coupon_reservation }
    - { from: PAYMENT_PENDING, event: CHECKOUT_EXPIRED, to: EXPIRED, effect: release_coupon_reservation }
    - { from: ACQUISITION_RECONCILING, event: RECONCILED, to: COMMERCIAL_SATISFIED }
    - { from: ACQUISITION_RECONCILING, event: TERMINAL_FAILURE, to: ACQUISITION_FAILED }

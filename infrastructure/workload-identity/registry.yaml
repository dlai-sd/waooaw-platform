schema_version: "1.0"
policy_version: "1.0"

environments:
  development:
    trust_domain: waooaw.dev
    leaf_lifetime_hours: 24
  ci:
    trust_domain: waooaw.ci
    leaf_lifetime_hours: 2
  demo:
    trust_domain: demo.waooaw.internal
    leaf_lifetime_hours: 2
  uat:
    trust_domain: uat.waooaw.internal
    leaf_lifetime_hours: 2
  prod:
    trust_domain: prod.waooaw.internal
    leaf_lifetime_hours: 1

workloads:
  business-platform:
    identity_path: business-platform
    owner: INST-010
    tls_usages: [client_auth, server_auth]
    delegation_signer: true
  billing-engine:
    identity_path: billing-engine
    owner: INST-010
    audience: urn:waooaw:service:billing-engine
    tls_usages: [server_auth]
  professional-runtime:
    identity_path: professional-runtime
    owner: INST-010
    audience: urn:waooaw:service:professional-runtime
    tls_usages: [client_auth, server_auth]
  agent-runtime-adapter-digital-marketing:
    identity_path: agent-runtime-adapter/digital-marketing-local-service/3.1.0
    owner: INST-010
    audience: urn:waooaw:adapter:digital-marketing-local-service:3.1.0
    tls_usages: [server_auth]
  agent-runtime-adapter-trading:
    identity_path: agent-runtime-adapter/trading-fo-crypto/1.8.0
    owner: INST-010
    audience: urn:waooaw:adapter:trading-fo-crypto:1.8.0
    tls_usages: [server_auth]

